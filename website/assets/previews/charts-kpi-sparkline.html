<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI + Sparkline</title><style>:root{--bg:#0f1621;--panel:#192534;--panel2:#232f3e;--card:#1a2633;--line:#354150;--control-line:#6a7888;--ink:#e9ebed;--muted:#a4b0c0;--dim:#6b7887;--accent:#539fe5;--accent-rgb:83,159,229;--accent2:#539fe5;--info:#539fe5;--info-rgb:83,159,229;--pos:#37c26b;--pos-rgb:55,194,107;--warn:#f5b74e;--warn-rgb:245,183,78;--neg:#eb6f6f;--neg-rgb:235,111,111;--crit:#c471ff;--crit-rgb:196,113,255;--accent-ink:#000716;--info-ink:#000716;--pos-ink:#000716;--warn-ink:#000716;--neg-ink:#000716;--crit-ink:#000716;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--elev-1:none;--elev-2:0 1px 8px rgba(0,0,0,.4);--dur:.12s;--ease:ease;--bd:1px;--head-w:700;--dens:1;color-scheme:dark}:root[data-mode="light"]{--bg:#f2f3f3;--panel:#ffffff;--panel2:#fafafa;--card:#ffffff;--line:#d5dbdb;--control-line:#7d8998;--ink:#16191f;--muted:#5f6b7a;--dim:#828d9c;--accent:#0972d3;--accent-rgb:9,114,211;--accent2:#0972d3;--info:#0972d3;--info-rgb:9,114,211;--pos:#037f0c;--pos-rgb:3,127,12;--warn:#b75e04;--warn-rgb:183,94,4;--neg:#d91515;--neg-rgb:217,21,21;--crit:#8657f0;--crit-rgb:134,87,240;--accent-ink:#ffffff;--info-ink:#ffffff;--pos-ink:#ffffff;--warn-ink:#ffffff;--neg-ink:#ffffff;--crit-ink:#ffffff;--cardgrad:linear-gradient(157deg,rgba(0,0,0,.02),rgba(0,0,0,0) 55%);color-scheme:light}.c-crit{--c:var(--crit);--c-rgb:var(--crit-rgb)}.c-neg{--c:var(--neg);--c-rgb:var(--neg-rgb)}.c-warn{--c:var(--warn);--c-rgb:var(--warn-rgb)}.c-pos{--c:var(--pos);--c-rgb:var(--pos-rgb)}.c-info{--c:var(--info);--c-rgb:var(--info-rgb)}.c-accent{--c:var(--accent);--c-rgb:var(--accent-rgb)}:where(body){background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}:root{--gray:#72869f;--orange:var(--accent);--red:#f85149;--blue:var(--info);--green:var(--pos);--purple:var(--crit)}:root{color-scheme:dark;--preview-bg:#0a0c12}*{box-sizing:border-box}html,body{background:var(--preview-bg)}body{margin:0;min-height:220px;display:flex;align-items:center;justify-content:center;padding:22px;font-family:system-ui,sans-serif;color:var(--ink)}.panel{min-width:215px}.ptitle{padding-left:0!important}.atom{width:145px;height:145px}:where(.kpi) *, *:where(.kpi) { box-sizing: border-box; }
.kpi { background: var(--card); background-image: var(--cardgrad); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-width: 150px; }
.kpi .l { font-family: ui-monospace, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.kpi .n { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11px; color: var(--muted); margin-top: 5px; }
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.6s ease-out 0s 1 normal forwards running draw; }
.scx-kpic .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
@keyframes draw { 
  100% { stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce){:where(.kpi) *, *:where(.kpi) { animation: auto ease 0s 1 normal none running none !important; }.draw, .scx-slope-line, .scx-bump path { stroke-dashoffset: 0; }}
@media (prefers-reduced-motion:reduce){.draw{animation:none!important}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head><body><div class="kpi" style="min-width:180px"><div class="l">On-Demand spend</div><div class="n">$48.2K</div>

          <circle cx="168" cy="4" r="3.2" fill="var(--neg)"></circle>
        </svg>
