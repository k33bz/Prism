<script type="text/html" id="pg-tables"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Tables & Data Layouts · Prism</title>
<style>
:root{
  --bg:#0b0e17; --panel:#121623; --panel2:#171d2e; --card:#141b2b; --line:#243049;
  --ink:#eaf1f9; --muted:#8593a8; --dim:#5b6678;
  --crit:#c879ff;  --crit-rgb:200,121,255;
  --neg:#f85149;   --neg-rgb:248,81,73;
  --warn:#e0a52b;  --warn-rgb:224,165,43;
  --pos:#3fb950;   --pos-rgb:63,185,80;
  --info:#4493f8;  --info-rgb:68,147,248;
  --accent:#ff9900;--accent-rgb:255,153,0;
  --cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%);
}
.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}
.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}
.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(255,153,0,.05),transparent 60%),var(--bg);
  color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.head{padding:28px 32px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#232f3e,var(--panel));position:relative}
.head h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.01em}
.head p{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:820px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 32px 0}
h3.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile .stage{padding:26px 18px;min-height:130px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 10px,transparent 10px 20px);position:relative}
.tile .meta{padding:12px 14px;border-top:1px solid var(--line)}
.tile .nm{font-weight:700;font-size:13.5px}
.tile .ref{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--accent);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:6px}
.tile .desc{color:var(--muted);font-size:12px;margin-top:8px}
.tile .row{display:flex;gap:8px;margin-top:10px}
.tile .copy{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.tile .copy:hover{border-color:var(--accent);color:var(--accent)}
.tile .copy.ok{border-color:var(--pos);color:var(--pos)}
.el-pill{display:inline-block;background:rgba(var(--c-rgb),.14);color:var(--c);border-radius:11px;padding:3px 10px;font-size:11px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
<style id="tables-styles">
/* ================= Tables & Data Layouts gallery — prefix dtb- / dtb* =================
   Primary data colour reads --c / --c-rgb and falls back to --accent, so every theme pack
   re-tints the tables to its brand colour (a .c-* class or inline --c recolours one facet).
   --info is reserved for the "info" status pill; --pos / --warn / --neg keep status semantics.
   Report-grade tables, matrices, key-value blocks, lists, trees, grids, schedules and
   ledgers. Fully self-contained, offline, pure HTML + CSS. Colour comes ONLY from the
   shared design tokens; recolourable families read --c / --c-rgb (add a c-* class or
   set them inline). Every tile stays legible on a frozen frame: motion is a scan, a
   highlight, a fill or an insert — never the only carrier of the information.
   No selector references .tile or :hover for load-bearing styling (copy-helper friendly). */

/* ---- shared table primitive ---- */
.dtb-tbl{width:100%;max-width:300px;border-collapse:separate;border-spacing:0;font:11px/1.35 ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dtb-tbl th{font:700 9px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);text-align:left;padding:7px 9px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
.dtb-tbl td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.dtb-tbl tbody tr:last-child td{border-bottom:0}
.dtb-tbl tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:800;background:var(--panel2)}
.dtb-num{text-align:right!important;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.dtb-mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.dtb-mut{color:var(--muted)}
.dtb-dim{color:var(--dim)}
.dtb-cap{margin-top:8px;font:600 9.5px/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--muted);text-align:center;letter-spacing:.02em}

/* ---- shared keyframes ---- */
@keyframes dtbShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes dtbFadeUp{0%{opacity:0;transform:translateY(6px)}12%,80%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(6px)}}
@keyframes dtbBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes dtbCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dtbPop{0%,60%{transform:scale(.4);opacity:0}70%{transform:scale(1.25);opacity:1}78%,92%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dtbDraw{0%{stroke-dashoffset:120}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes dtbFill{0%{transform:scaleX(0)}60%,90%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes dtbFlash{0%{box-shadow:inset 0 0 0 999px rgba(var(--pos-rgb),.28)}35%,100%{box-shadow:inset 0 0 0 999px rgba(var(--pos-rgb),0)}}
@keyframes dtbInsert{0%{opacity:0;transform:translateY(-100%)}10%{opacity:1;transform:translateY(0);box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),.22)}45%,100%{opacity:1;transform:translateY(0);box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0)}}

/* ===================== A. DATA TABLES ===================== */
/* zebra + scanning row highlight */
.dtb-zebra tbody tr:nth-child(even) td{background:rgba(255,255,255,.028)}
.dtb-zebra tbody tr td{animation:dtbRowScan 4.5s linear infinite}
.dtb-zebra tbody tr:nth-child(2) td{animation-delay:.6s}
.dtb-zebra tbody tr:nth-child(3) td{animation-delay:1.2s}
.dtb-zebra tbody tr:nth-child(4) td{animation-delay:1.8s}
.dtb-zebra tbody tr:nth-child(5) td{animation-delay:2.4s}
@keyframes dtbRowScan{0%,4%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0)}9%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),.14)}22%,100%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0)}}

/* hover-glow rows: cycling row light with a left accent bar */
.dtb-hoverglow tbody tr td{animation:dtbHov 6s ease-in-out infinite}
.dtb-hoverglow tbody tr td:first-child{animation-name:dtbHovBar}
.dtb-hoverglow tbody tr:nth-child(2) td{animation-delay:1.5s}
.dtb-hoverglow tbody tr:nth-child(3) td{animation-delay:3s}
.dtb-hoverglow tbody tr:nth-child(4) td{animation-delay:4.5s}
@keyframes dtbHov{0%,5%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0)}10%,20%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.13)}27%,100%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0)}}
@keyframes dtbHovBar{0%,5%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0),inset 0 0 0 0 var(--c,var(--accent))}10%,20%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.13),inset 2px 0 0 0 var(--c,var(--accent))}27%,100%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0),inset 0 0 0 0 var(--c,var(--accent))}}

/* sortable header + two rows swapping places */
.dtb-sort th.dtb-sorted{color:var(--accent)}
.dtb-sort-arrow{display:inline-block;margin-left:4px;font-size:8px;transform-origin:50% 55%;animation:dtbSortFlip 4s ease-in-out infinite}
@keyframes dtbSortFlip{0%,42%{transform:rotate(0)}50%,92%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.dtb-sort tbody tr:nth-child(2) td{animation:dtbSwapDown 4s ease-in-out infinite;position:relative;z-index:2}
.dtb-sort tbody tr:nth-child(3) td{animation:dtbSwapUp 4s ease-in-out infinite;position:relative;z-index:1}
@keyframes dtbSwapDown{0%,42%{transform:translateY(0)}50%,92%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes dtbSwapUp{0%,42%{transform:translateY(0)}50%,92%{transform:translateY(-100%)}100%{transform:translateY(0)}}

/* sticky header over an auto-scrolling body (div-based rows) */
.dtb-sticky{width:100%;max-width:300px;height:132px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--card);position:relative;font:11px/1.3 ui-sans-serif,system-ui,sans-serif}
.dtb-row{display:grid;grid-template-columns:1.6fr 1fr .8fr;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
.dtb-row .dtb-num{text-align:right}
.dtb-sticky-head{position:absolute;top:0;left:0;right:0;z-index:3;background:var(--panel2);font:700 9px/1.2 ui-sans-serif,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);box-shadow:0 4px 10px rgba(0,0,0,.35);padding:7px 10px}
.dtb-sticky-body{padding-top:26px;animation:dtbScrollUp 9s linear infinite}
@keyframes dtbScrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}

/* dense numeric table + live cell */
.dtb-dense{font-size:10px}
.dtb-dense th{padding:4px 7px;font-size:8.5px}
.dtb-dense td{padding:3px 7px}
.dtb-live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 6px var(--pos);margin-right:5px;vertical-align:1px;animation:dtbBlink 1.2s ease-in-out infinite}

/* row selection with checkboxes */
.dtb-cb{display:inline-block;width:12px;height:12px;border:1px solid var(--dim);border-radius:3px;position:relative;vertical-align:-2px;background:var(--panel)}
.dtb-cb::after{content:"";position:absolute;left:3px;top:0;width:4px;height:7px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);opacity:0}
.dtb-cb.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.dtb-cb.on::after{transform:rotate(45deg) scale(1);opacity:1}
.dtb-select tbody tr:nth-child(2) .dtb-cb{animation:dtbCbOn 5s steps(1) infinite}
.dtb-select tbody tr:nth-child(2) .dtb-cb::after{animation:dtbCbMark 5s ease-out infinite}
.dtb-select tbody tr:nth-child(2) td{animation:dtbSelRow 5s steps(1) infinite}
.dtb-select tbody tr:nth-child(4) .dtb-cb{animation:dtbCbOn 5s steps(1) infinite;animation-delay:1.2s}
.dtb-select tbody tr:nth-child(4) .dtb-cb::after{animation:dtbCbMark 5s ease-out infinite;animation-delay:1.2s}
.dtb-select tbody tr:nth-child(4) td{animation:dtbSelRow 5s steps(1) infinite;animation-delay:1.2s}
@keyframes dtbCbOn{0%,19%{background:var(--panel);border-color:var(--dim)}20%,75%{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}76%,100%{background:var(--panel);border-color:var(--dim)}}
@keyframes dtbCbMark{0%,19%{transform:rotate(45deg) scale(0);opacity:0}24%,75%{transform:rotate(45deg) scale(1);opacity:1}76%,100%{transform:rotate(45deg) scale(0);opacity:0}}
@keyframes dtbSelRow{0%,19%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0)}20%,75%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.12)}76%,100%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0)}}

/* expandable detail row */
.dtb-chev{display:inline-block;width:0;height:0;border:4px solid transparent;border-left:6px solid var(--muted);margin-right:6px;transform-origin:30% 50%;animation:dtbChev 5s ease-in-out infinite}
@keyframes dtbChev{0%,18%{transform:rotate(0)}25%,80%{transform:rotate(90deg)}88%,100%{transform:rotate(0)}}
.dtb-expand tr.dtb-detail td{padding:0;border-bottom:0}
.dtb-detail-in{max-height:0;overflow:hidden;background:rgba(var(--c-rgb,var(--accent-rgb)),.06);border-left:2px solid var(--c,var(--accent));animation:dtbExpand 5s ease-in-out infinite}
.dtb-detail-in > div{padding:6px 10px 7px;font-size:10px;color:var(--muted);line-height:1.5}
@keyframes dtbExpand{0%,18%{max-height:0}28%,78%{max-height:60px}90%,100%{max-height:0}}

/* inline cell editing */
.dtb-edit-cell{display:inline-block;min-width:78px;padding:1px 6px;border:1px solid var(--c,var(--accent));border-radius:4px;background:rgba(var(--c-rgb,var(--accent-rgb)),.09);box-shadow:0 0 0 3px rgba(var(--c-rgb,var(--accent-rgb)),.14);font-family:ui-monospace,Menlo,monospace}
.dtb-typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;max-width:0;animation:dtbType 4.5s steps(9,end) infinite}
@keyframes dtbType{0%,12%{max-width:0}55%,90%{max-width:5.4em}100%{max-width:0}}
.dtb-caret{display:inline-block;width:1px;height:11px;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:dtbCaret 1s steps(1) infinite}
.dtb-edit-hint{font-size:8.5px;color:var(--c,var(--accent));text-transform:uppercase;letter-spacing:.06em;font-weight:800;margin-left:6px}

/* totals row with counting numbers (registered property + counter) */
@property --dtb-n{syntax:'<integer>';inherits:false;initial-value:0}
.dtb-count{display:inline-block;counter-reset:dtbn var(--dtb-n)}
.dtb-count::after{content:counter(dtbn)}
.dtb-count.a{animation:dtbCountA 4s ease-out infinite}
.dtb-count.b{animation:dtbCountB 4s ease-out infinite}
.dtb-count.c{animation:dtbCountC 4s ease-out infinite}
@keyframes dtbCountA{0%{--dtb-n:0}55%,100%{--dtb-n:1284}}
@keyframes dtbCountB{0%{--dtb-n:0}55%,100%{--dtb-n:642}}
@keyframes dtbCountC{0%{--dtb-n:0}55%,100%{--dtb-n:98}}
.dtb-totals tfoot td{color:var(--accent)}

/* skeleton loading table */
.dtb-sk{display:block;height:9px;border-radius:4px;background:linear-gradient(90deg,var(--panel2) 25%,rgba(255,255,255,.09) 50%,var(--panel2) 75%);background-size:200% 100%;animation:dtbShimmer 1.5s linear infinite}
.dtb-sk.w1{width:70%}.dtb-sk.w2{width:45%}.dtb-sk.w3{width:85%}.dtb-sk.w4{width:30%}
.dtb-skel th .dtb-sk{background:linear-gradient(90deg,var(--line) 25%,rgba(255,255,255,.12) 50%,var(--line) 75%);background-size:200% 100%}

/* ===================== B. STATUS & DATA CELLS ===================== */
.dtb-pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.5}
.dtb-pill.ok{color:var(--pos);background:rgba(var(--pos-rgb),.14)}
.dtb-pill.warn{color:var(--warn);background:rgba(var(--warn-rgb),.14)}
.dtb-pill.crit{color:var(--neg);background:rgba(var(--neg-rgb),.16);animation:dtbPillPulse 1.3s ease-in-out infinite}
.dtb-pill.info{color:var(--info);background:rgba(var(--info-rgb),.14)}
.dtb-pill.off{color:var(--dim);background:rgba(255,255,255,.05)}
@keyframes dtbPillPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--neg-rgb),.5)}60%{box-shadow:0 0 0 5px rgba(var(--neg-rgb),0)}}

.dtb-bar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;vertical-align:middle;margin-right:6px}
.dtb-bar i{display:block;height:100%;width:var(--w,60%);border-radius:3px;background:var(--c,var(--accent));transform-origin:0 50%;animation:dtbFill 3.4s ease-out infinite}
.dtb-bar-v{font-size:9.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}

.dtb-spark{display:inline-block;width:64px;height:18px;vertical-align:middle;overflow:visible}
.dtb-spark-line{fill:none;stroke:var(--c,var(--accent));stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:dtbDraw 3s ease-out infinite}
.dtb-spark-dot{fill:var(--c,var(--accent));animation:dtbBlink 1.6s ease-in-out infinite}

.dtb-up{color:var(--pos);font-weight:800}
.dtb-down{color:var(--neg);font-weight:800}
.dtb-flat{color:var(--dim);font-weight:800}
.dtb-delta td.dtb-flash{animation:dtbFlash 3.2s ease-out infinite}
.dtb-delta tbody tr:nth-child(3) td.dtb-flash{animation-delay:1.1s;animation-name:dtbFlashNeg}
.dtb-delta tbody tr:nth-child(4) td.dtb-flash{animation-delay:2.2s}
@keyframes dtbFlashNeg{0%{box-shadow:inset 0 0 0 999px rgba(var(--neg-rgb),.28)}35%,100%{box-shadow:inset 0 0 0 999px rgba(var(--neg-rgb),0)}}

.dtb-av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(var(--c-rgb,var(--accent-rgb)),.25);color:var(--c,var(--accent));font:800 8.5px ui-sans-serif,system-ui,sans-serif;margin-right:7px;vertical-align:middle;position:relative}
.dtb-av i{position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;border-radius:50%;background:var(--pos);border:1.5px solid var(--card);animation:dtbBlink 1.4s ease-in-out infinite}
.dtb-av.away i{background:var(--warn);animation:none}
.dtb-av.gone i{background:var(--dim);animation:none}

.dtb-tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);font-size:9px;color:var(--muted);margin-right:3px;font-weight:700}
.dtb-tag.hot{border-color:var(--accent);color:var(--accent);animation:dtbTagGlow 2.2s ease-in-out infinite}
.dtb-tag.new{border-color:var(--pos);color:var(--pos)}
@keyframes dtbTagGlow{0%,100%{box-shadow:0 0 0 rgba(var(--accent-rgb),0)}50%{box-shadow:0 0 8px rgba(var(--accent-rgb),.6)}}

.dtb-heat td.dtb-hc{text-align:right;font-family:ui-monospace,Menlo,monospace;background:rgba(var(--accent-rgb),calc(var(--h,.5)*.62));color:var(--ink);animation:dtbHeatPulse 3.6s ease-in-out infinite;animation-delay:calc(var(--h,.5)*-1.6s)}
@keyframes dtbHeatPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}

.dtb-ticker tbody tr:first-child td{animation:dtbInsert 4s cubic-bezier(.2,.8,.3,1) infinite}
.dtb-ticker tbody tr:nth-child(2) td .dtb-tk{animation:dtbFlash 4s ease-out infinite;animation-delay:1.6s;padding:0 3px;border-radius:3px}
.dtb-ticker tbody tr:nth-child(3) td .dtb-tk{animation:dtbFlashNeg 4s ease-out infinite;animation-delay:2.6s;padding:0 3px;border-radius:3px}
.dtb-tk{display:inline-block}

/* ===================== C. MATRICES & COMPARISON ===================== */
.dtb-matrix td{text-align:center}
.dtb-matrix td:first-child{text-align:left;color:var(--muted)}
.dtb-matrix th{text-align:center}
.dtb-matrix th:first-child{text-align:left}
.dtb-yes{display:inline-block;color:var(--pos);font-weight:900;animation:dtbPop 4.8s ease-out infinite}
.dtb-no{color:var(--dim)}
.dtb-part{display:inline-block;width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--warn) 0 50%,var(--panel2) 50% 100%);vertical-align:-1px}
.dtb-matrix tr:nth-child(1) .dtb-yes{animation-delay:0s}.dtb-matrix tr:nth-child(2) .dtb-yes{animation-delay:.25s}.dtb-matrix tr:nth-child(3) .dtb-yes{animation-delay:.5s}.dtb-matrix tr:nth-child(4) .dtb-yes{animation-delay:.75s}
.dtb-matrix td:nth-child(3) .dtb-yes{animation-delay:.9s}.dtb-matrix td:nth-child(4) .dtb-yes{animation-delay:1.3s}

.dtb-hm{display:grid;grid-template-columns:34px repeat(7,18px);gap:3px;align-items:center;font:600 8.5px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.dtb-hm b{font-weight:600;text-align:center}
.dtb-hm i{display:block;width:18px;height:18px;border-radius:3px;background:rgba(var(--c-rgb,var(--accent-rgb)),var(--a,.4));animation:dtbWave 3.2s ease-in-out infinite;animation-delay:calc(var(--d,0)*.13s)}
@keyframes dtbWave{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}

.dtb-pivot th.dtb-rh{background:var(--panel2);color:var(--muted);text-transform:none;letter-spacing:0;font-size:10px}
.dtb-pivot td{text-align:right;font-family:ui-monospace,Menlo,monospace}
.dtb-pivot tbody tr:nth-child(3) td{animation:dtbRowLite 5s ease-in-out infinite}
.dtb-pivot tbody tr td:nth-child(3){animation:dtbRowLite 5s ease-in-out infinite}
.dtb-pivot tbody tr:nth-child(3) td:nth-child(3){animation:dtbHit 5s ease-in-out infinite;color:var(--accent);font-weight:800}
@keyframes dtbRowLite{0%,15%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0)}30%,70%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),.09)}85%,100%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0)}}
@keyframes dtbHit{0%,15%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0),inset 0 0 0 0 var(--accent)}30%,70%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),.22),inset 0 0 0 1px var(--accent)}85%,100%{box-shadow:inset 0 0 0 999px rgba(var(--accent-rgb),0),inset 0 0 0 0 var(--accent)}}

.dtb-risk{display:grid;grid-template-columns:auto repeat(4,32px);grid-auto-rows:26px;gap:3px;align-items:center;font:700 8px ui-sans-serif,system-ui,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.dtb-risk span{text-align:right;padding-right:4px}
.dtb-risk b{font-weight:700;text-align:center;align-self:start}
.dtb-risk i{display:block;height:26px;border-radius:4px;position:relative;background:rgba(var(--pos-rgb),.22)}
.dtb-risk i.m{background:rgba(var(--warn-rgb),.28)}
.dtb-risk i.h{background:rgba(var(--neg-rgb),.34)}
.dtb-risk-dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--neg);animation:dtbRiskPulse 1.8s ease-out infinite}
@keyframes dtbRiskPulse{0%{box-shadow:0 0 0 2px var(--neg),0 0 0 2px rgba(var(--neg-rgb),.6)}100%{box-shadow:0 0 0 2px var(--neg),0 0 0 12px rgba(var(--neg-rgb),0)}}

.dtb-compare th,.dtb-compare td{text-align:center}
.dtb-compare th:first-child,.dtb-compare td:first-child{text-align:left;color:var(--muted)}
.dtb-compare .dtb-rec{background:rgba(var(--accent-rgb),.08);box-shadow:inset 0 0 0 1px var(--accent);animation:dtbRecGlow 2.6s ease-in-out infinite}
.dtb-compare th.dtb-rec{color:var(--accent)}
.dtb-rec-badge{display:block;font-size:7.5px;letter-spacing:.1em;color:var(--accent);margin-top:2px}
@keyframes dtbRecGlow{0%,100%{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 rgba(var(--accent-rgb),0)}50%{box-shadow:inset 0 0 0 1px var(--accent),0 0 12px rgba(var(--accent-rgb),.35)}}

.dtb-corr{font-family:ui-monospace,Menlo,monospace}
.dtb-corr th{text-align:center;padding:5px 6px}
.dtb-corr td{text-align:center;padding:5px 6px;font-size:10px}
.dtb-corr td.p{background:rgba(var(--c-rgb,var(--accent-rgb)),calc(var(--v,.5)*.75))}
.dtb-corr td.n{background:rgba(var(--neg-rgb),calc(var(--v,.5)*.75))}
.dtb-corr td.d{background:rgba(var(--accent-rgb),.3);color:var(--accent);font-weight:800;animation:dtbBlink 2.6s ease-in-out infinite}

.dtb-contrib{display:grid;grid-template-columns:repeat(14,10px);grid-auto-rows:10px;gap:2px}
.dtb-contrib i{display:block;border-radius:2px;background:rgba(var(--pos-rgb),var(--a,.12));animation:dtbLight 7s ease-in-out infinite;animation-delay:calc(var(--d,0)*.07s)}
@keyframes dtbLight{0%,8%{filter:brightness(.6);transform:scale(.85)}14%,60%{filter:brightness(1.15);transform:scale(1)}70%,100%{filter:brightness(1);transform:scale(1)}}
.dtb-contrib-lg{display:flex;gap:3px;align-items:center;justify-content:flex-end;margin-top:6px;font:600 8.5px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.dtb-contrib-lg i{width:9px;height:9px;border-radius:2px;background:rgba(var(--pos-rgb),var(--a,.12))}

/* ===================== D. KEY-VALUE & DEFINITION ===================== */
.dtb-kv{display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;row-gap:6px;width:100%;max-width:280px;font:11px/1.3 ui-sans-serif,system-ui,sans-serif;align-items:end}
.dtb-kv .k{color:var(--muted)}
.dtb-kv .lead{border-bottom:1px dotted var(--dim);margin-bottom:3px;opacity:.7}
.dtb-kv .v{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right;animation:dtbFadeUp 6s ease-in-out infinite}
.dtb-kv .v:nth-of-type(2){animation-delay:.2s}.dtb-kv .v:nth-of-type(3){animation-delay:.4s}.dtb-kv .v:nth-of-type(4){animation-delay:.6s}.dtb-kv .v:nth-of-type(5){animation-delay:.8s}

.dtb-spec{width:100%;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font:11px/1.3 ui-sans-serif,system-ui,sans-serif}
.dtb-spec-h{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:800;font-size:11px;letter-spacing:.02em}
.dtb-spec-h small{float:right;color:var(--dim);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.dtb-spec-r{display:grid;grid-template-columns:90px 1fr;padding:6px 12px;border-bottom:1px solid var(--line);animation:dtbRowLite 6s ease-in-out infinite}
.dtb-spec-r:last-child{border-bottom:0}
.dtb-spec-r:nth-child(3){animation-delay:1.2s}.dtb-spec-r:nth-child(4){animation-delay:2.4s}.dtb-spec-r:nth-child(5){animation-delay:3.6s}.dtb-spec-r:nth-child(6){animation-delay:4.8s}
.dtb-spec-r .k{color:var(--muted)}
.dtb-spec-r .v{color:var(--ink);font-family:ui-monospace,Menlo,monospace}

.dtb-def{width:100%;max-width:280px;margin:0;font:11px/1.4 ui-sans-serif,system-ui,sans-serif}
.dtb-def dt{font-weight:800;color:var(--c,var(--accent));font-family:ui-monospace,Menlo,monospace;font-size:10.5px;margin-top:6px}
.dtb-def dt:first-child{margin-top:0}
.dtb-def dd{margin:1px 0 0 12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.dtb-def dd .dtb-typed{max-width:0;animation:dtbTypeLong 6s steps(26,end) infinite;color:var(--ink)}
@keyframes dtbTypeLong{0%,8%{max-width:0}55%,92%{max-width:15em}100%{max-width:0}}

.dtb-insp{width:100%;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font:10.5px/1.3 ui-sans-serif,system-ui,sans-serif}
.dtb-insp-h{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel2);font-weight:800;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.dtb-insp-h .dtb-chev{animation:none;transform:rotate(90deg)}
.dtb-insp-h.fold .dtb-chev{animation:dtbChev 6s ease-in-out infinite;animation-delay:-1.4s}
.dtb-insp-r{display:grid;grid-template-columns:80px 1fr;padding:4px 10px 4px 22px;border-bottom:1px solid var(--line)}
.dtb-insp-r .k{color:var(--muted)}
.dtb-insp-r .v{color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.dtb-insp-r .v.b{color:var(--crit)}.dtb-insp-r .v.n{color:var(--accent)}.dtb-insp-r .v.s{color:var(--pos)}
.dtb-insp-g{overflow:hidden;animation:dtbFold 6s ease-in-out infinite;animation-delay:-1.4s}
@keyframes dtbFold{0%,18%{max-height:80px}28%,78%{max-height:0}90%,100%{max-height:80px}}

.dtb-json{width:100%;max-width:280px;margin:0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font:10.5px/1.55 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre}
.dtb-jk{color:var(--c,var(--accent))}.dtb-js{color:var(--pos)}.dtb-jn{color:var(--accent)}.dtb-jb{color:var(--crit)}
.dtb-json-fold{display:block;overflow:hidden;max-height:60px;animation:dtbJsonFold 6s ease-in-out infinite}
.dtb-json-el{display:block;overflow:hidden;max-height:0;opacity:0;color:var(--dim);animation:dtbJsonEl 6s ease-in-out infinite}
@keyframes dtbJsonFold{0%,20%{max-height:60px;opacity:1}30%,70%{max-height:0;opacity:0}80%,100%{max-height:60px;opacity:1}}
@keyframes dtbJsonEl{0%,24%{max-height:0;opacity:0}32%,68%{max-height:20px;opacity:1}78%,100%{max-height:0;opacity:0}}

/* ===================== E. LISTS & TREES ===================== */
.dtb-tree{width:100%;max-width:260px;font:11px/1.6 ui-monospace,Menlo,monospace;color:var(--ink)}
.dtb-tree-n{display:flex;align-items:center;gap:6px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.dtb-tree-n .ic{width:12px;height:10px;border-radius:2px;background:var(--warn);position:relative;flex:0 0 auto}
.dtb-tree-n .ic::before{content:"";position:absolute;left:0;top:-2px;width:5px;height:2px;border-radius:1px 1px 0 0;background:var(--warn)}
.dtb-tree-n .fi{width:9px;height:11px;border-radius:1px;background:var(--dim);flex:0 0 auto}
.dtb-tree-n .fi.code{background:var(--c,var(--accent))}
.dtb-tree-n.sel{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.dtb-tree-kids{padding-left:18px;overflow:hidden;animation:dtbTreeOpen 6s ease-in-out infinite}
.dtb-tree .dtb-chev{animation:dtbChev 6s ease-in-out infinite}
@keyframes dtbTreeOpen{0%,18%{max-height:0;opacity:0}28%,80%{max-height:90px;opacity:1}90%,100%{max-height:0;opacity:0}}

.dtb-org{display:flex;flex-direction:column;align-items:center;width:100%;max-width:280px;font:700 9.5px/1.2 ui-sans-serif,system-ui,sans-serif}
.dtb-org-n{padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);text-align:center;min-width:64px;position:relative}
.dtb-org-n small{display:block;font-weight:600;font-size:8px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.dtb-org-n.root{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(var(--accent-rgb),.2)}
.dtb-org-v{width:2px;height:16px;background:linear-gradient(180deg,var(--accent),var(--line))}
.dtb-org-row{display:flex;gap:10px;position:relative;padding-top:12px}
.dtb-org-row::before{content:"";position:absolute;left:13%;right:13%;top:0;height:2px;background:var(--line)}
.dtb-org-row .dtb-org-n::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:12px;background:var(--line)}
.dtb-org-pulse{position:absolute;left:50%;top:-12px;width:6px;height:6px;margin-left:-2px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:dtbOrgPulse 3s ease-in-out infinite}
.dtb-org-row .dtb-org-n:nth-child(2) .dtb-org-pulse{animation-delay:1s}.dtb-org-row .dtb-org-n:nth-child(3) .dtb-org-pulse{animation-delay:2s}
@keyframes dtbOrgPulse{0%,60%{opacity:0;transform:translateY(0)}65%{opacity:1}90%{opacity:1;transform:translateY(12px)}100%{opacity:0;transform:translateY(12px)}}

.dtb-outline{width:100%;max-width:260px;margin:0;padding:0;list-style:none;font:11px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.dtb-outline li{position:relative;padding-left:16px}
.dtb-outline li::before{content:"";position:absolute;left:3px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--dim);animation:dtbBullet 5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.45s)}
.dtb-outline ul{list-style:none;margin:0;padding:0 0 0 6px;border-left:1px dashed var(--line);margin-left:6px}
.dtb-outline ul li::before{width:5px;height:5px;border-radius:1px;transform:rotate(45deg)}
.dtb-outline li.mut{color:var(--muted)}
@keyframes dtbBullet{0%,10%{background:var(--dim);box-shadow:0 0 0 rgba(var(--c-rgb,var(--accent-rgb)),0)}16%,26%{background:var(--c,var(--accent));box-shadow:0 0 8px rgba(var(--c-rgb,var(--accent-rgb)),.8)}36%,100%{background:var(--dim);box-shadow:0 0 0 rgba(var(--c-rgb,var(--accent-rgb)),0)}}

.dtb-steps{width:100%;max-width:260px;position:relative;font:11px/1.3 ui-sans-serif,system-ui,sans-serif;padding-left:30px}
.dtb-steps::before{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:2px;background:var(--line)}
.dtb-steps::after{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:2px;background:var(--pos);transform-origin:50% 0;animation:dtbTrack 6s ease-in-out infinite}
@keyframes dtbTrack{0%,8%{transform:scaleY(0)}70%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.dtb-step{position:relative;padding:4px 0 10px;color:var(--muted)}
.dtb-step:last-child{padding-bottom:0}
.dtb-step b{display:block;color:var(--ink);font-weight:700}
.dtb-step i{position:absolute;left:-30px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font:800 9px ui-sans-serif,system-ui,sans-serif;color:var(--muted);font-style:normal;animation:dtbStepOn 6s steps(1) infinite;animation-delay:calc(var(--i,0)*1.15s)}
@keyframes dtbStepOn{0%,12%{background:var(--panel2);border-color:var(--line);color:var(--muted)}13%,88%{background:var(--pos);border-color:var(--pos);color:#06140a}100%{background:var(--panel2);border-color:var(--line);color:var(--muted)}}

.dtb-check{width:100%;max-width:260px;margin:0;padding:0;list-style:none;font:11px/1.4 ui-sans-serif,system-ui,sans-serif}
.dtb-ck-item{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--ink);animation:dtbDone 7s steps(1) infinite;animation-delay:calc(var(--i,0)*1.2s)}
.dtb-ck-item .dtb-cb{animation:dtbCbOn 7s steps(1) infinite;animation-delay:calc(var(--i,0)*1.2s)}
.dtb-ck-item .dtb-cb::after{animation:dtbCbMark 7s ease-out infinite;animation-delay:calc(var(--i,0)*1.2s)}
.dtb-ck-item .dtb-cb.on{animation:none}.dtb-ck-item .dtb-cb.on::after{animation:none}
.dtb-ck-item.done{color:var(--dim);text-decoration:line-through;animation:none}
@keyframes dtbDone{0%,19%{color:var(--ink);text-decoration:none}20%,75%{color:var(--dim);text-decoration:line-through}76%,100%{color:var(--ink);text-decoration:none}}

.dtb-rank{width:100%;max-width:280px;font:11px/1.3 ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;gap:4px}
.dtb-rank-r{display:grid;grid-template-columns:22px 1fr 70px 34px;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.dtb-rank-r .rk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:9.5px;background:var(--panel2);color:var(--muted)}
.dtb-rank-r.g .rk{background:var(--accent);color:#1a1000}.dtb-rank-r.s .rk{background:var(--muted);color:#0b0e17}.dtb-rank-r.b .rk{background:rgba(var(--warn-rgb),.7);color:#1a1000}
.dtb-rank-r .bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.dtb-rank-r .bar i{display:block;height:100%;width:var(--w,50%);background:var(--c,var(--accent));border-radius:3px}
.dtb-rank-r .sc{text-align:right;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.dtb-rank-r.dn{animation:dtbSwapDownR 5s ease-in-out infinite;position:relative;z-index:1}
.dtb-rank-r.up{animation:dtbSwapUpR 5s ease-in-out infinite;position:relative;z-index:2}
.dtb-rank-r.up .sc{color:var(--pos)}
@keyframes dtbSwapDownR{0%,40%{transform:translateY(0)}50%,90%{transform:translateY(calc(100% + 4px))}100%{transform:translateY(0)}}
@keyframes dtbSwapUpR{0%,40%{transform:translateY(0);box-shadow:none}50%,90%{transform:translateY(calc(-100% - 4px));box-shadow:0 0 0 1px var(--pos),0 4px 14px rgba(0,0,0,.4)}100%{transform:translateY(0);box-shadow:none}}

.dtb-tl{width:100%;max-width:280px;position:relative;font:11px/1.3 ui-sans-serif,system-ui,sans-serif}
.dtb-tl-r{display:grid;grid-template-columns:44px 14px 1fr;align-items:center;gap:6px;padding:5px 0;position:relative}
.dtb-tl-r .t{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--dim);text-align:right}
.dtb-tl-r .d{width:8px;height:8px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);justify-self:center}
.dtb-tl-r .d.ok{border-color:var(--pos);background:var(--pos)}.dtb-tl-r .d.warn{border-color:var(--warn);background:var(--warn)}
.dtb-tl-r .e{color:var(--ink)}
.dtb-tl-r .e small{color:var(--muted);margin-left:5px;font-size:9.5px}
.dtb-tl::before{content:"";position:absolute;left:54px;top:8px;bottom:8px;width:2px;background:var(--line);margin-left:-1px}
.dtb-now{position:absolute;left:44px;right:0;top:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:dtbNow 6s ease-in-out infinite;pointer-events:none}
.dtb-now::before{content:"NOW";position:absolute;right:0;top:-5px;font:800 7px ui-sans-serif,system-ui,sans-serif;color:#1a1000;background:var(--accent);padding:1px 4px;border-radius:3px;letter-spacing:.08em}
@keyframes dtbNow{0%,10%{top:14%}45%,55%{top:60%}90%,100%{top:14%}}

/* ===================== F. GRIDS & SCHEDULES ===================== */
.dtb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:290px;font:10px/1.3 ui-sans-serif,system-ui,sans-serif}
.dtb-rec{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);animation:dtbFadeUp 6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.25s)}
.dtb-rec b{display:block;font-size:10.5px;color:var(--ink);font-weight:700}
.dtb-rec small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.dtb-rec em{display:block;font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--c,var(--accent));font-size:11px;margin-top:4px;font-weight:700}

.dtb-gantt{width:100%;max-width:290px;position:relative;font:600 9.5px/1.2 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
.dtb-gantt-r{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:6px;padding:3px 0}
.dtb-gantt-r .tr{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 24%,var(--line) 24% 25%);position:relative}
.dtb-gantt-r .tr i{position:absolute;top:1px;bottom:1px;left:var(--s,0%);width:var(--w,30%);border-radius:3px;background:var(--c,var(--accent));opacity:.85;transform-origin:0 50%;animation:dtbFill 5s ease-out infinite;animation-delay:calc(var(--i,0)*.35s)}
.dtb-gantt-r .tr i.ms{width:8px;height:8px;top:2px;border-radius:2px;transform:rotate(45deg);background:var(--accent);animation:none}
.dtb-today{position:absolute;top:0;bottom:0;left:calc(56px + 6px + 22%);width:2px;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:dtbToday 7s linear infinite}
@keyframes dtbToday{0%{left:calc(62px + 18%)}100%{left:calc(62px + 78%)}}

.dtb-sched{display:grid;grid-template-columns:34px repeat(5,1fr);grid-auto-rows:20px;gap:2px;width:100%;max-width:290px;font:600 8.5px ui-sans-serif,system-ui,sans-serif;color:var(--dim)}
.dtb-sched b{font-weight:700;text-align:center;line-height:20px;text-transform:uppercase;letter-spacing:.05em}
.dtb-sched span{text-align:right;padding-right:4px;line-height:20px;font-family:ui-monospace,Menlo,monospace}
.dtb-sched i{display:block;border-radius:3px;background:rgba(255,255,255,.035)}
.dtb-sched i.ev{background:rgba(var(--c-rgb,var(--accent-rgb)),.35);box-shadow:inset 0 0 0 1px rgba(var(--c-rgb,var(--accent-rgb)),.5)}
.dtb-sched i.now{animation:dtbSlot 1.6s ease-in-out infinite}
@keyframes dtbSlot{0%,100%{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 rgba(var(--accent-rgb),0)}50%{box-shadow:inset 0 0 0 2px var(--accent),0 0 10px rgba(var(--accent-rgb),.6)}}

.dtb-cal{width:100%;max-width:230px;font:600 9px ui-sans-serif,system-ui,sans-serif}

.dtb-cal-g i.o{color:var(--dim);opacity:.45}
.dtb-cal-g i.ev::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c,var(--accent))}
.dtb-cal-g i.today{background:var(--accent);color:#1a1000;font-weight:800;animation:dtbTodayRing 2s ease-out infinite}
@keyframes dtbTodayRing{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.6)}100%{box-shadow:0 0 0 8px rgba(var(--accent-rgb),0)}}

.dtb-kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:290px;font:600 9px/1.25 ui-sans-serif,system-ui,sans-serif}
.dtb-kan-col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:104px}

.dtb-kan-card.in{animation:dtbKanIn 5s ease-in-out infinite}
@keyframes dtbKanOut{0%,25%{opacity:1;transform:translateX(0)}40%,88%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:translateX(0)}}
@keyframes dtbKanIn{0%,32%{opacity:0;transform:translateX(-30px)}45%,88%{opacity:1;transform:translateX(0);box-shadow:0 0 0 1px var(--pos)}100%{opacity:0;transform:translateX(-30px)}}

.dtb-bento{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:44px;gap:6px;width:100%;max-width:290px;font:600 9px/1.2 ui-sans-serif,system-ui,sans-serif}
.dtb-bento div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--muted);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}

.dtb-bento small{font-size:8px;letter-spacing:.06em;text-transform:uppercase}
.dtb-bento .dtb-bar{width:100%;margin:0}
.dtb-bento .dtb-spark{width:100%;height:20px}
.dtb-bento .glow{animation:dtbBentoGlow 3s ease-in-out infinite}
@keyframes dtbBentoGlow{0%,100%{box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),0)}50%{box-shadow:inset 0 0 0 1px var(--accent),0 0 12px rgba(var(--accent-rgb),.25)}}

.dtb-masonry{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:290px;align-items:start}
.dtb-masonry > div{display:flex;flex-direction:column;gap:6px}
.dtb-mas{border-radius:7px;border:1px solid var(--line);background:linear-gradient(110deg,var(--card) 30%,rgba(255,255,255,.07) 50%,var(--card) 70%);background-size:220% 100%;animation:dtbShimmer 2.6s linear infinite;animation-delay:calc(var(--i,0)*-.4s);position:relative}
.dtb-mas::after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:3px;background:var(--panel2)}

/* ===================== G. LEDGERS, LOGS & TOOLBARS ===================== */
.dtb-ledger td.cr{color:var(--pos)}
.dtb-ledger td.dr{color:var(--neg)}
.dtb-ledger td.bal{color:var(--ink);font-weight:700}
.dtb-ledger tbody tr:first-child td{animation:dtbInsert 5s cubic-bezier(.2,.8,.3,1) infinite}
.dtb-ledger tfoot td{font-size:10px}

.dtb-diff td:first-child{width:14px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--dim);padding-right:4px;padding-left:8px}
.dtb-diff tr.add td{background:rgba(var(--pos-rgb),.13)}
.dtb-diff tr.add td:first-child{color:var(--pos)}
.dtb-diff tr.del td{background:rgba(var(--neg-rgb),.13);color:var(--muted);text-decoration:line-through}
.dtb-diff tr.del td:first-child{color:var(--neg);text-decoration:none}
.dtb-diff tr.add td{animation:dtbDiffAdd 3s ease-in-out infinite}
.dtb-diff tr.del td{animation:dtbDiffDel 3s ease-in-out infinite;animation-delay:1.5s}
@keyframes dtbDiffAdd{0%,100%{box-shadow:inset 0 0 0 999px rgba(var(--pos-rgb),0)}50%{box-shadow:inset 0 0 0 999px rgba(var(--pos-rgb),.16)}}
@keyframes dtbDiffDel{0%,100%{box-shadow:inset 0 0 0 999px rgba(var(--neg-rgb),0)}50%{box-shadow:inset 0 0 0 999px rgba(var(--neg-rgb),.16)}}

.dtb-audit td{font-size:10.5px}
.dtb-audit td.t{font-family:ui-monospace,Menlo,monospace;color:var(--dim);font-size:9.5px}
.dtb-audit td .who{display:inline-block;padding:0 5px;border-radius:4px;background:var(--panel2);font-weight:700;color:var(--c,var(--accent));font-size:9.5px}
.dtb-audit tbody tr td{animation:dtbFadeUp 7s ease-in-out infinite}
.dtb-audit tbody tr:nth-child(2) td{animation-delay:.5s}.dtb-audit tbody tr:nth-child(3) td{animation-delay:1s}.dtb-audit tbody tr:nth-child(4) td{animation-delay:1.5s}.dtb-audit tbody tr:nth-child(5) td{animation-delay:2s}

.dtb-pg{display:inline-flex;align-items:center;gap:4px;font:700 10.5px ui-sans-serif,system-ui,sans-serif}
.dtb-pg i{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-style:normal;animation:dtbPage 6s steps(1) infinite;animation-delay:calc(var(--i,0)*-1.2s)}
.dtb-pg i.nav{animation:none;color:var(--dim)}
.dtb-pg i.dots{animation:none;border-color:transparent;background:transparent}
@keyframes dtbPage{0%,19%{background:var(--accent);border-color:var(--accent);color:#1a1000}20%,100%{background:var(--card);border-color:var(--line);color:var(--muted)}}
.dtb-pg-info{font:600 9.5px ui-sans-serif,system-ui,sans-serif;color:var(--dim);margin-top:8px;text-align:center}

.dtb-toolbar{width:100%;max-width:290px;font:600 9.5px ui-sans-serif,system-ui,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:7px}
.dtb-tb-row{display:flex;align-items:center;gap:6px}
.dtb-search{flex:1;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:10px}
.dtb-search::before{content:"";width:8px;height:8px;border:1.5px solid var(--dim);border-radius:50%;box-shadow:3px 3px 0 -1px var(--dim);flex:0 0 auto}
.dtb-search .dtb-typed{animation:dtbType 5s steps(7,end) infinite}
.dtb-chip{padding:2px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:9px;white-space:nowrap}
.dtb-chip.on{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:rgba(var(--c-rgb,var(--accent-rgb)),.12)}
.dtb-chip.tog{animation:dtbChip 5s steps(1) infinite}
@keyframes dtbChip{0%,35%{border-color:var(--line);color:var(--muted);background:var(--panel)}36%,85%{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:rgba(var(--c-rgb,var(--accent-rgb)),.12)}86%,100%{border-color:var(--line);color:var(--muted);background:var(--panel)}}
.dtb-tb-btn{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}
.dtb-tb-count{margin-left:auto;font-family:ui-monospace,Menlo,monospace;color:var(--dim);font-size:9px;font-weight:600}
.dtb-tb-count b{color:var(--ink);animation:dtbCountFlip 5s steps(1) infinite}
@keyframes dtbCountFlip{0%,35%{color:var(--ink)}36%,50%{color:var(--c,var(--accent))}51%,85%{color:var(--ink)}}

.dtb-empty{width:100%;max-width:290px;border:1px dashed var(--line);border-radius:10px;padding:10px;position:relative;font:600 10px ui-sans-serif,system-ui,sans-serif;text-align:center;color:var(--muted)}
.dtb-empty .dtb-sk{opacity:.35;margin:0 auto 8px;animation-duration:3s}
.dtb-empty-ic{width:30px;height:24px;margin:4px auto 6px;border:2px solid var(--dim);border-radius:5px;position:relative;opacity:.8}
.dtb-empty-ic::before,.dtb-empty-ic::after{content:"";position:absolute;left:5px;right:5px;height:2px;background:var(--dim);border-radius:1px;top:6px}
.dtb-empty-ic::after{top:13px;right:11px}
.dtb-empty b{display:block;color:var(--ink);font-size:11px}
.dtb-empty small{display:block;margin-top:2px;font-weight:500}
.dtb-empty-btn{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);animation:dtbTagGlow 2.4s ease-in-out infinite}

/* dual-tone contribution calendar (series A ◤ / series B ◢) — from a Forgejo landing page.
   Recolour with --dtb-a-rgb / --dtb-b-rgb (defaults: info blue / crit violet). */
.dtb-forge{display:grid;grid-template-columns:repeat(14,11px);grid-auto-rows:11px;gap:3px;--dtb-a-rgb:var(--c-rgb,var(--accent-rgb));--dtb-b-rgb:var(--crit-rgb)}
.dtb-forge i{display:block;border-radius:2px;background:linear-gradient(135deg,rgba(var(--dtb-a-rgb),var(--c,0)) 50%,rgba(var(--dtb-b-rgb),var(--a,0)) 50%),var(--panel2);animation:dtbLight 7s ease-in-out infinite;animation-delay:calc(var(--d,0)*.07s)}
.dtb-forge-lg{display:flex;gap:3px;align-items:center;justify-content:flex-end;margin-top:6px;font:600 8.5px ui-sans-serif,system-ui,sans-serif;color:var(--dim);--dtb-a-rgb:var(--c-rgb,var(--accent-rgb));--dtb-b-rgb:var(--crit-rgb)}
.dtb-forge-lg i{width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,rgba(var(--dtb-a-rgb),var(--c,0)) 50%,rgba(var(--dtb-b-rgb),var(--a,0)) 50%),var(--panel2)}
.dtb-forge-lg b{font-weight:700;margin-right:5px}
.dtb-forge-lg b.c{color:rgb(var(--dtb-a-rgb))}.dtb-forge-lg b.a{color:rgb(var(--dtb-b-rgb))}
.dtb-forge-cap{font:600 8.5px ui-sans-serif,system-ui,sans-serif;color:var(--muted);margin-bottom:6px;text-align:center}
.dtb-forge-cap b{color:var(--ink)}

/* ember sparks rising from the busiest weeks of a contribution calendar (the forge-landing
   touch): position the wrapper, drop <i> sparks with --x (column) and --sc (rgb triplet). */
.dtb-cal-wrap{position:relative;display:inline-block}
.dtb-sparks{position:absolute;inset:0;pointer-events:none;overflow:visible;--dtb-a-rgb:var(--c-rgb,var(--accent-rgb));--dtb-b-rgb:var(--crit-rgb)}
/* longhands on purpose: the catalog extractor drops an animation shorthand that mixes var() with a separate delay */
.dtb-sparks i{position:absolute;bottom:2px;left:var(--x,50%);width:4px;height:4px;border-radius:50%;background:rgb(var(--sc,var(--pos-rgb)));box-shadow:0 0 7px 2px rgba(var(--sc,var(--pos-rgb)),.7);opacity:0;animation-name:dtbSpark;animation-duration:var(--dur,5s);animation-timing-function:linear;animation-iteration-count:infinite;animation-delay:var(--delay,0s)}
.dtb-sparks i.s{width:3px;height:3px}
@keyframes dtbSpark{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%{transform:translate(5px,-42px);opacity:.7}100%{transform:translate(-4px,-78px);opacity:0}}

/* ---- interactive mode for the sorting demos: first click stops the ambient loop, then
   every click performs a real reorder animated with FLIP (see the tables page script) ---- */
.dtb-rowmove.manual tbody tr td,.dtb-rowmove.manual .dtb-arr,.dtb-resort.manual th,.dtb-resort.manual td,.dtb-resort.manual .dtb-sort-arrow,.dtb-fall.manual td,.dtb-fall.manual .dtb-sort-arrow{animation:none!important;transform:none;opacity:1;box-shadow:none}
.dtb-rowmove .dtb-arr,.dtb-resort th.dtb-num,.dtb-fall th.dtb-num{cursor:pointer;user-select:none}
.dtb-rowmove .dtb-arr:hover,.dtb-resort th.dtb-num:hover,.dtb-fall th.dtb-num:hover{color:var(--c,var(--accent))}
.dtb-manual-hint{display:block;margin-top:6px;font:600 9px ui-sans-serif,system-ui,sans-serif;color:var(--dim);text-align:center;letter-spacing:.04em}
.dtb-tbl.manual td.flip{transition:transform .45s cubic-bezier(.4,0,.2,1)}
.dtb-tbl.manual tr.lifted td{position:relative;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.14)}
.dtb-arr.pressed{color:var(--c,var(--accent))!important;background:rgba(var(--c-rgb,var(--accent-rgb)),.22);border-radius:3px;box-shadow:0 0 8px rgba(var(--c-rgb,var(--accent-rgb)),.5)}
.dtb-resort.manual .flashed{animation:dtbColFlashOnce .6s ease-out!important}
@keyframes dtbColFlashOnce{0%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.45)}100%{box-shadow:inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0)}}
.dtb-fall.manual tr.fall-out td{animation:dtbFallOut .55s cubic-bezier(.3,0,.7,.4) forwards!important;transform-origin:20% 50%}
.dtb-fall.manual tr.land-in td{animation:dtbLandIn .6s cubic-bezier(.2,.8,.3,1.15) both!important}
@keyframes dtbFallOut{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(190%) rotate(var(--rot,-5deg));opacity:0}}
@keyframes dtbLandIn{0%{transform:translateY(-300%);opacity:0}60%{transform:translateY(6%);opacity:1}100%{transform:translateY(0);opacity:1}}

/* ---- reduced motion: freeze every dtb animation on a legible frame ---- */
@media (prefers-reduced-motion:reduce){
  [class*="dtb-"],[class*="dtb-"]::before,[class*="dtb-"]::after,.dtb-tbl *{animation:none!important}
  .dtb-detail-in,.dtb-tree-kids,.dtb-insp-g,.dtb-json-fold{max-height:none!important;opacity:1!important}
  .dtb-typed{max-width:none!important}
  .dtb-yes{transform:none;opacity:1}
  .dtb-kan-card.in{opacity:0}
  .dtb-sparks i{opacity:.5;transform:translateY(-30px)}
}

<script>
/* Tables gallery: interactive sorting demos. The tiles loop an ambient CSS demo until the
   first click; after that the table is in manual mode and every click does a real reorder.
   Self-contained, idempotent, no globals. */
(function(){
  if(window.dtbSortDemos) return; window.dtbSortDemos=true;
  var num=function(t){return parseFloat(String(t).replace(/[^0-9.\-]/g,''))||0;};
  function manual(tbl){ if(!tbl.classList.contains('manual')){ tbl.classList.add('manual'); tbl.querySelectorAll('tr').forEach(function(r){ r.removeAttribute('style'); }); } }
  // FLIP: snapshot row tops, mutate DOM, then animate each moved row from its old position.
  function flip(tbl, mutate, lifted){
    var rows=[].slice.call(tbl.querySelectorAll('tbody tr'));
    var before={}; rows.forEach(function(r,i){ r._k=r._k||('r'+i+Math.random()); before[r._k]=r.getBoundingClientRect().top; });
    mutate();
    rows.forEach(function(r){
      var d=before[r._k]-r.getBoundingClientRect().top; if(!d) return;
      [].forEach.call(r.children,function(td){ td.classList.remove('flip'); td.style.transform='translateY('+d+'px)'; });
      if(lifted===r) r.classList.add('lifted');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        [].forEach.call(r.children,function(td){ td.classList.add('flip'); td.style.transform=''; });
        setTimeout(function(){ r.classList.remove('lifted'); [].forEach.call(r.children,function(td){ td.classList.remove('flip'); }); },500);
      }); });
    });
  }
  // (1) row move arrows
  document.addEventListener('click',function(e){
    var arr=e.target.closest('.dtb-rowmove .dtb-arr'); if(!arr) return;
    var tbl=arr.closest('table'), row=arr.closest('tr'); manual(tbl);
    var up=/▲/.test(arr.textContent), sib=up?row.previousElementSibling:row.nextElementSibling; if(!sib) return;
    arr.classList.add('pressed'); setTimeout(function(){ arr.classList.remove('pressed'); },420);
    flip(tbl,function(){ if(up) sib.parentNode.insertBefore(row,sib); else sib.parentNode.insertBefore(sib,row); },row);
  });
  // (2) flash + resort: click a numeric header
  document.addEventListener('click',function(e){
    var th=e.target.closest('.dtb-resort th.dtb-num'); if(!th) return;
    var tbl=th.closest('table'); manual(tbl);
    var idx=[].indexOf.call(th.parentNode.children,th), desc=th.getAttribute('data-dir')!=='desc';
    th.setAttribute('data-dir',desc?'desc':'asc');
    var arrow=th.querySelector('.dtb-sort-arrow'); if(arrow) arrow.textContent=desc?'▼':'▲';
    [].forEach.call(tbl.querySelectorAll('th.dtb-sortcol, td.dtb-sortcol'),function(c){ c.classList.remove('dtb-sortcol'); });
    th.classList.add('dtb-sortcol'); tbl.querySelectorAll('tbody tr').forEach(function(r){ r.children[idx].classList.add('dtb-sortcol'); });
    var cells=[th].concat([].map.call(tbl.querySelectorAll('tbody tr'),function(r){return r.children[idx];}));
    cells.forEach(function(c){ c.classList.remove('flashed'); void c.offsetWidth; c.classList.add('flashed'); });
    var tb=tbl.tBodies[0];
    setTimeout(function(){ flip(tbl,function(){
      var rows=[].slice.call(tb.rows).sort(function(a,b){ var d=num(a.children[idx].textContent)-num(b.children[idx].textContent); return desc?-d:d; });
      rows.forEach(function(r){ tb.appendChild(r); });
    }); },260);
  });
  // (3) fall + land: rows tumble out, DOM resorts, rows drop back in
  document.addEventListener('click',function(e){
    var th=e.target.closest('.dtb-fall th.dtb-num'); if(!th) return;
    var tbl=th.closest('table'); if(tbl.getAttribute('data-busy')) return; manual(tbl); tbl.setAttribute('data-busy','1');
    var idx=[].indexOf.call(th.parentNode.children,th), desc=th.getAttribute('data-dir')!=='desc';
    th.setAttribute('data-dir',desc?'desc':'asc'); var arrow=th.querySelector('.dtb-sort-arrow'); if(arrow) arrow.textContent=desc?'▼':'▲';
    var tb=tbl.tBodies[0], rows=[].slice.call(tb.rows);
    rows.forEach(function(r,i){ r.classList.remove('land-in'); r.style.setProperty('--rot',((i%2?1:-1)*(3+i*1.2))+'deg'); [].forEach.call(r.children,function(td){ td.style.animationDelay=(i*90)+'ms'; }); r.classList.add('fall-out'); });
    setTimeout(function(){
      rows.sort(function(a,b){ var d=num(a.children[idx].textContent)-num(b.children[idx].textContent); return desc?-d:d; });
      rows.forEach(function(r,i){ tb.appendChild(r); r.classList.remove('fall-out'); [].forEach.call(r.children,function(td){ td.style.animationDelay=(i*110)+'ms'; }); r.classList.add('land-in'); });
      setTimeout(function(){ rows.forEach(function(r){ r.classList.remove('land-in'); [].forEach.call(r.children,function(td){ td.style.animationDelay=''; }); }); tbl.removeAttribute('data-busy'); }, 700+rows.length*110);
    }, 600+rows.length*90);
  });
})();
<\/script>
</div>
<script>
function copyViz(btn){
  var stage=btn.closest('.tile').querySelector('.stage');
  var html=stage.innerHTML.replace(/\s+$/,'').trim();
  var usedClasses=new Set();
  (html.match(/class="[^"]*"/g)||[]).forEach(function(m){m.replace(/class="/,'').replace(/"/,'').split(/\s+/).forEach(function(c){if(c)usedClasses.add(c)})});
  var cssRules=[];
  try{var sheets=document.styleSheets;for(var s=0;s<sheets.length;s++){var rules=sheets[s].cssRules;for(var r=0;r<rules.length;r++){var rule=rules[r];if(rule.type===7&&html.indexOf(rule.name)!==-1){cssRules.push(rule.cssText)}if(rule.type===1&&rule.selectorText){for(var uc of usedClasses){if(rule.selectorText.indexOf('.'+uc)!==-1&&!rule.selectorText.includes('.tile')){cssRules.push(rule.cssText);break}}}}}}catch(e){}
  cssRules=[...new Set(cssRules)];
  var output='<!-- Prism Component -->\n'+html;
  if(cssRules.length>0)output+='\n\n<style>\n'+cssRules.join('\n')+'\n</style>';
  function sgCopy(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).catch(function(){return sgCopyFallback(txt);});}}catch(e){}return Promise.resolve(sgCopyFallback(txt));}
  function sgCopyFallback(txt){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,txt.length);}catch(e){}var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(!ok)return Promise.reject(new Error('copy failed'));return true;}
  sgCopy(output).then(function(){var o=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=o;btn.textContent='✓ Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');btn.removeAttribute('data-lbl');},1300);},function(){var o=btn.dataset.lbl||btn.textContent;btn.dataset.lbl=o;btn.textContent='✗ Press ⌘C';btn.classList.add('ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('ok');btn.removeAttribute('data-lbl');},1500);});
}
/* data-snip copy for snippet buttons */
document.addEventListener('click',function(e){var b=e.target.closest('.copy[data-snip]');if(!b)return;var t=b.getAttribute('data-snip');
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).catch(fb):Promise.resolve(fb()));
  var o=b.dataset.lbl||b.textContent;b.dataset.lbl=o;b.textContent='✓ Copied';b.classList.add('ok');setTimeout(function(){b.textContent=o;b.classList.remove('ok');},1300);
});
<\/script>
</body>
</html>
</script>
