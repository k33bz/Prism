<title>Sequential Hub &amp; Spokes · Prism</title>
<!-- Prism showcase sample: obsidian-sequential-hub-spokes (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-svg { display: block; }
.obs-gr-hubnode { fill: var(--ob); stroke: none; filter: drop-shadow(0 0 6px rgba(var(--ob-rgb),.9)); }
.obs-spoke { stroke: rgba(var(--ob-rgb),.25); stroke-width: 1.5; animation: 4.2s ease 0s infinite normal none running obsSpokeOn; }
.obs-spoke.s2 { animation-delay: 0.6s; }
.obs-spoke.s3 { animation-delay: 1.2s; }
.obs-spoke.s4 { animation-delay: 1.8s; }
.obs-spoke.s5 { animation-delay: 2.4s; }
.obs-spoke.s6 { animation-delay: 3s; }
.obs-spoketip { fill: rgba(var(--ob-rgb),.5); animation: 4.2s ease 0s infinite normal none running obsTipPop; }
.obs-spoketip.s2 { animation-delay: 0.6s; }
.obs-spoketip.s3 { animation-delay: 1.2s; }
.obs-spoketip.s4 { animation-delay: 1.8s; }
.obs-spoketip.s5 { animation-delay: 2.4s; }
.obs-spoketip.s6 { animation-delay: 3s; }
@keyframes obsSpokeOn { 
  0%, 100% { stroke: rgba(var(--ob-rgb),.25); }
  8%, 18% { stroke: var(--ob); filter: drop-shadow(0 0 4px rgba(var(--ob-rgb),.9)); }
  30% { stroke: rgba(var(--ob-rgb),.25); }
}
@keyframes obsTipPop { 
  0%, 100% { r: 3; }
  10%, 16% { r: 4.6; fill: var(--ob); }
  28% { r: 3; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs"><svg class="obs-svg" viewBox="0 0 240 112" width="250" height="112"><g><line class="obs-spoke" x1="120" y1="56" x2="120" y2="12"></line><line class="obs-spoke s2" x1="120" y1="56" x2="195" y2="24"></line><line class="obs-spoke s3" x1="120" y1="56" x2="204" y2="91"></line><line class="obs-spoke s4" x1="120" y1="56" x2="120" y2="104"></line><line class="obs-spoke s5" x1="120" y1="56" x2="36" y2="91"></line><line class="obs-spoke s6" x1="120" y1="56" x2="45" y2="24"></line></g><circle class="obs-gr-hubnode" cx="120" cy="56" r="9"></circle><circle class="obs-spoketip" cx="120" cy="12" r="3"></circle><circle class="obs-spoketip s2" cx="195" cy="24" r="3"></circle><circle class="obs-spoketip s3" cx="204" cy="91" r="3"></circle><circle class="obs-spoketip s4" cx="120" cy="104" r="3"></circle><circle class="obs-spoketip s5" cx="36" cy="91" r="3"></circle><circle class="obs-spoketip s6" cx="45" cy="24" r="3"></circle></svg></div></div></div>
