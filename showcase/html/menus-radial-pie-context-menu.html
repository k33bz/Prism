<!DOCTYPE html>
<html lang="en">

<title>Radial / Pie Context Menu · Prism</title>
<!-- Prism showcase sample: menus-radial-pie-context-menu (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-radialwrap { position: relative; width: 180px; height: 180px; }
.mnu-radial-center { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--info); display: grid; place-items: center; color: var(--info); font-size: 16px; z-index: 2; box-shadow: 0 0 0 6px rgba(var(--info-rgb),.12); animation: 2.4s ease-in-out 0s infinite normal none running mnuBreathe; }
.mnu-radial-item { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: grid; place-items: center; font-size: 15px; transition: transform 0.2s, background 0.2s, border-color 0.2s; z-index: 1; animation: 0.3s cubic-bezier(0.3, 1.5, 0.4, 1) 0s 1 normal both running mnuFabPop; }
.mnu-radial-item:hover { background: rgba(var(--accent-rgb),.2); border-color: var(--accent); transform: scale(1.12); }
.mnu-radial-item:nth-child(2) { transform: translate(0px, -72px); animation-delay: 0.02s; }
.mnu-radial-item:nth-child(3) { transform: translate(62px, -38px); animation-delay: 0.06s; }
.mnu-radial-item:nth-child(4) { transform: translate(62px, 38px); animation-delay: 0.1s; }
.mnu-radial-item:nth-child(5) { transform: translate(0px, 72px); animation-delay: 0.14s; }
.mnu-radial-item:nth-child(6) { transform: translate(-62px, 38px); animation-delay: 0.18s; }
.mnu-radial-item:nth-child(7) { transform: translate(-62px, -38px); animation-delay: 0.22s; }
.mnu-radial-item:hover:nth-child(2) { transform: translate(0px, -72px) scale(1.12); }
.mnu-radial-item:hover:nth-child(3) { transform: translate(62px, -38px) scale(1.12); }
.mnu-radial-item:hover:nth-child(4) { transform: translate(62px, 38px) scale(1.12); }
.mnu-radial-item:hover:nth-child(5) { transform: translate(0px, 72px) scale(1.12); }
.mnu-radial-item:hover:nth-child(6) { transform: translate(-62px, 38px) scale(1.12); }
.mnu-radial-item:hover:nth-child(7) { transform: translate(-62px, -38px) scale(1.12); }
.mnu-radial-ring { position: absolute; inset: 14px; border: 1px dashed rgba(var(--info-rgb),.3); border-radius: 50%; z-index: 0; }
@keyframes mnuBreathe { 
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@keyframes mnuFabPop { 
  0% { opacity: 0; transform: scale(0.4); }
  100% { opacity: 1; transform: scale(1); }
}
</style>
</head>
