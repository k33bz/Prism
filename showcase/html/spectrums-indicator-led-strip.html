<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicator LED Strip · Prism</title>
<!-- Prism showcase sample: spectrums-indicator-led-strip (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-lp-led { width: 14px; height: 14px; border-radius: 50%; display: inline-block; position: relative; flex: 0 0 auto; background: radial-gradient(circle at 34% 28%, rgb(68, 68, 68) 0%, rgb(32, 33, 36) 60%, rgb(0, 0, 0) 100%); box-shadow: rgba(255, 255, 255, 0.15) 0px 1px 1px inset, rgb(42, 42, 44) 0px 0px 0px 2px, rgb(16, 16, 18) 0px 0px 0px 3px; }
.skeu-lp-led.skeu-lp-on.skeu-lp-red { background: radial-gradient(circle at 34% 28%, #ffcac5, var(--neg) 46%, #6b0f0a 100%); box-shadow: 0 0 8px 2px rgba(var(--neg-rgb),.85), inset 0 1px 1px rgba(255,255,255,.55), 0 0 0 2px #2a2a2c, 0 0 0 3px #101012; animation: 1.1s ease-in-out 0s infinite normal none running skeuLedBlink; }
.skeu-lp-led.skeu-lp-on.skeu-lp-amber { background: radial-gradient(circle at 34% 28%, #fff0c2, var(--skeu-amber) 46%, #7a4c06 100%); box-shadow: 0 0 8px 2px rgba(var(--skeu-amber-rgb),.85), inset 0 1px 1px rgba(255,255,255,.55), 0 0 0 2px #2a2a2c, 0 0 0 3px #101012; }
.skeu-lp-led.skeu-lp-on.skeu-lp-green { background: radial-gradient(circle at 34% 28%, #d3ffd9, var(--pos) 46%, #0d4a19 100%); box-shadow: 0 0 8px 2px rgba(var(--pos-rgb),.85), inset 0 1px 1px rgba(255,255,255,.55), 0 0 0 2px #2a2a2c, 0 0 0 3px #101012; }
.skeu-statusstrip { width: 170px; padding: 10px 12px; border-radius: 9px; background-image: var(--skeu-gunmetal); border: 1px solid rgb(6, 6, 7); box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 0px inset, rgba(0, 0, 0, 0.45) 0px 8px 16px; display: flex; flex-direction: column; gap: 7px; }
.skeu-ss-row { display: flex; align-items: center; justify-content: space-between; }
.skeu-ss-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--skeu-metal-3); }
@keyframes skeuLedBlink { 
  0%, 60%, 100% { opacity: 1; }
  30% { opacity: 0.35; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-statusstrip">
      <div class="skeu-ss-row"><span class="skeu-ss-lbl">POWER</span><span class="skeu-lp-led skeu-lp-on skeu-lp-green"></span></div>
      <div class="skeu-ss-row"><span class="skeu-ss-lbl">NETWORK</span><span class="skeu-lp-led skeu-lp-on skeu-lp-amber"></span></div>
      <div class="skeu-ss-row"><span class="skeu-ss-lbl">FAULT</span><span class="skeu-lp-led skeu-lp-on skeu-lp-red"></span></div>
    </div></div></div>
<div class="meta"><b>Indicator LED Strip</b> · <code>spectrums-indicator-led-strip</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>Three jewel-bezel LEDs stacked on a control strip, the fault light blinking — a compact multi-channel status readout.</p></div>

</body>
</html>
