<style id="prism-tokens">

<style id="showcase-shell">

body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-marker { position: relative; max-width: 270px; height: 78px; }
.fx-gl-marker-line { position: absolute; left: 10px; right: 10px; top: 50px; height: 2px; background: var(--line); }
.fx-gl-marker-tick { position: absolute; top: 44px; width: 1px; height: 14px; background: var(--dim); left: calc(10px + (100% - 20px) * var(--p,0)); }
.fx-gl-marker-dot { position: absolute; top: 50px; left: 10px; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 0 3px rgba(var(--fx-gl-rgb),.9),0 0 10px rgba(var(--fx-gl-rgb),.9),0 0 24px rgba(var(--fx-gl-rgb),.6),0 0 48px rgba(var(--fx-gl-rgb),.3); animation: 4s ease-in-out 0s infinite normal none running fxGlMarkerMove; }
.fx-gl-marker-flag { position: absolute; top: 8px; left: 10px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; background: rgba(var(--fx-gl-rgb),.2); border: 1px solid rgba(var(--fx-gl-rgb),.7); text-shadow: 0 0 6px rgba(var(--fx-gl-rgb),.8); box-shadow: 0 0 10px rgba(var(--fx-gl-rgb),.45); animation: 4s ease-in-out 0s infinite normal none running fxGlMarkerMove; }
@keyframes fxGlMarkerMove { 
  0%, 100% { left: 10px; }
  50% { left: calc(100% - 10px); }
}
</style>
