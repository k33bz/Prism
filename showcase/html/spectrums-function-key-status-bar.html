<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function-key Status Bar · Prism</title>
<!-- Prism showcase sample: spectrums-function-key-status-bar (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.rterm-crt { position: relative; background: rgb(10, 10, 10); font-family: "Courier New", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; color: rgb(51, 255, 51); border-radius: 3px; overflow: hidden; isolation: isolate; box-shadow: rgba(0, 0, 0, 0.85) 0px 0px 34px inset, rgba(0, 0, 0, 0.6) 0px 0px 2px inset; }
.rterm-crt::before { content: ""; position: absolute; inset: 0px; z-index: 3; pointer-events: none; background: repeating-linear-gradient(rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 1px, rgba(0, 0, 0, 0.42) 2px, rgba(0, 0, 0, 0.42) 3px); mix-blend-mode: multiply; animation: 6s linear 0s infinite normal none running rtermFlicker; }
.rterm-crt::after { content: ""; position: absolute; inset: 0px; z-index: 2; pointer-events: none; background: radial-gradient(rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.5) 100%); }
.rterm-crt * { position: relative; z-index: 1; }
.rterm-green { --rt-fg: #33ff33; --rt-fg-rgb: 51,255,51; --rt-dim: #125c12; --rt-dimtext: #1f9c1f; }
.rterm-crt { color: var(--rt-fg,#33ff33); }
.rterm-statusbar { width: 250px; display: flex; justify-content: space-between; padding: 6px 10px; font-size: 10.5px; letter-spacing: 0.02em; background: rgb(0, 0, 0); border-top: 1px solid var(--rt-dim); border-bottom: 1px solid var(--rt-dim); }
.rterm-statusbar .rterm-sbkey { background: var(--rt-fg); color: rgb(4, 20, 10); padding: 0px 4px; margin-right: 3px; font-weight: 700; }
@keyframes rtermFlicker { 
  0%, 100% { opacity: 0.94; }
  42% { opacity: 1; }
  58% { opacity: 0.9; }
  76% { opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="rterm-crt rterm-green rterm-statusbar"><span><span class="rterm-sbkey">F1</span>Help</span><span><span class="rterm-sbkey">F5</span>Reload</span><span><span class="rterm-sbkey">F10</span>Quit</span></div></div></div>
<div class="meta"><b>Function-key Status Bar</b> · <code>spectrums-function-key-status-bar</code><br>Spectrums · Retro Terminal · Retro Terminal<p>DOS-application-style bottom status bar with inverted function-key chips; use as persistent app chrome.</p></div>

</body>
</html>
