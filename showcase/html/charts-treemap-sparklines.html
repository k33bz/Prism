<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treemap Sparklines · Prism</title>
<!-- Prism showcase sample: charts-treemap-sparklines (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-tm-svg { width: 100%; max-width: 300px; height: auto; display: block; font-family: ui-sans-serif, system-ui, sans-serif; }
.chx-tm-lb { fill: var(--ink); font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-tm-fa { fill: rgba(var(--accent-rgb),.6); }
.chx-tm-fi { fill: rgba(var(--info-rgb),.58); }
.chx-tm-fp { fill: rgba(var(--pos-rgb),.55); }
.chx-tm-fw { fill: rgba(var(--warn-rgb),.55); }
.chx-tm-spark rect { stroke: var(--bg); stroke-width: 1.2; }
.chx-tm-spark polyline { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation-name: chxTmSpk; animation-duration: 2.4s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes chxTmSpk { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="chx-tm-svg chx-tm-spark" viewBox="0 0 300 150">
      <rect class="chx-tm-fi" x="4" y="8" width="140" height="64" rx="2"></rect>
      <rect class="chx-tm-fa" x="148" y="8" width="148" height="64" rx="2"></rect>
      <rect class="chx-tm-fp" x="4" y="76" width="180" height="66" rx="2"></rect>
      <rect class="chx-tm-fw" x="188" y="76" width="108" height="66" rx="2"></rect>
      <polyline style="--d:0s" points="12,58 32,44 52,50 72,30 92,38 112,22 132,28"></polyline>
      <polyline style="--d:.4s" points="156,54 176,58 196,40 216,46 236,26 256,34 288,18"></polyline>
      <polyline style="--d:.8s" points="12,128 44,110 76,120 108,96 140,104 172,86"></polyline>
      <polyline style="--d:1.2s" points="196,130 220,116 244,124 268,104 288,110"></polyline>
      <text class="chx-tm-lb" x="10" y="22">Atlas</text>
      <text class="chx-tm-lb" x="154" y="22">Comet</text>
      <text class="chx-tm-lb" x="10" y="92">Ember</text>
      <text class="chx-tm-lb" x="194" y="92">Nova</text>
    </svg></div></div>
<div class="meta"><b>Treemap Sparklines</b> · <code>charts-treemap-sparklines</code><br>Charts &amp; Metrics · TREEMAPS &amp; HIERARCHIES<p>Each cell holds a small trend line that redraws in place. Use it when a treemap slice also needs its recent trajectory.</p></div>
