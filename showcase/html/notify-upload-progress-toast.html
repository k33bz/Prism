<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Progress Toast · Prism</title>
<!-- Prism showcase sample: notify-upload-progress-toast (gallery: notify). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ns-toast { position: relative; display: flex; align-items: center; gap: 10px; width: 224px; padding: 11px 13px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.34) 0px 10px 26px; color: var(--ink); font-size: 12.5px; line-height: 1.35; overflow: hidden; }
.ns-toast::before { content: ""; position: absolute; left: 0px; top: 0px; bottom: 0px; width: 4px; background: var(--c,var(--info)); }
.ns-ttitle { font-weight: 700; font-size: 12.5px; }
.ns-toast.ns-cycle { animation: 4.4s ease-in-out 0s infinite normal none running nsSlideIn; }
.ns-stack .ns-toast { width: 100%; padding: 9px 12px; }
.ns-stack .ns-toast:nth-child(1) { animation: 4.5s ease-in-out 0s infinite normal none running nsStackUp; }
.ns-stack .ns-toast:nth-child(2) { animation: 4.5s ease-in-out 0.5s infinite normal none running nsStackUp; }
.ns-stack .ns-toast:nth-child(3) { animation: 4.5s ease-in-out 1s infinite normal none running nsStackUp; }
.ns-track { position: relative; height: 7px; border-radius: 99px; background: var(--card); overflow: hidden; }
.ns-fill { position: absolute; inset: 0px auto 0px 0px; border-radius: 99px; background: var(--c,var(--info)); }
.ns-upload { --c: var(--info); --cr: 68,147,248; }
.ns-upload .ns-track { margin-top: 8px; }
.ns-upload .ns-fill { animation: 4s ease-in-out 0s infinite normal none running nsUpFill; }
.ns-upload .ns-pct { position: absolute; right: 12px; top: 9px; font-size: 11px; font-weight: 800; color: var(--c); }
.ns-det .ns-fill { animation: 4.5s ease-in-out 0s infinite normal none running nsDet; }
.ns-indet .ns-fill { width: 38%; animation: 1.5s cubic-bezier(0.65, 0.05, 0.36, 1) 0s infinite normal none running nsIndet; }
@keyframes nsSlideIn { 
  0% { opacity: 0; transform: translateX(26px) scale(0.96); }
  12%, 78% { opacity: 1; transform: translateX(0px) scale(1); }
  92%, 100% { opacity: 0; transform: translateX(26px) scale(0.96); }
}
@keyframes nsStackUp { 
  0% { opacity: 0; transform: translateY(14px) scale(0.94); }
  18%, 82% { opacity: 1; transform: translateY(0px) scale(1); }
  100% { opacity: 0.55; transform: translateY(-4px) scale(0.97); }
}
@keyframes nsUpFill { 
  0% { width: 0px; }
  70%, 100% { width: 100%; }
}
@keyframes nsDet { 
  0% { width: 8%; }
  45%, 75% { width: 72%; }
  100% { width: 8%; }
}
@keyframes nsIndet { 
  0% { left: -40%; }
  100% { left: 100%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ns-toast ns-upload" style="display:block;width:220px"><div class="ns-ttitle">Uploading report.pdf</div><span class="ns-pct">…</span><div class="ns-track"><div class="ns-fill"></div></div></div></div></div>
<div class="meta"><b>Upload Progress Toast</b> · <code>notify-upload-progress-toast</code><br>Notifications &amp; Status · PROGRESS NOTIFICATIONS<p>Toast with a filling bar tracking an in-flight upload; use for file transfers.</p></div>

</body>
</html>
