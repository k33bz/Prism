<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treemap · Prism</title>
<!-- Prism showcase sample: charts-treemap-2 (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ncx2-tree { position: relative; width: 210px; height: 110px; }
.ncx2-tree i { position: absolute; border-radius: 3px; display: flex; align-items: flex-start; justify-content: flex-start; font-size: 9px; font-weight: 800; color: rgb(255, 255, 255); padding: 3px 4px; box-sizing: border-box; transform-origin: left top; animation: 0.7s ease-out 0s 1 normal both running ncx2Pop; }
@keyframes ncx2Pop { 
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.25); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ncx2-tree">
      <i style="left:0;top:0;width:112px;height:66px;background:var(--info);animation-delay:0s">api 42%</i>
      <i style="left:116px;top:0;width:94px;height:40px;background:var(--accent);animation-delay:.08s">db 26%</i>
      <i style="left:116px;top:44px;width:56px;height:22px;background:var(--pos);animation-delay:.16s">cache</i>
      <i style="left:176px;top:44px;width:34px;height:22px;background:var(--warn);animation-delay:.24s">q</i>
      <i style="left:0;top:70px;width:66px;height:40px;background:var(--crit);animation-delay:.32s">web 18%</i>
      <i style="left:70px;top:70px;width:60px;height:40px;background:rgba(var(--info-rgb),.7);animation-delay:.4s">auth</i>
      <i style="left:134px;top:70px;width:76px;height:40px;background:rgba(var(--accent-rgb),.7);animation-delay:.48s">cdn 9%</i>
    </div></div></div>
<div class="meta"><b>Treemap</b> · <code>charts-treemap-2</code><br>Charts &amp; Metrics · New<p>Nested rectangles sized by value — resource hogs visibly swell, so cost or usage share reads at a glance.</p></div>

</body>
</html>
