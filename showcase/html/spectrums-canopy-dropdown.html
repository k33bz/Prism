<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopy Dropdown · Prism</title>
<!-- Prism showcase sample: spectrums-canopy-dropdown (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-leafdot { width: 9px; height: 9px; flex: 0 0 auto; display: inline-block; background: linear-gradient(135deg,var(--solp-leaf2),var(--solp-leaf)); border-radius: 0px 60%; transform: rotate(45deg); box-shadow: rgba(76, 175, 109, 0.5) 0px 0px 5px; }
.solp-dropdown { display: flex; flex-direction: column; width: 220px; font-family: inherit; }
.solp-dd-trig { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 11px 16px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-weight: 800; font-size: 13px; color: rgb(23, 56, 32); background: linear-gradient(135deg,var(--solp-leaf2),var(--solp-leaf)); border-radius: 18px 18px 6px 6px; box-shadow: var(--solp-shadow); }
.solp-dd-trig .solp-dd-car { transition: transform 0.25s; }
.solp-dropdown:hover .solp-dd-car { transform: rotate(180deg); }
.solp-dd-panel { background: var(--solp-cream); border: 1px solid var(--solp-line); border-radius: 6px 6px 20px 20px; overflow: hidden; box-shadow: var(--solp-shadow); }
.solp-dd-item { display: flex; align-items: center; gap: 9px; padding: 10px 16px; font-size: 12.5px; font-weight: 600; color: var(--solp-ink); cursor: pointer; transition: 0.18s; border-top: 1px solid rgba(76, 175, 109, 0.14); }
.solp-dd-item:hover { background: linear-gradient(90deg, rgba(255, 201, 74, 0.25), transparent); color: var(--solp-golddeep); padding-left: 20px; }
.solp-dd-item.is-warn { color: rgb(164, 99, 42); }
.solp-dd-item.is-warn:hover { background: linear-gradient(90deg, rgba(255, 179, 71, 0.3), transparent); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="solp-dropdown">
      <div class="solp-dd-trig">Garden Tools <span class="solp-dd-car">▾</span></div>
      <div class="solp-dd-panel">
        <div class="solp-dd-item"><span class="solp-leafdot"></span>Compost Log</div>
        <div class="solp-dd-item"><span class="solp-leafdot"></span>Rain Capture</div>
        <div class="solp-dd-item is-warn"><span class="solp-leafdot"></span>Low Sun Alert</div>
      </div>
    </div></div></div>
<div class="meta"><b>Canopy Dropdown</b> · <code>spectrums-canopy-dropdown</code><br>Spectrums · Solarpunk · Solarpunk<p>A leaf-tipped dropdown menu in the Solarpunk language — organic top corners, a cream canopy panel, and gold-tinted hover states.</p></div>

</body>
</html>
