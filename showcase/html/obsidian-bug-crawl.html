<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Crawl · Prism</title>
<!-- Prism showcase sample: obsidian-bug-crawl (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-co { width: 288px; max-width: 100%; background: linear-gradient(180deg,rgba(var(--ob-rgb),.11),rgba(var(--ob-rgb),.035)); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 3px solid var(--ob); border-radius: 10px; padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-cot { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; color: var(--ob); letter-spacing: 0.02em; }
.obs-coi { width: 17px; height: 17px; flex: 0 0 17px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; }
.obs-cob { margin-top: 6px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.obs-cob b { color: var(--ink); }
.obs-co-glowrail .obs-coi { animation: 2.6s ease-in-out 0s infinite normal none running obsIcoBreathe; }
.obs-co-bug { border-style: dashed; }
.obs-bug { position: absolute; bottom: 3px; left: 0px; width: 10px; height: 7px; border-radius: 50% / 60%; background: var(--ob); animation: 5s linear 0s infinite normal none running obsCrawl; }
.obs-bug::before, .obs-bug::after { content: ""; position: absolute; left: 1px; top: -2px; width: 8px; height: 11px; border-left: 1.5px solid rgba(var(--ob-rgb),.8); border-right: 1.5px solid rgba(var(--ob-rgb),.8); animation: 0.18s linear 0s infinite alternate none running obsLegs; }
.obs-bug::after { top: auto; bottom: -2px; }
.obs-co-inner .obs-cot { color: var(--info); font-size: 11.5px; }
.obs-co-inner .obs-cob { margin-top: 3px; font-size: 11.5px; }
@keyframes obsIcoBreathe { 
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.14); opacity: 1; }
}
@keyframes obsLegs { 
  100% { transform: skewX(14deg); }
}
@keyframes obsCrawl { 
  0% { left: -4%; transform: rotate(2deg); }
  25% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
  75% { transform: rotate(-2deg); }
  100% { left: 101%; transform: rotate(2deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-co obs-co-bug c-neg"><div class="obs-cot"><span class="obs-coi">⌁</span>Rendering defect</div><div class="obs-cob">The query returns duplicate rows when aliases are enabled.</div><span class="obs-bug"></span></div></div></div>
<div class="meta"><b>Bug Crawl</b> · <code>obsidian-bug-crawl</code><br>Obsidian Facets · OBSIDIAN CALLOUTS &amp; ADMONITIONS<p>A dashed debug callout with a tiny animated bug traversing its edge.</p></div>

</body>
</html>
