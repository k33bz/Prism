<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee Toggle · Prism</title>
<!-- Prism showcase sample: spectrums-marquee-toggle (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-pill.is-on { color: var(--neu-accent); box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); }
.glm-nav-item.is-on { background: rgba(255, 255, 255, 0.24); color: rgb(255, 255, 255); box-shadow: rgba(255, 255, 255, 0.5) 0px 1px 0px inset, rgba(0, 0, 0, 0.5) 0px 4px 14px -6px; }
.deco-menu, .deco-dd, .deco-tabs, .deco-ctx, .deco-btn, .deco-iconbtn, .deco-toggle, .deco-toast, .deco-banner, .deco-snack, .deco-callout, .deco-quote, .deco-chart, .deco-gauge, .deco-kpi, .deco-spark, .deco-field, .deco-select, .deco-check, .deco-range, .deco-headline, .deco-eyebrow, .deco-dropcap, .deco-monogram, .deco-sunburst, .deco-ziggurat, .deco-frame, .deco-fandivider { box-sizing: border-box; font-family: Georgia, "Times New Roman", serif; }
.deco-menu-item.is-on { color: var(--deco-gold-hi); border-left-color: var(--deco-gold); background: rgba(212, 175, 55, 0.1); }
.deco-dd-item.is-on { color: var(--deco-gold-hi); background: rgba(212, 175, 55, 0.12); }
.deco-tab.is-on { color: var(--deco-gold-hi); background: rgba(212, 175, 55, 0.1); }
.deco-tab.is-on::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 1px; height: 2px; background: var(--deco-gradient-gold-diag); }
.deco-toggle { display: flex; align-items: center; gap: 10px; background: transparent; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-family: inherit; padding: 0px; }
.deco-toggle-track { position: relative; width: 52px; height: 22px; border: 1px solid var(--deco-line); background: var(--deco-emerald-deep); display: flex; align-items: center; padding: 2px; }
.deco-toggle-track::before { content: ""; position: absolute; inset: 3px; background: repeating-linear-gradient(90deg, rgba(212, 175, 55, 0.18) 0px, rgba(212, 175, 55, 0.18) 3px, transparent 3px, transparent 8px); opacity: 0.5; }
.deco-toggle-knob { position: relative; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,var(--deco-gold-hi),var(--deco-gold) 70%); box-shadow: rgba(212, 175, 55, 0.4) 0px 0px 6px; transition: transform 0.2s; }
.deco-toggle.is-on .deco-toggle-track { border-color: var(--deco-gold); box-shadow: rgba(212, 175, 55, 0.35) 0px 0px 10px inset; }
.deco-toggle.is-on .deco-toggle-knob { transform: translateX(26px); box-shadow: rgba(244, 229, 161, 0.8) 0px 0px 12px; }
.deco-toggle-lbl { font-size: 12px; letter-spacing: 0.04em; color: var(--deco-ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><button class="deco-toggle is-on" role="switch" aria-checked="true"><span class="deco-toggle-track"><span class="deco-toggle-knob"></span></span><span class="deco-toggle-lbl">Marquee Lights</span></button></div></div>
<div class="meta"><b>Marquee Toggle</b> · <code>spectrums-marquee-toggle</code><br>Spectrums · Art Deco · Art Deco<p>An on/off switch styled like a theatre marquee bulb strip, gold-lit when active — use for feature toggles in the Art Deco language.</p></div>

</body>
</html>
