<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Location Dots · Prism</title>
<!-- Prism showcase sample: maps-live-location-dots (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-scene { position: relative; width: 250px; height: 158px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 140% at 50% -20%,rgba(var(--info-rgb),.10),transparent 60%),var(--panel2); border: 1px solid var(--line); }
.gmap-loc .ring.b { animation-delay: 1.2s; }
.gmap-cmp .a .fillrg { fill: rgba(var(--info-rgb),.5); animation: 3.2s ease-in-out 0s infinite normal none running gmapCmpFlip; }
.gmap-cmp .b .fillrg { fill: rgba(var(--accent-rgb),.5); animation: 3.2s ease-in-out 1.6s infinite normal none running gmapCmpFlip; }
.gmap-grid-svg .g { stroke: rgba(var(--info-rgb),.35); stroke-width: 0.7; fill: none; }
.gmap-live .d { position: absolute; width: 8px; height: 8px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--pos); box-shadow: 0 0 8px rgba(var(--pos-rgb),.9); animation: 3.6s ease-in-out 0s infinite normal none running gmapStreamIn; }
.gmap-live .d.a { animation-delay: 0.2s; }
.gmap-live .d.b { animation-delay: 0.7s; background: var(--info); box-shadow: 0 0 8px rgba(var(--info-rgb),.9); }
.gmap-live .d.c { animation-delay: 1.3s; background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),.9); }
.gmap-live .d.e { animation-delay: 1.9s; }
.gmap-live .d.f { animation-delay: 2.4s; background: var(--info); box-shadow: 0 0 8px rgba(var(--info-rgb),.9); }
.gmap-live .d.g { animation-delay: 3s; background: var(--crit); box-shadow: 0 0 8px rgba(var(--crit-rgb),.9); }
.gmap-live .cnt { position: absolute; right: 8px; top: 8px; font: 700 10px / 1 ui-monospace, monospace; color: var(--pos); }
.gmap-flow-parts.g { stroke: var(--pos); }
@keyframes gmapCmpFlip { 
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0.25; }
}
@keyframes gmapStreamIn { 
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  20% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
  40% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  85% { opacity: 1; }
  100% { opacity: 0.15; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-scene gmap-live">
      <div class="cnt">LIVE</div>
      <div class="d a" style="left:52px;top:56px"></div>
      <div class="d b" style="left:120px;top:44px"></div>
      <div class="d c" style="left:186px;top:70px"></div>
      <div class="d e" style="left:80px;top:110px"></div>
      <div class="d f" style="left:150px;top:118px"></div>
      <div class="d g" style="left:210px;top:112px"></div>
    </div></div></div>
<div class="meta"><b>Live Location Dots</b> · <code>maps-live-location-dots</code><br>Maps &amp; Geo · LIVE &amp; TELEMETRY<p>Location pings popping in across the map as live events arrive.</p></div>

</body>
</html>
