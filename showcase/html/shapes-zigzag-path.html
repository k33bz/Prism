body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

<style id="effect-css">
.c-warn { --c: var(--warn); --c-rgb: 224,165,43; }
.nsh2-zigzag { display: inline-flex; font-weight: 800; font-size: 24px; color: var(--c); }
.nsh2-zigzag span { display: inline-block; animation-duration: 1.6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: nsh2ZigBob; animation-timeline: auto; animation-range: normal; animation-delay: var(--d,0s); }
