<style id="prism-tokens">

<style id="showcase-shell">

</style>
<style id="effect-css">
.chx-lq-chart { width: 100%; max-width: 300px; height: 150px; display: block; }
.chx-lq-ax { stroke: var(--line); stroke-width: 1; }

.chx-lq-sig { fill: rgba(var(--c-rgb,var(--accent-rgb)),.18); }

@keyframes chxLqOut { 
  0%, 100% { r: 2.5; opacity: 0.6; }
  50% { r: 5; opacity: 1; }
}
