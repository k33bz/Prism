<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Cube · Prism</title>
<!-- Prism showcase sample: shapes-text-cube (gallery: shapes). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-accent { --c: var(--accent); --c-rgb: 255,153,0; }
.nsh2-cube { width: 120px; height: 120px; perspective: 640px; }
.nsh2-cube .nsh2-cube-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: 15s linear 0s infinite normal none running nsh2CubeSpin; }
.nsh2-cube .nsh2-face { position: absolute; inset: 0px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; letter-spacing: 0.02em; color: var(--c); border: 2px solid var(--c); background: rgba(var(--c-rgb),.10); text-shadow: 0 0 9px rgba(var(--c-rgb),.6); }
.nsh2-cube .f1 { transform: translateZ(60px); }
.nsh2-cube .f2 { transform: rotateY(180deg) translateZ(60px); }
.nsh2-cube .f3 { transform: rotateY(90deg) translateZ(60px); }
.nsh2-cube .f4 { transform: rotateY(-90deg) translateZ(60px); }
.nsh2-cube .f5 { transform: rotateX(90deg) translateZ(60px); }
.nsh2-cube .f6 { transform: rotateX(-90deg) translateZ(60px); }
@keyframes nsh2CubeSpin { 
  0% { transform: rotateX(-24deg) rotateY(0deg); }
  100% { transform: rotateX(-24deg) rotateY(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nsh2-cube c-accent"><div class="nsh2-cube-in"><div class="nsh2-face f1">PRISM</div><div class="nsh2-face f2">SHAPE</div><div class="nsh2-face f3">TEXT</div><div class="nsh2-face f4">CUBE</div><div class="nsh2-face f5">3D</div><div class="nsh2-face f6">FX</div></div></div></div></div>
<div class="meta"><b>Text Cube</b> · <code>shapes-text-cube</code><br>Text Shapes · 3D Tunnels &amp; Perspective<p>Six labelled faces built with translateZ/rotateX/rotateY on a preserve-3d box that tumbles continuously. Each face carries its own word — a rotating word-die.</p></div>

</body>
</html>
