<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag / Chip Input · Prism</title>
<!-- Prism showcase sample: input-tag-chip-input (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; align-items: center; cursor: text; width: 100%; }
.nin2-chips:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.nin2-chips .nin2-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(var(--accent-rgb),.14); border: 1px solid rgba(var(--accent-rgb),.4); color: var(--accent); padding: 3px 4px 3px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 700; animation: 0.2s ease 0s 1 normal none running nin2Pop; }
.nin2-chips .nin2-chip b { cursor: pointer; opacity: 0.65; font-size: 14px; line-height: 1; padding: 0px 3px; }
.nin2-chips .nin2-chip b:hover { opacity: 1; }
.nin2-chips input { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--ink); outline: none; flex: 1 1 0%; min-width: 70px; }
.nin2-chips input::placeholder { color: var(--dim); }
@keyframes nin2Pop { 
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-chips"><span class="nin2-chip">prod<b>×</b></span><span class="nin2-chip">us-east-1<b>×</b></span><input placeholder="Add tag…"></div></div></div>
<div class="meta"><b>Tag / Chip Input</b> · <code>input-tag-chip-input</code><br>Input Methods · Fields, Pickers &amp; Actions<p>Type a value and press Enter to add a removable chip; click × to drop one. For tags, recipients, or filters.</p></div>

</body>
</html>
