<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Crystal · Prism</title>
<!-- Prism showcase sample: objects-floating-crystal (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-crystal { position: relative; width: 90px; height: 120px; transform-style: preserve-3d; animation: 7s linear 0s infinite normal none running nobj2CrySpin; }
.nobj2-crystal .nobj2-cwrap { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; animation: 3.4s ease-in-out 0s infinite normal none running nobj2Float; }
.nobj2-crystal .nobj2-gtop { position: absolute; left: 50%; bottom: 0px; width: 52px; height: 44px; margin-left: -26px; transform-origin: 50% 100%; clip-path: polygon(50% 0px, 100% 100%, 0px 100%); background: color-mix(in srgb,var(--fc) 40%,transparent); border: 1px solid var(--fc); }
.nobj2-crystal .nobj2-gbot { position: absolute; left: 50%; top: 0px; width: 52px; height: 60px; margin-left: -26px; transform-origin: 50% 0px; clip-path: polygon(0px 0px, 100% 0px, 50% 100%); background: color-mix(in srgb,var(--fc) 26%,transparent); border: 1px solid var(--fc); }
.nobj2-gt-1 { transform: translateZ(24px) rotateX(-40deg); }
.nobj2-gt-2 { transform: rotateY(90deg) translateZ(24px) rotateX(-40deg); }
.nobj2-gt-3 { transform: rotateY(180deg) translateZ(24px) rotateX(-40deg); }
.nobj2-gt-4 { transform: rotateY(270deg) translateZ(24px) rotateX(-40deg); }
.nobj2-gb-1 { transform: translateZ(24px) rotateX(30deg); }
.nobj2-gb-2 { transform: rotateY(90deg) translateZ(24px) rotateX(30deg); }
.nobj2-gb-3 { transform: rotateY(180deg) translateZ(24px) rotateX(30deg); }
.nobj2-gb-4 { transform: rotateY(270deg) translateZ(24px) rotateX(30deg); }
@keyframes nobj2CrySpin { 
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}
@keyframes nobj2Float { 
  0%, 100% { transform: translateY(-6px); }
  50% { transform: translateY(6px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nobj2-scene"><div class="nobj2-crystal" style="--fc:var(--nobj2-cy)">
      <span class="nobj2-cwrap">
        <span class="nobj2-gtop nobj2-gt-1"></span><span class="nobj2-gtop nobj2-gt-2"></span><span class="nobj2-gtop nobj2-gt-3"></span><span class="nobj2-gtop nobj2-gt-4"></span>
        <span class="nobj2-gbot nobj2-gb-1"></span><span class="nobj2-gbot nobj2-gb-2"></span><span class="nobj2-gbot nobj2-gb-3"></span><span class="nobj2-gbot nobj2-gb-4"></span>
      </span>
    </div></div></div></div>
<div class="meta"><b>Floating Crystal</b> · <code>objects-floating-crystal</code><br>Animated Objects · 3D Objects<p>A faceted gem of translucent panes spinning and hovering. Premium tiers, gems, rare states.</p></div>

</body>
