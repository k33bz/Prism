<style id="effect-css">
.amb-lava-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg,var(--bg),var(--panel2)); isolation: isolate; }
.amb-lava-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.amb-lava-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.05em; color: var(--muted); opacity: 0.85; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.55) 0px 1px 4px; }
.amb-lava-lampA { stop-color: var(--panel2); }
.amb-lava-lampC { stop-color: var(--bg); }
.amb-lava-bn { fill: rgba(var(--neg-rgb),.9); }
.amb-lava-plm-b { transform-box: fill-box; transform-origin: center center; animation-name: ambLavaPlume; animation-duration: 4s; animation-timing-function: cubic-bezier(0.5, 0, 0.6, 1); animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.amb-lava-plm-base { transform-box: fill-box; transform-origin: center center; animation-name: ambLavaBaseGlow; animation-duration: 2s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
@keyframes ambLavaPlume { 
  0% { transform: translate(0px, 14px) scale(1.2); }
  55% { transform: translate(var(--sx,8px),-70px) scale(.7); }
  100% { transform: translate(0px, -118px) scale(0.3); opacity: 0; }
}
@keyframes ambLavaBaseGlow { 
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(1.12); }
}
