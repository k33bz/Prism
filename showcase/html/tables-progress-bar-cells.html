<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Bar Cells · Prism</title>
<!-- Prism showcase sample: tables-progress-bar-cells (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-bar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.dtb-bar i { display: block; height: 100%; width: var(--w,60%); border-radius: 3px; background: var(--c,var(--accent)); transform-origin: 0px 50%; animation: 3.4s ease-out 0s infinite normal none running dtbFill; }
.dtb-bar-v { font-size: 9.5px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.dtb-bento .dtb-bar { width: 100%; margin: 0px; }
@keyframes dtbFill { 
  0% { transform: scaleX(0); }
  60%, 90% { transform: scaleX(1); }
  100% { transform: scaleX(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl"><thead><tr><th>Migration</th><th>Progress</th></tr></thead><tbody>
      <tr><td>users</td><td><span class="dtb-bar" style="--w:100%;--c:var(--pos)"><i></i></span><span class="dtb-bar-v">100%</span></td></tr>
      <tr><td>orders</td><td><span class="dtb-bar" style="--w:72%"><i></i></span><span class="dtb-bar-v">72%</span></td></tr>
      <tr><td>events</td><td><span class="dtb-bar" style="--w:38%;--c:var(--accent)"><i></i></span><span class="dtb-bar-v">38%</span></td></tr>
      <tr><td>audit_log</td><td><span class="dtb-bar" style="--w:9%;--c:var(--warn)"><i></i></span><span class="dtb-bar-v">9%</span></td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Progress Bar Cells</b> · <code>tables-progress-bar-cells</code><br>Tables &amp; Data Layouts · STATUS &amp; DATA CELLS<p>Inline progress bars that fill to their value inside each cell — set --w per row and recolour with --c.</p></div>

</body>
</html>
