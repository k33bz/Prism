<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Draw · Prism</title>
<!-- Prism showcase sample: lab-route-draw (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-route { --c: var(--neg); --c-rgb: var(--neg-rgb); }
.lab-rv-route svg { display: block; width: 100%; height: 100%; font: 700 10px ui-sans-serif, system-ui, sans-serif; }
.lab-rv-rtg { fill: none; stroke: var(--line); stroke-width: 1; }
.lab-rv-rtp { fill: none; stroke: var(--c); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; animation-name: labRvRoute; }
.lab-rv-rtd { fill: none; stroke: rgba(var(--c-rgb),.35); stroke-width: 1; stroke-dasharray: 3, 3; }
.lab-rv-rp { transform-box: fill-box; transform-origin: 50% 100%; }
.lab-rv-rp circle { fill: var(--c); }
.lab-rv-rp .lab-rv-rpc { fill: var(--panel2); }
.lab-rv-rp text { fill: var(--ink); }
.lab-rv-rtp, .lab-rv-rp { animation-duration: 4s; animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1); animation-iteration-count: infinite; }
.lab-rv-rp:nth-of-type(1) { animation-name: labRvRp1; }
.lab-rv-rp:nth-of-type(2) { animation-name: labRvRp2; }
.lab-rv-rp:nth-of-type(3) { animation-name: labRvRp3; }
@keyframes labRvRoute { 
  0% { stroke-dashoffset: 100; opacity: 1; }
  62%, 84% { stroke-dashoffset: 0; opacity: 1; }
  94% { stroke-dashoffset: 0; opacity: 0; }
  100% { stroke-dashoffset: 100; opacity: 0; }
}
@keyframes labRvRp1 { 
  0%, 4% { opacity: 0; transform: scale(0); }
  12%, 84% { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(0); }
}
@keyframes labRvRp2 { 
  0%, 30% { opacity: 0; transform: scale(0); }
  38%, 84% { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(0); }
}
@keyframes labRvRp3 { 
  0%, 58% { opacity: 0; transform: scale(0); }
  66%, 84% { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-route">
      <svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path class="lab-rv-rtg" d="M0,32H300M0,64H300M0,96H300M60,0V130M120,0V130M180,0V130M240,0V130"></path>
        <path class="lab-rv-rtd" d="M28,98C80,24 120,118 168,62S238,26 272,78"></path>
        <path class="lab-rv-rtp" pathLength="100" d="M28,98C80,24 120,118 168,62S238,26 272,78"></path>
        <g class="lab-rv-rp"><circle cx="28" cy="98" r="7"></circle><circle class="lab-rv-rpc" cx="28" cy="98" r="3"></circle><text x="40" y="112">Depot</text></g>
        <g class="lab-rv-rp"><circle cx="168" cy="62" r="7"></circle><circle class="lab-rv-rpc" cx="168" cy="62" r="3"></circle><text x="150" y="49">Hub 12</text></g>
        <g class="lab-rv-rp"><circle cx="272" cy="78" r="7"></circle><circle class="lab-rv-rpc" cx="272" cy="78" r="3"></circle><text x="243" y="100">Drop</text></g>
      </svg>
    </div></div></div>
<div class="meta"><b>Route Draw</b> · <code>lab-route-draw</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>A route strokes itself along a dotted guide and pin markers pop up as the line reaches each stop. Use for journey maps or delivery tracking sections.</p></div>

</body>
</html>
