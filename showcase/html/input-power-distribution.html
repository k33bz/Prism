<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Distribution · Prism</title>
<!-- Prism showcase sample: input-power-distribution (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.in-scf { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--bg); padding: 8px; font: 800 8px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.1em; color: var(--bg); text-transform: uppercase; }
.in-scf-eq { display: flex; align-items: flex-end; gap: 5px; height: 100%; padding: 6px 4px 4px; }
.in-scf-eq b { flex: 1 1 0%; border-radius: 3px 3px 0px 0px; background: linear-gradient(0deg,var(--info),var(--crit)); transform-origin: center bottom; animation: 1.4s ease-in-out 0s infinite normal none running inScfEq; }
.in-scf-eq b:nth-child(2) { animation-delay: 0.15s; }
.in-scf-eq b:nth-child(3) { animation-delay: 0.3s; }
.in-scf-eq b:nth-child(4) { animation-delay: 0.45s; }
.in-scf-eq b:nth-child(5) { animation-delay: 0.6s; }
.in-scf-eq b:nth-child(6) { animation-delay: 0.75s; }
.in-scf-eq b:nth-child(7) { animation-delay: 0.9s; }
.in-scf-eq b:nth-child(8) { animation-delay: 0.5s; }
@keyframes inScfEq { 
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="in-scf in-scf-eq" role="img" aria-label="Power distribution bars">
      <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
    </div></div></div>
<div class="meta"><b>Power Distribution</b> · <code>input-power-distribution</code><br>Input Methods · RETRO SCIFI CONTROL PANELS<p>A row of vertical bars pumping like a level meter, cyan into violet, the power-routing display of a console.</p></div>

</body>
</html>
