<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento Stat Grid · Prism</title>
<!-- Prism showcase sample: tables-bento-stat-grid (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-sk.w2 { width: 45%; }
.dtb-bar { display: inline-block; width: 64px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; vertical-align: middle; margin-right: 6px; }
.dtb-bar i { display: block; height: 100%; width: var(--w,60%); border-radius: 3px; background: var(--c,var(--info)); transform-origin: 0px 50%; animation: 3.4s ease-out 0s infinite normal none running dtbFill; }
.dtb-spark { display: inline-block; width: 64px; height: 18px; vertical-align: middle; overflow: visible; }
.dtb-spark-line { fill: none; stroke: var(--c,var(--info)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: 3s ease-out 0s infinite normal none running dtbDraw; }
.dtb-bento { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 44px; gap: 6px; width: 100%; max-width: 290px; font: 600 9px / 1.2 ui-sans-serif, system-ui, sans-serif; }
.dtb-bento div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--muted); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.dtb-bento div.w2 { grid-column: span 2; }
.dtb-bento div.h2 { grid-row: span 2; }
.dtb-bento em { font-style: normal; font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 800; color: var(--c,var(--ink)); }
.dtb-bento small { font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; }
.dtb-bento .dtb-bar { width: 100%; margin: 0px; }
.dtb-bento .dtb-spark { width: 100%; height: 20px; }
.dtb-bento .glow { animation: 3s ease-in-out 0s infinite normal none running dtbBentoGlow; }
@keyframes dtbDraw { 
  0% { stroke-dashoffset: 120; }
  55%, 85% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes dtbFill { 
  0% { transform: scaleX(0); }
  60%, 90% { transform: scaleX(1); }
  100% { transform: scaleX(1); }
}
@keyframes dtbBentoGlow { 
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),0); }
  50% { box-shadow: inset 0 0 0 1px var(--accent),0 0 12px rgba(var(--accent-rgb),.25); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="dtb-bento">
      <div class="w2 glow"><small>Monthly spend</small><em style="--c:var(--accent)">$18.2K</em></div>
      <div><small>Uptime</small><em style="--c:var(--pos)">99.98</em></div>
      <div class="h2"><small>Requests</small><svg class="dtb-spark" viewBox="0 0 64 18" preserveAspectRatio="none"><polyline class="dtb-spark-line" points="1,14 10,11 19,13 28,8 37,10 46,5 55,7 63,3"></polyline></svg><em>48K</em></div>
      <div><small>Errors</small><em style="--c:var(--neg)">0.3%</em></div>
      <div><small>Coverage</small><span class="dtb-bar" style="--w:72%"><i></i></span></div>
    </div></div></div>
<div class="meta"><b>Bento Stat Grid</b> · <code>tables-bento-stat-grid</code><br>Tables &amp; Data Layouts · GRIDS &amp; SCHEDULES<p>Mixed-span tiles (.w2, .h2) holding one figure, sparkline or bar each, with the hero tile glowing — dashboard summaries.</p></div>

</body>
</html>
