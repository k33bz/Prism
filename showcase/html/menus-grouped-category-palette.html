<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped-category Palette · Prism</title>
<!-- Prism showcase sample: menus-grouped-category-palette (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-ico { flex: 0 0 16px; text-align: center; color: var(--muted); font-size: 12px; }
.mnu-item:hover .mnu-ico { color: inherit; }
.mnu-lbl { flex: 1 1 auto; min-width: 0px; }
.mnu-group-lbl { padding: 6px 10px 3px; font: 800 9.5px / 1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); }
.mnu-sidebar .mnu-ico { flex: 0 0 15px; }
.mnu-cmdk { width: 320px; background: var(--panel2); border: 1px solid var(--line); border-radius: 13px; box-shadow: rgba(0, 0, 0, 0.5) 0px 22px 50px; overflow: hidden; animation: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0s 1 normal both running mnuScaleIn; }
.mnu-cmdk-inputrow { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.mnu-cmdk-inputrow .mnu-ico { color: var(--dim); }
.mnu-cmdk-fakeinput { flex: 1 1 auto; color: var(--ink); font-size: 13px; }
.mnu-cmdk-fakeinput .mnu-caret { display: inline-block; width: 1.5px; height: 14px; background: var(--info); vertical-align: -2px; margin-left: 1px; animation: 1.1s step-end 0s infinite normal none running mnuCaretBlink; }
.mnu-cmdk-esc { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.mnu-cmdk-list { padding: 6px; }
.mnu-cmdk-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink); }
.mnu-cmdk-row.is-sel { background: rgba(var(--info-rgb),.16); }
.mnu-cmdk-row .mnu-ico { width: 20px; text-align: center; color: var(--muted); }
.mnu-cmdk-row.is-sel .mnu-ico { color: var(--info); }
.mnu-cmdk-rich .mnu-cmdk-row { align-items: flex-start; padding: 9px 10px; }
.mnu-cmdk-rich .mnu-cmdk-row.is-sel .mnu-cmdk-ic2 { background: rgba(var(--accent-rgb),.2); color: var(--accent); }
.mnu-cmdk-groups .mnu-group-lbl { padding-top: 8px; }
.mnu-cmdk-recent .mnu-cmdk-row .mnu-recent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.mnu-swatch.is-sel { border-color: var(--ink); }
.mnu-tm-track label .mnu-ico { font-size: 15px; color: inherit; }
@keyframes mnuScaleIn { 
  0% { opacity: 0; transform: scale(0.86) translateY(-4px); }
  100% { opacity: 1; transform: scale(1) translateY(0px); }
}
@keyframes mnuCaretBlink { 
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-cmdk mnu-cmdk-groups">
      <div class="mnu-cmdk-inputrow"><span class="mnu-ico">⌘</span><span class="mnu-cmdk-fakeinput">Type a command…</span><span class="mnu-cmdk-esc">esc</span></div>
      <div class="mnu-cmdk-list">
        <div class="mnu-group-lbl">Recent</div>
        <div class="mnu-cmdk-row is-sel"><span class="mnu-ico">↩</span><span class="mnu-lbl">Reopen closed tab</span></div>
        <div class="mnu-group-lbl">Actions</div>
        <div class="mnu-cmdk-row"><span class="mnu-ico">＋</span><span class="mnu-lbl">New project</span></div>
        <div class="mnu-cmdk-row"><span class="mnu-ico">⚙</span><span class="mnu-lbl">Open settings</span></div>
      </div>
    </div></div></div>
<div class="meta"><b>Grouped-category Palette</b> · <code>menus-grouped-category-palette</code><br>Menus &amp; Actions · COMMAND PALETTES<p>Command palette organizing results under labelled groups like Recent and Actions.</p></div>

</body>
</html>
