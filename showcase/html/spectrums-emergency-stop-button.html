<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Stop Button · Prism</title>
<!-- Prism showcase sample: spectrums-emergency-stop-button (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-stopbtn { position: relative; width: 64px; height: 64px; border-radius: 50%; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; background: radial-gradient(circle at 32% 26%, rgb(74, 77, 84), rgb(28, 30, 33) 65%, rgb(10, 10, 11) 100%); box-shadow: rgb(10, 11, 12) 0px 8px 0px, rgba(0, 0, 0, 0.55) 0px 16px 22px; display: grid; place-items: center; transition: transform 0.09s, box-shadow 0.09s; }
.skeu-stopbtn-cap { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 32% 24%,#ff8c7a,var(--neg) 42%,#7a0f0a 100%); box-shadow: inset 0 3px 4px rgba(255,255,255,.5), inset 0 -5px 8px rgba(0,0,0,.45), 0 0 10px rgba(var(--neg-rgb),.5); }
.skeu-stopbtn:hover .skeu-stopbtn-cap { filter: brightness(1.08); }
.skeu-stopbtn:active { transform: translateY(7px); box-shadow: rgb(10, 11, 12) 0px 1px 0px, rgba(0, 0, 0, 0.5) 0px 3px 6px; }
.skeu-stopbtn:active .skeu-stopbtn-cap { box-shadow: rgba(0, 0, 0, 0.6) 0px 4px 8px inset, rgba(255, 255, 255, 0.2) 0px -1px 1px inset; }
.skeu-stopbtn-collar { position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgb(199, 200, 204); box-shadow: rgba(0, 0, 0, 0.4) 0px 1px 2px inset, rgba(0, 0, 0, 0.5) 0px 1px 2px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><button class="skeu-stopbtn"><span class="skeu-stopbtn-collar"></span><span class="skeu-stopbtn-cap"></span></button></div></div>
<div class="meta"><b>Emergency Stop Button</b> · <code>spectrums-emergency-stop-button</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A mushroom-cap red E-stop button with a metal collar guard — presses flat with a satisfying deep-shadow collapse for destructive actions.</p></div>

</body>
</html>
