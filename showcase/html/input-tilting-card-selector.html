<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilting Card Selector · Prism</title>
<!-- Prism showcase sample: input-tilting-card-selector (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-hide { position: absolute; opacity: 0; pointer-events: none; width: 0px; height: 0px; }
.nin2-tiltsel { display: flex; gap: 12px; }
.nin2-tiltsel label { flex: 1 1 0%; perspective: 500px; cursor: pointer; }
.nin2-tiltsel .nin2-tc { padding: 16px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); text-align: center; transition: transform 0.35s cubic-bezier(0.5, 0.2, 0.1, 1), box-shadow 0.35s, border-color 0.2s; transform: rotateY(0deg); }
.nin2-tiltsel .nin2-tc .nin2-ico { font-size: 24px; }
.nin2-tiltsel .nin2-tc .nin2-lb { font-size: 11px; color: var(--muted); margin-top: 5px; font-weight: 700; }
.nin2-tiltsel input:checked + .nin2-tc { transform: rotateY(-16deg) translateZ(24px); border-color: var(--accent); box-shadow: rgba(0, 0, 0, 0.45) -10px 10px 22px; }
.nin2-tiltsel input:checked + .nin2-tc .nin2-lb { color: var(--accent); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-tiltsel">
      <label><input type="radio" name="nin2tilt" class="nin2-hide" checked=""><div class="nin2-tc"><div class="nin2-ico">⚡</div><div class="nin2-lb">Fast</div></div></label>
      <label><input type="radio" name="nin2tilt" class="nin2-hide"><div class="nin2-tc"><div class="nin2-ico">⚖️</div><div class="nin2-lb">Balanced</div></div></label>
      <label><input type="radio" name="nin2tilt" class="nin2-hide"><div class="nin2-tc"><div class="nin2-ico">🌱</div><div class="nin2-lb">Eco</div></div></label>
    </div></div></div>
<div class="meta"><b>Tilting Card Selector</b> · <code>input-tilting-card-selector</code><br>Input Methods · 3D &amp; Depth Controls<p>Option cards that swing out in 3D and cast a shadow when chosen. A playful radio group for mode or plan pickers.</p></div>

</body>
</html>
