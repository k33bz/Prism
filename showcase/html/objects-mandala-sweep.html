<!-- Prism showcase sample: objects-mandala-sweep (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obj-sand-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,var(--panel2),var(--panel)); display: grid; place-items: center; isolation: isolate; }
.obj-sand-tag { position: absolute; left: 12px; bottom: 9px; z-index: 8; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obj-sand-mand { position: relative; width: 120px; height: 120px; border-radius: 50%; overflow: hidden; background: var(--panel2); border: 1.5px solid var(--line); }
.obj-sand-mand-p { position: absolute; inset: 0px; background: repeating-conic-gradient(from 0deg,rgba(var(--warn-rgb),.55) 0deg 6deg,transparent 6deg 18deg),
  radial-gradient(circle,transparent 20%,rgba(var(--warn-rgb),.3) 21% 23%,transparent 24% 40%,rgba(var(--warn-rgb),.3) 41% 43%,transparent 44%); clip-path: inset(0px 100% 0px 0px); animation: 4s ease-in-out 0s infinite normal none running objSandMandLay; }
.obj-sand-mand-sweep { position: absolute; top: 0px; bottom: 0px; width: 14px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); animation: 4s ease-in-out 0s infinite normal none running objSandMandSweep; }
.obj-sand-mand-core { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0px 0px -8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px rgba(var(--warn-rgb),.7); }
@keyframes objSandMandLay { 
  0% { clip-path: inset(0px 100% 0px 0px); }
  80%, 100% { clip-path: inset(0px); }
}
@keyframes objSandMandSweep { 
  0% { left: -14px; }
  80%, 100% { left: 120px; }
}
</style>
</head>
