<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Dial / Knob · Prism</title>
<!-- Prism showcase sample: input-3d-dial-knob (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-hide { position: absolute; opacity: 0; pointer-events: none; width: 0px; height: 0px; }
.nin2-dial3d { width: 120px; text-align: center; }
.nin2-dial3d .nin2-knob { width: 96px; height: 96px; margin: 0px auto; border-radius: 50%; position: relative; transform: rotateX(52deg); transform-style: preserve-3d; background: radial-gradient(circle at 50% 38%,var(--panel2),var(--panel)); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.45) 0px 14px 20px, rgba(255, 255, 255, 0.03) 0px 0px 0px 6px inset; }
.nin2-dial3d .nin2-top { position: absolute; inset: 14px; border-radius: 50%; background: conic-gradient(from 210deg,rgba(var(--accent-rgb),.5),rgba(var(--accent-rgb),.05) 300deg,transparent 300deg); transform: translateZ(14px); transition: transform 0.4s cubic-bezier(0.6, 0.2, 0.1, 1); }
.nin2-dial3d .nin2-ptr { position: absolute; top: 8px; left: 50%; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: var(--accent); transform: translateZ(15px); }
.nin2-dial3d label { display: inline-block; font-size: 11px; color: var(--muted); cursor: pointer; padding: 3px 5px; border-radius: 6px; }
.nin2-dial3d input:checked + label { color: var(--accent); background: rgba(var(--accent-rgb),.12); }
.nin2-dial3d .nin2-r0:checked ~ .nin2-knob .nin2-top { transform: translateZ(14px) rotate(-100deg); }
.nin2-dial3d .nin2-r1:checked ~ .nin2-knob .nin2-top { transform: translateZ(14px) rotate(-40deg); }
.nin2-dial3d .nin2-r2:checked ~ .nin2-knob .nin2-top { transform: translateZ(14px) rotate(30deg); }
.nin2-dial3d .nin2-r3:checked ~ .nin2-knob .nin2-top { transform: translateZ(14px) rotate(100deg); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-dial3d">
      <input type="radio" name="nin2dial" id="nin2d0" class="nin2-hide nin2-r0"><label for="nin2d0">Lo</label>
      <input type="radio" name="nin2dial" id="nin2d1" class="nin2-hide nin2-r1" checked=""><label for="nin2d1">Md</label>
      <input type="radio" name="nin2dial" id="nin2d2" class="nin2-hide nin2-r2"><label for="nin2d2">Hi</label>
      <input type="radio" name="nin2dial" id="nin2d3" class="nin2-hide nin2-r3"><label for="nin2d3">Max</label>
      <div class="nin2-knob"><div class="nin2-top"></div><div class="nin2-ptr"></div></div>
    </div></div></div>
<div class="meta"><b>3D Dial / Knob</b> · <code>input-3d-dial-knob</code><br>Input Methods · 3D &amp; Depth Controls<p>A tilted rotary knob whose fill and pointer rotate to the chosen level. Pick a preset to turn the dial. For volume, throttle, or intensity.</p></div>

</body>
</html>
