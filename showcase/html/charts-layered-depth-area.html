<!DOCTYPE html>

<title>Layered Depth Area · Prism</title>
<!-- Prism showcase sample: charts-layered-depth-area (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.n3d-scene { perspective: 640px; perspective-origin: 50% 42%; display: flex; align-items: center; justify-content: center; min-height: 150px; }
.n3d-depth { position: relative; width: 190px; height: 110px; transform-style: preserve-3d; transform: rotateX(6deg) rotateY(-30deg); animation: 10s ease-in-out 0s infinite normal none running n3dSway; }
.n3d-depth svg { position: absolute; left: 0px; top: 0px; width: 190px; height: 110px; }
.n3d-depth .l1 { transform: translateZ(0px); }
.n3d-depth .l2 { transform: translateZ(-24px); }
.n3d-depth .l3 { transform: translateZ(-48px); }
.n3d-depth .l4 { transform: translateZ(-72px); }
.n3d-depth polyline { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 340; stroke-dashoffset: 340; animation: 2.4s ease-out 0s 1 normal forwards running ncx2Draw; }
@keyframes n3dSway { 
  0%, 100% { transform: rotateX(13deg) rotateY(-26deg); }
  50% { transform: rotateX(15deg) rotateY(-6deg); }
}
@keyframes ncx2Draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="n3d-scene"><div class="n3d-depth">
      <svg class="l4" viewBox="0 0 190 110"><polyline points="4,80 40,66 76,74 112,54 148,62 186,44" stroke="var(--crit)" style="animation-delay:.3s"></polyline></svg>
      <svg class="l3" viewBox="0 0 190 110"><polyline points="4,86 40,72 76,60 112,68 148,50 186,58" stroke="var(--warn)" style="animation-delay:.2s"></polyline></svg>
      <svg class="l2" viewBox="0 0 190 110"><polyline points="4,74 40,82 76,64 112,72 148,58 186,66" stroke="var(--accent)" style="animation-delay:.1s"></polyline></svg>
      <svg class="l1" viewBox="0 0 190 110"><polyline points="4,90 40,76 76,82 112,60 148,70 186,52" stroke="var(--info)" style="animation-delay:0s"></polyline></svg>
    </div></div></div></div>
<div class="meta"><b>Layered Depth Area</b> · <code>charts-layered-depth-area</code><br>Charts &amp; Metrics · 3D &amp; Perspective (2026 drop)<p>Four self-drawing trend planes stacked along the Z axis — compare several series without the clutter of overlapping fills.</p></div>

</html>
