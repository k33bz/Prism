<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Header · Prism</title>
<!-- Prism showcase sample: menus-search-header (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-item.is-active { color: var(--accent); }
.mnu-item.is-active .mnu-check { opacity: 1; }
.mnu-nav-underline a.is-active { color: var(--ink); }
.mnu-nav-underline a:nth-child(1).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(1):hover ~ .mnu-nu-bar { transform: translateX(0px); }
.mnu-nav-underline a:nth-child(2).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(2):hover ~ .mnu-nu-bar { transform: translateX(100%); }
.mnu-nav-underline a:nth-child(3).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(3):hover ~ .mnu-nu-bar { transform: translateX(200%); }
.mnu-nav-underline a:nth-child(4).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(4):hover ~ .mnu-nu-bar { transform: translateX(300%); }
.mnu-sidebar a.is-active { background: rgba(var(--accent-rgb),.16); color: var(--accent); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); animation: 2.6s ease-in-out 0s infinite normal none running mnuPulseGlow; }
.mnu-pillnav a.is-active, .mnu-pillnav a:hover { color: var(--ink); }
.mnu-pillnav a:nth-child(1).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(1):hover ~ .mnu-pn-pill { transform: translateX(0px); }
.mnu-pillnav a:nth-child(2).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(2):hover ~ .mnu-pn-pill { transform: translateX(68px); }
.mnu-pillnav a:nth-child(3).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(3):hover ~ .mnu-pn-pill { transform: translateX(146px); }
.mnu-actionbar button.is-active { color: var(--accent); background: rgba(var(--accent-rgb),.14); }
.mnu-ts-track a.is-active { background: rgba(var(--info-rgb),.18); border-color: rgba(var(--info-rgb),.5); color: var(--info); }
@keyframes mnuPulseGlow { 
  0%, 100% { box-shadow: 0 0 0 rgba(var(--accent-rgb),0); }
  50% { box-shadow: 0 0 14px rgba(var(--accent-rgb),.45); }
}
.mnu-hdr { width: 300px; box-sizing: border-box; }
.mnu-hdr-bar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; }
.mnu-hdr-logo { display: flex; align-items: center; gap: 7px; font: 800 13px ui-sans-serif, system-ui, sans-serif; color: var(--ink); white-space: nowrap; }
.mnu-hdr-logo::before { content: ""; width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.5)); }
.mnu-hdr-links { display: flex; gap: 2px; align-items: center; }
.mnu-hdr-links a { padding: 6px 9px; border-radius: 7px; color: var(--muted); font: 600 12px ui-sans-serif, system-ui, sans-serif; text-decoration: none; transition: color 0.15s, background 0.15s; white-space: nowrap; }
.mnu-hdr-links a:hover { color: var(--ink); background: rgba(var(--info-rgb),.12); }
.mnu-hdr-links a.is-active { color: var(--accent); }
.mnu-hdr-sp { flex: 1 1 auto; }
.mnu-hdr-cta .mnu-hdr-bar { padding: 0px 9px; gap: 5px; }
.mnu-hdr-cta .mnu-hdr-links a { padding: 6px; }
.mnu-hdr-split .mnu-hdr-bar { justify-content: space-between; }
.mnu-hdr-split .mnu-hdr-links { flex: 1 1 0px; }
.mnu-hdr-split .mnu-hdr-links.r { justify-content: flex-end; }
.mnu-hdr-split .mnu-hdr-logo { position: static; }
.mnu-hdr-searchbox { display: flex; align-items: center; gap: 7px; height: 30px; width: 34px; padding: 0px 8px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); overflow: hidden; transition: width 0.28s cubic-bezier(0.25, 1, 0.35, 1); cursor: text; }
.mnu-hdr-searchbox::before { content: "🔍"; font-size: 12px; filter: grayscale(1); opacity: 0.7; flex: 0 0 auto; }
.mnu-hdr-searchbox input { border: 0px; background: transparent; color: var(--ink); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 12px; width: 100%; outline: none; }
.mnu-hdr-searchbox input::placeholder { color: var(--dim); }
.mnu-hdr-search:hover .mnu-hdr-searchbox, .mnu-hdr-searchbox:focus-within { width: 150px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-hdr mnu-hdr-search"><div class="mnu-hdr-bar">
      <span class="mnu-hdr-logo">Beacon</span>
      <nav class="mnu-hdr-links"><a href="#" class="is-active">Feed</a><a href="#">Saved</a></nav>
      <span class="mnu-hdr-sp"></span>
      <label class="mnu-hdr-searchbox"><input type="text" placeholder="Search everything"></label>
    </div></div></div></div>
<div class="meta"><b>Search Header</b> · <code>menus-search-header</code><br>Menus &amp; Actions · HEADER NAVIGATION<p>The search field sits collapsed to an icon and expands as the pointer nears or it takes focus, reclaiming the space when idle. Hover the bar or click the field.</p></div>

</body>
</html>
