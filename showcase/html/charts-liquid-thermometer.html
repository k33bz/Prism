</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-lq-fig { width: 100%; max-width: 300px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 14px; box-sizing: border-box; }
.chx-lq-svg { display: block; height: 100%; overflow: visible; }
.chx-lq-body { fill: rgba(var(--c-rgb,var(--accent-rgb)),.34); }
.chx-lq-body2 { fill: rgba(var(--c-rgb,var(--accent-rgb)),.22); }
.chx-lq-shell { fill: rgba(var(--c-rgb,var(--accent-rgb)),.05); stroke: rgba(var(--c-rgb,var(--accent-rgb)),.55); stroke-width: 2; }
.chx-lq-cap { fill: var(--muted); font: 500 7px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
.chx-lq-tick { stroke: rgba(var(--c-rgb,var(--accent-rgb)),.4); stroke-width: 1; }
.chx-lq-w1 { animation-name: chxLqWave; animation-duration: 2.4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.chx-lq-w2 { animation-name: chxLqWave; animation-duration: 3.6s; animation-timing-function: linear; animation-iteration-count: infinite; }
.chx-lq-therm-lvl { transform: translateY(18px); animation-name: chxLqThermFill; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.chx-lq-therm-bulb { fill: rgba(var(--c-rgb,var(--accent-rgb)),.6); }
@keyframes chxLqWave { 
  100% { transform: translateX(-40px); }
}
@keyframes chxLqThermFill { 
  0% { transform: translateY(74px); }
  50% { transform: translateY(18px); }
  80% { transform: translateY(24px); }
  100% { transform: translateY(74px); }
}
</style>
