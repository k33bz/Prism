<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box &amp; Whisker · Prism</title>
<!-- Prism showcase sample: charts-box-whisker (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nch-pctband .med { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 400; stroke-dashoffset: 400; animation: 2.6s ease-out 0s infinite normal none running nchDraw; }
@keyframes nchDraw { 
  100% { stroke-dashoffset: 0; }
}
.ncx2-box { display: flex; align-items: flex-end; gap: 16px; height: 110px; }
.ncx2-box .bx { position: relative; width: 26px; height: 100%; }
.ncx2-box .whk { position: absolute; left: 50%; width: 2px; background: var(--muted); transform: translateX(-50%); }
.ncx2-box .cap { position: absolute; left: 20%; right: 20%; height: 2px; background: var(--muted); }
.ncx2-box .iqr { position: absolute; left: 0px; right: 0px; border: 1.5px solid var(--info); background: rgba(var(--info-rgb),.25); border-radius: 3px; transform-origin: center center; animation: 0.9s ease-out 0s 1 normal both running ncx2Grow; }
.ncx2-box .med { position: absolute; left: 0px; right: 0px; height: 2px; background: var(--accent); }
@keyframes ncx2Grow { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ncx2-box">
      <div class="bx"><span class="whk" style="top:6%;height:88%"></span><span class="cap" style="top:6%"></span><span class="cap" style="bottom:6%"></span><span class="iqr" style="top:28%;height:40%;animation-delay:0s"></span><span class="med" style="top:46%"></span></div>
      <div class="bx"><span class="whk" style="top:14%;height:80%"></span><span class="cap" style="top:14%"></span><span class="cap" style="bottom:6%"></span><span class="iqr" style="top:36%;height:34%;animation-delay:.1s"></span><span class="med" style="top:52%"></span></div>
      <div class="bx"><span class="whk" style="top:2%;height:76%"></span><span class="cap" style="top:2%"></span><span class="cap" style="bottom:22%"></span><span class="iqr" style="top:22%;height:44%;animation-delay:.2s"></span><span class="med" style="top:40%"></span></div>
      <div class="bx"><span class="whk" style="top:20%;height:74%"></span><span class="cap" style="top:20%"></span><span class="cap" style="bottom:6%"></span><span class="iqr" style="top:42%;height:32%;animation-delay:.3s"></span><span class="med" style="top:58%"></span></div>
    </div></div></div>
<div class="meta"><b>Box &amp; Whisker</b> · <code>charts-box-whisker</code><br>Charts &amp; Metrics · New</div>

</body>
</html>
