<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Map Pin · Prism</title>
<!-- Prism showcase sample: objects-3d-map-pin (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-pin { position: relative; width: 90px; height: 120px; transform-style: preserve-3d; animation: 6s linear 0s infinite normal none running nobj2PinSpin; }
.nobj2-pin .nobj2-pbody { position: absolute; left: 50%; top: 6px; width: 54px; height: 54px; margin-left: -27px; border-radius: 50% 50% 50% 0px; transform: rotate(-45deg); background: radial-gradient(circle at 35% 30%,#fff9,var(--fc)); border: 2px solid color-mix(in srgb,var(--fc) 70%,#000); }
.nobj2-pin .nobj2-pdot { position: absolute; left: 50%; top: 26px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: rgb(12, 15, 24); transform: translateZ(2px); }
.nobj2-pin .nobj2-pshadow { position: absolute; left: 50%; top: 104px; width: 44px; height: 12px; margin-left: -22px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 0, 0, 0.55), transparent 70%); transform: rotateX(80deg); animation: 6s ease-in-out 0s infinite normal none running nobj2PinShad; }
@keyframes nobj2PinSpin { 
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}
@keyframes nobj2PinShad { 
  0%, 100% { transform: rotateX(80deg) scale(0.8); }
  50% { transform: rotateX(80deg) scale(1.05); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nobj2-scene"><div class="nobj2-pin" style="--fc:var(--nobj2-n)">
      <span class="nobj2-pbody"></span><span class="nobj2-pdot"></span><span class="nobj2-pshadow"></span>
    </div></div></div></div>
<div class="meta"><b>3D Map Pin</b> · <code>objects-3d-map-pin</code><br>Animated Objects · 3D Objects<p>A teardrop marker spinning in space above its cast shadow. Locations, regions, &quot;you are here&quot;.</p></div>

</body>
</html>
