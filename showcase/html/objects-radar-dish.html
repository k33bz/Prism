<style id="showcase-shell">

</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-dish { position: relative; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(58deg); }
.nobj2-dish .nobj2-mast { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--nobj2-ln); }
.nobj2-dish .nobj2-spin { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; animation: 4s linear 0s infinite normal none running nobj2DishSpin; }
.nobj2-dish .nobj2-plate { position: absolute; left: -30px; top: -22px; width: 60px; height: 44px; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--nobj2-t) 55%,transparent),color-mix(in srgb,var(--nobj2-t) 12%,transparent)); border: 1.5px solid var(--nobj2-t); transform: translateX(30px) rotateX(-46deg); }
.nobj2-dish .nobj2-wv { position: absolute; left: 36px; top: -14px; width: 26px; height: 26px; border-top-style: ; border-top-width: ; border-right-style: ; border-right-width: ; border-bottom-style: ; border-bottom-width: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-radius: 50%; border-color: var(--nobj2-t) transparent transparent transparent; animation: 1.6s ease-out 0s infinite normal none running nobj2DishWv; }
.nobj2-dish .nobj2-wv2 { animation-delay: 0.5s; }
.nobj2-dish .nobj2-wv3 { animation-delay: 1s; }
@keyframes nobj2DishSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes nobj2DishWv { 
  0% { transform: scale(0.4); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}
</style>
