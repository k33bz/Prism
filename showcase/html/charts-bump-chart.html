<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bump Chart · Prism</title>
<!-- Prism showcase sample: charts-bump-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ncx2-bump svg { width: 210px; height: 110px; }
.ncx2-bump polyline { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: 2s ease-out 0s 1 normal forwards running ncx2Draw; }
.ncx2-bump circle { animation: 0.6s ease-out 0s 1 normal both running ncx2Pop; }
@keyframes ncx2Draw { 
  100% { stroke-dashoffset: 0; }
}
@keyframes ncx2Pop { 
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.25); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ncx2-bump"><svg viewBox="0 0 210 110">
      <polyline points="10,20 70,50 130,20 200,50" stroke="var(--info)" style="animation-delay:0s"></polyline>
      <polyline points="10,50 70,20 130,80 200,20" stroke="var(--accent)" style="animation-delay:.15s"></polyline>
      <polyline points="10,80 70,80 130,50 200,80" stroke="var(--pos)" style="animation-delay:.3s"></polyline>
      <g fill="var(--info)"><circle cx="10" cy="20" r="4"></circle><circle cx="70" cy="50" r="4"></circle><circle cx="130" cy="20" r="4"></circle><circle cx="200" cy="50" r="4"></circle></g>
      <g fill="var(--accent)"><circle cx="10" cy="50" r="4"></circle><circle cx="70" cy="20" r="4"></circle><circle cx="130" cy="80" r="4"></circle><circle cx="200" cy="20" r="4"></circle></g>
      <g fill="var(--pos)"><circle cx="10" cy="80" r="4"></circle><circle cx="70" cy="80" r="4"></circle><circle cx="130" cy="50" r="4"></circle><circle cx="200" cy="80" r="4"></circle></g>
    </svg></div></div></div>
<div class="meta"><b>Bump Chart</b> · <code>charts-bump-chart</code><br>Charts &amp; Metrics · New<p>Ranking lines that cross as positions change between periods — see who overtook whom across the leaderboard.</p></div>

</body>
</html>
