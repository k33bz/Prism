<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Strength Meter · Prism</title>
<!-- Prism showcase sample: obsidian-link-strength-meter (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-bondrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); margin-top: 7px; }
.obs-bondrow:first-child { margin-top: 0px; }
.obs-bondname { width: 56px; text-align: right; color: var(--ink); font-weight: 600; font-size: 10px; }
.obs-bond { flex: 1 1 0%; height: 6px; border-radius: 3px; position: relative; overflow: hidden; background: rgba(var(--ob-rgb),.16); }
.obs-bond::before { content: ""; position: absolute; inset: 0px; border-radius: 3px; background-image: ; background-position-x: ; background-position-y: ; background-repeat: ; background-attachment: ; background-origin: ; background-clip: ; background-color: ; background-size: 200% 100%; animation: 1.8s linear 0s infinite normal none running obsBond; }
.obs-bond.b2 { height: 4px; }
.obs-bond.b2::before { animation-duration: 2.6s; opacity: 0.7; }
.obs-bond.b3 { height: 2px; }
.obs-bond.b3::before { animation-duration: 3.6s; opacity: 0.45; }
.obs-bondn { width: 22px; font-weight: 800; color: var(--ob); font-size: 10px; }
@keyframes obsBond { 
  100% { background-position: -200% 0px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs" style="width:250px"><div class="obs-bondrow"><span class="obs-bondname">supports</span><span class="obs-bond"></span><span class="obs-bondn">92</span></div><div class="obs-bondrow"><span class="obs-bondname">extends</span><span class="obs-bond b2"></span><span class="obs-bondn">64</span></div><div class="obs-bondrow"><span class="obs-bondname">mentions</span><span class="obs-bond b3"></span><span class="obs-bondn">31</span></div></div></div></div>
<div class="meta"><b>Link Strength Meter</b> · <code>obsidian-link-strength-meter</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>Three relationship bonds flow at different speeds to communicate connection strength.</p></div>

</body>
</html>
