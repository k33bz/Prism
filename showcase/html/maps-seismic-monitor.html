<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seismic Monitor · Prism</title>
<!-- Prism showcase sample: maps-seismic-monitor (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-seis { position: relative; width: 220px; height: 120px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel2); }
.gmap-seis .grid { position: absolute; inset: 0px; background-image: linear-gradient(90deg,rgba(var(--info-rgb),.08) 1px,transparent 1px); background-size: 18px 100%; }
.gmap-seis .trace { position: absolute; left: 0px; right: 0px; top: 50%; height: 1px; background: rgba(var(--pos-rgb),.35); }
.gmap-seis .bars { position: absolute; inset: 0px; display: flex; align-items: center; justify-content: space-around; }
.gmap-seis .bars i { width: 3px; background: var(--pos); border-radius: 2px; transform-origin: center center; box-shadow: 0 0 6px rgba(var(--pos-rgb),.7); animation: 1.1s ease-in-out 0s infinite normal none running gmapSeis; }
.gmap-seis .bars i.q { background: var(--neg); box-shadow: 0 0 8px rgba(var(--neg-rgb),.9); }
.gmap-seis .mag { position: absolute; right: 8px; top: 6px; font: 700 10px / 1 ui-monospace, monospace; color: var(--neg); animation: 1s ease-in-out 0s infinite normal none running gmapHudBlink; }
@keyframes gmapHudBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@keyframes gmapSeis { 
  0% { transform: scaleY(0.15); }
  50% { transform: scaleY(1); }
  100% { transform: scaleY(0.3); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-seis">
      <div class="grid"></div>
      <div class="trace"></div>
      <div class="mag">M 4.6</div>
      <div class="bars">
        <i style="height:24px;animation-delay:0s"></i><i style="height:40px;animation-delay:.1s"></i>
        <i class="q" style="height:70px;animation-delay:.15s"></i><i style="height:46px;animation-delay:.2s"></i>
        <i style="height:30px;animation-delay:.25s"></i><i class="q" style="height:64px;animation-delay:.3s"></i>
        <i style="height:38px;animation-delay:.35s"></i><i style="height:52px;animation-delay:.4s"></i>
        <i style="height:26px;animation-delay:.45s"></i><i style="height:44px;animation-delay:.5s"></i>
        <i class="q" style="height:60px;animation-delay:.55s"></i><i style="height:34px;animation-delay:.6s"></i>
      </div>
    </div></div></div>
<div class="meta"><b>Seismic Monitor</b> · <code>maps-seismic-monitor</code><br>Maps &amp; Geo · LIVE &amp; TELEMETRY<p>A live activity trace with jittering bars flagging a seismic spike.</p></div>

</body>
</html>
