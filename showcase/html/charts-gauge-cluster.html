<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauge Cluster · Prism</title>
<!-- Prism showcase sample: charts-gauge-cluster (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tl .g { color: var(--pos); background: var(--pos); }
.mp-radialbar .arc { transform-box: view-box; transform-origin: center center; animation: 1.3s ease-out 0s 1 normal forwards running mp-dashIn; }
.mp-net .nd { transform-box: fill-box; transform-origin: center center; animation: 0.5s ease-out 0s 1 normal backwards running mp-pop; }
@keyframes mp-dashIn { 
  0% { stroke-dashoffset: var(--len); }
  100% { stroke-dashoffset: var(--off); }
}
@keyframes mp-pop { 
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
.nch-net .nd { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--info); box-shadow: 0 0 8px var(--info); animation: 2.4s ease-in-out 0s infinite normal none running nchNet; }
.nch-gaugetri { display: flex; gap: 14px; }
.nch-gaugetri .g { position: relative; width: 60px; height: 36px; overflow: hidden; }
.nch-gaugetri .g .arc { position: absolute; top: 0px; width: 60px; height: 60px; border-radius: 50%; mask: radial-gradient(closest-side, transparent 58%, rgb(0, 0, 0) 60%); }
.nch-gaugetri .nd { position: absolute; bottom: 2px; left: 50%; width: 2px; height: 26px; background: var(--ink); transform-origin: center bottom; animation: 2.6s ease-in-out 0s infinite normal none running nchNeedle3; }
@keyframes nchNet { 
  0%, 100% { transform: scale(0.8); opacity: 0.6; }
  50% { transform: scale(1.2); opacity: 1; }
}
@keyframes nchNeedle3 { 
  0%, 100% { transform: translateX(-50%) rotate(-64deg); }
  50% { transform: translateX(-50%) rotate(54deg); }
}
.ncx2-chord .arc { fill: none; stroke-width: 7; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nch-gaugetri">
        <div class="g"><div class="arc" style="background:conic-gradient(from 270deg,var(--pos) 0 50%,transparent 50%)"></div><div class="nd"></div></div>
        <div class="g"><div class="arc" style="background:conic-gradient(from 270deg,var(--warn) 0 50%,transparent 50%)"></div><div class="nd" style="animation-delay:.4s"></div></div>
        <div class="g"><div class="arc" style="background:conic-gradient(from 270deg,var(--neg) 0 50%,transparent 50%)"></div><div class="nd" style="animation-delay:.8s"></div></div>
      </div></div></div>
<div class="meta"><b>Gauge Cluster</b> · <code>charts-gauge-cluster</code><br>Charts &amp; Metrics · New<p>Three half-gauges with sweeping needles — an instrument panel for related live readings.</p></div>

</body>
</html>
