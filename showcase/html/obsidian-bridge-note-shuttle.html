<!DOCTYPE html>

<meta charset="utf-8">

<title>Bridge-Note Shuttle · Prism</title>
<!-- Prism showcase sample: obsidian-bridge-note-shuttle (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-svg { display: block; }
.obs-gr-node { fill: var(--panel2); stroke: var(--ob); stroke-width: 1.5; }
.obs-gr-edge { stroke: rgba(var(--ob-rgb),.45); stroke-width: 1.2; stroke-dasharray: 4, 5; animation: 1.6s linear 0s infinite normal none running obsEdge; }
.obs-shuttle { fill: rgb(255, 255, 255); filter: drop-shadow(0 0 5px var(--ob)); animation: 3.6s ease-in-out 0s infinite normal none running obsShuttle; }
.obs-bridgenode { fill: var(--ob); animation: 3.6s ease-in-out 0s infinite normal none running obsBridgeGlow; }
@keyframes obsEdge { 
  100% { stroke-dashoffset: -9; }
}
@keyframes obsShuttle { 
  0%, 100% { transform: translateX(0px); }
  50% { transform: translateX(84px); }
}
@keyframes obsBridgeGlow { 
  0%, 100% { filter: drop-shadow(0 0 2px rgba(var(--ob-rgb),.4)); }
  50% { filter: drop-shadow(0 0 10px rgba(var(--ob-rgb),1)); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs"><svg class="obs-svg" viewBox="0 0 240 104" width="250" height="106"><g class="obs-gr-edge"><line x1="34" y1="30" x2="76" y2="52"></line><line x1="34" y1="76" x2="76" y2="52"></line><line x1="76" y1="52" x2="164" y2="52"></line><line x1="164" y1="52" x2="207" y2="25"></line><line x1="164" y1="52" x2="211" y2="80"></line></g><circle class="obs-gr-node" cx="34" cy="30" r="5"></circle><circle class="obs-gr-node" cx="34" cy="76" r="6"></circle><circle class="obs-bridgenode" cx="76" cy="52" r="7"></circle><circle class="obs-bridgenode" cx="164" cy="52" r="7"></circle><circle class="obs-gr-node" cx="207" cy="25" r="5"></circle><circle class="obs-gr-node" cx="211" cy="80" r="6"></circle><circle class="obs-shuttle" cx="76" cy="52" r="3"></circle></svg></div></div></div>
<div class="meta"><b>Bridge-Note Shuttle</b> · <code>obsidian-bridge-note-shuttle</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>A bright idea packet travels between two clusters through their bridge note.</p></div>
