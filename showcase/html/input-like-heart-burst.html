<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like / Heart Burst · Prism</title>
<!-- Prism showcase sample: input-like-heart-burst (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-search .nin2-menu li:hover, .nin2-search .nin2-menu li.nin2-hi { background: rgba(var(--accent-rgb),.12); color: var(--ink); }
.nin2-heart { position: relative; width: 64px; height: 64px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: none; cursor: pointer; }
.nin2-heart .nin2-hi { font-size: 34px; color: var(--dim); transition: 0.2s; display: inline-block; }
.nin2-heart.nin2-liked .nin2-hi { color: var(--neg); animation: 0.4s ease 0s 1 normal none running nin2Beat; }
.nin2-heart .nin2-burst { position: absolute; inset: 0px; pointer-events: none; }
.nin2-heart .nin2-burst i { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--neg); opacity: 0; }
.nin2-heart.nin2-liked .nin2-burst i { animation: 0.5s ease-out 0s 1 normal none running nin2Spark; }
@keyframes nin2Beat { 
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.35); }
  60% { transform: scale(0.9); }
}
@keyframes nin2Spark { 
  0% { opacity: 1; transform: translate(-50%, -50%) translate(0px, 0px) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><button class="nin2-heart" type="button"><span class="nin2-hi">♥</span><span class="nin2-burst"><i style="--dx:-18px;--dy:-14px"></i><i style="--dx:18px;--dy:-14px"></i><i style="--dx:-14px;--dy:16px"></i><i style="--dx:14px;--dy:16px"></i><i style="--dx:0;--dy:-22px"></i></span></button></div></div>
<div class="meta"><b>Like / Heart Burst</b> · <code>input-like-heart-burst</code><br>Input Methods · Fields, Pickers &amp; Actions<p>A heart that beats and throws a spark burst on the like tap. The delightful micro-reaction from social feeds.</p></div>

</body>
</html>
