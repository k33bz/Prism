<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Progress Bar · Prism</title>
<!-- Prism showcase sample: menus-scroll-progress-bar (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-progress { position: relative; width: 240px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); padding: 18px 14px 14px; }
.mnu-prog-track { position: absolute; top: 0px; left: 0px; right: 0px; height: 3px; background: rgba(var(--info-rgb),.12); }
.mnu-prog-fill { height: 100%; width: 0px; background: linear-gradient(90deg,var(--accent),var(--warn)); box-shadow: 0 0 8px rgba(var(--accent-rgb),.55); animation: 4s cubic-bezier(0.45, 0, 0.2, 1) 0s infinite normal none running mnuProg; }
.mnu-prog-doc b { display: block; height: 9px; width: 60%; border-radius: 3px; background: var(--muted); opacity: 0.7; margin-bottom: 11px; }
.mnu-prog-doc i { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 7px; }
.mnu-prog-doc i:nth-child(3) { width: 92%; }
.mnu-prog-doc i:nth-child(4) { width: 80%; }
.mnu-prog-doc i:nth-child(5) { width: 88%; }
.mnu-prog-doc i:nth-child(6) { width: 64%; }
@keyframes mnuProg { 
  0%, 10% { width: 0px; }
  88%, 100% { width: 100%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-progress"><div class="mnu-prog-track"><div class="mnu-prog-fill"></div></div>
      <div class="mnu-prog-doc"><b></b><i></i><i></i><i></i><i></i><i></i></div></div></div></div>
<div class="meta"><b>Scroll Progress Bar</b> · <code>menus-scroll-progress-bar</code><br>Menus &amp; Actions · WAYFINDING &amp; PROGRESS<p>A thin accent bar across the top fills as the reader moves down the page, the reading indicator. Shown on a loop; in use its width maps to scroll position.</p></div>

</body>
</html>
