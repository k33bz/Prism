<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Rays · Prism</title>
<!-- Prism showcase sample: objects-sun-rays (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.wx-sun .rays { transform-box: view-box; transform-origin: 59px 59px; animation: 18s linear 0s infinite normal none running spin; }
.orbits .sun { transform-box: fill-box; transform-origin: center center; animation: 2.4s ease-in-out 0s infinite normal none running pulse; }
@keyframes spin { 
  100% { transform: rotate(1turn); }
}
@keyframes pulse { 
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
.amb { position: relative; width: 100%; height: 150px; border-radius: 12px; overflow: hidden; background: rgb(12, 16, 24); }
.amb > .amb-content { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; height: 100%; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; text-shadow: rgba(0, 0, 0, 0.6) 0px 1px 6px; font-size: 13px; }
.amb .amb-px { position: absolute; top: 0px; left: 0px; pointer-events: none; }
.amb-sunny .sun { position: absolute; left: 50%; top: 38%; width: 56px; height: 56px; margin: -28px 0px 0px -28px; border-radius: 50%; background: radial-gradient(circle, rgb(255, 255, 255), rgb(255, 230, 168)); box-shadow: rgba(255, 225, 150, 0.7) 0px 0px 40px 12px; animation: 4s ease-in-out 0s infinite normal none running ambSunPulse; }
.amb-sunrays { background: radial-gradient(circle at 50% 40%, rgb(255, 231, 176), rgb(255, 159, 28) 70%); }
.amb-sunrays .rays { position: absolute; left: 50%; top: 40%; width: 340px; height: 340px; margin: -170px 0px 0px -170px; background: repeating-conic-gradient(rgba(255, 255, 255, 0.55) 0deg, rgba(255, 255, 255, 0.55) 6deg, transparent 6deg, transparent 16deg); border-radius: 50%; animation: 26s linear 0s infinite normal none running ambRayspin; mix-blend-mode: screen; }
.amb-sunrays .sun { position: absolute; left: 50%; top: 40%; width: 46px; height: 46px; margin: -23px 0px 0px -23px; border-radius: 50%; background: rgb(255, 255, 255); box-shadow: rgba(255, 240, 200, 0.9) 0px 0px 30px 10px; }
@keyframes ambRayspin { 
  100% { transform: rotate(360deg); }
}
@keyframes ambSunPulse { 
  0%, 100% { transform: scale(1); opacity: 0.95; }
  50% { transform: scale(1.06); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb amb-sunrays"><div class="rays"></div><div class="sun"></div><div class="amb-content" style="color:#5a3a00;text-shadow:none">Sun Rays ✺</div></div></div></div>
<div class="meta"><b>Sun Rays</b> · <code>objects-sun-rays</code><br>Animated Objects · Ambient weather backdrops<p>A slowly rotating starburst of light rays radiating from a bright sun — radiant, energetic.</p></div>

</body>
</html>
