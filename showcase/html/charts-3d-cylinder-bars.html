<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Cylinder Bars · Prism</title>
<!-- Prism showcase sample: charts-3d-cylinder-bars (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="250" height="190" viewBox="0 0 250 190" style="overflow:visible">
        <!-- 3D cylinder bar chart -->
        <defs>
          <linearGradient id="cyl1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity=".55"></stop><stop offset=".5" stop-color="var(--accent)"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity=".5"></stop></linearGradient>
          <linearGradient id="cyl2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--info)" stop-opacity=".55"></stop><stop offset=".5" stop-color="var(--info)"></stop><stop offset="1" stop-color="var(--info)" stop-opacity=".5"></stop></linearGradient>
          <linearGradient id="cyl3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--pos)" stop-opacity=".55"></stop><stop offset=".5" stop-color="var(--pos)"></stop><stop offset="1" stop-color="var(--pos)" stop-opacity=".5"></stop></linearGradient>
        </defs>
        <line x1="30" y1="165" x2="225" y2="165" stroke="var(--line)"></line>
        <!-- each cylinder: body rect + bottom ellipse + top ellipse (lighter) -->
        <g>
          <rect x="50" y="100" width="34" height="65" fill="url(#cyl1)"></rect><ellipse cx="67" cy="165" rx="17" ry="6" fill="var(--accent)" opacity=".35"></ellipse><ellipse cx="67" cy="100" rx="17" ry="6" fill="var(--accent)"></ellipse><ellipse cx="67" cy="100" rx="17" ry="6" fill="rgba(255,255,255,.25)"></ellipse>
          <rect x="108" y="70" width="34" height="95" fill="url(#cyl2)"></rect><ellipse cx="125" cy="165" rx="17" ry="6" fill="var(--info)" opacity=".35"></ellipse><ellipse cx="125" cy="70" rx="17" ry="6" fill="var(--info)"></ellipse><ellipse cx="125" cy="70" rx="17" ry="6" fill="rgba(255,255,255,.25)"></ellipse>
          <rect x="166" y="120" width="34" height="45" fill="url(#cyl3)"></rect><ellipse cx="183" cy="165" rx="17" ry="6" fill="var(--pos)" opacity=".35"></ellipse><ellipse cx="183" cy="120" rx="17" ry="6" fill="var(--pos)"></ellipse><ellipse cx="183" cy="120" rx="17" ry="6" fill="rgba(255,255,255,.25)"></ellipse>
        </g>
        <g font-size="11" font-weight="800" font-variant-numeric="tabular-nums" text-anchor="middle">
          <text x="67" y="93" fill="var(--accent)">68%</text><text x="125" y="63" fill="var(--info)">94%</text><text x="183" y="113" fill="var(--pos)">41%</text>
        </g>
        <g font-size="9.5" fill="var(--muted)" text-anchor="middle"><text x="67" y="182">CPU</text><text x="125" y="182">Mem</text><text x="183" y="182">Disk</text></g>
      </svg></div></div>
<div class="meta"><b>3D Cylinder Bars</b> · <code>charts-3d-cylinder-bars</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Rounded cylindrical columns with lit top caps and curved side shading. A softer, more &quot;physical&quot; alternative to flat bars for utilization gauges.</p></div>

</body>
</html>
