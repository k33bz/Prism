<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky Shrink Header · Prism</title>
<!-- Prism showcase sample: menus-sticky-shrink-header (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-condense { width: 240px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); position: relative; }
.mnu-cond-bar { position: absolute; top: 0px; left: 0px; right: 0px; display: flex; align-items: center; gap: 9px; height: 64px; padding: 0px 14px; background: var(--panel2); border-bottom: 1px solid transparent; animation: 4.4s ease-in-out 0s infinite normal none running mnuCondBar; z-index: 2; }
.mnu-cond-logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.5)); flex: 0 0 auto; animation: 4.4s ease-in-out 0s infinite normal none running mnuCondLogo; }
.mnu-cond-tt b { display: block; font: 800 13px ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.mnu-cond-tt small { display: block; font-size: 10px; color: var(--dim); overflow: hidden; animation: 4.4s ease-in-out 0s infinite normal none running mnuCondSub; }
.mnu-cond-doc { position: absolute; top: 64px; left: 0px; right: 0px; padding: 12px 14px; }
.mnu-cond-doc i { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 7px; }
.mnu-cond-doc i:nth-child(2) { width: 88%; }
.mnu-cond-doc i:nth-child(3) { width: 74%; }
@keyframes mnuCondBar { 
  0%, 28% { height: 64px; box-shadow: none; border-bottom-color: transparent; }
  52%, 90% { height: 40px; box-shadow: rgba(0, 0, 0, 0.4) 0px 8px 18px; border-bottom-color: var(--line); }
  100% { height: 64px; }
}
@keyframes mnuCondLogo { 
  0%, 28% { width: 26px; height: 26px; }
  52%, 90% { width: 20px; height: 20px; }
  100% { width: 26px; height: 26px; }
}
@keyframes mnuCondSub { 
  0%, 28% { max-height: 14px; opacity: 0.9; }
  52%, 90% { max-height: 0px; opacity: 0; }
  100% { max-height: 14px; opacity: 0.9; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-condense"><div class="mnu-cond-bar"><span class="mnu-cond-logo"></span><span class="mnu-cond-tt"><b>Meridian</b><small>Design systems studio</small></span></div>
      <div class="mnu-cond-doc"><i></i><i></i><i></i></div></div></div></div>
<div class="meta"><b>Sticky Shrink Header</b> · <code>menus-sticky-shrink-header</code><br>Menus &amp; Actions · WAYFINDING &amp; PROGRESS<p>On scroll the header condenses: it loses height, the logo shrinks, the subtitle collapses away and a shadow lifts it off the page. Shown looping between the two states.</p></div>

</body>
</html>
