<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordcount Odometer · Prism</title>
<!-- Prism showcase sample: obsidian-wordcount-odometer (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-notechrome { width: 278px; max-width: 100%; min-height: 86px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(160deg,rgba(var(--ob-rgb),.09),var(--panel2) 55%); padding: 12px 14px; position: relative; overflow: hidden; text-align: left; }
.obs-notechrome h4 { margin: 0px; color: var(--ink); font-size: 15px; letter-spacing: -0.01em; }
.obs-notechrome p { margin: 5px 0px 0px; color: var(--muted); font-size: 10.5px; }
.obs-notechrome small { color: var(--dim); font-size: 9.5px; }
.obs-wordcount { display: flex; align-items: center; justify-content: space-between; }
.obs-odometer { display: flex; gap: 2px; }
.obs-odometer b { width: 19px; height: 27px; overflow: hidden; border-radius: 5px; background: rgb(9, 12, 20); border: 1px solid var(--line); position: relative; color: var(--ob); font: 800 17px / 27px ui-monospace, monospace; text-align: center; }
.obs-odometer b::after { content: "3\a 4\a 5\a 6\a 7"; white-space: pre; position: absolute; left: 0px; top: 0px; width: 100%; animation: 5s steps(4) 0s infinite normal none running obsOdo; }
.obs-odometer b:nth-child(2)::after { content: "7\a 8\a 9\a 0\a 1"; animation-delay: -1.1s; }
.obs-odometer b:nth-child(3)::after { content: "2\a 3\a 4\a 5\a 6"; animation-delay: -2.3s; }
@keyframes obsOdo { 
  100% { transform: translateY(-108px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-notechrome obs-wordcount"><div><h4>Words</h4><small>in this note</small></div><div class="obs-odometer"><b></b><b></b><b></b></div></div></div></div>
<div class="meta"><b>Wordcount Odometer</b> · <code>obsidian-wordcount-odometer</code><br>Obsidian Facets · NOTE CHROME &amp; HEADERS<p>Three mechanical digits roll continuously inside a compact note statistic.</p></div>

</body>
</html>
