<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton Card · Prism</title>
<!-- Prism showcase sample: lab-skeleton-card (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-skcard { width: 100%; max-width: 240px; padding: 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; box-sizing: border-box; }
.lab-ld-skcard-img { height: 50px; border-radius: 6px; background: var(--panel2); }
.lab-ld-skcard-ln { height: 9px; border-radius: 5px; background: var(--panel2); margin-top: 8px; }
.lab-ld-skcard-ln.lab-ld-w60 { width: 60%; }
.lab-ld-skcard-ln.lab-ld-w90 { width: 90%; }
.lab-ld-skcard-ln.lab-ld-w40 { width: 40%; }
.lab-ld-skcard::after { content: ""; position: absolute; inset: 0px; background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, 0.1) 50%, transparent 65%); transform: translateX(-100%); animation: 2s ease-in-out 0s infinite normal none running labLdSheen; }
@keyframes labLdSheen { 
  100% { transform: translateX(100%); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-skcard"><div class="lab-ld-skcard-img"></div><div class="lab-ld-skcard-ln lab-ld-w60"></div><div class="lab-ld-skcard-ln lab-ld-w90"></div><div class="lab-ld-skcard-ln lab-ld-w40"></div></div></div></div>
<div class="meta"><b>Skeleton Card</b> · <code>lab-skeleton-card</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>A card placeholder with an image block and three text lines under a diagonal sheen sweep. Use in place of a card while its data loads.</p></div>

</body>
</html>
