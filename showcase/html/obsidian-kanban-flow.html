<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Flow · Prism</title>
<!-- Prism showcase sample: obsidian-kanban-flow (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-daily { width: 278px; max-width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(150deg,var(--panel2),rgba(var(--ob-rgb),.07)); padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-daily h4 { margin: 0px; font-size: 12px; color: var(--ink); }
.obs-daily small { font-size: 9px; color: var(--dim); }
.obs-kanban-flow { display: flex; gap: 6px; height: 94px; }
.obs-kcol { flex: 1 1 0%; border-radius: 7px; background: rgba(0, 0, 0, 0.16); border: 1px solid var(--line); padding: 5px; }
.obs-kcol b { display: block; text-align: center; font-size: 8px; color: var(--dim); margin-bottom: 5px; }
.obs-kcard { height: 19px; border-radius: 5px; background: rgba(var(--ob-rgb),.17); border: 1px solid rgba(var(--ob-rgb),.35); margin-top: 4px; animation: 6s ease-in-out 0s infinite normal none running obsKanban; }
.obs-kcol:nth-child(2) .obs-kcard { animation-delay: 2s; }
.obs-kcol:nth-child(3) .obs-kcard { animation-delay: 4s; }
@keyframes obsKanban { 
  0%, 100% { transform: translateY(0px); opacity: 0.45; }
  12%, 28% { transform: translateY(-2px); opacity: 1; box-shadow: 0 5px 9px rgba(var(--ob-rgb),.2); }
  40% { transform: translateY(0px); opacity: 0.45; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-daily obs-kanban-flow"><div class="obs-kcol"><b>IDEAS</b><span class="obs-kcard"></span><span class="obs-kcard"></span></div><div class="obs-kcol"><b>DOING</b><span class="obs-kcard"></span></div><div class="obs-kcol"><b>DONE</b><span class="obs-kcard"></span><span class="obs-kcard"></span></div></div></div></div>
<div class="meta"><b>Kanban Flow</b> · <code>obsidian-kanban-flow</code><br>Obsidian Facets · TASKS &amp; DAILY NOTES<p>Three miniature kanban lanes take turns lifting their active card.</p></div>

</body>
</html>
