<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inset Text Field · Prism</title>
<!-- Prism showcase sample: spectrums-inset-text-field (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-field { width: 220px; text-align: left; }
.neu-field .neu-flabel { display: block; font-size: 10.5px; font-weight: 700; color: var(--neu-muted); margin-bottom: 7px; letter-spacing: 0.02em; }
.neu-field .neu-finput { width: 100%; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 13px; padding: 12px 14px; border-radius: 14px; background: var(--neu-base); color: var(--neu-ink); box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light); transition: box-shadow 0.2s; }
.neu-field .neu-finput::placeholder { color: var(--neu-muted); }
.neu-field .neu-finput:focus { outline: none; box-shadow: inset 4px 4px 8px var(--neu-darkStrong), inset -4px -4px 8px var(--neu-light), 0 0 0 2px rgba(var(--neu-accent-rgb),.4); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="neu-field">
      <label class="neu-flabel">EMAIL ADDRESS</label>
      <input class="neu-finput" placeholder="you@company.com">
    </div></div></div>
<div class="meta"><b>Inset Text Field</b> · <code>spectrums-inset-text-field</code><br>Spectrums · Neumorphism · Neumorphism<p>A convincing Neumorphism input: the field is pressed into the surface at rest and gets a subtle amber outline ring on focus — no visible border, ever.</p></div>

</body>
</html>
