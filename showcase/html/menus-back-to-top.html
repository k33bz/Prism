<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to Top · Prism</title>
<!-- Prism showcase sample: menus-back-to-top (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-totop { position: relative; width: 240px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); padding: 16px 14px; }
.mnu-totop i { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 8px; }
.mnu-totop i:nth-child(1) { width: 70%; }
.mnu-totop i:nth-child(2) { width: 92%; }
.mnu-totop i:nth-child(3) { width: 84%; }
.mnu-totop i:nth-child(4) { width: 90%; }
.mnu-totop i:nth-child(5) { width: 76%; }
.mnu-tt-btn { position: absolute; bottom: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.75)); color: var(--bg); display: grid; place-items: center; font-size: 16px; cursor: pointer; box-shadow: 0 8px 18px rgba(var(--accent-rgb),.4); animation: 4s ease-in-out 0s infinite normal none running mnuTotop; transition: transform 0.18s; }
.mnu-tt-btn:hover { transform: translateY(-3px); }
@keyframes mnuTotop { 
  0%, 12% { opacity: 0; transform: translateY(12px) scale(0.8); }
  28%, 82% { opacity: 1; transform: none; }
  96%, 100% { opacity: 0; transform: translateY(12px) scale(0.8); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-totop"><i></i><i></i><i></i><i></i><i></i><button class="mnu-tt-btn" aria-label="Back to top">↑</button></div></div></div>
<div class="meta"><b>Back to Top</b> · <code>menus-back-to-top</code><br>Menus &amp; Actions · WAYFINDING &amp; PROGRESS<p>A floating round button fades and springs in once the reader scrolls past the fold, then lifts on hover, the return-to-top control. Shown appearing on a loop.</p></div>

</body>
</html>
