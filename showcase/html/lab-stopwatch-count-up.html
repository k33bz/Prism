<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch (count up) · Prism</title>
<!-- Prism showcase sample: lab-stopwatch-count-up (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tb-mono { font-family: ui-monospace, Menlo, monospace; font-weight: 800; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="tb-mono" style="font-size:26px;color:var(--pos)"><span data-stopwatch="">02:55.6</span></div></div></div>
<div class="meta"><b>Stopwatch (count up)</b> · <code>lab-stopwatch-count-up</code><br>Animation Lab · Time<p>A live count-up stopwatch ticking tenths of a second — for elapsed-time / &quot;running&quot; indicators.</p></div>
<script>
/* live time-based widgets (countdown ring, MM:SS, stopwatch) - from Prism.html */
(function(){
  function tick(){
    var now=Date.now();
    document.querySelectorAll('[data-countdown]').forEach(function(el){
      var total=parseInt(el.getAttribute('data-countdown'),10)||8;
      el.textContent=total-Math.floor(now/1000)%total;
    });
    document.querySelectorAll('[data-timer="mmss"]').forEach(function(el){
      var from=parseInt(el.getAttribute('data-from'),10)||90;
      var rem=from-Math.floor(now/1000)%(from+1);
      var m=Math.floor(rem/60),s=rem%60;
      el.textContent=String(m).padStart(2,'0');
      var secEl=el.parentNode.querySelector('[data-timer-sec]');
      if(secEl)secEl.textContent=String(s).padStart(2,'0');
    });
    document.querySelectorAll('[data-stopwatch]').forEach(function(el){
      var t=(now/100)%6000;
      var m=Math.floor(t/600),s=Math.floor(t/10)%60,d=Math.floor(t)%10;
      el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;
    });
    requestAnimationFrame(tick);
  }
  tick();
})();</script>
</body>
</html>
