<style id="effect-css">
.chx-lq-chart { width: 100%; max-width: 300px; height: 150px; display: block; }

.chx-lq-vcol { transform-origin: center bottom; transform: scaleY(0); animation-name: chxLqCol; animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 1, 0.3, 1); animation-iteration-count: infinite; animation-delay: var(--chx-lq-d,0s); }

@keyframes chxLqCol { 
  0% { transform: scaleY(0); }
  35% { transform: scaleY(1); }
  90% { transform: scaleY(1); }
  100% { transform: scaleY(0); }
}
@keyframes chxLqFade { 
  0% { opacity: 0; }
  45% { opacity: 0; }
  60% { opacity: 1; }
  92% { opacity: 1; }
  100% { opacity: 0; }
}
