<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Diffusion · Prism</title>
<!-- Prism showcase sample: obsidian-ink-diffusion (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-ambient { width: 280px; max-width: 100%; height: 108px; border: 1px solid var(--line); border-radius: 10px; background: rgb(9, 12, 22); position: relative; overflow: hidden; }
.obs-ambient-label { position: absolute; left: 10px; bottom: 7px; z-index: 4; font-size: 8px; font-weight: 800; letter-spacing: 0.12em; color: rgba(255, 255, 255, 0.65); text-shadow: rgb(0, 0, 0) 0px 1px 5px; }
.obs-ink-diffuse::before { content: ""; position: absolute; width: 42px; height: 42px; border-radius: 42% 58% 48% 52%; left: 119px; top: 33px; background: var(--ob); filter: blur(1px); animation: 7s ease-in-out 0s infinite normal none running obsInk; mix-blend-mode: screen; }
.obs-ink-diffuse::after { content: "THOUGHT"; position: absolute; inset: 0px; display: flex; align-items: center; justify-content: center; color: rgb(255, 255, 255); font-size: 11px; font-weight: 900; letter-spacing: 0.2em; z-index: 2; opacity: 0; animation: 7s ease 0s infinite normal none running obsInkText; }
@keyframes obsInk { 
  0% { transform: scale(0.15); filter: blur(1px); opacity: 0.8; }
  45% { transform: scale(2.8); filter: blur(12px); opacity: 0.45; border-radius: 58% 42% 63% 37%; }
  85%, 100% { transform: scale(4); filter: blur(24px); opacity: 0; }
}
@keyframes obsInkText { 
  0%, 25% { opacity: 0; letter-spacing: 0.5em; }
  48%, 78% { opacity: 1; letter-spacing: 0.2em; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-ambient obs-ink-diffuse"><span class="obs-ambient-label">INK BECOMES IDEA</span></div></div></div>
<div class="meta"><b>Ink Diffusion</b> · <code>obsidian-ink-diffusion</code><br>Obsidian Facets · VAULT AMBIENT &amp; FOCUS<p>A purple ink bloom expands through darkness and resolves into a thought.</p></div>

</body>
</html>
