<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growing Plant · Prism</title>
<!-- Prism showcase sample: objects-growing-plant (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.plant { transform-box: fill-box; transform-origin: 59px 100px; animation: 4.4s ease-in-out 0s infinite normal none running plantSway; }
.plant .stem { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 2.2s ease-out 0.1s 1 normal forwards running plantGrow; }
.plant .leaf { transform-box: fill-box; transform-origin: center center; opacity: 0; transform: scale(0.2); animation: 0.8s ease-out 0s 1 normal forwards running plantLeaf; }
.plant .l1 { animation-delay: 0.5s; }
.plant .l2 { animation-delay: 0.8s; }
.plant .l3 { animation-delay: 1.05s; }
.plant .bloom { animation-delay: 1.35s; }
@keyframes plantGrow { 
  100% { stroke-dashoffset: 0; }
}
@keyframes plantLeaf { 
  100% { opacity: 1; transform: scale(1); }
}
@keyframes plantSway { 
  0%, 100% { transform: rotate(-2.5deg); }
  50% { transform: rotate(2.5deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="plant" fill="none" style="width:100px;height:100px">
        <path class="stem" style="--len:90" d="M59 100 C59 80 57 64 59 48" stroke="var(--green)" stroke-width="5" stroke-linecap="round"></path>
        <ellipse class="leaf l1" cx="44" cy="74" rx="13" ry="7" fill="var(--green)" transform="rotate(-30 44 74)"></ellipse>
        <ellipse class="leaf l2" cx="74" cy="64" rx="13" ry="7" fill="var(--green)" transform="rotate(30 74 64)"></ellipse>
        <ellipse class="leaf l3" cx="46" cy="56" rx="11" ry="6" fill="#4fd06a" transform="rotate(-22 46 56)"></ellipse>
        <circle class="leaf bloom" cx="59" cy="44" r="9" fill="var(--mag)"></circle>
        <rect x="38" y="100" width="42" height="6" rx="3" fill="#5b4636"></rect>
      </svg></div></div>
<div class="meta"><b>Growing Plant</b> · <code>objects-growing-plant</code><br>Animated Objects · Time, launch &amp; life<p>The stem draws upward, leaves pop in sequence, and a bloom opens before the cycle resets. Growth metrics, sustainability, onboarding.</p></div>

</body>
</html>
