<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chomp Loader · Prism</title>
<!-- Prism showcase sample: lab-chomp-loader (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-chomp { position: relative; width: 170px; height: 40px; overflow: hidden; }
.lab-ld-chomp-m { position: absolute; left: 8px; top: 6px; width: 28px; height: 28px; }
.lab-ld-chomp-j { position: absolute; left: 0px; width: 28px; height: 14px; background: var(--c,var(--accent)); animation-duration: 0.5s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
.lab-ld-chomp-j:first-child { top: 0px; border-radius: 14px 14px 0px 0px; transform-origin: 50% 100%; animation-name: labLdJawUp; }
.lab-ld-chomp-j:last-child { top: 14px; border-radius: 0px 0px 14px 14px; transform-origin: 50% 0px; animation-name: labLdJawDown; }
.lab-ld-chomp-d { position: absolute; top: 16px; left: 150px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: 0.85; animation-name: labLdChompDot; animation-duration: 1.6s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: calc(var(--i)*-.4s); }
@keyframes labLdJawUp { 
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-32deg); }
}
@keyframes labLdJawDown { 
  0% { transform: rotate(0deg); }
  100% { transform: rotate(32deg); }
}
@keyframes labLdChompDot { 
  0% { transform: translateX(0px); opacity: 0.85; }
  88% { opacity: 0.85; }
  92%, 100% { transform: translateX(-122px); opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-chomp"><div class="lab-ld-chomp-m"><i class="lab-ld-chomp-j"></i><i class="lab-ld-chomp-j"></i></div><i class="lab-ld-chomp-d" style="--i:0"></i><i class="lab-ld-chomp-d" style="--i:1"></i><i class="lab-ld-chomp-d" style="--i:2"></i><i class="lab-ld-chomp-d" style="--i:3"></i></div></div></div>
<div class="meta"><b>Chomp Loader</b> · <code>lab-chomp-loader</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>A round mouth opens and closes while a train of dots glides in from the right and vanishes at the jaws. Use for queue draining or batch consumption states.</p></div>

</body>
</html>
