<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDN Edge Map · Prism</title>
<!-- Prism showcase sample: arch-cdn-edge-map (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-box { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-cir { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-gl { fill: none; stroke: rgba(var(--cr,var(--accent-rgb)),.9); stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
.arch-net-nm { fill: var(--ink); font-size: 6.5px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-lbl { fill: var(--muted); font-size: 6px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-cap { fill: var(--muted); font-size: 6px; font-family: ui-monospace, Menlo, monospace; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-wired { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2.5, 2.5; }
.arch-net-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetFlow; animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
.arch-net-fast { animation-duration: 0.7s; }
.arch-net-lit { transform-box: fill-box; transform-origin: center center; animation-name: archNetLit; animation-duration: 3s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--ld,0s); }
@keyframes archNetFlow { 
  100% { stroke-dashoffset: -15; }
}
@keyframes archNetLit { 
  0%, 55%, 100% { opacity: 0; transform: scale(0.5); }
  16% { opacity: 0.75; transform: scale(1); }
  40% { opacity: 0; transform: scale(1.6); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-net-svg arch-net-cdn" viewBox="0 0 300 150" style="--c:var(--info);--cr:var(--info-rgb)" role="img" aria-label="CDN edge map with cache hit">
      <path class="arch-net-wired" d="M52 74 150 30M52 74 240 42M52 74 268 82M52 74 235 118M52 74 150 116"></path>
      <path class="arch-net-wire" d="M150 78 268 82"></path>
      <path class="arch-net-flow arch-net-fast" style="--fd:0s" d="M150 78 268 82"></path>
      <g fill="var(--pos)"><circle class="arch-net-lit" style="--ld:.7s;--cr:var(--pos-rgb)" cx="268" cy="82" r="8"></circle></g>
      <g style="--cr:var(--info-rgb)"><rect class="arch-net-box" x="28" y="62" width="24" height="20" rx="4"></rect><path class="arch-net-gl" d="M33 68h14M33 72h14M33 76h14"></path></g>
      <text class="arch-net-lbl" x="40" y="92">origin</text>
      <g style="--cr:var(--info-rgb)"><circle class="arch-net-cir" cx="150" cy="30" r="6.5"></circle><circle class="arch-net-cir" cx="240" cy="42" r="6.5"></circle><circle class="arch-net-cir" cx="235" cy="118" r="6.5"></circle><circle class="arch-net-cir" cx="150" cy="116" r="6.5"></circle></g>
      <g style="--cr:var(--pos-rgb)"><circle class="arch-net-cir" cx="268" cy="82" r="7.5"></circle></g>
      <g style="--cr:var(--accent-rgb)"><circle class="arch-net-cir" cx="150" cy="78" r="6"></circle></g>
      <text class="arch-net-nm" x="150" y="80.5" style="font-size:6px">req</text>
      <text class="arch-net-lbl" x="150" y="94">user</text>
      <text class="arch-net-cap" x="238" y="72" style="fill:var(--pos)">cache hit</text>
      <text class="arch-net-lbl" x="200" y="30">edge PoP</text>
    </svg></div></div>
<div class="meta"><b>CDN Edge Map</b> · <code>arch-cdn-edge-map</code><br>Architecture Diagrams · NETWORK FLOW MAPS<p>An origin plus edge points of presence, with a request routed to the nearest edge and a cache hit glow. Use for content delivery diagrams.</p></div>

</body>
</html>
