<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog Timeline · Prism</title>
<!-- Prism showcase sample: callouts-changelog-timeline (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-chg { width: 234px; text-align: left; position: relative; padding-left: 16px; }
.ann-chg::before { content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.ann-chg .ann-ce { position: relative; padding: 0px 0px 10px; }
.ann-chg .ann-ce:last-child { padding-bottom: 0px; }
.ann-chg .ann-ce::before { content: ""; position: absolute; left: -16px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--cg,var(--ann-i)); box-shadow: 0 0 7px -1px var(--cg,var(--ann-i)); }
.ann-chg .ann-ce.add { --cg: var(--ann-p); }
.ann-chg .ann-ce.fix { --cg: var(--ann-w); }
.ann-chg .ann-ce.rm { --cg: var(--ann-n); }
.ann-chg .ann-cv { display: flex; gap: 7px; align-items: baseline; }
.ann-chg .ann-ctag { font-size: 8.5px; font-weight: 800; letter-spacing: 0.05em; padding: 1px 5px; border-radius: 4px; color: var(--cg,var(--ann-i)); background: rgba(255, 255, 255, 0.05); }
.ann-chg .ann-cx { font-size: 10.5px; color: var(--muted); }
.ann-chg .ann-cver { font-size: 10px; font-weight: 800; color: var(--ink); font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-chg">
      <div class="ann-ce add"><div class="ann-cv"><span class="ann-cver">1.4.0</span><span class="ann-ctag">ADDED</span></div><div class="ann-cx">Dark-mode support</div></div>
      <div class="ann-ce fix"><div class="ann-cv"><span class="ann-cver">1.3.2</span><span class="ann-ctag">FIXED</span></div><div class="ann-cx">Race in cache warmer</div></div>
      <div class="ann-ce rm"><div class="ann-cv"><span class="ann-cver">1.3.0</span><span class="ann-ctag">REMOVED</span></div><div class="ann-cx">Legacy v1 endpoint</div></div>
    </div></div></div>
<div class="meta"><b>Changelog Timeline</b> · <code>callouts-changelog-timeline</code><br>Callouts &amp; Annotations · TIMELINES &amp; STEPPERS<p>Release feed with color-coded add/fix/remove dots and version tags.</p></div>

</body>
</html>
