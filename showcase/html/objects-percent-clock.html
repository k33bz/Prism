<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percent Clock · Prism</title>
<!-- Prism showcase sample: objects-percent-clock (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obj-sand-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,var(--panel2),var(--panel)); display: grid; place-items: center; isolation: isolate; }
.obj-sand-tag { position: absolute; left: 12px; bottom: 9px; z-index: 8; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obj-sand-pctc { position: relative; width: 150px; height: 120px; display: flex; align-items: center; gap: 14px; justify-content: center; animation: 4s linear 0s infinite normal none running objSandPctDrive; }
.obj-sand-pctc-hg { position: relative; width: 60px; height: 104px; flex: 0 0 auto; }
.obj-sand-pctc-b { position: absolute; left: 2px; right: 2px; height: 46px; overflow: hidden; border: 1.5px solid var(--muted); }
.obj-sand-pctc-b.obj-sand-pctc-t { top: 4px; border-radius: 30px 30px 6px 6px; border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; }
.obj-sand-pctc-b.obj-sand-pctc-bt { bottom: 4px; border-radius: 6px 6px 30px 30px; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; }
.obj-sand-pctc-ts { position: absolute; left: 0px; right: 0px; top: 0px; height: 100%; background: var(--warn); transform-origin: center top; transform: scaleY(calc(1 - var(--obj-sand-pct)/100)); }
.obj-sand-pctc-bs { position: absolute; left: 0px; right: 0px; bottom: 0px; height: 100%; background: rgba(var(--warn-rgb),.85); clip-path: polygon(50% 35%, 100% 100%, 0px 100%); transform-origin: center bottom; transform: scaleY(calc(var(--obj-sand-pct)/100)); }
.obj-sand-pctc-neck { position: absolute; left: 50%; top: 50px; width: 2px; height: 8px; margin-left: -1px; background: var(--warn); }
.obj-sand-pctc-num { font: 800 22px ui-sans-serif, system-ui, sans-serif; color: var(--ink); counter-reset: objSandPct var(--obj-sand-pct); min-width: 58px; }
.obj-sand-pctc-num::after { content: counter(objSandPct) "%"; color: var(--warn); }
.obj-sand-pctc-lab { display: block; font: 500 9px / 1.4 ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: 0.08em; margin-top: 3px; }
@keyframes objSandPctDrive { 
  0% { --obj-sand-pct: 0; }
  92%, 100% { --obj-sand-pct: 100; }
}
@property --obj-sand-pct { syntax: "<integer>"; inherits: true; initial-value: 0; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obj-sand-root"><div class="obj-sand-pctc"><div class="obj-sand-pctc-hg"><span class="obj-sand-pctc-b obj-sand-pctc-t"><span class="obj-sand-pctc-ts"></span></span><span class="obj-sand-pctc-neck"></span><span class="obj-sand-pctc-b obj-sand-pctc-bt"><span class="obj-sand-pctc-bs"></span></span></div><div class="obj-sand-pctc-num"><span class="obj-sand-pctc-lab">fallen</span></div></div><span class="obj-sand-tag">Atlas · 0 to 100</span></div></div></div>
<div class="meta"><b>Percent Clock</b> · <code>objects-percent-clock</code><br>Animated Objects · HOURGLASS &amp; SAND<p>An hourglass paired with a live 0 to 100 percent readout of how much sand has fallen, counted by a registered property. Progress timers.</p></div>

</body>
</html>
