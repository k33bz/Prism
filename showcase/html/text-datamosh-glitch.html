<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datamosh-Glitch · Prism</title>
<!-- Prism showcase sample: text-datamosh-glitch (gallery: text). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-crit { --c: var(--crit); --c-rgb: 200,121,255; }
.tx-sample { font-size: 30px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.1; text-align: center; }
.tx-sample.lg { font-size: 38px; }
.tx-sample.sm { font-size: 22px; letter-spacing: 0.06em; }
.tx-glitch { position: relative; color: var(--c); font-weight: 800; }
.tx-glitch::before, .tx-glitch::after { content: attr(data-text); position: absolute; left: 0px; top: 0px; width: 100%; pointer-events: none; }
.tx-glitch::before { color: rgb(51, 221, 255); left: 2px; text-shadow: rgb(51, 221, 255) -1px 0px; animation: 2.4s steps(2) 0s infinite normal none running txGlitchA; }
.tx-glitch::after { color: rgb(255, 51, 170); left: -2px; text-shadow: rgb(255, 51, 170) 1px 0px; animation: 2.8s steps(2) 0s infinite normal none running txGlitchB; }
@keyframes txGlitchA { 
  0%, 100% { clip-path: inset(0px 0px 85%); transform: translate(0px); }
  20% { clip-path: inset(20% 0px 55%); transform: translate(-3px, 0px); }
  40% { clip-path: inset(60% 0px 10%); transform: translate(3px, 0px); }
  60% { clip-path: inset(10% 0px 70%); transform: translate(-2px, 0px); }
  80% { clip-path: inset(45% 0px 35%); transform: translate(2px, 0px); }
}
@keyframes txGlitchB { 
  0%, 100% { clip-path: inset(70% 0px 5%); transform: translate(0px); }
  25% { clip-path: inset(15% 0px 60%); transform: translate(3px, 0px); }
  50% { clip-path: inset(55% 0px 20%); transform: translate(-3px, 0px); }
  75% { clip-path: inset(30% 0px 50%); transform: translate(2px, 0px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><span class="tx-sample tx-glitch c-crit" data-text="GLITCH">GLITCH</span></div></div>
<div class="meta"><b>Datamosh-Glitch</b> · <code>text-datamosh-glitch</code><br>Text Effects · Glitch &amp; Distortion<p>Two cyan/magenta clones slice the word into horizontal bands that jump and re-slice. The classic cyberpunk error. Requires a matching data-text attribute.</p></div>

</body>
</html>
