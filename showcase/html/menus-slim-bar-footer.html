<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slim Bar Footer · Prism</title>
<!-- Prism showcase sample: menus-slim-bar-footer (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-ftr { width: 300px; box-sizing: border-box; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
.mnu-ftr a { color: var(--muted); text-decoration: none; transition: color 0.15s; }
.mnu-ftr a:hover { color: var(--ink); }
.mnu-ftr-soc { display: flex; gap: 6px; }
.mnu-ftr-soc span { width: 22px; height: 22px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); cursor: pointer; transition: 0.15s; }
.mnu-ftr-soc span:hover { color: var(--info); border-color: rgba(var(--info-rgb),.5); }
.mnu-ftr-bar { display: flex; align-items: center; gap: 12px; padding: 11px 14px; flex-wrap: wrap; }
.mnu-ftr-bar .mnu-ftr-links { display: flex; gap: 12px; flex: 1 1 auto; justify-content: center; font-size: 11.5px; }
.mnu-ftr-bar .cprt { font-size: 10.5px; color: var(--dim); white-space: nowrap; }
.mnu-ftr-cta .row .mnu-ftr-links { display: flex; gap: 12px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-ftr mnu-ftr-bar">
      <span class="cprt">© 2026 Loop</span>
      <nav class="mnu-ftr-links"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Status</a><a href="#">Contact</a></nav>
      <div class="mnu-ftr-soc"><span>𝕏</span><span>in</span><span>gh</span></div>
    </div></div></div>
<div class="meta"><b>Slim Bar Footer</b> · <code>menus-slim-bar-footer</code><br>Menus &amp; Actions · FOOTER NAVIGATION<p>A single-row footer: copyright at the left, inline legal links centred, social icons at the right, the minimal app footer. Wraps gracefully when narrow.</p></div>

</body>
</html>
