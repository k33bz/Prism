<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swimlane Flow · Prism</title>
<!-- Prism showcase sample: arch-swimlane-flow (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-lanes { display: flex; flex-direction: column; gap: 0px; width: 100%; max-width: 320px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.arch-lane { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); }
.arch-lane:last-child { border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; }
.arch-lane .arch-lhdr { flex: 0 0 52px; font: 800 8px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; }
.arch-lane .arch-ltrack { position: relative; flex: 1 1 0%; height: 14px; display: flex; align-items: center; }
.arch-lane .arch-ltrack::before { content: ""; position: absolute; left: 0px; right: 0px; top: 50%; height: 2px; background: var(--line); }
.arch-lstep { position: relative; z-index: 1; padding: 2px 7px; border-radius: 6px; font: 800 8px / 1.3 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid rgba(var(--info-rgb),.55); }
.arch-ltrack .arch-lpkt { position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: 3s linear 0s infinite normal none running archPacket; }
@keyframes archPacket { 
  0% { left: 2%; opacity: 0; }
  12% { opacity: 1; }
  88% { opacity: 1; }
  100% { left: 97%; opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="arch-lanes">
      <div class="arch-lane"><span class="arch-lhdr">User</span><div class="arch-ltrack"><span class="arch-lstep">Submit</span><span class="arch-lpkt"></span></div></div>
      <div class="arch-lane"><span class="arch-lhdr">API</span><div class="arch-ltrack"><span class="arch-lstep">Validate</span><span class="arch-lpkt" style="animation-delay:1s"></span></div></div>
      <div class="arch-lane"><span class="arch-lhdr">Worker</span><div class="arch-ltrack"><span class="arch-lstep">Process</span><span class="arch-lpkt" style="animation-delay:2s"></span></div></div>
    </div></div></div>
<div class="meta"><b>Swimlane Flow</b> · <code>arch-swimlane-flow</code><br>Architecture Diagrams · SEQUENCE &amp; FLOW DIAGRAMS<p>Stacked lanes per actor with steps and a packet gliding through each — shows who owns each stage of a flow.</p></div>

</body>
</html>
