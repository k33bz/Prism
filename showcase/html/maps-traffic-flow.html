<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Flow · Prism</title>
<!-- Prism showcase sample: maps-traffic-flow (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-scene { position: relative; width: 250px; height: 158px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 140% at 50% -20%,rgba(var(--info-rgb),.10),transparent 60%),var(--panel2); border: 1px solid var(--line); }
.gmap-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.gmap-hex .hx.hot { background: var(--accent); animation: 2.2s ease-in-out 0s infinite normal none running gmapHexGlow; }
.gmap-sel .rg.hot { fill: rgba(var(--accent-rgb),.55); stroke: var(--accent); stroke-width: 2; animation: 2.4s ease-in-out 0s infinite normal none running gmapSelGlow; }
.gmap-grid-svg .g { stroke: rgba(var(--info-rgb),.35); stroke-width: 0.7; fill: none; }
.gmap-live .d.g { animation-delay: 3s; background: var(--crit); box-shadow: 0 0 8px rgba(var(--crit-rgb),.9); }
.gmap-flow-line { fill: none; stroke: rgba(var(--info-rgb),.16); stroke-width: 3; stroke-linecap: round; }
.gmap-flow-line.hot { stroke: rgba(var(--neg-rgb),.3); }
.gmap-flow-parts { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 3, 12; animation: 1s linear 0s infinite normal none running gmapFlowMove; }
.gmap-flow-parts.g { stroke: var(--pos); }
.gmap-flow-parts.y { stroke: var(--warn); animation-duration: 1.6s; }
.gmap-flow-parts.r { stroke: var(--neg); animation-duration: 2.6s; }
.gmap-dc .node .r { position: absolute; inset: 0px; display: flex; align-items: center; justify-content: center; font: 700 8px / 1 system-ui; color: rgb(26, 26, 26); }
@keyframes gmapHexGlow { 
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.6); }
}
@keyframes gmapSelGlow { 
  0%, 100% { filter: drop-shadow(0 0 3px rgba(var(--accent-rgb),.6)); }
  50% { filter: drop-shadow(0 0 10px rgba(var(--accent-rgb),1)); }
}
@keyframes gmapFlowMove { 
  100% { stroke-dashoffset: -30; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-scene">
      <svg class="gmap-svg" viewBox="0 0 250 158">
        <path class="gmap-flow-line" d="M20,120 C80,120 90,50 140,50 C180,50 200,60 232,50"></path>
        <path class="gmap-flow-parts g" d="M20,120 C80,120 90,50 140,50 C180,50 200,60 232,50"></path>
        <path class="gmap-flow-line hot" d="M20,40 C70,40 110,110 160,110 C200,110 210,90 232,110"></path>
        <path class="gmap-flow-parts r" d="M20,40 C70,40 110,110 160,110 C200,110 210,90 232,110"></path>
        <path class="gmap-flow-line" d="M30,80 L230,86"></path>
        <path class="gmap-flow-parts y" d="M30,80 L230,86"></path>
      </svg>
    </div></div></div>
<div class="meta"><b>Traffic Flow</b> · <code>maps-traffic-flow</code><br>Maps &amp; Geo · LIVE &amp; TELEMETRY<p>Particles streaming along roads, colored green/amber/red by congestion.</p></div>

</body>
</html>
