<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Rise Hero · Prism</title>
<!-- Prism showcase sample: lab-clip-rise-hero (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-clip { --c: var(--pos); --c-rgb: var(--pos-rgb); padding: 10px; }
.lab-rv-hero { position: relative; height: 108px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg,rgba(var(--c-rgb),.6),var(--card) 72%); animation-name: labRvClip; }
.lab-rv-hc { position: absolute; left: 14px; bottom: 12px; animation-name: labRvClipIn; }
.lab-rv-ht { font-size: 16px; font-weight: 800; line-height: 1.1; }
.lab-rv-hs { color: var(--muted); margin-top: 3px; }
.lab-rv-hero, .lab-rv-hc { animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); animation-iteration-count: infinite; }
@keyframes labRvClip { 
  0% { clip-path: inset(100% 0px 0px); }
  24%, 80% { clip-path: inset(0px); }
  90%, 100% { clip-path: inset(0px 0px 100%); }
}
@keyframes labRvClipIn { 
  0%, 8% { opacity: 0; transform: translateY(26px); }
  34%, 80% { opacity: 1; transform: none; }
  90%, 100% { opacity: 0; transform: translateY(-10px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-clip">
      <div class="lab-rv-hero"><div class="lab-rv-hc"><div class="lab-rv-ht">Nova is live</div><div class="lab-rv-hs">Rollout complete in 14 regions</div></div></div>
    </div></div></div>
<div class="meta"><b>Clip Rise Hero</b> · <code>lab-clip-rise-hero</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>A hero panel unmasks from the bottom edge while its copy drifts up into place, then wipes away upward. Use for banner sections entering on scroll.</p></div>

</body>
</html>
