<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Nav · Prism</title>
<!-- Prism showcase sample: menus-dot-nav (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-item.is-active { color: var(--accent); }
.mnu-item.is-active .mnu-check { opacity: 1; }
.mnu-nav-underline a.is-active { color: var(--ink); }
.mnu-nav-underline a:nth-child(1).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(1):hover ~ .mnu-nu-bar { transform: translateX(0px); }
.mnu-nav-underline a:nth-child(2).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(2):hover ~ .mnu-nu-bar { transform: translateX(100%); }
.mnu-nav-underline a:nth-child(3).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(3):hover ~ .mnu-nu-bar { transform: translateX(200%); }
.mnu-nav-underline a:nth-child(4).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(4):hover ~ .mnu-nu-bar { transform: translateX(300%); }
.mnu-sidebar a.is-active { background: rgba(var(--accent-rgb),.16); color: var(--accent); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); animation: 2.6s ease-in-out 0s infinite normal none running mnuPulseGlow; }
.mnu-pillnav a.is-active, .mnu-pillnav a:hover { color: var(--ink); }
.mnu-pillnav a:nth-child(1).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(1):hover ~ .mnu-pn-pill { transform: translateX(0px); }
.mnu-pillnav a:nth-child(2).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(2):hover ~ .mnu-pn-pill { transform: translateX(68px); }
.mnu-pillnav a:nth-child(3).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(3):hover ~ .mnu-pn-pill { transform: translateX(146px); }
.mnu-actionbar button.is-active { color: var(--accent); background: rgba(var(--accent-rgb),.14); }
.mnu-ts-track a.is-active { background: rgba(var(--info-rgb),.18); border-color: rgba(var(--info-rgb),.5); color: var(--info); }
@keyframes mnuPulseGlow { 
  0%, 100% { box-shadow: 0 0 0 rgba(var(--accent-rgb),0); }
  50% { box-shadow: 0 0 14px rgba(var(--accent-rgb),.45); }
}
.mnu-hdr-links a.is-active { color: var(--accent); }
.mnu-rail a.is-active { background: rgba(var(--accent-rgb),.16); color: var(--accent); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); animation: 2.6s ease-in-out 0s infinite normal none running mnuPulseGlow; }
.mnu-tabbar a.is-active, .mnu-tabbar a:hover { color: var(--accent); }
.mnu-tabbar a.is-active .mnu-tb-ic, .mnu-tabbar a:hover .mnu-tb-ic { transform: translateY(-2px) scale(1.14); }
.mnu-tabbar a:nth-child(1).is-active ~ .mnu-tb-ink, .mnu-tabbar a:nth-child(1):hover ~ .mnu-tb-ink { transform: translateX(0px); }
.mnu-tabbar a:nth-child(2).is-active ~ .mnu-tb-ink, .mnu-tabbar a:nth-child(2):hover ~ .mnu-tb-ink { transform: translateX(100%); }
.mnu-tabbar a:nth-child(3).is-active ~ .mnu-tb-ink, .mnu-tabbar a:nth-child(3):hover ~ .mnu-tb-ink { transform: translateX(200%); }
.mnu-tabbar a:nth-child(4).is-active ~ .mnu-tb-ink, .mnu-tabbar a:nth-child(4):hover ~ .mnu-tb-ink { transform: translateX(300%); }
.mnu-dotnav { display: flex; flex-direction: column; gap: 15px; padding: 13px 11px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; width: max-content; }
.mnu-dotnav a { position: relative; width: 11px; height: 11px; border-radius: 50%; background: var(--line); cursor: pointer; transition: transform 0.2s, background 0.2s; }
.mnu-dotnav a:hover { background: var(--muted); transform: scale(1.25); }
.mnu-dotnav a.is-active { background: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb),.2); transform: scale(1.15); }
.mnu-dotnav a::after { content: attr(data-tip); position: absolute; left: calc(100% + 13px); top: 50%; transform: translateY(-50%) translateX(-4px); background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: 600 10px ui-sans-serif, system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.18s; }
.mnu-dotnav a:hover::after { opacity: 1; transform: translateY(-50%) translateX(0px); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><nav class="mnu-dotnav"><a href="#" data-tip="Intro"></a><a href="#" class="is-active" data-tip="Features"></a><a href="#" data-tip="Pricing"></a><a href="#" data-tip="Reviews"></a><a href="#" data-tip="Contact"></a></nav></div></div>
<div class="meta"><b>Dot Nav</b> · <code>menus-dot-nav</code><br>Menus &amp; Actions · NAVIGATION MOTION<p>The scrollytelling side rail: one dot glows as the active section while each reveals its label on hover, the long-page navigator. The active dot wears an accent halo.</p></div>

</body>
</html>
