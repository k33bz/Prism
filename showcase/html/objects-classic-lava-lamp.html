<!-- Prism showcase sample: objects-classic-lava-lamp (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.amb-lava-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg,var(--bg),var(--panel2)); isolation: isolate; }
.amb-lava-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.amb-lava-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.05em; color: var(--muted); opacity: 0.85; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.55) 0px 1px 4px; }
.amb-lava-lampA { stop-color: var(--panel2); }
.amb-lava-lampB { stop-color: var(--panel); }
.amb-lava-b { fill: var(--c,var(--accent)); }
.amb-lava-cap { fill: var(--line); }
.amb-lava-clsc-b { transform-box: fill-box; transform-origin: center center; animation-name: ambLavaRise; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes ambLavaRise { 
  0% { transform: translateY(6px) scale(0.7); }
  18% { transform: translateY(-4px) scale(1.05); }
  52% { transform: translateY(-92px) scale(1.18); }
  84% { transform: translateY(-4px) scale(1); }
  100% { transform: translateY(6px) scale(0.7); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb-lava-root">

        <linearGradient id="ambLavaLamp1" x1="0" y1="0" x2="0" y2="1"><stop class="amb-lava-lampA" offset="0"></stop><stop class="amb-lava-lampB" offset="1"></stop></linearGradient>
        <clipPath id="ambLavaClip1"><path d="M120,22 L180,22 L186,132 L114,132 Z"></path></clipPath>
      </defs>
        <rect x="140" y="8" width="20" height="12" class="amb-lava-cap"></rect>
        <path d="M120,22 L180,22 L186,132 L114,132 Z" fill="url(#ambLavaLamp1)"></path>
        <path d="M108,132 L192,132 L198,144 L102,144 Z" class="amb-lava-cap"></path>
        <g clip-path="url(#ambLavaClip1)"><g filter="url(#ambLavaGoo1)">
          <ellipse cx="150" cy="128" rx="30" ry="16" class="amb-lava-b"></ellipse>
          <circle class="amb-lava-b amb-lava-clsc-b" cx="146" cy="122" r="16"></circle>

<div class="meta"><b>Classic Lava Lamp</b> · <code>objects-classic-lava-lamp</code><br>Animated Objects · LAVA LAMPS &amp; FLUID<p>Fat blobs peel off a molten base and drift slowly up a tapered vessel, merging through a gooey filter. Retro hero and loading backdrops.</p></div>
