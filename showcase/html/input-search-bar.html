<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Bar · Prism</title>
<!-- Prism showcase sample: input-search-bar (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.inp { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 11px 14px; font-size: 13.5px; font-family: inherit; outline: none; transition: 0.2s; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.inp::placeholder { color: var(--dim); }
.search-wrap { position: relative; width: 100%; }
.search-wrap .inp { padding-left: 38px; padding-right: 38px; }
.search-wrap .ico-l { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 15px; }
.search-wrap .ico-r { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--accent); color: rgb(26, 18, 0); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
.search-wrap .ico-r:hover { filter: brightness(1.15); }
.pwd-row .inp { padding-right: 42px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="search-wrap">
        <span class="ico-l">🔍</span>
        <input class="inp" placeholder="Search accounts, services, metrics…">
        <button class="ico-r">⌘K</button>
      </div></div></div>
<div class="meta"><b>Search Bar</b> · <code>input-search-bar</code><br>Input Methods · Search &amp; Command Line<p>Full search input with icon left, keyboard shortcut badge right. The universal search pattern.</p></div>

</body>
</html>
