<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donut Chart · Prism</title>
<!-- Prism showcase sample: charts-donut-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--line)" stroke-width="24"></circle>
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--accent)" stroke-width="24" stroke-dasharray="169.6 377" stroke-dashoffset="0" transform="rotate(-90 80 80)"></circle>
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--info)" stroke-width="24" stroke-dasharray="113.1 377" stroke-dashoffset="-169.6" transform="rotate(-90 80 80)"></circle>
        <circle cx="80" cy="80" r="60" fill="none" stroke="var(--pos)" stroke-width="24" stroke-dasharray="75.4 377" stroke-dashoffset="-282.7" transform="rotate(-90 80 80)"></circle>
        <text x="80" y="76" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">$42K</text>
        <text x="80" y="94" text-anchor="middle" font-size="9" fill="var(--muted)">TOTAL SPEND</text>
      </svg>
      <div class="legend" style="flex-direction:column;gap:6px"><span><i style="background:var(--accent)"></i>Compute 45%</span><span><i style="background:var(--info)"></i>Storage 30%</span><span><i style="background:var(--pos)"></i>Network 20%</span></div></div></div>
<div class="meta"><b>Donut Chart</b> · <code>charts-donut-chart</code><br>Charts &amp; Metrics · Pie Charts &amp; Donuts<p>Ring donut with center value and legend. Best for 2–5 categories of a total.</p></div>

</body>
</html>
