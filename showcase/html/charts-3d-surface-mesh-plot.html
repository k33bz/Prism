<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>3D Surface / Mesh Plot · Prism</title>
<!-- Prism showcase sample: charts-3d-surface-mesh-plot (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="250" height="190" viewBox="0 0 250 190" style="overflow:visible">
        <!-- 3D wireframe surface / mesh plot -->
        <defs>
          <linearGradient id="surf3d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--crit)" stop-opacity=".55"></stop><stop offset="1" stop-color="var(--info)" stop-opacity=".15"></stop></linearGradient>
        </defs>
        <!-- back-to-front rows of an undulating surface; each quad shaded by height -->
        <g stroke="rgba(200,121,255,.5)" stroke-width=".8">
          <polygon points="40,70 95,55 150,68 205,52" fill="url(#surf3d)" opacity=".45"></polygon>
          <polygon points="32,92 90,74 148,90 208,70" fill="url(#surf3d)" opacity=".6"></polygon>
          <polygon points="24,116 84,94 146,114 212,90" fill="url(#surf3d)" opacity=".78"></polygon>
          <polygon points="16,142 78,116 144,140 216,112" fill="url(#surf3d)" opacity=".95"></polygon>
        </g>
        <!-- ribs connecting the rows (the mesh grid) -->
        <g stroke="rgba(255,255,255,.18)" stroke-width=".6" fill="none">
          <path d="M40,70 32,92 24,116 16,142"></path><path d="M95,55 90,74 84,94 78,116"></path><path d="M150,68 148,90 146,114 144,140"></path><path d="M205,52 208,70 212,90 216,112"></path>
        </g>
        <text x="125" y="178" text-anchor="middle" font-size="10" fill="var(--muted)">latency × region × hour</text>
      </svg></div></div>
<div class="meta"><b>3D Surface / Mesh Plot</b> · <code>charts-3d-surface-mesh-plot</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Wireframe surface for two-variable metrics (e.g. latency across region × hour). Height-shaded quads convey the third dimension. Best for showing a &quot;landscape&quot; of values.</p></div>

</body>
</html>
