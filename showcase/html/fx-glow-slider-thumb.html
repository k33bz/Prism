<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Slider Thumb · Prism</title>
<!-- Prism showcase sample: fx-glow-slider-thumb (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-info { --c: var(--info); --c-rgb: 68,147,248; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-slider { max-width: 262px; display: grid; gap: 12px; font-size: 12px; color: var(--muted); }
.fx-gl-slider-row { display: flex; justify-content: space-between; }
.fx-gl-slider-row b { color: var(--ink); font-weight: 600; }
.fx-gl-slider-track { position: relative; height: 6px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.fx-gl-slider-fill { position: absolute; left: 0px; top: 0px; bottom: 0px; border-radius: inherit; background: rgba(var(--fx-gl-rgb),.8); box-shadow: 0 0 8px rgba(var(--fx-gl-rgb),.5); animation: 4s ease-in-out 0s infinite normal none running fxGlSliderFill; }
.fx-gl-slider-thumb { position: absolute; top: 50%; left: 25%; width: 20px; height: 20px; margin: -10px 0px 0px -10px; border-radius: 50%; background: rgba(255, 255, 255, 0.95); border: 2px solid rgba(var(--fx-gl-rgb),1); animation: 4s ease-in-out 0s infinite normal none running fxGlSliderThumb; }
@keyframes fxGlSliderFill { 
  0%, 100% { width: 25%; }
  50% { width: 78%; }
}
@keyframes fxGlSliderThumb { 
  0%, 100% { left: 25%; box-shadow: 0 0 0 3px rgba(var(--fx-gl-rgb),.2),0 0 8px rgba(var(--fx-gl-rgb),.6),0 0 18px rgba(var(--fx-gl-rgb),.3); }
  25%, 75% { box-shadow: 0 0 0 6px rgba(var(--fx-gl-rgb),.3),0 0 14px rgba(var(--fx-gl-rgb),.95),0 0 34px rgba(var(--fx-gl-rgb),.6); }
  50% { left: 78%; box-shadow: 0 0 0 3px rgba(var(--fx-gl-rgb),.2),0 0 8px rgba(var(--fx-gl-rgb),.6),0 0 18px rgba(var(--fx-gl-rgb),.3); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-slider c-info"><div class="fx-gl-slider-row"><b>Brightness</b><span>64%</span></div><div class="fx-gl-slider-track"><div class="fx-gl-slider-fill"></div><div class="fx-gl-slider-thumb"></div></div></div></div></div>
<div class="meta"><b>Glow Slider Thumb</b> · <code>fx-glow-slider-thumb</code><br>FX Store · GLOW SYSTEM<p>The thumb travels the track with a halo that swells while it moves and relaxes at rest. Use for volume, brightness or range controls.</p></div>

</body>
</html>
