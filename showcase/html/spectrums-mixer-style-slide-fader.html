<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixer-Style Slide Fader · Prism</title>
<!-- Prism showcase sample: spectrums-mixer-style-slide-fader (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-fader { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.skeu-fader-track { position: relative; width: 26px; height: 132px; border-radius: 6px; background: linear-gradient(90deg, rgb(10, 10, 11), rgb(28, 29, 31), rgb(10, 10, 11)); border: 1px solid rgb(0, 0, 0); box-shadow: rgba(0, 0, 0, 0.7) 0px 2px 6px inset; }
.skeu-fader-fill { position: absolute; left: 50%; bottom: 0px; width: 2px; height: 52%; background: var(--skeu-amber); box-shadow: 0 0 6px rgba(var(--skeu-amber-rgb),.7); transform: translateX(-50%); }
.skeu-fader-cap { position: absolute; left: 50%; bottom: 52%; width: 38px; height: 16px; border-radius: 5px; background-image: var(--skeu-brushed-metal); border: 1px solid rgb(125, 127, 132); transform: translate(-50%, 50%); box-shadow: rgba(255, 255, 255, 0.85) 0px 1px 0px inset, rgba(0, 0, 0, 0.3) -1px -1px 2px inset, rgba(0, 0, 0, 0.5) 0px 3px 6px; cursor: grab; }
.skeu-fader-cap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 60%; height: 2px; background: rgb(90, 91, 96); transform: translate(-50%, -50%); box-shadow: rgb(90, 91, 96) 0px 3px 0px, rgb(90, 91, 96) 0px -3px 0px; }
.skeu-fader-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--skeu-metal-4); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-fader"><div class="skeu-fader-track"><div class="skeu-fader-fill"></div><div class="skeu-fader-cap"></div></div><div class="skeu-fader-label">LEVEL</div></div></div></div>
<div class="meta"><b>Mixer-Style Slide Fader</b> · <code>spectrums-mixer-style-slide-fader</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A vertical channel-strip fader with a grooved metal cap riding in a recessed track — a drag control styled after mixing-console hardware.</p></div>

</body>
</html>
