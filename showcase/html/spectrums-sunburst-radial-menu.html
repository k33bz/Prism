<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunburst Radial Menu · Prism</title>
<!-- Prism showcase sample: spectrums-sunburst-radial-menu (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-radial { position: relative; width: 170px; height: 170px; }
.solp-radial::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 1px dashed rgba(255, 201, 74, 0.35); animation: 16s linear 0s infinite normal none running solpDrift2; }
.solp-radial-core { position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0px 0px -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff6d8,var(--solp-gold) 60%,var(--solp-golddeep)); box-shadow: rgba(255, 201, 74, 0.18) 0px 0px 0px 8px, rgba(255, 201, 74, 0.55) 0px 0px 26px; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 20px; animation: 3.2s ease-in-out 0s infinite normal none running solpRayPulse; }
.solp-radial-petal { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0px 0px -20px; border-radius: 0px 60%; background: linear-gradient(135deg,var(--solp-leaf2),var(--solp-leaf)); display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: rgba(47, 90, 58, 0.3) 0px 4px 10px; transition: filter 0.25s, box-shadow 0.25s; cursor: pointer; }
.solp-radial-petal:hover { filter: brightness(1.18); box-shadow: rgba(126, 217, 87, 0.7) 0px 0px 18px; }
.solp-radial-petal.n { transform: translate(0px, -64px); }
.solp-radial-petal.e { transform: translate(64px, 0px); }
.solp-radial-petal.s { transform: translate(0px, 64px); }
.solp-radial-petal.w { transform: translate(-64px, 0px); }
@keyframes solpDrift2 { 
  100% { transform: rotate(360deg); }
}
@keyframes solpRayPulse { 
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="solp-radial">
      <div class="solp-radial-core">☀️</div>
      <div class="solp-radial-petal n">🌱</div>
      <div class="solp-radial-petal e">💧</div>
      <div class="solp-radial-petal s">🍃</div>
      <div class="solp-radial-petal w">♻️</div>
    </div></div></div>
<div class="meta"><b>Sunburst Radial Menu</b> · <code>spectrums-sunburst-radial-menu</code><br>Spectrums · Solarpunk · Solarpunk<p>A glowing sun core orbited by leaf-shaped action petals on a slow-turning dashed ring — a playful radial menu for eco-dashboard actions.</p></div>

</body>
</html>
