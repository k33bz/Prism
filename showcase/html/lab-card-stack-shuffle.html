<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Stack Shuffle · Prism</title>
<!-- Prism showcase sample: lab-card-stack-shuffle (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-shuffle { position: relative; width: 200px; height: 96px; }
.lab-ld-shuffle-c { position: absolute; left: calc(50% - 50px); top: 26px; width: 100px; height: 62px; border-radius: 9px; border: 1px solid rgba(var(--c-rgb,var(--accent-rgb)),.5); background: linear-gradient(150deg,rgba(var(--c-rgb,var(--accent-rgb)),.55),var(--panel2) 70%),var(--panel); box-shadow: rgba(0, 0, 0, 0.35) 0px 8px 18px; display: grid; place-items: center; font: 600 13px ui-sans-serif, system-ui, sans-serif; color: var(--ink); animation-name: labLdShuffle; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--i)*-1.333s); }
@keyframes labLdShuffle { 
  0% { transform: translate(0px, 0px) scale(1); filter: brightness(1); z-index: 3; }
  16% { transform: translate(78px, -6px) rotate(8deg) scale(1); filter: brightness(1); z-index: 3; }
  17% { z-index: 1; }
  33% { transform: translate(0px, -18px) scale(0.86); filter: brightness(0.55); z-index: 1; }
  66% { transform: translate(0px, -9px) scale(0.93); filter: brightness(0.78); z-index: 2; }
  100% { transform: translate(0px, 0px) scale(1); filter: brightness(1); z-index: 3; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-shuffle"><div class="lab-ld-shuffle-c" style="--i:0">Atlas</div><div class="lab-ld-shuffle-c" style="--i:1">Comet</div><div class="lab-ld-shuffle-c" style="--i:2">Ember</div></div></div></div>
<div class="meta"><b>Card Stack Shuffle</b> · <code>lab-card-stack-shuffle</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>The front card slides out to the right and tucks in at the back of the stack while the rest step forward. Use while a deck, feed or queue is being prepared.</p></div>

</body>
</html>
