<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Tubes · Prism</title>
<!-- Prism showcase sample: objects-test-tubes (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tube .liquid { transform-box: fill-box; transform-origin: center bottom; animation: 3.4s ease-in-out 0s infinite normal none running fill; }
.tube .bub { animation: 2.2s ease-in 0s infinite normal none running riseBubble; }
.tube .b2 { animation-delay: 0.7s; }
.tube .b3 { animation-delay: 1.3s; }
.tube .drop { animation: 2.4s ease-in 0s infinite normal none running drip; }
.wx-rain .drop { animation: 1.3s linear 0s infinite normal none running wxDrop; }
@keyframes riseBubble { 
  0% { transform: translateY(0px); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(-34px); opacity: 0; }
}
@keyframes fill { 
  0% { transform: scaleY(0.15); }
  45%, 70% { transform: scaleY(1); }
  100% { transform: scaleY(0.15); }
}
@keyframes drip { 
  0%, 55% { transform: translateY(0px); opacity: 0; }
  60% { opacity: 1; }
  85% { transform: translateY(26px); opacity: 1; }
  90%, 100% { opacity: 0; }
}
@keyframes wxDrop { 
  0% { transform: translateY(0px); opacity: 0; }
  15% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(34px); opacity: 0; }
}
.amb-rain .drop { position: absolute; top: -20px; width: 1.5px; height: var(--len,16px); border-radius: 2px; background: linear-gradient(transparent, rgba(150, 190, 255, 0.9)); transform: rotate(12deg); animation: ambRain var(--dur,.7s) linear infinite var(--delay,0s); opacity: var(--op,.6); }
.amb-downpour .drop { position: absolute; top: -24px; width: 2px; height: var(--len,26px); border-radius: 2px; background: linear-gradient(transparent, rgba(170, 205, 255, 0.95)); transform: rotate(20deg); animation: ambRain var(--dur,.45s) linear infinite var(--delay,0s); opacity: var(--op,.75); }
@keyframes ambRain { 
  0% { transform: translateY(-20px); }
  100% { transform: translateY(170px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="tube" fill="none">
        <!-- pipette + drop -->
        <line x1="74" y1="14" x2="92" y2="6" stroke="var(--mag)" stroke-width="4" stroke-linecap="round"></line>
        <circle class="drop" cx="73" cy="22" r="3.5" fill="var(--red)"></circle>
        <!-- rack -->
        <line x1="30" y1="34" x2="88" y2="34" stroke="#f3b6c2" stroke-width="5" stroke-linecap="round"></line>
        <!-- tube 1 -->
        <clipPath id="t1"><rect x="42" y="34" width="14" height="60" rx="7"></rect></clipPath>
        <rect x="42" y="34" width="14" height="60" rx="7" stroke="#9fd2ef" stroke-width="3"></rect>
        <g clip-path="url(#t1)"><rect class="liquid" x="42" y="54" width="14" height="40" fill="var(--teal)" opacity=".8"></rect>
          <circle class="bub b1" cx="49" cy="88" r="2" fill="#cfefff"></circle><circle class="bub b2" cx="46" cy="90" r="1.6" fill="#cfefff"></circle></g>
        <!-- tube 2 -->
        <clipPath id="t2"><rect x="64" y="34" width="14" height="60" rx="7"></rect></clipPath>
        <rect x="64" y="34" width="14" height="60" rx="7" stroke="#9fd2ef" stroke-width="3"></rect>
        <g clip-path="url(#t2)"><rect class="liquid" x="64" y="58" width="14" height="36" fill="var(--red)" opacity=".8" style="animation-delay:.6s"></rect>
          <circle class="bub b3" cx="71" cy="88" r="2" fill="#ffd0d0"></circle></g>
      </svg></div></div>
<div class="meta"><b>Test Tubes</b> · <code>objects-test-tubes</code><br>Animated Objects · Structures &amp; particles<p>Liquid fills, bubbles rise, pipette drips. Labs / experiments / testing.</p></div>

</body>
</html>
