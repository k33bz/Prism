<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunderstorm · Prism</title>
<!-- Prism showcase sample: objects-thunderstorm (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.wx-rain .cloud { transform-box: fill-box; transform-origin: center center; animation: 4s ease-in-out 0s infinite normal none running wxBob; }
.wx-storm .cloud { transform-box: fill-box; transform-origin: center center; animation: 3.4s ease-in-out 0s infinite normal none running wxBob; }
.wx-storm .bolt { transform-box: fill-box; transform-origin: center center; animation: 2.2s steps(1) 0s infinite normal none running wxFlash; }
.batt .bolt { transform-box: fill-box; transform-origin: center center; animation: 1.4s ease-in-out 0s infinite normal none running battBolt; }
@keyframes wxBob { 
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}
@keyframes wxFlash { 
  0%, 40%, 100% { opacity: 0; filter: none; }
  45% { opacity: 1; }
  50% { opacity: 0.2; }
  55% { opacity: 1; }
  70% { opacity: 0; }
}
@keyframes battBolt { 
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.amb-clouds .cloud { position: absolute; border-radius: 40px; background: rgba(255, 255, 255, 0.9); box-shadow: rgba(255, 255, 255, 0.85) 30px 6px 0px -4px, rgba(255, 255, 255, 0.8) -26px 8px 0px -6px; animation: ambDrift var(--dur,16s) linear infinite var(--delay,0s); }
.amb-godrays .cloud { position: absolute; top: -6px; border-radius: 30px; background: rgba(230, 238, 250, 0.9); box-shadow: rgba(230, 238, 250, 0.8) 26px 6px 0px -4px; }
@keyframes ambDrift { 
  0% { transform: translateX(-140%); }
  100% { transform: translateX(260%); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="wx-storm" fill="none">
        <g class="cloud">
          <path d="M30 50 a17 17 0 0 1 33 -6 a15 15 0 0 1 23 6 a13 13 0 0 1 -2 25 H37 a15 15 0 0 1 -7 -25 Z" fill="#2c3651" stroke="#46557a" stroke-width="2"></path>
        </g>
        <polygon class="bolt" points="58,72 50,92 60,90 52,108 74,82 62,84 70,72" fill="var(--orange)" stroke="var(--accent)" stroke-width="1"></polygon>
      </svg></div></div>
<div class="meta"><b>Thunderstorm</b> · <code>objects-thunderstorm</code><br>Animated Objects · Weather &amp; sky<p>A dark cloud bobs while a lightning bolt double-flashes on a steps timeline. Severe-weather alerts, &quot;storm&quot;, high-energy states.</p></div>

</body>
</html>
