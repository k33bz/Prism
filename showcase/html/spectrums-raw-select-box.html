<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raw Select Box · Prism</title>
<!-- Prism showcase sample: spectrums-raw-select-box (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gallery :is(.brut-nav, .brut-drop, .brut-ctx, .brut-tabs, .brut-btn, .brut-toast, .brut-banner, .brut-callout, .brut-quote, .brut-bars, .brut-kpi, .brut-meter, .brut-table, .brut-field, .brut-check, .brut-headline, .brut-marked, .brut-stamp-text, .brut-badge, .brut-avatar, .brut-swatch-row) { --ink: #111111; --paper: #f2f2f0; --hot: #ffe600; --danger: #ff2e00; font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
.brut-nav, .brut-drop-btn, .brut-drop-list, .brut-ctx, .brut-tabs, .brut-btn, .brut-toast, .brut-banner, .brut-callout, .brut-quote, .brut-kpi, .brut-meter, .brut-table, .brut-input, .brut-select, .brut-badge, .brut-avatar { border-radius: 0px !important; }
.brut-field { display: flex; flex-direction: column; gap: 6px; width: 200px; }
.brut-field-label { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; background: var(--paper); padding: 2px 6px; align-self: flex-start; }
.brut-input, .brut-select { font-family: inherit; background: var(--paper); border: 3px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 13px; padding: 9px 10px; box-shadow: 4px 4px 0 var(--ink); outline: none; transition: box-shadow 0.08s linear, transform 0.08s linear; }
.brut-input:focus, .brut-select:focus { box-shadow: 6px 6px 0 var(--hot); }
.brut-select { appearance: none; cursor: pointer; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><label class="brut-field">
      <span class="brut-field-label">ENVIRONMENT</span>
      <select class="brut-select">
        <option>PRODUCTION</option>
        <option>STAGING</option>
        <option>DEV</option>
      </select>
    </label></div></div>
<div class="meta"><b>Raw Select Box</b> · <code>spectrums-raw-select-box</code><br>Spectrums · Brutalist Web · Brutalist Web<p>A native select styled with the same thick border and hard shadow as every other control, so dropdowns don't break the brutalist illusion.</p></div>

</body>
</html>
