<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confetti Drift · Prism</title>
<!-- Prism showcase sample: objects-confetti-drift (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.amb-bg-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: var(--panel2); isolation: isolate; }
.amb-bg-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.amb-bg-confetti { background: linear-gradient(180deg,var(--panel2),var(--panel)); }
.amb-bg-confetti-p { position: absolute; top: -14px; left: var(--x,50%); width: 7px; height: 11px; border-radius: 2px; background: var(--c,var(--accent)); opacity: 0.9; animation-name: ambBgConfetti; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.amb-bg-confetti-p:nth-child(4n+2) { background: var(--info); width: 9px; height: 9px; border-radius: 50%; }
.amb-bg-confetti-p:nth-child(4n+3) { background: var(--pos); width: 11px; height: 6px; }
.amb-bg-confetti-p:nth-child(4n+4) { background: var(--crit); width: 6px; height: 6px; }
@keyframes ambBgConfetti { 
  0% { transform: translate(0px, 0px) rotate(0deg); }
  50% { transform: translate(14px, 88px) rotate(200deg); }
  100% { transform: translate(-8px, 180px) rotate(420deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb-bg-root amb-bg-confetti"><i class="amb-bg-confetti-p" style="--x:6%;--d:-.3s"></i><i class="amb-bg-confetti-p" style="--x:15%;--d:-2.4s"></i><i class="amb-bg-confetti-p" style="--x:24%;--d:-1.1s"></i><i class="amb-bg-confetti-p" style="--x:33%;--d:-3.2s"></i><i class="amb-bg-confetti-p" style="--x:42%;--d:-.8s"></i><i class="amb-bg-confetti-p" style="--x:51%;--d:-2.9s"></i><i class="amb-bg-confetti-p" style="--x:60%;--d:-1.7s"></i><i class="amb-bg-confetti-p" style="--x:69%;--d:-3.7s"></i><i class="amb-bg-confetti-p" style="--x:78%;--d:-.5s"></i><i class="amb-bg-confetti-p" style="--x:87%;--d:-2.1s"></i><i class="amb-bg-confetti-p" style="--x:94%;--d:-1.4s"></i><i class="amb-bg-confetti-p" style="--x:48%;--d:-3.9s"></i><span class="amb-bg-tag">Ember · 99.98% uptime</span></div></div></div>
<div class="meta"><b>Confetti Drift</b> · <code>objects-confetti-drift</code><br>Animated Objects · AMBIENT BACKGROUNDS<p>Small paper pieces in four colours tumble slowly down the panel. Milestone, reward and celebration backdrops that stay calm.</p></div>
