<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Bloom · Prism</title>
<!-- Prism showcase sample: obsidian-cluster-bloom (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-svg { display: block; }
.obs-gr-hubnode { fill: var(--ob); stroke: none; filter: drop-shadow(0 0 6px rgba(var(--ob-rgb),.9)); }
.obs-bloomnode { fill: var(--panel2); stroke: var(--ob); stroke-width: 1.4; transform-origin: 120px 60px; animation: 5s ease 0s infinite normal none running obsBloomNode; }
.obs-bloomnode.n2 { animation-delay: 0.25s; }
.obs-bloomnode.n3 { animation-delay: 0.5s; }
.obs-bloomnode.n4 { animation-delay: 0.75s; }
.obs-bloomnode.n5 { animation-delay: 1s; }
.obs-bloomnode.n6 { animation-delay: 1.25s; }
.obs-bloomedge { stroke: rgba(var(--ob-rgb),.5); stroke-width: 1.1; stroke-dasharray: 40; stroke-dashoffset: 40; animation: 5s ease 0s infinite normal none running obsEdgeDraw; }
.obs-bloomedge.n2 { animation-delay: 0.25s; }
.obs-bloomedge.n3 { animation-delay: 0.5s; }
.obs-bloomedge.n4 { animation-delay: 0.75s; }
.obs-bloomedge.n5 { animation-delay: 1s; }
.obs-bloomedge.n6 { animation-delay: 1.25s; }
@keyframes obsBloomNode { 
  0% { transform: scale(0); opacity: 0; }
  10%, 72% { transform: scale(1); opacity: 1; }
  88%, 100% { transform: scale(0); opacity: 0; }
}
@keyframes obsEdgeDraw { 
  0% { stroke-dashoffset: 40; }
  14%, 72% { stroke-dashoffset: 0; }
  88%, 100% { stroke-dashoffset: 40; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs"><svg class="obs-svg" viewBox="0 0 240 112" width="250" height="112"><g><line class="obs-bloomedge" x1="120" y1="56" x2="46" y2="24"></line><line class="obs-bloomedge n2" x1="120" y1="56" x2="190" y2="18"></line><line class="obs-bloomedge n3" x1="120" y1="56" x2="208" y2="73"></line><line class="obs-bloomedge n4" x1="120" y1="56" x2="151" y2="101"></line><line class="obs-bloomedge n5" x1="120" y1="56" x2="65" y2="96"></line></g><circle class="obs-gr-hubnode" cx="120" cy="56" r="8"></circle><circle class="obs-bloomnode" cx="46" cy="24" r="6"></circle><circle class="obs-bloomnode n2" cx="190" cy="18" r="5"></circle><circle class="obs-bloomnode n3" cx="208" cy="73" r="7"></circle><circle class="obs-bloomnode n4" cx="151" cy="101" r="5"></circle><circle class="obs-bloomnode n5" cx="65" cy="96" r="6"></circle></svg></div></div></div>
<div class="meta"><b>Cluster Bloom</b> · <code>obsidian-cluster-bloom</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>A graph cluster grows outward link-by-link, then contracts for another idea.</p></div>

</body>
</html>
