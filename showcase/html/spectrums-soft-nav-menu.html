<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Nav Menu · Prism</title>
<!-- Prism showcase sample: spectrums-soft-nav-menu (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-menu { width: 198px; padding: 10px; border-radius: 20px; background: var(--neu-base); box-shadow: 9px 9px 18px var(--neu-dark), -9px -9px 18px var(--neu-light); display: flex; flex-direction: column; gap: 6px; text-align: left; }
.neu-menu .neu-mi { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 12px; font-size: 12.5px; font-weight: 600; color: var(--neu-muted); cursor: pointer; transition: box-shadow 0.18s, color 0.18s, background 0.18s; background: transparent; }
.neu-menu .neu-mi .neu-ic { width: 16px; text-align: center; font-size: 13px; opacity: 0.85; }
.neu-menu .neu-mi:hover { color: var(--neu-ink); background: var(--neu-base); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
.neu-menu .neu-mi.is-active { color: var(--neu-accent); background: var(--neu-base); box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light); }
.neu-dock .neu-dot:active, .neu-dock .neu-dot.is-active { box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); color: var(--neu-accent); transform: translateY(0px); }
.glm-menu-item:hover, .glm-menu-item.is-active { background: rgba(255, 255, 255, 0.18); padding-left: 13px; }
.solp-nav-item.is-active { background: linear-gradient(135deg,var(--solp-gold2),var(--solp-gold)); color: rgb(74, 44, 5); box-shadow: rgba(255, 179, 71, 0.55) 0px 0px 14px, rgba(0, 0, 0, 0.15) 0px 4px 10px; }
.solp-nav-item:not(.is-active):hover { background: rgba(76, 175, 109, 0.15); color: var(--solp-leafdeep); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="neu-menu">
      <div class="neu-mi is-active"><span class="neu-ic">▤</span>Dashboard</div>
      <div class="neu-mi"><span class="neu-ic">📁</span>Projects</div>
      <div class="neu-mi"><span class="neu-ic">👥</span>Team</div>
      <div class="neu-mi"><span class="neu-ic">⚙</span>Settings</div>
    </div></div></div>
<div class="meta"><b>Soft Nav Menu</b> · <code>spectrums-soft-nav-menu</code><br>Spectrums · Neumorphism · Neumorphism<p>A Neumorphism nav list where the active row presses inward and hovered rows lift slightly — no border ever appears, only shadow.</p></div>

</body>
</html>
