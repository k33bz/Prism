<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Meter · Prism</title>
<!-- Prism showcase sample: input-password-strength-meter-2 (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-pwd { width: 100%; }
.nin2-pwd .nin2-row { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.nin2-pwd .nin2-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.nin2-pwd input { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--ink); outline: none; flex: 1 1 0%; letter-spacing: 0.1em; }
.nin2-pwd .nin2-eye { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.nin2-pwd .nin2-bars { display: flex; gap: 5px; margin-top: 8px; }
.nin2-pwd .nin2-bars i { flex: 1 1 0%; height: 5px; border-radius: 3px; background: var(--panel2); transition: 0.3s; }
.nin2-pwd[data-lvl="1"] .nin2-bars i:nth-child(-n+1) { background: var(--neg); }
.nin2-pwd[data-lvl="2"] .nin2-bars i:nth-child(-n+2) { background: var(--warn); }
.nin2-pwd[data-lvl="3"] .nin2-bars i:nth-child(-n+3) { background: var(--info); }
.nin2-pwd[data-lvl="4"] .nin2-bars i { background: var(--pos); }
.nin2-pwd .nin2-lab { font-size: 10.5px; color: var(--muted); margin-top: 6px; font-weight: 700; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-pwd" data-lvl="3">
      <div class="nin2-row"><input type="password" value="Str0ng!" placeholder="Password"><button type="button" class="nin2-eye">👁</button></div>
      <div class="nin2-bars"><i></i><i></i><i></i><i></i></div>
      <div class="nin2-lab">Good</div>
    </div></div></div>
<div class="meta"><b>Password Strength Meter</b> · <code>input-password-strength-meter-2</code><br>Input Methods · Fields, Pickers &amp; Actions<p>Four bars and a label rate strength live as you type, sweeping red→amber→blue→green. The eye reveals or masks the value.</p></div>

</body>
</html>
