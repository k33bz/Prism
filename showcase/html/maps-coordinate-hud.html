<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinate HUD · Prism</title>
<!-- Prism showcase sample: maps-coordinate-hud (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tile .row { display: flex; gap: 8px; margin-top: 10px; }
.gmap-legend .row { display: flex; align-items: center; gap: 8px; margin: 5px 0px; }
.gmap-hud { width: 222px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 12px / 1.5 ui-monospace, Menlo, monospace; color: var(--ink); }
.gmap-hud .hd { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.gmap-hud .row { display: flex; justify-content: space-between; padding: 2px 0px; }
.gmap-hud .k { color: var(--dim); }
.gmap-hud .v { color: var(--info); font-weight: 700; }
.gmap-hud .cur { color: var(--accent); animation: 1s step-end 0s infinite normal none running gmapHudBlink; }
.gmap-hud .fix { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 6px rgba(var(--pos-rgb),.9); animation: 1.4s ease-in-out 0s infinite normal none running gmapHudBlink; }
@keyframes gmapHudBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-hud">
      <div class="hd"><span>GPS FIX</span><span class="fix"></span></div>
      <div class="row"><span class="k">LAT</span><span class="v">47.6062°&nbsp;N</span></div>
      <div class="row"><span class="k">LON</span><span class="v">122.3321°&nbsp;W</span></div>
      <div class="row"><span class="k">ALT</span><span class="v">54&nbsp;m</span></div>
      <div class="row"><span class="k">SATS</span><span class="v">11<span class="cur">_</span></span></div>
    </div></div></div>
<div class="meta"><b>Coordinate HUD</b> · <code>maps-coordinate-hud</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>A monospace readout of live lat/long, altitude and satellite lock.</p></div>

</body>
</html>
