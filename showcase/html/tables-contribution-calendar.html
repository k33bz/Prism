<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-contrib { display: grid; grid-template-columns: repeat(14, 10px); grid-auto-rows: 10px; gap: 2px; }
.dtb-contrib i { display: block; border-radius: 2px; background: rgba(var(--pos-rgb),var(--a,.12)); animation-duration: 7s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: dtbLight; animation-timeline: auto; animation-range: normal; animation-delay: calc(var(--d,0)*.07s); }
.dtb-contrib-lg { display: flex; gap: 3px; align-items: center; justify-content: flex-end; margin-top: 6px; font: 600 8.5px ui-sans-serif, system-ui, sans-serif; color: var(--dim); }
.dtb-contrib-lg i { width: 9px; height: 9px; border-radius: 2px; background: rgba(var(--pos-rgb),var(--a,.12)); }
.dtb-insp-r .v.s { color: var(--pos); }
.dtb-rank-r.s .rk { background: var(--muted); color: rgb(11, 14, 23); }
.dtb-cal-wrap { position: relative; display: inline-block; }
.dtb-sparks { position: absolute; inset: 0px; pointer-events: none; overflow: visible; --dtb-a-rgb: var(--c-rgb,var(--accent-rgb)); --dtb-b-rgb: var(--crit-rgb); }
.dtb-sparks i { position: absolute; bottom: 2px; left: var(--x,50%); width: 4px; height: 4px; border-radius: 50%; background: rgb(var(--sc,var(--pos-rgb))); box-shadow: 0 0 7px 2px rgba(var(--sc,var(--pos-rgb)),.7); opacity: 0; animation-name: dtbSpark; animation-duration: var(--dur,5s); animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--delay,0s); }
.dtb-sparks i.s { width: 3px; height: 3px; }
@keyframes dtbLight { 
  0%, 8% { filter: brightness(0.6); transform: scale(0.85); }
  14%, 60% { filter: brightness(1.15); transform: scale(1); }
  70%, 100% { filter: brightness(1); transform: scale(1); }
}
@keyframes dtbSpark { 
  0% { transform: translate(0px, 0px); opacity: 0; }
  10% { opacity: 1; }
  60% { transform: translate(5px, -42px); opacity: 0.7; }
  100% { transform: translate(-4px, -78px); opacity: 0; }
}
</style>
</head>
