<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamburger Morphs · Prism</title>
<!-- Prism showcase sample: menus-hamburger-morphs (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-hamicons { display: flex; gap: 16px; }
.mnu-hi { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mnu-hi input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-hi label { width: 38px; height: 38px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
.mnu-hi label span { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--ink); transition: transform 0.3s cubic-bezier(0.3, 1, 0.4, 1), opacity 0.2s, width 0.3s; }
.mnu-hi small { font: 600 9px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em; color: var(--dim); }
.mnu-hi-x input:checked ~ label span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.mnu-hi-x input:checked ~ label span:nth-child(2) { opacity: 0; }
.mnu-hi-x input:checked ~ label span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.mnu-hi-arrow label span { width: 18px; }
.mnu-hi-arrow input:checked ~ label span:nth-child(1) { width: 11px; transform: translate(-5px, 7px) rotate(-45deg); }
.mnu-hi-arrow input:checked ~ label span:nth-child(2) { width: 18px; }
.mnu-hi-arrow input:checked ~ label span:nth-child(3) { width: 11px; transform: translate(-5px, -7px) rotate(45deg); }
.mnu-hi-plus label { gap: 0px; }
.mnu-hi-plus label span:nth-child(2) { width: 0px; height: 0px; }
.mnu-hi-plus label span:nth-child(1) { transform: translateY(1px); }
.mnu-hi-plus label span:nth-child(3) { width: 2px; height: 18px; position: absolute; transform: rotate(0deg); }
.mnu-hi-plus input:checked ~ label span:nth-child(1) { transform: rotate(45deg); }
.mnu-hi-plus input:checked ~ label span:nth-child(3) { transform: rotate(45deg); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-hamicons">
      <div class="mnu-hi mnu-hi-x"><input type="checkbox" id="mnu-hi-x"><label for="mnu-hi-x"><span></span><span></span><span></span></label><small>to close</small></div>
      <div class="mnu-hi mnu-hi-arrow"><input type="checkbox" id="mnu-hi-arrow"><label for="mnu-hi-arrow"><span></span><span></span><span></span></label><small>to back</small></div>
      <div class="mnu-hi mnu-hi-plus"><input type="checkbox" id="mnu-hi-plus"><label for="mnu-hi-plus"><span></span><span></span><span></span></label><small>plus to x</small></div>
    </div></div></div>
<div class="meta"><b>Hamburger Morphs</b> · <code>menus-hamburger-morphs</code><br>Menus &amp; Actions · NAVIGATION MOTION<p>The menu button micro-animations: the three bars morph into a close cross, a back arrow, or a plus that spins to an x. Click each to toggle.</p></div>

</body>
</html>
