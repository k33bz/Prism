<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN Pad + Dots · Prism</title>
<!-- Prism showcase sample: input-pin-pad-dots (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.pin { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pin .pin-dots { display: flex; gap: 14px; }
.pin .pin-dots .pd { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); transition: 0.18s; }
.pin .pin-dots .pd.fill { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),.5); }
.pin .pin-pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 8px; }
.pin .pin-pad button { height: 42px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.12s; font-family: inherit; }
.pin .pin-pad button:hover { border-color: var(--accent); color: var(--accent); }
.pin .pin-pad button:active { transform: scale(0.92); background: rgba(var(--accent-rgb),.15); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="pin" id="pin1">
        <div class="pin-dots"><span class="pd fill"></span><span class="pd fill"></span><span class="pd"></span><span class="pd"></span></div>
        <div class="pin-pad">
          <button onclick="ipPin('1')">1</button><button onclick="ipPin('2')">2</button><button onclick="ipPin('3')">3</button>
          <button onclick="ipPin('4')">4</button><button onclick="ipPin('5')">5</button><button onclick="ipPin('6')">6</button>
          <button onclick="ipPin('7')">7</button><button onclick="ipPin('8')">8</button><button onclick="ipPin('9')">9</button>
          <button onclick="ipPinClear()">⌫</button><button onclick="ipPin('0')">0</button><button onclick="ipPinClear()">C</button>
        </div>
      </div></div></div>
<div class="meta"><b>PIN Pad + Dots</b> · <code>input-pin-pad-dots</code><br>Input Methods · Auth &amp; Secure Inputs<p>A numeric keypad that fills masked dots as digits are entered, with the active dots glowing accent. Backspace and clear keys included. The lock-screen / secure-entry pattern that never shows the raw value.</p></div>

</body>
</html>
