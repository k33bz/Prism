<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanning for Signal · Prism</title>
<!-- Prism showcase sample: maps-scanning-for-signal (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-wp.w2 { animation-delay: 0.5s; }
.gmap-wp.w3 { animation-delay: 1s; }
.gmap-signal { position: relative; width: 200px; height: 130px; }
.gmap-signal .src { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--warn); box-shadow: 0 0 12px rgba(var(--warn-rgb),1); z-index: 2; }
.gmap-signal .wave { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(var(--warn-rgb),.7); animation: 2.4s ease-out 0s infinite normal none running gmapSignalGrow; }
.gmap-signal .w2 { animation-delay: 0.8s; }
.gmap-signal .w3 { animation-delay: 1.6s; }
.gmap-signal .txt { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); font: 600 9px / 1 system-ui, sans-serif; color: var(--warn); letter-spacing: 0.1em; animation: 1.2s ease-in-out 0s infinite normal none running gmapHudBlink; }
@keyframes gmapHudBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@keyframes gmapSignalGrow { 
  0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-signal">
      <div class="wave"></div><div class="wave w2"></div><div class="wave w3"></div>
      <div class="src"></div>
      <div class="txt">SCANNING FOR SIGNAL</div>
    </div></div></div>
<div class="meta"><b>Scanning for Signal</b> · <code>maps-scanning-for-signal</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>Concentric waves emitting from a source while searching for a signal.</p></div>

</body>
</html>
