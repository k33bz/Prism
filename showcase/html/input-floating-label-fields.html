<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating-Label Fields · Prism</title>
<!-- Prism showcase sample: input-floating-label-fields (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.flt { position: relative; width: 100%; }
.flt input { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 18px 14px 8px; font-size: 13.5px; font-family: inherit; outline: none; transition: 0.2s; }
.flt input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.flt label { position: absolute; left: 14px; top: 14px; color: var(--dim); font-size: 13.5px; pointer-events: none; transition: 0.18s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: left top; }
.flt input:focus + label, .flt input:not(:placeholder-shown) + label { transform: translateY(-9px) scale(0.78); color: var(--accent); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%;display:flex;flex-direction:column;gap:12px">
        <div class="flt"><input type="text" placeholder=" "><label>Stack name</label></div>
        <div class="flt"><input type="text" placeholder=" " value="prod-billing-pipeline"><label>Deployment ID</label></div>
      </div></div></div>
<div class="meta"><b>Floating-Label Fields</b> · <code>input-floating-label-fields</code><br>Input Methods · Text Inputs<p>Material-style fields where the placeholder label animates up and shrinks into the border when focused or filled. Saves vertical space while keeping context visible. Pure CSS using :placeholder-shown.</p></div>

</body>
</html>
