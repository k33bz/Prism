<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Cloud · Prism</title>
<!-- Prism showcase sample: charts-word-cloud (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-pl-svg { width: 100%; max-width: 300px; height: auto; display: block; overflow: hidden; font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-pl-svg text { font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-pl-wc-w { transform-box: fill-box; transform-origin: center center; animation-name: chxPlSettle; animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); animation-iteration-count: infinite; animation-fill-mode: both; animation-delay: calc(var(--i)*.12s); }
.chx-pl-wc-w text { font-weight: 700; }
.chx-pl-wc-pulse { transform-box: fill-box; transform-origin: center center; animation: 1.4s ease-in-out 0s infinite normal none running chxPlPulse; }
@keyframes chxPlSettle { 
  0% { transform: translate(var(--dx),var(--dy)) scale(.4); opacity: 0; }
  30%, 100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
}
@keyframes chxPlPulse { 
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="chx-pl-svg chx-pl-wordcloud" viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="chx-pl-wc-w" style="--i:0;--dx:18.3px;--dy:-5.45px"><text class="chx-pl-wc-pulse" x="150" y="80" text-anchor="middle" fill="var(--ink)" font-size="24">latency</text></g><g class="chx-pl-wc-w" style="--i:1;--dx:0.63px;--dy:-16.42px"><text class="" x="62" y="48" text-anchor="middle" fill="var(--c,var(--accent))" font-size="15">uptime</text></g><g class="chx-pl-wc-w" style="--i:2;--dx:-20.01px;--dy:-3.97px"><text class="" x="232" y="52" text-anchor="middle" fill="var(--info)" font-size="17">Atlas</text></g><g class="chx-pl-wc-w" style="--i:3;--dx:9.89px;--dy:19.98px"><text class="" x="78" y="112" text-anchor="middle" fill="var(--ink)" font-size="13">deploy</text></g><g class="chx-pl-wc-w" style="--i:4;--dx:-5.93px;--dy:-2.82px"><text class="" x="224" y="106" text-anchor="middle" fill="var(--pos)" font-size="12">cache</text></g><g class="chx-pl-wc-w" style="--i:5;--dx:-21.67px;--dy:14.97px"><text class="" x="142" y="30" text-anchor="middle" fill="var(--muted)" font-size="12">queue</text></g><g class="chx-pl-wc-w" style="--i:6;--dx:-18.58px;--dy:-3.45px"><text class="" x="250" y="130" text-anchor="middle" fill="var(--neg)" font-size="14">alerts</text></g><g class="chx-pl-wc-w" style="--i:7;--dx:24.7px;--dy:-15.23px"><text class="" x="84" y="74" text-anchor="middle" fill="var(--crit)" font-size="12">Nova</text></g><g class="chx-pl-wc-w" style="--i:8;--dx:-20.28px;--dy:-3.44px"><text class="" x="138" y="116" text-anchor="middle" fill="var(--muted)" font-size="10">retries</text></g><g class="chx-pl-wc-w" style="--i:9;--dx:-2.76px;--dy:2.05px"><text class="" x="28" y="90" text-anchor="middle" fill="var(--info)" font-size="11" transform="rotate(-90 28 90)">region</text></g><g class="chx-pl-wc-w" style="--i:10;--dx:3.9px;--dy:-12.57px"><text class="" x="285" y="84" text-anchor="middle" fill="var(--muted)" font-size="10" transform="rotate(-90 285 84)">shard</text></g><g class="chx-pl-wc-w" style="--i:11;--dx:-1.77px;--dy:5.64px"><text class="" x="196" y="132" text-anchor="middle" fill="var(--ink)" font-size="10">Pixel</text></g><g class="chx-pl-wc-w" style="--i:12;--dx:-21.27px;--dy:17.22px"><text class="" x="48" y="20" text-anchor="middle" fill="var(--muted)" font-size="9">scale</text></g><g class="chx-pl-wc-w" style="--i:13;--dx:-21.92px;--dy:6.67px"><text class="" x="232" y="20" text-anchor="middle" fill="var(--muted)" font-size="9">edge</text></g></svg></div></div>
<div class="meta"><b>Word Cloud</b> · <code>charts-word-cloud</code><br>Charts &amp; Metrics · CORRELATION, TIME &amp; DISTRIBUTION PLOTS<p>Terms sized by frequency drifting into their slots, the largest one pulsing. Use it as a quick read of what dominates a corpus of tickets, tags or logs.</p></div>

</body>
</html>
