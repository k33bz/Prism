<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Grain · Prism</title>
<!-- Prism showcase sample: objects-film-grain (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.amb-bg-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: var(--panel2); isolation: isolate; }
.amb-bg-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.amb-bg-grain { background: linear-gradient(160deg,var(--panel2),var(--panel)); }
.amb-bg-grain::before, .amb-bg-grain::after { content: ""; position: absolute; inset: -24px; background-image: radial-gradient(rgba(255, 255, 255, 0.22) 0.6px, transparent 1.1px), radial-gradient(rgba(0, 0, 0, 0.4) 0.6px, transparent 1.1px), radial-gradient(rgba(255, 255, 255, 0.16) 0.5px, transparent 1px), radial-gradient(rgba(0, 0, 0, 0.3) 0.5px, transparent 1px); background-size: 5px 5px, 7px 7px, 11px 11px, 13px 13px; background-position: 0px 0px, 3px 2px, 6px 4px, 1px 9px; animation-name: ambBgGrain; animation-duration: 0.5s; animation-timing-function: steps(5); animation-iteration-count: infinite; }
.amb-bg-grain::after { background-size: 9px 9px, 17px 17px, 19px 19px, 23px 23px; background-position: 2px 4px, 5px 1px, 12px 8px, 7px 15px; animation-duration: 0.4s; animation-direction: reverse; }
.amb-bg-grain-vig { position: absolute; inset: 0px; background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.55) 100%); }
.amb-bg-grain-flick { position: absolute; inset: 0px; background: rgba(255, 255, 255, 0.04); animation: 4s steps(1) 0s infinite normal none running ambBgFlick; }
@keyframes ambBgGrain { 
  0% { transform: translate(0px, 0px); }
  20% { transform: translate(-5px, 3px); }
  40% { transform: translate(4px, -6px); }
  60% { transform: translate(-2px, -3px); }
  80% { transform: translate(6px, 5px); }
  100% { transform: translate(0px, 0px); }
}
@keyframes ambBgFlick { 
  0%, 100% { opacity: 0; }
  12% { opacity: 1; }
  14% { opacity: 0; }
  61% { opacity: 1; }
  63% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb-bg-root amb-bg-grain"><i class="amb-bg-grain-vig"></i><i class="amb-bg-grain-flick"></i><span class="amb-bg-tag">Ember · gallery</span></div></div></div>
<div class="meta"><b>Film Grain</b> · <code>objects-film-grain</code><br>Animated Objects · AMBIENT BACKGROUNDS<p>Two speckle layers jitter on stepped timing under a vignette, with an occasional frame flicker. Editorial, photo and cinematic surfaces.</p></div>
