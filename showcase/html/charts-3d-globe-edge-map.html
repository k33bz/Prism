<!DOCTYPE html>
<html lang="en">
<head>

<title>3D Globe / Edge Map · Prism</title>
<!-- Prism showcase sample: charts-3d-globe-edge-map (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="200" height="190" viewBox="0 0 200 190" style="overflow:visible">
        <!-- 3D sphere / globe metric -->
        <defs>
          <radialGradient id="globe3d" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#7fc4ff"></stop><stop offset=".5" stop-color="var(--info)"></stop><stop offset="1" stop-color="#0a2a52"></stop></radialGradient>
        </defs>
        <ellipse cx="100" cy="160" rx="52" ry="11" fill="rgba(0,0,0,.35)"></ellipse>
        <circle cx="100" cy="92" r="62" fill="url(#globe3d)"></circle>
        <!-- latitude / longitude wireframe -->
        <g fill="none" stroke="rgba(255,255,255,.28)" stroke-width=".8">
          <ellipse cx="100" cy="92" rx="62" ry="20"></ellipse><ellipse cx="100" cy="92" rx="62" ry="42"></ellipse>
          <ellipse cx="100" cy="92" rx="20" ry="62"></ellipse><ellipse cx="100" cy="92" rx="42" ry="62"></ellipse>
          <line x1="38" y1="92" x2="162" y2="92"></line>
        </g>
        <!-- live nodes on the surface -->
        <g><circle cx="78" cy="64" r="3.5" fill="var(--accent)"></circle><circle cx="124" cy="80" r="3.5" fill="var(--pos)"></circle><circle cx="108" cy="118" r="3.5" fill="var(--warn)"></circle><circle cx="70" cy="104" r="3.5" fill="var(--crit)"></circle></g>
        <text x="100" y="184" text-anchor="middle" font-size="10" fill="var(--muted)">14 active edge regions</text>
      </svg></div></div>
<div class="meta"><b>3D Globe / Edge Map</b> · <code>charts-3d-globe-edge-map</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Shaded sphere with lat/long wireframe and surface nodes. Conveys global distribution — edge PoPs, regional traffic, or worldwide active users — at a glance.</p></div>

</html>
