<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Root Range Slider · Prism</title>
<!-- Prism showcase sample: spectrums-root-range-slider (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-range { width: 220px; position: relative; padding-top: 6px; }
.solp-rg-track { position: relative; height: 8px; border-radius: 5px; background: var(--solp-cream2); border: 1px solid var(--solp-line); }
.solp-rg-fill { position: absolute; top: 0px; bottom: 0px; left: 0px; border-radius: 5px; background: linear-gradient(90deg,var(--solp-leaf),var(--solp-gold)); }
.solp-range input[type="range"] { position: absolute; top: -6px; left: 0px; width: 100%; height: 20px; appearance: none; background: none; margin: 0px; }
.solp-range input[type="range"]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 0px 60%; background: linear-gradient(135deg,#fff2c4,var(--solp-gold)); border: 2px solid rgb(255, 255, 255); box-shadow: rgba(201, 129, 42, 0.5) 0px 2px 8px; cursor: pointer; }
.solp-rg-read { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--solp-ink); margin-top: 10px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="solp-range">
      <div class="solp-rg-track"><div class="solp-rg-fill" style="width:62%"></div></div>
      <input type="range" value="62" min="0" max="100">
      <div class="solp-rg-read"><span>Shade</span><span>Full sun</span></div>
    </div></div></div>
<div class="meta"><b>Root Range Slider</b> · <code>spectrums-root-range-slider</code><br>Spectrums · Solarpunk · Solarpunk<p>A leaf-to-gold gradient track with a diamond-leaf thumb — for tuning light exposure, watering level, or any organic-feeling range.</p></div>

</body>
</html>
