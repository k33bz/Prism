<title>Histogram + Density Curve · Prism</title>
<!-- Prism showcase sample: charts-histogram-density-curve (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.6s ease-out 0s 1 normal forwards running draw; }
@keyframes draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="240" height="120" viewBox="0 0 240 120">
        <line x1="20" y1="100" x2="228" y2="100" stroke="var(--line)"></line>
        <defs><linearGradient id="scxHist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity=".5"></stop></linearGradient></defs>
        <g class="anim-bars" fill="url(#scxHist)">
          <rect x="24" y="86" width="22" height="14" rx="2"></rect><rect x="48" y="68" width="22" height="32" rx="2"></rect><rect x="72" y="40" width="22" height="60" rx="2"></rect><rect x="96" y="22" width="22" height="78" rx="2"></rect><rect x="120" y="34" width="22" height="66" rx="2"></rect><rect x="144" y="58" width="22" height="42" rx="2"></rect><rect x="168" y="78" width="22" height="22" rx="2"></rect><rect x="192" y="90" width="22" height="10" rx="2"></rect>
        </g>
        <path class="draw" style="--len:300" d="M35,86 Q59,68 83,40 T131,34 Q155,58 179,78 T223,90" fill="none" stroke="var(--info)" stroke-width="2" stroke-linecap="round" opacity=".8"></path>
        <line x1="107" y1="14" x2="107" y2="100" stroke="var(--pos)" stroke-dasharray="3 3"></line><text x="109" y="14" font-size="8" fill="var(--pos)">median</text>
      </svg></div></div>
<div class="meta"><b>Histogram + Density Curve</b> · <code>charts-histogram-density-curve</code><br>Charts &amp; Metrics · Density &amp; Calendar Maps<p>Binned frequency bars with a smoothed density curve overlaid and a median marker. Shows the shape of a distribution — where latency clusters, whether it is skewed, where the long tail lives.</p></div>
