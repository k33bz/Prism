<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Canvas Drift · Prism</title>
<!-- Prism showcase sample: obsidian-infinite-canvas-drift (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-canvas { width: 280px; max-width: 100%; height: 108px; border: 1px solid var(--line); border-radius: 10px; background-color: rgb(12, 16, 27); background-image: radial-gradient(rgba(var(--ob-rgb),.22) .8px,transparent .9px); background-size: 12px 12px; position: relative; overflow: hidden; }
.obs-cardmini { position: absolute; border: 1px solid rgba(var(--ob-rgb),.38); border-radius: 7px; background: linear-gradient(150deg,#171d2d,rgba(var(--ob-rgb),.13)); box-shadow: rgba(0, 0, 0, 0.28) 0px 5px 12px; padding: 7px; color: var(--ink); font-size: 8px; }
.obs-cardmini i { display: block; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); margin-top: 4px; }
.obs-canvas-float .obs-cardmini { width: 94px; height: 55px; left: 92px; top: 26px; animation: 4s ease-in-out 0s infinite normal none running obsCanvasFloat; }
.obs-canvas-float .obs-cardmini::after { content: ""; position: absolute; inset: -5px; border-radius: 10px; border: 1px solid rgba(var(--ob-rgb),.25); animation: 3s ease-out 0s infinite normal none running obsPing; }
.obs-group-aura .obs-cardmini { width: 62px; height: 38px; }
.obs-guides .obs-cardmini { width: 74px; height: 40px; left: 103px; top: 34px; animation: 5s ease-in-out 0s infinite normal none running obsAlignCard; }
.obs-infinite-drift { background-size: 16px 16px; animation: 12s linear 0s infinite normal none running obsGridDrift; }
.obs-infinite-drift .obs-cardmini { width: 72px; height: 42px; animation: 12s linear 0s infinite normal none running obsWorldCard; }
.obs-infinite-drift .d1 { left: 25px; top: 21px; }
.obs-infinite-drift .d2 { left: 155px; top: 60px; animation-delay: -4s; }
.obs-infinite-drift .d3 { left: 230px; top: 8px; animation-delay: -8s; }
@keyframes obsPing { 
  0% { transform: scale(0.6); opacity: 1; }
  80%, 100% { transform: scale(2.1); opacity: 0; }
}
@keyframes obsCanvasFloat { 
  0%, 100% { transform: translateY(2px) rotate(-1deg); }
  50% { transform: translateY(-6px) rotate(1deg); box-shadow: 0 12px 22px rgba(var(--ob-rgb),.2); }
}
@keyframes obsAlignCard { 
  0% { transform: translate(35px, -20px); }
  38%, 72% { transform: translate(0px, 0px); }
  100% { transform: translate(-28px, 20px); }
}
@keyframes obsGridDrift { 
  100% { background-position: 64px 48px; }
}
@keyframes obsWorldCard { 
  0% { transform: translate(-35px, 25px) rotate(-1deg); }
  50% { transform: translate(12px, -8px) rotate(1deg); }
  100% { transform: translate(60px, -40px) rotate(-1deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-canvas obs-infinite-drift"><div class="obs-cardmini d1"><i></i><i></i></div><div class="obs-cardmini d2"><i></i><i></i></div><div class="obs-cardmini d3"><i></i><i></i></div></div></div></div>
<div class="meta"><b>Infinite Canvas Drift</b> · <code>obsidian-infinite-canvas-drift</code><br>Obsidian Facets · CANVAS &amp; SPATIAL NOTES<p>A seamless world grid and its cards drift through a slow infinite pan.</p></div>

</body>
</html>
