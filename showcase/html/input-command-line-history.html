<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Line + History · Prism</title>
<!-- Prism showcase sample: input-command-line-history (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.cmdline { width: 100%; background: rgb(8, 11, 18); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--pos); display: flex; align-items: center; gap: 8px; }
.cmdline .prompt { color: var(--accent); font-weight: 700; user-select: none; }
.cmdline input { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--pos); font: inherit; flex: 1 1 0%; outline: none; caret-color: var(--pos); }
.cmdline input::placeholder { color: var(--dim); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%">
        <div class="cmdline" style="flex-direction:column;align-items:flex-start;gap:4px">
          <div style="display:flex;align-items:center;gap:8px;width:100%"><span class="prompt">~/project $</span><input placeholder="Enter command..." value="" style="width:100%"></div>
          <div style="font-size:11px;color:var(--dim);padding-left:2px;margin-top:4px">
            <div style="color:var(--muted)">↑ aws configure list</div>
            <div style="color:var(--muted)">↑ kubectl get pods -n production</div>
            <div style="color:var(--dim)">↑ docker ps --format "table {{.Names}}\t{{.Status}}"</div>
          </div>
        </div>
      </div></div></div>
<div class="meta"><b>Command Line + History</b> · <code>input-command-line-history</code><br>Input Methods · Search &amp; Command Line<p>CLI with command history shown below. Navigate with ↑↓ arrows.</p></div>

</body>
</html>
