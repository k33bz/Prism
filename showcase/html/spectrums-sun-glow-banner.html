<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun-Glow Banner · Prism</title>
<!-- Prism showcase sample: spectrums-sun-glow-banner (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-sunbanner { position: relative; width: 270px; display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 20px 34px; background: linear-gradient(135deg,#fff6da,var(--solp-cream2)); border: 1px solid rgba(255, 201, 74, 0.5); overflow: hidden; box-shadow: rgba(255, 179, 71, 0.25) 0px 10px 26px; }
.solp-sunbanner::before { content: ""; position: absolute; top: 50%; left: -30px; width: 120px; height: 120px; margin-top: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 201, 74, 0.75), transparent 70%); animation: 3s ease-in-out 0s infinite normal none running solpRayPulse; pointer-events: none; }
.solp-sun-ico { position: relative; z-index: 1; width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff9e6,var(--solp-gold) 55%,var(--solp-golddeep)); box-shadow: rgba(255, 201, 74, 0.7) 0px 0px 20px; }
.solp-sb-body { position: relative; z-index: 1; }
.solp-sb-title { font-weight: 800; font-size: 13.5px; color: rgb(90, 58, 16); }
.solp-sb-sub { font-size: 11.5px; color: rgb(138, 106, 46); margin-top: 2px; }
@keyframes solpRayPulse { 
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="solp-sunbanner">
      <div class="solp-sun-ico"></div>
      <div class="solp-sb-body"><div class="solp-sb-title">Peak solar output</div><div class="solp-sb-sub">Panels running at 118% today.</div></div>
    </div></div></div>
<div class="meta"><b>Sun-Glow Banner</b> · <code>spectrums-sun-glow-banner</code><br>Spectrums · Solarpunk · Solarpunk<p>The signature Solarpunk banner — a warm cream card with a breathing sun disc and a soft radiating glow behind it. Use for good-news, high-output status.</p></div>

</body>
</html>
