<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Globe (regions) · Prism</title>
<!-- Prism showcase sample: charts-3d-globe-regions (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.spin3d { transform-box: view-box; transform-origin: center center; animation: 18s linear 0s infinite normal none running spin3dRot; }
@keyframes spin3dRot { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="180" height="180" viewBox="0 0 180 180" class="spin3d">
        <defs><radialGradient id="globe-g" cx=".35" cy=".3"><stop offset="0" stop-color="#1b4a7a"></stop><stop offset="1" stop-color="#06101e"></stop></radialGradient></defs>
        <circle cx="90" cy="90" r="70" fill="url(#globe-g)" stroke="var(--info)" stroke-width="1" opacity=".95"></circle>
        <!-- lat/long graticule -->
        <g fill="none" stroke="rgba(68,147,248,.45)" stroke-width="1">
          <ellipse cx="90" cy="90" rx="70" ry="24"></ellipse><ellipse cx="90" cy="90" rx="70" ry="48"></ellipse>
          <ellipse cx="90" cy="90" rx="24" ry="70"></ellipse><ellipse cx="90" cy="90" rx="48" ry="70"></ellipse>
          <line x1="20" y1="90" x2="160" y2="90"></line>
        </g>
        <!-- region nodes -->
        <circle cx="64" cy="62" r="4" fill="var(--pos)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"></animate></circle>
        <circle cx="118" cy="76" r="4" fill="var(--accent)"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"></animate></circle>
        <circle cx="96" cy="120" r="4" fill="var(--neg)"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"></animate></circle>
      </svg></div></div>
<div class="meta"><b>3D Globe (regions)</b> · <code>charts-3d-globe-regions</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>A shaded sphere with a lat/long graticule and pulsing region nodes — green/amber/red by health. The wireframe slowly rotates. The go-to for &quot;traffic / status by geography&quot; across a global footprint.</p></div>

</body>
</html>
