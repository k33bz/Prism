<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latency Heat Links · Prism</title>
<!-- Prism showcase sample: arch-latency-heat-links (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-cir { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-nm { fill: var(--ink); font-size: 6.5px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-cap { fill: var(--muted); font-size: 6px; font-family: ui-monospace, Menlo, monospace; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetFlow; animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
.arch-net-r1 { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetR1; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.arch-net-r2 { fill: none; stroke: var(--pos); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetR2; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.arch-net-hot { stroke: var(--neg); stroke-width: 1.6; stroke-linecap: round; animation-name: archNetHot; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
@keyframes archNetFlow { 
  100% { stroke-dashoffset: -15; }
}
@keyframes archNetR1 { 
  0% { stroke-dashoffset: 0; opacity: 1; }
  42% { stroke-dashoffset: -45; opacity: 1; }
  48% { opacity: 0; }
  100% { stroke-dashoffset: -45; opacity: 0; }
}
@keyframes archNetR2 { 
  0% { stroke-dashoffset: 0; opacity: 0; }
  48% { opacity: 0; }
  55% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: -45; opacity: 1; }
}
@keyframes archNetHot { 
  0%, 38% { opacity: 0; }
  50%, 92% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-net-svg arch-net-heat" viewBox="0 0 300 150" style="--c:var(--warn);--cr:var(--warn-rgb)" role="img" aria-label="Latency heat links with reroute">
      <path class="arch-net-wire" style="stroke:rgba(var(--pos-rgb),.85)" d="M40 40 150 75M40 110 150 75"></path>
      <path class="arch-net-wire" style="stroke:rgba(var(--pos-rgb),.85)" d="M150 75 262 110"></path>
      <path class="arch-net-wire" style="stroke:rgba(var(--warn-rgb),.85)" d="M150 75 262 40"></path>
      <path class="arch-net-flow" style="--fd:0s;--c:var(--pos)" d="M40 40 150 75"></path>
      <path class="arch-net-r1" style="--c:var(--warn)" d="M150 75 262 40"></path>
      <path class="arch-net-hot" d="M150 75 262 40"></path>
      <path class="arch-net-r2" d="M150 75 262 110"></path>
      <g style="--cr:var(--pos-rgb)"><circle class="arch-net-cir" cx="40" cy="40" r="7"></circle><circle class="arch-net-cir" cx="40" cy="110" r="7"></circle></g>
      <g style="--cr:var(--info-rgb)"><circle class="arch-net-cir" cx="150" cy="75" r="8"></circle></g>
      <g style="--cr:var(--warn-rgb)"><circle class="arch-net-cir" cx="262" cy="40" r="7"></circle></g>
      <g style="--cr:var(--pos-rgb)"><circle class="arch-net-cir" cx="262" cy="110" r="7"></circle></g>
      <text class="arch-net-nm" x="150" y="77.5">R</text>
      <text class="arch-net-cap" x="88" y="52" style="fill:var(--pos)">8ms</text>
      <text class="arch-net-cap" x="205" y="50" style="fill:var(--neg)">40ms hot</text>
      <text class="arch-net-cap" x="200" y="98" style="fill:var(--pos)">reroute</text>
    </svg></div></div>
<div class="meta"><b>Latency Heat Links</b> · <code>arch-latency-heat-links</code><br>Architecture Diagrams · NETWORK FLOW MAPS<p>Edges coloured by latency, with one link heating to red and traffic rerouting to a faster path. Use for SLA and latency aware routing visuals.</p></div>

</body>
</html>
