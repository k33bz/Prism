<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Tumble · Prism</title>
<!-- Prism showcase sample: lab-cube-tumble (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nlab2-scene { perspective: 600px; display: flex; align-items: center; justify-content: center; }
.nlab2-cube { position: relative; width: 60px; height: 60px; transform-style: preserve-3d; }
.nlab2-cube .fc { position: absolute; width: 60px; height: 60px; border: 1px solid rgba(var(--info-rgb),.65); background: rgba(var(--info-rgb),.16); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: var(--info); }
.nlab2-cube .c-fr { transform: translateZ(30px); }
.nlab2-cube .c-bk { transform: rotateY(180deg) translateZ(30px); }
.nlab2-cube .c-rt { transform: rotateY(90deg) translateZ(30px); }
.nlab2-cube .c-lt { transform: rotateY(-90deg) translateZ(30px); }
.nlab2-cube .c-tp { transform: rotateX(90deg) translateZ(30px); }
.nlab2-cube .c-bm { transform: rotateX(-90deg) translateZ(30px); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nlab2-scene"><div class="nlab2-cube" style="animation:nlab2CubeTumble 4s linear infinite"><div class="fc c-fr">1</div><div class="fc c-bk">2</div><div class="fc c-rt">3</div><div class="fc c-lt">4</div><div class="fc c-tp">5</div><div class="fc c-bm">6</div></div></div></div></div>
<div class="meta"><b>Cube Tumble</b> · <code>lab-cube-tumble</code><br>Animation Lab · 3D Motion &amp; Perspective<p>A real 6-face preserve-3d cube rotating on both X and Y axes for an endless tumbling loop.</p></div>

</body>
</html>
