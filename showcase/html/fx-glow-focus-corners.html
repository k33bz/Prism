<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Focus Corners · Prism</title>
<!-- Prism showcase sample: fx-glow-focus-corners (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-warn { --c: var(--warn); --c-rgb: 224,165,43; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-corners { position: relative; max-width: 280px; height: 120px; display: grid; place-items: center; }
.fx-gl-corners-target { padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); animation: 2s ease-in-out 0s infinite normal none running fxGlCornersTarget; }
.fx-gl-corners-frame { position: absolute; inset: 22px 60px; animation: 2s ease-in-out 0s infinite normal none running fxGlCorners; }
.fx-gl-corner { position: absolute; width: 16px; height: 16px; border: 0 solid rgba(var(--fx-gl-rgb),1); filter: drop-shadow(0 0 4px rgba(var(--fx-gl-rgb),.9)) drop-shadow(0 0 10px rgba(var(--fx-gl-rgb),.5)); }
.fx-gl-corner-tl { top: 0px; left: 0px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
.fx-gl-corner-tr { top: 0px; right: 0px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
.fx-gl-corner-bl { bottom: 0px; left: 0px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
.fx-gl-corner-br { bottom: 0px; right: 0px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }
@keyframes fxGlCorners { 
  0%, 100% { transform: scale(1.25); opacity: 0.5; }
  50% { transform: scale(1); opacity: 1; }
}
@keyframes fxGlCornersTarget { 
  0%, 100% { border-color: var(--line); text-shadow: 0 0 0 rgba(var(--fx-gl-rgb),0); box-shadow: 0 0 0 rgba(var(--fx-gl-rgb),0); }
  50% { border-color: rgba(var(--fx-gl-rgb),.6); text-shadow: 0 0 10px rgba(var(--fx-gl-rgb),.7); box-shadow: 0 0 14px rgba(var(--fx-gl-rgb),.35); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-corners c-warn"><div class="fx-gl-corners-target">Pixel</div><div class="fx-gl-corners-frame"><span class="fx-gl-corner fx-gl-corner-tl"></span><span class="fx-gl-corner fx-gl-corner-tr"></span><span class="fx-gl-corner fx-gl-corner-bl"></span><span class="fx-gl-corner fx-gl-corner-br"></span></div></div></div></div>
<div class="meta"><b>Glow Focus Corners</b> · <code>fx-glow-focus-corners</code><br>FX Store · GLOW SYSTEM<p>Four glowing brackets contract onto the target and relax again, like a viewfinder locking on. Use to point out the element a tour step is about.</p></div>
