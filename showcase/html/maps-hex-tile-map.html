<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex-Tile Map · Prism</title>
<!-- Prism showcase sample: maps-hex-tile-map (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-hex { display: grid; grid-template-columns: repeat(9, 20px); gap: 2px; width: 200px; transform: rotate(-2deg); }
.gmap-hex .hx { width: 20px; height: 22px; clip-path: polygon(50% 0px, 100% 25%, 100% 75%, 50% 100%, 0px 75%, 0px 25%); background: rgba(var(--info-rgb),.07); margin-top: 0px; }
.gmap-hex .r1 { margin-top: 11px; }
.gmap-hex .hx.on { background: rgba(var(--info-rgb),.4); }
.gmap-hex .hx.on2 { background: rgba(var(--accent-rgb),.5); }
.gmap-hex .hx.hot { background: var(--accent); animation: 2.2s ease-in-out 0s infinite normal none running gmapHexGlow; }
.gmap-sel .rg.hot { fill: rgba(var(--accent-rgb),.55); stroke: var(--accent); stroke-width: 2; animation: 2.4s ease-in-out 0s infinite normal none running gmapSelGlow; }
.gmap-radar .r1 { width: 38%; height: 38%; }
.gmap-flow-line.hot { stroke: rgba(var(--neg-rgb),.3); }
@keyframes gmapHexGlow { 
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.6); }
}
@keyframes gmapSelGlow { 
  0%, 100% { filter: drop-shadow(0 0 3px rgba(var(--accent-rgb),.6)); }
  50% { filter: drop-shadow(0 0 10px rgba(var(--accent-rgb),1)); }
}
.bar button.on { color: rgb(255, 255, 255) !important; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-hex">
      <div class="hx"></div><div class="hx on"></div><div class="hx on2"></div><div class="hx"></div><div class="hx on"></div><div class="hx hot"></div><div class="hx"></div><div class="hx on"></div><div class="hx"></div>
      <div class="hx r1 on"></div><div class="hx r1 on2"></div><div class="hx r1 hot"></div><div class="hx r1 on"></div><div class="hx r1"></div><div class="hx r1 on"></div><div class="hx r1 on2"></div><div class="hx r1"></div><div class="hx r1 on"></div>
      <div class="hx on"></div><div class="hx"></div><div class="hx on"></div><div class="hx on2"></div><div class="hx on"></div><div class="hx"></div><div class="hx hot"></div><div class="hx on"></div><div class="hx"></div>
      <div class="hx r1"></div><div class="hx r1 on"></div><div class="hx r1 on"></div><div class="hx r1"></div><div class="hx r1 on2"></div><div class="hx r1 on"></div><div class="hx r1"></div><div class="hx r1 on"></div><div class="hx r1 on2"></div>
    </div></div></div>
<div class="meta"><b>Hex-Tile Map</b> · <code>maps-hex-tile-map</code><br>Maps &amp; Geo · WORLD &amp; REGION MAPS<p>A hexagonal tile grid with lit regions — the classic hex-bin territory map.</p></div>

</body>
</html>
