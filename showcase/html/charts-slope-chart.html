<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slope Chart · Prism</title>
<!-- Prism showcase sample: charts-slope-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.scx-slope-dot { r: 4; }
.scx-slope-line { stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.3s ease-out 0s 1 normal forwards running scx-dash; }
@keyframes scx-dash { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="220" height="150" viewBox="0 0 220 150" style="overflow:visible">
        <text x="40" y="14" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">Q1</text>
        <text x="180" y="14" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">Q2</text>
        <line x1="40" y1="22" x2="40" y2="138" stroke="var(--line)"></line><line x1="180" y1="22" x2="180" y2="138" stroke="var(--line)"></line>
        <g stroke-linecap="round">
          <path class="scx-slope-line" style="--len:150;stroke:var(--accent)" d="M40,40 L180,28"></path>
          <path class="scx-slope-line" style="--len:150;stroke:var(--info);animation-delay:.15s" d="M40,72 L180,96"></path>
          <path class="scx-slope-line" style="--len:150;stroke:var(--pos);animation-delay:.3s" d="M40,104 L180,60"></path>
        </g>
        <g><circle class="scx-slope-dot" cx="40" cy="40" fill="var(--accent)"></circle><circle class="scx-slope-dot" cx="180" cy="28" fill="var(--accent)"></circle><circle class="scx-slope-dot" cx="40" cy="72" fill="var(--info)"></circle><circle class="scx-slope-dot" cx="180" cy="96" fill="var(--info)"></circle><circle class="scx-slope-dot" cx="40" cy="104" fill="var(--pos)"></circle><circle class="scx-slope-dot" cx="180" cy="60" fill="var(--pos)"></circle></g>
        <g font-size="9" fill="var(--muted)" text-anchor="end"><text x="34" y="43">EC2</text><text x="34" y="75">RDS</text><text x="34" y="107">S3</text></g>
        <g font-size="9" font-weight="700" text-anchor="start"><text x="186" y="31" fill="var(--accent)">+18%</text><text x="186" y="99" fill="var(--info)">−9%</text><text x="186" y="63" fill="var(--pos)">+27%</text></g>
      </svg></div></div>
<div class="meta"><b>Slope Chart</b> · <code>charts-slope-chart</code><br>Charts &amp; Metrics · Comparison &amp; Distribution<p>Two time points joined by lines — the slope instantly shows who rose and who fell between periods. Cuts through the clutter of grouped bars when you only care about the change. Lines draw in from the left.</p></div>

</body>
</html>
