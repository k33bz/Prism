<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Carousel · Prism</title>
<!-- Prism showcase sample: shapes-word-carousel (gallery: shapes). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-warn { --c: var(--warn); --c-rgb: 224,165,43; }
.nsh2-carousel { width: 210px; height: 100px; perspective: 760px; }
.nsh2-carousel .nsh2-car-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: 16s linear 0s infinite normal none running nsh2CarSpin; }
.nsh2-carousel .nsh2-car-panel { position: absolute; left: 50%; top: 50%; width: 120px; height: 50px; margin: -25px 0px 0px -60px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--c); border-radius: 9px; background: rgba(var(--c-rgb),.13); color: var(--c); font-weight: 800; font-size: 14px; text-shadow: 0 0 7px rgba(var(--c-rgb),.5); }
@keyframes nsh2CarSpin { 
  100% { transform: rotateY(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nsh2-carousel c-warn" data-words="LAUNCH SCALE SHIP GROW WIN NEXT" data-nsh2="1"><div class="nsh2-car-in"><div class="nsh2-car-panel" style="transform: rotateY(0deg) translateZ(164px);">LAUNCH</div><div class="nsh2-car-panel" style="transform: rotateY(60deg) translateZ(164px);">SCALE</div><div class="nsh2-car-panel" style="transform: rotateY(120deg) translateZ(164px);">SHIP</div><div class="nsh2-car-panel" style="transform: rotateY(180deg) translateZ(164px);">GROW</div><div class="nsh2-car-panel" style="transform: rotateY(240deg) translateZ(164px);">WIN</div><div class="nsh2-car-panel" style="transform: rotateY(300deg) translateZ(164px);">NEXT</div></div></div></div></div>
<div class="meta"><b>Word Carousel</b> · <code>shapes-word-carousel</code><br>Text Shapes · 3D Tunnels &amp; Perspective<p>Word panels arranged evenly around a vertical axis with rotateY + translateZ, revolving toward and away from you. A classic 3D carousel where each card is a word.</p></div>

</body>
</html>
