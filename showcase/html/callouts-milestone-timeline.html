<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Timeline · Prism</title>
<!-- Prism showcase sample: callouts-milestone-timeline (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-mile { display: flex; justify-content: space-between; width: 238px; position: relative; }
.ann-mile::before { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 2px; background: linear-gradient(90deg,var(--ann-p),var(--ann-i)); }
.ann-mile .ann-mi { position: relative; text-align: center; flex: 1 1 0%; }
.ann-mile .ann-md { width: 13px; height: 13px; margin: 0px auto 6px; border-radius: 50%; background: var(--card,#0c0f18); border: 2px solid var(--ann-i); transform: rotate(45deg); }
.ann-mile .ann-mi.hit .ann-md { background: var(--ann-p); border-color: var(--ann-p); box-shadow: 0 0 9px -1px rgba(var(--ann-p-rgb),.9); }
.ann-mile .ann-ml { font-size: 9px; font-weight: 700; color: var(--ink); }
.ann-mile .ann-mv { font-size: 8.5px; color: var(--dim); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-mile">
      <div class="ann-mi hit"><div class="ann-md"></div><div class="ann-ml">Alpha</div><div class="ann-mv">Q1</div></div>
      <div class="ann-mi hit"><div class="ann-md"></div><div class="ann-ml">Beta</div><div class="ann-mv">Q2</div></div>
      <div class="ann-mi"><div class="ann-md"></div><div class="ann-ml">GA</div><div class="ann-mv">Q3</div></div>
    </div></div></div>
<div class="meta"><b>Milestone Timeline</b> · <code>callouts-milestone-timeline</code><br>Callouts &amp; Annotations · TIMELINES &amp; STEPPERS<p>Horizontal diamonds marking reached vs upcoming milestones on a roadmap.</p></div>

</body>
</html>
