<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voronoi Treemap · Prism</title>
<!-- Prism showcase sample: charts-voronoi-treemap (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-tm-svg { width: 100%; max-width: 300px; height: auto; display: block; font-family: ui-sans-serif, system-ui, sans-serif; }
.chx-tm-lb { fill: var(--ink); font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-tm-fa { fill: rgba(var(--accent-rgb),.6); }
.chx-tm-fi { fill: rgba(var(--info-rgb),.58); }
.chx-tm-fp { fill: rgba(var(--pos-rgb),.55); }
.chx-tm-fw { fill: rgba(var(--warn-rgb),.55); }
.chx-tm-fc { fill: rgba(var(--crit-rgb),.55); }
.chx-tm-voro polygon { stroke: var(--bg); stroke-width: 1.4; animation: 0.6s ease 0s 1 normal both running chxTmVoroIn; }
.chx-tm-voro .chx-tm-hl { animation-name: chxTmVoroWalk; animation-duration: 3.6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes chxTmVoroIn { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes chxTmVoroWalk { 
  0%, 100% { opacity: 0.55; }
  45%, 55% { opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="chx-tm-svg chx-tm-voro" viewBox="0 0 300 150">
      <polygon class="chx-tm-fi chx-tm-hl" style="--d:0s" points="0,0 120,0 96,74 0,96"></polygon>
      <polygon class="chx-tm-fa chx-tm-hl" style="--d:.5s" points="120,0 300,0 300,60 190,70 96,74"></polygon>
      <polygon class="chx-tm-fp chx-tm-hl" style="--d:1s" points="0,96 96,74 118,150 0,150"></polygon>
      <polygon class="chx-tm-fw chx-tm-hl" style="--d:1.5s" points="96,74 190,70 176,150 118,150"></polygon>
      <polygon class="chx-tm-fc chx-tm-hl" style="--d:2s" points="190,70 300,60 300,150 176,150"></polygon>
      <text class="chx-tm-lb" x="34" y="46">Atlas</text>
      <text class="chx-tm-lb" x="196" y="34">Comet</text>
      <text class="chx-tm-lb" x="40" y="124">Ember</text>
      <text class="chx-tm-lb" x="128" y="120">Nova</text>
      <text class="chx-tm-lb" x="224" y="116">Orbit</text>
    </svg></div></div>
<div class="meta"><b>Voronoi Treemap</b> · <code>charts-voronoi-treemap</code><br>Charts &amp; Metrics · TREEMAPS &amp; HIERARCHIES<p>Polygonal cells partition the frame by area, fade in, and a highlight walks between them. Use it for organic part to whole.</p></div>

</body>
</html>
