<!DOCTYPE html>

<title>3D Cylinder Bars · Prism</title>
<!-- Prism showcase sample: charts-3d-cylinder-bars-2 (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.bar3d { position: absolute; bottom: 0px; width: 28px; transform-style: preserve-3d; animation: 1s cubic-bezier(0.22, 1, 0.36, 1) 0s 1 normal forwards running rise3d; }
.bar3d .face-front { position: absolute; bottom: 0px; left: 0px; width: 28px; background: var(--accent); transform-origin: center bottom; }
.bar3d .face-top { position: absolute; left: 0px; width: 28px; height: 14px; background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.1)); transform: rotateX(90deg); transform-origin: center top; }
.bar3d .face-right { position: absolute; right: -14px; bottom: 0px; width: 14px; background: rgba(0, 0, 0, 0.25); transform: skewY(-45deg); transform-origin: left bottom; }
@keyframes rise3d { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="240" height="190" viewBox="0 0 240 190" style="overflow:visible">
        <defs>
          <linearGradient id="cyl-a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)" stop-opacity=".5"></stop><stop offset=".5" stop-color="var(--accent)"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity=".5"></stop></linearGradient>
          <linearGradient id="cyl-i" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--info)" stop-opacity=".5"></stop><stop offset=".5" stop-color="var(--info)"></stop><stop offset="1" stop-color="var(--info)" stop-opacity=".5"></stop></linearGradient>
          <linearGradient id="cyl-p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--pos)" stop-opacity=".5"></stop><stop offset=".5" stop-color="var(--pos)"></stop><stop offset="1" stop-color="var(--pos)" stop-opacity=".5"></stop></linearGradient>
        </defs>
        <g stroke="var(--line)" stroke-width=".5" opacity=".4"><line x1="30" y1="160" x2="220" y2="160"></line></g>
        <!-- three cylinders: body rect + bottom ellipse + lit top ellipse -->
        <g class="bar3d" style="animation:rise3d 1s cubic-bezier(.22,1,.36,1) forwards;transform-origin:bottom">
          <ellipse cx="65" cy="160" rx="22" ry="7" fill="url(#cyl-a)" opacity=".6"></ellipse>
          <rect x="43" y="95" width="44" height="65" fill="url(#cyl-a)"></rect>
          <ellipse cx="65" cy="95" rx="22" ry="7" fill="var(--accent)"></ellipse>
          <text x="65" y="178" text-anchor="middle" font-size="9" fill="var(--muted)">EC2</text>
        </g>
        <g class="bar3d" style="animation:rise3d 1s cubic-bezier(.22,1,.36,1) .12s backwards;transform-origin:bottom">
          <ellipse cx="125" cy="160" rx="22" ry="7" fill="url(#cyl-i)" opacity=".6"></ellipse>
          <rect x="103" y="70" width="44" height="90" fill="url(#cyl-i)"></rect>
          <ellipse cx="125" cy="70" rx="22" ry="7" fill="var(--info)"></ellipse>
          <text x="125" y="178" text-anchor="middle" font-size="9" fill="var(--muted)">S3</text>
        </g>
        <g class="bar3d" style="animation:rise3d 1s cubic-bezier(.22,1,.36,1) .24s backwards;transform-origin:bottom">
          <ellipse cx="185" cy="160" rx="22" ry="7" fill="url(#cyl-p)" opacity=".6"></ellipse>
          <rect x="163" y="115" width="44" height="45" fill="url(#cyl-p)"></rect>
          <ellipse cx="185" cy="115" rx="22" ry="7" fill="var(--pos)"></ellipse>
          <text x="185" y="178" text-anchor="middle" font-size="9" fill="var(--muted)">RDS</text>
        </g>
      </svg></div></div>
<div class="meta"><b>3D Cylinder Bars</b> · <code>charts-3d-cylinder-bars-2</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Rounded columns built from a body rectangle capped by a lit top ellipse and a soft base shadow — the spreadsheet-classic &quot;3-D cylinder&quot; chart. Bars rise on load. Great for a small set of named totals.</p></div>
