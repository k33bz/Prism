<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wide Hourglass · Prism</title>
<!-- Prism showcase sample: objects-wide-hourglass (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obj-sand-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,var(--panel2),var(--panel)); display: grid; place-items: center; isolation: isolate; }
.obj-sand-tag { position: absolute; left: 12px; bottom: 9px; z-index: 8; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obj-sand-wide { position: relative; width: 104px; height: 112px; }
.obj-sand-wide-b { position: absolute; left: 4px; right: 4px; height: 50px; overflow: hidden; border: 1.5px solid var(--muted); }
.obj-sand-wide-b.obj-sand-wide-t { top: 0px; border-radius: 44px 44px 8px 8px; border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; }
.obj-sand-wide-b.obj-sand-wide-bt { bottom: 0px; border-radius: 8px 8px 44px 44px; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; }
.obj-sand-wide-ts { position: absolute; left: 0px; right: 0px; top: 0px; height: 100%; background: radial-gradient(120% 90% at 50% 0,rgba(var(--warn-rgb),.95),var(--warn)); transform-origin: center top; animation: 4s ease-in-out 0s infinite normal none running objSandWideT; }
.obj-sand-wide-bs { position: absolute; left: 0px; right: 0px; bottom: 0px; height: 100%; background: radial-gradient(120% 120% at 50% 100%,var(--warn),rgba(var(--warn-rgb),.75)); clip-path: polygon(50% 30%, 100% 100%, 0px 100%); transform: scaleY(0); transform-origin: center bottom; animation: 4s ease-in-out 0s infinite normal none running objSandWideB; }
.obj-sand-wide-neck { position: absolute; left: 50%; top: 52px; width: 2px; height: 12px; margin-left: -1px; background: var(--warn); animation: 4s linear 0s infinite normal none running objSandClsStream; }
@keyframes objSandClsStream { 
  0%, 88% { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@keyframes objSandWideT { 
  0% { transform: scaleY(1); }
  88%, 100% { transform: scaleY(0.05); }
}
@keyframes objSandWideB { 
  0% { transform: scaleY(0.05); }
  88%, 100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obj-sand-root"><div class="obj-sand-wide"><span class="obj-sand-wide-b obj-sand-wide-t"><span class="obj-sand-wide-ts"></span></span><span class="obj-sand-wide-neck"></span><span class="obj-sand-wide-b obj-sand-wide-bt"><span class="obj-sand-wide-bs"></span></span></div><span class="obj-sand-tag">Comet · wait</span></div></div></div>
<div class="meta"><b>Wide Hourglass</b> · <code>objects-wide-hourglass</code><br>Animated Objects · HOURGLASS &amp; SAND<p>A squat hourglass with rounded bulbs drains top to bottom on a gentle loop. A softer, friendlier timer for empty and waiting states.</p></div>

</body>
</html>
