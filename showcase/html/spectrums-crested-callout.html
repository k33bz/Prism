<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crested Callout · Prism</title>
<!-- Prism showcase sample: spectrums-crested-callout (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.deco-menu, .deco-dd, .deco-tabs, .deco-ctx, .deco-btn, .deco-iconbtn, .deco-toggle, .deco-toast, .deco-banner, .deco-snack, .deco-callout, .deco-quote, .deco-chart, .deco-gauge, .deco-kpi, .deco-spark, .deco-field, .deco-select, .deco-check, .deco-range, .deco-headline, .deco-eyebrow, .deco-dropcap, .deco-monogram, .deco-sunburst, .deco-ziggurat, .deco-frame, .deco-fandivider { box-sizing: border-box; font-family: Georgia, "Times New Roman", serif; }
.deco-callout { position: relative; width: 240px; padding: 18px 18px 16px; background: linear-gradient(160deg,var(--deco-emerald),var(--deco-emerald-deep)); border: 1px solid var(--deco-line); }
.deco-callout::before, .deco-callout::after { content: ""; position: absolute; width: 11px; height: 11px; border: 1px solid var(--deco-gold); opacity: 0.85; }
.deco-callout::before { top: 5px; left: 5px; border-right-width: medium; border-right-style: none; border-right-color: currentcolor; border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; }
.deco-callout::after { bottom: 5px; right: 5px; border-left-width: medium; border-left-style: none; border-left-color: currentcolor; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; }
.deco-callout-crest { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; color: var(--deco-gold-hi); font-size: 13px; border: 1px solid var(--deco-line); transform: rotate(45deg); }
.deco-callout-crest > * { display: inline-block; transform: rotate(-45deg); }
.deco-callout-title { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--deco-gold-hi); margin-bottom: 6px; }
.deco-callout-body { font-size: 12.5px; color: var(--deco-muted); line-height: 1.55; }
.deco-callout-warn .deco-callout-crest { color: var(--deco-warn); border-color: rgba(207, 143, 63, 0.5); }
.deco-callout-warn .deco-callout-title { color: var(--deco-warn); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="deco-callout">
      <div class="deco-callout-crest"><span>✦</span></div>
      <div class="deco-callout-title">House Rule</div>
      <div class="deco-callout-body">Black tie preferred after 7&nbsp;PM in the Grand Salon.</div>
    </div></div></div>
<div class="meta"><b>Crested Callout</b> · <code>spectrums-crested-callout</code><br>Spectrums · Art Deco · Art Deco<p>An admonition block framed with symmetric gold corner brackets and a small sunburst crest — for a formal aside or house rule.</p></div>

</body>
</html>
