<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Schedule Grid · Prism</title>
<!-- Prism showcase sample: tables-weekly-schedule-grid (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-sched { display: grid; grid-template-columns: 34px repeat(5, 1fr); grid-auto-rows: 20px; gap: 2px; width: 100%; max-width: 290px; font: 600 8.5px ui-sans-serif, system-ui, sans-serif; color: var(--dim); }
.dtb-sched b { font-weight: 700; text-align: center; line-height: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
.dtb-sched span { text-align: right; padding-right: 4px; line-height: 20px; font-family: ui-monospace, Menlo, monospace; }
.dtb-sched i { display: block; border-radius: 3px; background: rgba(255, 255, 255, 0.035); }
.dtb-sched i.ev { background: rgba(var(--c-rgb,var(--info-rgb)),.35); box-shadow: inset 0 0 0 1px rgba(var(--c-rgb,var(--info-rgb)),.5); }
.dtb-sched i.now { animation: 1.6s ease-in-out 0s infinite normal none running dtbSlot; }
.dtb-cal-g i.ev::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--c,var(--info)); }
@keyframes dtbSlot { 
  0%, 100% { box-shadow: inset 0 0 0 1px var(--accent),0 0 0 rgba(var(--accent-rgb),0); }
  50% { box-shadow: inset 0 0 0 2px var(--accent),0 0 10px rgba(var(--accent-rgb),.6); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="dtb-sched">
      <span></span><b>Mon</b><b>Tue</b><b>Wed</b><b>Thu</b><b>Fri</b>
      <span>09</span><i class="ev"></i><i></i><i class="ev" style="--c-rgb:var(--pos-rgb)"></i><i></i><i class="ev"></i>
      <span>11</span><i></i><i class="ev now" style="--c-rgb:var(--accent-rgb)"></i><i></i><i class="ev" style="--c-rgb:var(--crit-rgb)"></i><i></i>
      <span>14</span><i class="ev" style="--c-rgb:var(--pos-rgb)"></i><i></i><i></i><i class="ev"></i><i class="ev" style="--c-rgb:var(--warn-rgb)"></i>
      <span>16</span><i></i><i class="ev"></i><i class="ev" style="--c-rgb:var(--crit-rgb)"></i><i></i><i></i>
    </div></div></div>
<div class="meta"><b>Weekly Schedule Grid</b> · <code>tables-weekly-schedule-grid</code><br>Tables &amp; Data Layouts · GRIDS &amp; SCHEDULES<p>Hours down, weekdays across, colour-blocked slots and the current slot pulsing in the accent — rotas, room bookings, on-call.</p></div>

</body>
</html>
