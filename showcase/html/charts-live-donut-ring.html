<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Donut Ring · Prism</title>
<!-- Prism showcase sample: charts-live-donut-ring (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lv-donut { position: relative; width: 104px; height: 104px; }
.lv-donut svg { transform: rotate(-90deg); }
.lv-donut .ring-bg { fill: none; stroke: var(--panel2); stroke-width: 11; }
.lv-donut .ring-fg { fill: none; stroke: var(--accent); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 1, 0.4, 1), stroke 0.4s; }
.lv-donut .ctr { position: absolute; inset: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lv-donut .ctr b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.lv-donut .ctr s { font-size: 9px; color: var(--muted); text-decoration: none; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lv-donut" id="lvDonut">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle class="ring-bg" cx="52" cy="52" r="44"></circle>
          <circle class="ring-fg" id="lvDonutFg" cx="52" cy="52" r="44" stroke-dasharray="276.5" stroke-dashoffset="11.1" style="stroke: var(--warn);"></circle>
        </svg>
        <div class="ctr"><b id="lvDonutVal">96.0%</b><s>success</s></div>
      </div></div></div>
<div class="meta"><b>Live Donut Ring</b> · <code>charts-live-donut-ring</code><br>Charts &amp; Metrics · Live &amp; Animated<p>A single-value ring that animates its arc and recolors on each update — success rate, SLO budget, capacity used. The center number rolls in sync with the sweep.</p></div>

</body>
</html>
