<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkbar Rows · Prism</title>
<!-- Prism showcase sample: charts-sparkbar-rows (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nch-gantt .row { height: 12px; background: var(--panel2); border-radius: 6px; position: relative; overflow: hidden; }
.nch-gantt .row i { position: absolute; top: 0px; height: 100%; border-radius: 6px; background: linear-gradient(90deg,var(--info),rgba(var(--info-rgb),.4)); transform-origin: left center; animation: 1s ease-out 0s 1 normal both running nchGanttW; }
.nch-dumbbell .row { position: relative; height: 12px; }
.nch-sparkbar { display: flex; flex-direction: column; gap: 8px; width: 220px; }
.nch-sparkbar .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.nch-sparkbar .mini { display: flex; align-items: flex-end; gap: 2px; height: 22px; flex: 1 1 0%; }
.nch-sparkbar .mini i { flex: 1 1 0%; border-radius: 1px; background: var(--c,var(--accent)); transform-origin: center bottom; animation: 0.7s ease-out 0s 1 normal both running nchGrow; }
@keyframes nchGrow { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
@keyframes nchGanttW { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
.n3d-cards .card .mini { display: flex; align-items: flex-end; gap: 3px; height: 24px; margin-top: 8px; }
.n3d-cards .card .mini i { flex: 1 1 0%; border-radius: 2px; background: var(--c,var(--info)); opacity: 0.8; }
.ncx2-bullet .row { position: relative; height: 16px; border-radius: 4px; background: linear-gradient(90deg,rgba(var(--neg-rgb),.22),rgba(var(--warn-rgb),.22) 60%,rgba(var(--pos-rgb),.22)); }
.ncx2-lollipop .row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nch-sparkbar">
        <div class="row" style="--c:var(--pos)"><span>us-east-1</span><div class="mini"><i style="height:40%"></i><i style="height:60%;animation-delay:.05s"></i><i style="height:50%;animation-delay:.1s"></i><i style="height:80%;animation-delay:.15s"></i><i style="height:70%;animation-delay:.2s"></i><i style="height:95%;animation-delay:.25s"></i></div></div>
        <div class="row" style="--c:var(--info)"><span>eu-west-1</span><div class="mini"><i style="height:70%"></i><i style="height:50%;animation-delay:.05s"></i><i style="height:60%;animation-delay:.1s"></i><i style="height:40%;animation-delay:.15s"></i><i style="height:55%;animation-delay:.2s"></i><i style="height:45%;animation-delay:.25s"></i></div></div>
        <div class="row" style="--c:var(--warn)"><span>ap-south-1</span><div class="mini"><i style="height:30%"></i><i style="height:45%;animation-delay:.05s"></i><i style="height:65%;animation-delay:.1s"></i><i style="height:55%;animation-delay:.15s"></i><i style="height:75%;animation-delay:.2s"></i><i style="height:85%;animation-delay:.25s"></i></div></div>
      </div></div></div>
<div class="meta"><b>Sparkbar Rows</b> · <code>charts-sparkbar-rows</code><br>Charts &amp; Metrics · New<p>Small-multiples mini bar charts, one per row — scan many series and their shape without axes.</p></div>

</body>
</html>
