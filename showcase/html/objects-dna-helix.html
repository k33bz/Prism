<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Helix · Prism</title>
<!-- Prism showcase sample: objects-dna-helix (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dna .rung { transform-box: fill-box; transform-origin: center center; animation: 2.6s ease-in-out 0s infinite normal none running dnaTwist; }
@keyframes dnaTwist { 
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.12); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="dna" fill="none">
        <!-- rungs (oscillating scaleX = twist) + end nodes -->
        <g stroke-width="5" stroke-linecap="round">
          <g class="rung" style="animation-delay:0s"><line x1="34" y1="14" x2="84" y2="14" stroke="var(--mag)"></line></g>
          <g class="rung" style="animation-delay:-.22s"><line x1="34" y1="27" x2="84" y2="27" stroke="var(--teal)"></line></g>
          <g class="rung" style="animation-delay:-.44s"><line x1="34" y1="40" x2="84" y2="40" stroke="var(--mag)"></line></g>
          <g class="rung" style="animation-delay:-.66s"><line x1="34" y1="53" x2="84" y2="53" stroke="var(--teal)"></line></g>
          <g class="rung" style="animation-delay:-.88s"><line x1="34" y1="66" x2="84" y2="66" stroke="var(--mag)"></line></g>
          <g class="rung" style="animation-delay:-1.1s"><line x1="34" y1="79" x2="84" y2="79" stroke="var(--teal)"></line></g>
          <g class="rung" style="animation-delay:-1.32s"><line x1="34" y1="92" x2="84" y2="92" stroke="var(--mag)"></line></g>
          <g class="rung" style="animation-delay:-1.54s"><line x1="34" y1="105" x2="84" y2="105" stroke="var(--teal)"></line></g>
        </g>
      </svg></div></div>
<div class="meta"><b>DNA Helix</b> · <code>objects-dna-helix</code><br>Animated Objects · Structures &amp; particles<p>Rungs scale in phase to read as a rotating double helix. Genomics / bio sections.</p></div>

</body>
</html>
