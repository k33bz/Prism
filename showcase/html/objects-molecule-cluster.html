<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molecule Cluster · Prism</title>
<!-- Prism showcase sample: objects-molecule-cluster (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mol .ring { transform-box: view-box; transform-origin: 59px 59px; animation: 9s linear 0s infinite normal none running spin; }
.mol .sat { transform-box: fill-box; transform-origin: center center; animation: 2s ease-in-out 0s infinite normal none running pulse; }
.mol .s2 { animation-delay: 0.4s; }
.mol .s3 { animation-delay: 0.8s; }
.scan-mol .ring { transform-box: view-box; transform-origin: 59px 59px; animation: 11s linear 0s infinite normal none running spin; }
.orbits .ring { transform-box: view-box; transform-origin: 59px 59px; }
.constel .s2 { animation-delay: 0.4s; }
.constel .s3 { animation-delay: 0.8s; }
.sat .body { transform-box: view-box; transform-origin: 59px 59px; animation: 4s ease-in-out 0s infinite normal none running satWob; }
.sat .wave { transform-box: fill-box; transform-origin: center center; animation: 2s ease-in-out 0s infinite normal none running wifiOn; }
.sat .w2 { animation-delay: 0.3s; }
.sat .w3 { animation-delay: 0.6s; }
@keyframes spin { 
  100% { transform: rotate(1turn); }
}
@keyframes pulse { 
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
@keyframes wifiOn { 
  0%, 100% { opacity: 0.18; }
  50% { opacity: 1; }
}
@keyframes satWob { 
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
.amb-tornado .ring { position: absolute; left: 50%; border: 2px solid rgba(190, 200, 220, 0.45); border-radius: 50%; transform: translateX(-50%); animation: ambSpin var(--dur,1.2s) linear infinite; }
@keyframes ambSpin { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="mol" fill="none">
        <g class="ring" stroke="var(--gray)" stroke-width="3">
          <line x1="59" y1="59" x2="93" y2="40"></line><line x1="59" y1="59" x2="26" y2="48"></line><line x1="59" y1="59" x2="64" y2="98"></line>
          <circle class="sat s1" cx="93" cy="40" r="8" fill="var(--teal)"></circle>
          <circle class="sat s2" cx="26" cy="48" r="7" fill="var(--orange)"></circle>
          <circle class="sat s3" cx="64" cy="98" r="7" fill="var(--satblue)"></circle>
        </g>
        <circle cx="59" cy="59" r="13" fill="var(--mag)"></circle>
      </svg></div></div>
<div class="meta"><b>Molecule Cluster</b> · <code>objects-molecule-cluster</code><br>Animated Objects · Structures &amp; particles<p>Central node with bonded satellites slowly orbiting + pulsing. Chemistry / data nodes.</p></div>

</body>
</html>
