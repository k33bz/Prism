<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Toggle · Prism</title>
<!-- Prism showcase sample: fx-glow-toggle (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-pos { --c: var(--pos); --c-rgb: 63,185,80; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-toggle { max-width: 280px; height: 120px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 14px; }
.fx-gl-toggle-track { position: relative; width: 54px; height: 30px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); animation: 4s ease-in-out 0s infinite normal none running fxGlToggleTrack; }
.fx-gl-toggle-knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); animation: 4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite normal none running fxGlToggleKnob; }
.fx-gl-toggle-lbl { color: var(--muted); }
@keyframes fxGlToggleTrack { 
  0%, 22%, 88%, 100% { background: var(--panel2); border-color: var(--line); box-shadow: 0 0 0 rgba(var(--fx-gl-rgb),0),0 0 0 rgba(var(--fx-gl-rgb),0); }
  32%, 78% { background: rgba(var(--fx-gl-rgb),.35); border-color: rgba(var(--fx-gl-rgb),.8); box-shadow: inset 0 0 10px rgba(var(--fx-gl-rgb),.4),0 0 16px rgba(var(--fx-gl-rgb),.5),0 0 34px rgba(var(--fx-gl-rgb),.22); }
}
@keyframes fxGlToggleKnob { 
  0%, 22%, 88%, 100% { transform: translateX(0px); background: var(--muted); box-shadow: rgba(0, 0, 0, 0.5) 0px 1px 3px; }
  32%, 78% { transform: translateX(24px); background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 8px rgba(var(--fx-gl-rgb),.9),0 0 20px rgba(var(--fx-gl-rgb),.6); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-toggle c-pos"><div class="fx-gl-toggle-track"><div class="fx-gl-toggle-knob"></div></div><span class="fx-gl-toggle-lbl">Notifications</span></div></div></div>
<div class="meta"><b>Glow Toggle</b> · <code>fx-glow-toggle</code><br>FX Store · GLOW SYSTEM<p>The switch flips on, the track fills with tinted light and the knob turns into a lamp, then it flips back. Use for settings that deserve a strong on state.</p></div>

</body>
</html>
