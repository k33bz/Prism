<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slice-Glitch · Prism</title>
<!-- Prism showcase sample: text-slice-glitch (gallery: text). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.tx-sample { font-size: 30px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.1; text-align: center; }
.tx-sample.lg { font-size: 38px; }
.tx-sample.sm { font-size: 22px; letter-spacing: 0.06em; }
.ntx2-slice { position: relative; color: var(--c); font-weight: 800; }
.ntx2-slice::before, .ntx2-slice::after { content: attr(data-text); position: absolute; left: 0px; top: 0px; width: 100%; pointer-events: none; }
.ntx2-slice::before { color: rgb(51, 221, 255); animation: 2.2s steps(2) 0s infinite normal none running ntx2SliceA; }
.ntx2-slice::after { color: rgb(255, 51, 170); animation: 2.6s steps(2) 0s infinite normal none running ntx2SliceB; }
@keyframes ntx2SliceA { 
  0%, 100% { clip-path: inset(0px 0px 82%); transform: translateX(0px); }
  25% { clip-path: inset(30% 0px 40%); transform: translateX(-5px); }
  50% { clip-path: inset(66% 0px 6%); transform: translateX(4px); }
  75% { clip-path: inset(12% 0px 66%); transform: translateX(-3px); }
}
@keyframes ntx2SliceB { 
  0%, 100% { clip-path: inset(72% 0px 4%); transform: translateX(0px); }
  30% { clip-path: inset(18% 0px 58%); transform: translateX(5px); }
  60% { clip-path: inset(48% 0px 26%); transform: translateX(-4px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><span class="tx-sample ntx2-slice c-neg" data-text="ERROR">ERROR</span></div></div>
<div class="meta"><b>Slice-Glitch</b> · <code>text-slice-glitch</code><br>Text Effects · New Treatments<p>Cyan and magenta clones cut the word into shifting horizontal bands that jump sideways — a sharper, blockier glitch than the datamosh. Requires data-text.</p></div>

</body>
</html>
