<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Book · Prism</title>
<!-- Prism showcase sample: objects-opening-book (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ob3d-scene { width: 100%; max-width: 300px; height: 140px; perspective: 620px; perspective-origin: 50% 45%; display: grid; place-items: center; overflow: hidden; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); --oc: var(--c,var(--accent)); --ocr: var(--c-rgb,var(--accent-rgb)); }
.ob3d-scene * { box-sizing: border-box; }
.ob3d-book-rig { width: 70px; height: 90px; position: relative; transform-style: preserve-3d; transform: translateY(6px) rotateX(35deg) rotateZ(-8deg); }
.ob3d-book-back { position: absolute; inset: 0px; border-radius: 2px 6px 6px 2px; border: 1px solid var(--oc); background: rgba(var(--ocr),.5); }
.ob3d-book-page { position: absolute; inset: 3px 4px; border: 1px solid var(--line); background: var(--panel2); transform-origin: 0px 50%; transform: translateZ(2px); padding: 10px 8px; display: flex; flex-direction: column; gap: 5px; }
.ob3d-book-page i { display: block; height: 3px; border-radius: 2px; background: var(--dim); }
.ob3d-book-p2 { transform: translateZ(3px); animation: 4s ease-in-out 0s infinite normal none running ob3dPage; }
.ob3d-book-cover { position: absolute; inset: 0px; border-radius: 2px 6px 6px 2px; border: 1px solid var(--oc); background: rgba(var(--ocr),.65); transform-origin: 0px 50%; transform: translateZ(5px); animation: 4s ease-in-out 0s infinite normal none running ob3dCover; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: 1px; }
@keyframes ob3dCover { 
  0%, 10% { transform: translateZ(5px) rotateY(0deg); }
  35%, 72% { transform: translateZ(5px) rotateY(-175deg); }
  95%, 100% { transform: translateZ(5px) rotateY(0deg); }
}
@keyframes ob3dPage { 
  0%, 25% { transform: translateZ(3px) rotateY(0deg); }
  45%, 55% { transform: translateZ(3px) rotateY(-170deg); }
  70%, 100% { transform: translateZ(3px) rotateY(0deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ob3d-scene ob3d-book"><div class="ob3d-book-rig"><div class="ob3d-book-back"></div><div class="ob3d-book-page"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ob3d-book-page ob3d-book-p2"><i></i><i></i><i></i><i></i></div><div class="ob3d-book-cover">NOVA</div></div></div></div></div>
<div class="meta"><b>Opening Book</b> · <code>objects-opening-book</code><br>Animated Objects · 3D CSS OBJECTS<p>A hard cover swings open on its spine and a page turns behind it before both close. Use for docs, guides, changelogs and reading states.</p></div>

</body>
</html>
