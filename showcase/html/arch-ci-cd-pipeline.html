<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Pipeline · Prism</title>
<!-- Prism showcase sample: arch-ci-cd-pipeline (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-pipe { display: flex; gap: 8px; align-items: center; }
.arch-pstage { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--muted); font: 800 9px / 1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.03em; animation: 4.4s ease-in-out 0s infinite normal none running archLight; }
.arch-pstage:nth-child(2) { animation-delay: 0.55s; }
.arch-pstage:nth-child(3) { animation-delay: 1.1s; }
.arch-pstage:nth-child(4) { animation-delay: 1.65s; }
.arch-pstage:nth-child(5) { animation-delay: 2.2s; }
.arch-psep { color: var(--dim); font-weight: 800; }
@keyframes archLight { 
  0%, 72%, 100% { background: var(--card); border-color: var(--line); color: var(--muted); }
  12%, 40% { background: rgba(var(--pos-rgb),.2); border-color: var(--pos); color: var(--ink); box-shadow: 0 0 12px rgba(var(--pos-rgb),.4); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="arch-pipe">
      <div class="arch-pstage">Source</div><span class="arch-psep">›</span>
      <div class="arch-pstage">Build</div><span class="arch-psep">›</span>
      <div class="arch-pstage">Test</div><span class="arch-psep">›</span>
      <div class="arch-pstage">Deploy</div>
    </div></div></div>
<div class="meta"><b>CI/CD Pipeline</b> · <code>arch-ci-cd-pipeline</code><br>Architecture Diagrams · FULL MINI<p>Build → Test → Deploy stages that light up green in sequence — a release pipeline advancing continuously.</p></div>

</body>
</html>
