<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination · Prism</title>
<!-- Prism showcase sample: tables-pagination (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-pg { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px ui-sans-serif, system-ui, sans-serif; }
.dtb-pg i { display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-style: normal; animation-duration: 6s; animation-timing-function: steps(1); animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: dtbPage; animation-timeline: auto; animation-range: normal; animation-delay: calc(var(--i,0)*-1.2s); }
.dtb-pg i.nav { animation: auto ease 0s 1 normal none running none; color: var(--dim); }
.dtb-pg i.dots { animation: auto ease 0s 1 normal none running none; border-color: transparent; background: transparent; }
.dtb-pg-info { font: 600 9.5px ui-sans-serif, system-ui, sans-serif; color: var(--dim); margin-top: 8px; text-align: center; }
@keyframes dtbPage { 
  0%, 19% { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  20%, 100% { background: var(--card); border-color: var(--line); color: var(--muted); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div>
      <div class="dtb-pg"><i class="nav">‹</i><i style="--i:0">1</i><i style="--i:1">2</i><i style="--i:2">3</i><i style="--i:3">4</i><i style="--i:4">5</i><i class="dots">…</i><i class="nav">12</i><i class="nav">›</i></div>
      <div class="dtb-pg-info">Showing 41–60 of 234 rows</div>
    </div></div></div>
<div class="meta"><b>Pagination</b> · <code>tables-pagination</code><br>Tables &amp; Data Layouts · LEDGERS, LOGS &amp; TOOLBARS<p>A pager whose active page steps forward on its own, plus the rows-shown caption — the footer of any paged table.</p></div>

</body>
</html>
