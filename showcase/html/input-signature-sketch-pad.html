<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature / Sketch Pad · Prism</title>
<!-- Prism showcase sample: input-signature-sketch-pad (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on::after { left: 23px; background: rgb(26, 18, 0); }
.segctl button.on { color: rgb(26, 18, 0); }
.toggle.lg.on::after { left: 30px; }
.toggle.icn.on::after { content: "✓"; color: var(--accent); }
.toggle.pos.on { background: var(--pos); border-color: var(--pos); }
.toggle.pos.on::after { background: rgb(6, 20, 10); }
.toggle.crit.on { background: var(--crit); border-color: var(--crit); }
.toggle.crit.on::after { background: rgb(26, 8, 38); }
.react-rate .rr.up.on { border-color: var(--pos); color: var(--pos); background: rgba(var(--pos-rgb),.1); }
.react-rate .rr.down.on { border-color: var(--neg); color: var(--neg); background: rgba(var(--neg-rgb),.1); }
.timefield .ampm button.on { background: var(--accent); color: rgb(26, 18, 0); border-color: var(--accent); }
.radio-pills .rp.on { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb),.1); }
.radio-pills .rp.on .rp-dot { background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),.6); }
.nps button.on { border-color: var(--accent); background: var(--accent); color: rgb(26, 18, 0); }
.nps button.lo.on { background: var(--neg); border-color: var(--neg); color: rgb(255, 255, 255); }
.nps button.mid.on { background: var(--warn); border-color: var(--warn); color: rgb(26, 18, 0); }
.nps button.hi.on { background: var(--pos); border-color: var(--pos); color: rgb(6, 20, 10); }
.mo-grid button.on { background: var(--accent); border-color: var(--accent); color: rgb(26, 18, 0); }
.sig-pad { width: 100%; }
.sig-pad canvas { width: 100%; height: 130px; display: block; background: rgb(8, 11, 18); border: 1px solid var(--line); border-radius: 12px; cursor: crosshair; touch-action: none; }
.sig-pad .sig-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.sig-pad .sig-hint { font-size: 10.5px; color: var(--dim); }
.sig-pad .sig-clear { background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.12s; }
.sig-pad .sig-clear:hover { color: var(--neg); background: rgba(var(--neg-rgb),.1); }
.sig-pad .sig-pens { display: flex; gap: 6px; }
.sig-pad .sig-pen { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; transition: 0.12s; }
.sig-pad .sig-pen.on { border-color: rgb(255, 255, 255); transform: scale(1.12); }
.region-grid button.on { border-color: var(--accent); background: rgba(var(--accent-rgb),.12); color: var(--accent); }
.likert .lk.on { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),.4); }
.bar button.on { color: rgb(255, 255, 255) !important; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="sig-pad" id="sig1">
        <canvas data-pen="#eaf1f9" width="294" height="130"></canvas>
        <div class="sig-foot">
          <div class="sig-pens">
            <span class="sig-pen on" style="background:#eaf1f9" onclick="ipSigPen(this,'#eaf1f9')"></span>
            <span class="sig-pen" style="background:var(--accent)" onclick="ipSigPen(this,'#ff9900')"></span>
            <span class="sig-pen" style="background:var(--info)" onclick="ipSigPen(this,'#4493f8')"></span>
          </div>
          <button class="sig-clear" onclick="ipSigClear(this)">Clear</button>
        </div>
        <div class="sig-hint">Sign or sketch with mouse / touch</div>
      </div></div></div>
<div class="meta"><b>Signature / Sketch Pad</b> · <code>input-signature-sketch-pad</code><br>Input Methods · Drawing &amp; Signature<p>A real drawable &lt;canvas&gt; — smooth freehand strokes via mouse or touch, switchable pen color, and a Clear button. For approvals, annotations, or quick diagrams.</p></div>

</body>
</html>
