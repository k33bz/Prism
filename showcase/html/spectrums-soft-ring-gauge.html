<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Ring Gauge · Prism</title>
<!-- Prism showcase sample: spectrums-soft-ring-gauge (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-gauge { width: 120px; height: 120px; position: relative; display: grid; place-items: center; border-radius: 50%; background: var(--neu-base); box-shadow: inset 6px 6px 12px var(--neu-dark), inset -6px -6px 12px var(--neu-light); }
.neu-gauge .neu-gring { width: 96px; height: 96px; border-radius: 50%; background: conic-gradient(var(--neu-accent) calc(var(--pct,72)*1%), transparent 0); display: grid; place-items: center; mask: radial-gradient(farthest-side, transparent calc(100% - 10px), rgb(0, 0, 0) calc(100% - 9px)); animation: 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal backwards running neuRingIn; }
.neu-gauge .neu-gval { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: var(--neu-base); display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--neu-ink); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
@keyframes neuRingIn { 
  0% { --pct: 0; }
  100% { --pct: 72; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="neu-gauge"><div class="neu-gring"><div class="neu-gval">72%</div></div></div></div></div>
<div class="meta"><b>Soft Ring Gauge</b> · <code>spectrums-soft-ring-gauge</code><br>Spectrums · Neumorphism · Neumorphism<p>A circular gauge sunk into the slab with the fill ring animating in, and an extruded cap floating on top to hold the numeral.</p></div>

</body>
</html>
