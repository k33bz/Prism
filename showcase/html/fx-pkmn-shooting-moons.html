<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shooting Moons · Prism</title>
<!-- Prism showcase sample: fx-pkmn-shooting-moons (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.fx-pksm { position: relative; width: 330px; max-width: 100%; height: 150px; border-radius: 12px; overflow: hidden; --c1: var(--crit); --c1-rgb: var(--crit-rgb); --c2: var(--warn); --c2-rgb: var(--warn-rgb); background: radial-gradient(130% 100% at 50% 50%,rgba(var(--c1-rgb),.12),rgba(0,0,0,0) 72%),#0b0e15; border: 1px solid rgba(var(--c1-rgb),.35); }
.fx-pksm-card { position: absolute; left: 272px; top: 46px; width: 40px; height: 54px; border-radius: 4px; border: 1.5px solid rgba(255, 255, 255, 0.4); background: linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)); }
.fx-pksm-m { position: absolute; left: -30px; top: 62px; width: 26px; height: 26px; opacity: 0; animation: 2.4s cubic-bezier(0.4, 0.05, 0.5, 1) 0s infinite normal none running fxPksmFly; }
.fx-pksm-m svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 7px rgba(var(--c1-rgb),.75)); }
.fx-pksm-moon { fill: var(--c1); stroke: var(--c2); stroke-width: 1.6; }
.fx-pksm-m.m2 { top: 44px; width: 20px; height: 20px; animation-delay: 0.14s; }
.fx-pksm-m.m3 { top: 82px; width: 20px; height: 20px; animation-delay: 0.28s; }
.fx-pksm-sp { position: absolute; width: 7px; height: 7px; opacity: 0; background: var(--c2); clip-path: polygon(50% 0px, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0px 50%, 38% 38%); animation: 2.4s ease-out 0s infinite normal none running fxPksmSpark; }
.fx-pksm-sp.p1 { left: 70px; top: 52px; }
.fx-pksm-sp.p2 { left: 130px; top: 74px; background: var(--c1); animation-delay: 0.14s; }
.fx-pksm-sp.p3 { left: 196px; top: 48px; animation-delay: 0.26s; }
.fx-pksm-sp.p4 { left: 238px; top: 70px; background: var(--c1); animation-delay: 0.36s; }
.fx-pksm-burst { position: absolute; left: 292px; top: 73px; width: 54px; height: 54px; margin: -27px 0px 0px -27px; border-radius: 50%; border: 3px solid var(--c1); opacity: 0; box-shadow: 0 0 14px rgba(var(--c1-rgb),.8); animation: 2.4s cubic-bezier(0.2, 0.8, 0.3, 1) 0s infinite normal none running fxPksmBurst; }
.fx-pksm-st { position: absolute; left: 292px; top: 73px; width: 9px; height: 9px; opacity: 0; background: var(--c2); clip-path: polygon(50% 0px, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0px 50%, 38% 38%); animation: 2.4s ease-out 0s infinite normal none running fxPksmStar; }
.fx-pksm-st.t2 { --dx: 22px; --dy: -24px; animation-delay: 0.04s; background: var(--c1); }
.fx-pksm-st.t3 { --dx: -24px; --dy: -20px; animation-delay: 0.08s; }
.fx-pksm-st.t4 { --dx: 18px; --dy: 20px; animation-delay: 0.12s; }
.fx-pksm-st.t1 { --dx: -6px; --dy: -30px; }
.fx-pknj-t.t1 { top: 56px; }
.fx-pknj-t.t2 { top: 72px; animation-delay: 0.06s; }
.fx-pknj-t.t3 { top: 88px; animation-delay: 0.12s; }
@keyframes fxPksmFly { 
  0%, 4% { opacity: 0; transform: translate(0px, 0px) rotate(0deg); }
  10% { opacity: 1; }
  30% { transform: translate(150px, -14px) rotate(210deg); }
  52% { opacity: 1; transform: translate(300px, 2px) rotate(410deg); }
  58%, 100% { opacity: 0; transform: translate(316px, 4px) rotate(430deg); }
}
@keyframes fxPksmSpark { 
  0%, 16% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  24% { opacity: 1; transform: scale(1.1) rotate(40deg); }
  42%, 100% { opacity: 0; transform: scale(0.4) rotate(80deg); }
}
@keyframes fxPksmBurst { 
  0%, 52% { opacity: 0; transform: scale(0.2); }
  58% { opacity: 0.95; transform: scale(0.6); }
  74%, 100% { opacity: 0; transform: scale(1.35); }
}
@keyframes fxPksmStar { 
  0%, 54% { opacity: 0; transform: translate(0px, 0px) scale(0.4) rotate(0deg); }
  60% { opacity: 1; }
  76% { opacity: 0.8; transform: translate(var(--dx,0px),var(--dy,-24px)) scale(1) rotate(90deg); }
  88%, 100% { opacity: 0; transform: translate(var(--dx,0px),var(--dy,-24px)) scale(.4) rotate(140deg); }
}
</style>
</head>

<div class="tile"><div class="stage" id="stage"><div class="fx-pksm" role="img" aria-label="Shooting Moons: crescent moons arc across like thrown blades with a gold sparkle trail and a star-burst on the far card">

    <span class="fx-pksm-m m2"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="fx-pksm-moon" d="M20 2 A15 15 0 1 0 30 22 A11.5 11.5 0 0 1 20 2 Z"></path></svg></span>
    <span class="fx-pksm-m m3"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="fx-pksm-moon" d="M20 2 A15 15 0 1 0 30 22 A11.5 11.5 0 0 1 20 2 Z"></path></svg></span>
