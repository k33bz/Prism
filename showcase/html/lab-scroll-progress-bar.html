<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Progress Bar · Prism</title>
<!-- Prism showcase sample: lab-scroll-progress-bar (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-ln { display: block; height: 6px; border-radius: 3px; background: var(--line); width: var(--w,80%); }
.lab-rv-plx-bg, .lab-rv-plx-mid, .lab-rv-plx-fg, .lab-rv-plx-chip, .lab-rv-thumb { animation-duration: 4s; animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); animation-iteration-count: infinite; }
.lab-rv-thumb { position: absolute; right: 3px; top: 6px; width: 3px; height: 34px; border-radius: 2px; background: var(--dim); animation-name: labRvThumb; }
.lab-rv-sh, .lab-rv-sht, .lab-rv-sc, .lab-rv-sticky .lab-rv-thumb { animation-duration: 4s; animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); animation-iteration-count: infinite; }
.lab-rv-prog { --c: var(--info); --c-rgb: var(--info-rgb); background: var(--panel); }
.lab-rv-pbar { position: absolute; left: 0px; right: 0px; top: 0px; height: 3px; z-index: 2; background: var(--c); transform-origin: left center; animation-name: labRvPbar; }
.lab-rv-pct { position: absolute; right: 10px; top: 9px; z-index: 2; font: 700 10px / 1 ui-monospace, Menlo, monospace; color: var(--c); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 7px; counter-reset: labRvPct var(--lab-rv-p); animation-name: labRvPct; }
.lab-rv-pct::after { content: counter(labRvPct) "% read"; }
.lab-rv-pg { position: absolute; left: 14px; right: 14px; top: 14px; animation-name: labRvScrollLong; }
.lab-rv-pgh { font-size: 14px; font-weight: 800; margin-bottom: 8px; padding-right: 78px; }
.lab-rv-pg .lab-rv-ln { margin-bottom: 8px; }
.lab-rv-pbar, .lab-rv-pct, .lab-rv-pg, .lab-rv-prog .lab-rv-thumb { animation-duration: 4s; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); animation-iteration-count: infinite; }
.lab-rv-prog .lab-rv-thumb { animation-name: labRvThumbLong; }
.lab-rv-fg .lab-rv-ln { width: var(--w,70%); }
@keyframes labRvThumb { 
  0%, 8% { transform: translateY(0px); }
  48%, 58% { transform: translateY(84px); }
  92%, 100% { transform: translateY(0px); }
}
@keyframes labRvPbar { 
  0%, 6% { transform: scaleX(0); }
  70%, 86% { transform: scaleX(1); }
  96%, 100% { transform: scaleX(0); }
}
@keyframes labRvPct { 
  0%, 6% { --lab-rv-p: 0; }
  70%, 86% { --lab-rv-p: 100; }
  96%, 100% { --lab-rv-p: 0; }
}
@keyframes labRvScrollLong { 
  0%, 6% { transform: translateY(0px); }
  70%, 86% { transform: translateY(-118px); }
  96%, 100% { transform: translateY(0px); }
}
@keyframes labRvThumbLong { 
  0%, 6% { transform: translateY(0px); }
  70%, 86% { transform: translateY(84px); }
  96%, 100% { transform: translateY(0px); }
}
@property --lab-rv-p { syntax: "<integer>"; inherits: false; initial-value: 100; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-prog">
      <div class="lab-rv-pbar"></div>
      <div class="lab-rv-pct"></div>
      <div class="lab-rv-pg">
        <div class="lab-rv-pgh">Why Comet moved to edge caches</div>
        <span class="lab-rv-ln" style="--w:92%"></span><span class="lab-rv-ln" style="--w:78%"></span><span class="lab-rv-ln" style="--w:88%"></span><span class="lab-rv-ln" style="--w:60%"></span>
        <span class="lab-rv-ln" style="--w:90%"></span><span class="lab-rv-ln" style="--w:84%"></span><span class="lab-rv-ln" style="--w:70%"></span><span class="lab-rv-ln" style="--w:95%"></span><span class="lab-rv-ln" style="--w:66%"></span><span class="lab-rv-ln" style="--w:40%"></span>
      </div>
      <div class="lab-rv-thumb"></div>
    </div></div></div>
<div class="meta"><b>Scroll Progress Bar</b> · <code>lab-scroll-progress-bar</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>A top bar fills and a percent badge counts up as the article scrolls, then everything snaps back to the top. Use for reading progress on long posts.</p></div>

</body>
</html>
