<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row Selection · Prism</title>
<!-- Prism showcase sample: tables-row-selection (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-cb { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--dim); border-radius: 3px; position: relative; vertical-align: -2px; background: var(--panel); }
.dtb-cb::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 7px; border-top-color: ; border-top-style: ; border-right-color: ; border-right-style: ; border-bottom-color: ; border-bottom-style: ; border-left-color: ; border-left-style: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-width: 0px 2px 2px 0px; transform: rotate(45deg) scale(0); opacity: 0; }
.dtb-cb.dtb-on { background: var(--c,var(--accent)); border-color: var(--c,var(--accent)); }
.dtb-cb.dtb-on::after { transform: rotate(45deg) scale(1); opacity: 1; }
.dtb-select tbody tr:nth-child(2) .dtb-cb { animation: 5s steps(1) 0s infinite normal none running dtbCbOn; }
.dtb-select tbody tr:nth-child(2) .dtb-cb::after { animation: 5s ease-out 0s infinite normal none running dtbCbMark; }
.dtb-select tbody tr:nth-child(2) td { animation: 5s steps(1) 0s infinite normal none running dtbSelRow; }
.dtb-select tbody tr:nth-child(4) .dtb-cb { animation: 5s steps(1) 1.2s infinite normal none running dtbCbOn; }
.dtb-select tbody tr:nth-child(4) .dtb-cb::after { animation: 5s ease-out 1.2s infinite normal none running dtbCbMark; }
.dtb-select tbody tr:nth-child(4) td { animation: 5s steps(1) 1.2s infinite normal none running dtbSelRow; }
.dtb-pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 9px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.5; }
.dtb-pill.dtb-ok { color: var(--pos); background: rgba(var(--pos-rgb),.14); }
.dtb-pill.warn { color: var(--warn); background: rgba(var(--warn-rgb),.14); }
.dtb-pill.crit { color: var(--neg); background: rgba(var(--neg-rgb),.16); animation: 1.3s ease-in-out 0s infinite normal none running dtbPillPulse; }
.dtb-pill.info { color: var(--info); background: rgba(var(--info-rgb),.14); }
.dtb-pill.off { color: var(--dim); background: rgba(255, 255, 255, 0.05); }
.dtb-ck-item .dtb-cb { animation-duration: 7s; animation-timing-function: steps(1); animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: dtbCbOn; animation-timeline: auto; animation-range: normal; animation-delay: calc(var(--i,0)*1.2s); }
.dtb-ck-item .dtb-cb::after { animation-duration: 7s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: dtbCbMark; animation-timeline: auto; animation-range: normal; animation-delay: calc(var(--i,0)*1.2s); }
.dtb-ck-item .dtb-cb.dtb-on { animation: auto ease 0s 1 normal none running none; }
.dtb-ck-item .dtb-cb.dtb-on::after { animation: auto ease 0s 1 normal none running none; }
.dtb-tl-r .d.dtb-ok { border-color: var(--pos); background: var(--pos); }
.dtb-tl-r .d.warn { border-color: var(--warn); background: var(--warn); }
.dtb-chip.dtb-on { border-color: var(--c,var(--accent)); color: var(--c,var(--accent)); background: rgba(var(--c-rgb,var(--accent-rgb)),.12); }
.dtb-tbl.manual td.flip { transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
.dtb-tbl.manual tr.lifted td { position: relative; z-index: 2; box-shadow: 0 6px 16px rgba(0,0,0,.45),inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.14); }
@keyframes dtbCbOn { 
  0%, 19% { background: var(--panel); border-color: var(--dim); }
  20%, 75% { background: var(--c,var(--accent)); border-color: var(--c,var(--accent)); }
  76%, 100% { background: var(--panel); border-color: var(--dim); }
}
@keyframes dtbCbMark { 
  0%, 19% { transform: rotate(45deg) scale(0); opacity: 0; }
  24%, 75% { transform: rotate(45deg) scale(1); opacity: 1; }
  76%, 100% { transform: rotate(45deg) scale(0); opacity: 0; }
}
@keyframes dtbSelRow { 
  0%, 19% { box-shadow: inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0); }
  20%, 75% { box-shadow: inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.12); }
  76%, 100% { box-shadow: inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),0); }
}
@keyframes dtbPillPulse { 
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--neg-rgb),.5); }
  60% { box-shadow: 0 0 0 5px rgba(var(--neg-rgb),0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl dtb-select"><thead><tr><th><span class="dtb-cb"></span></th><th>Ticket</th><th>Status</th></tr></thead><tbody>
