<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilted Card Stack · Prism</title>
<!-- Prism showcase sample: charts-tilted-card-stack (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.scx-kpic .v { font-size: 25px; font-weight: 800; line-height: 1.1; margin-top: 3px; font-variant-numeric: tabular-nums; }
.nch-radbar .t { stroke: var(--panel2); }
.nch-rings .t { stroke: var(--panel2); }
.nch-sparkbar .mini { display: flex; align-items: flex-end; gap: 2px; height: 22px; flex: 1 1 0%; }
.nch-sparkbar .mini i { flex: 1 1 0%; border-radius: 1px; background: var(--c,var(--accent)); transform-origin: center bottom; animation: 0.7s ease-out 0s 1 normal both running nchGrow; }
@keyframes nchGrow { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
.n3d-scene { perspective: 640px; perspective-origin: 50% 42%; display: flex; align-items: center; justify-content: center; min-height: 150px; }
.n3d-cards { position: relative; width: 150px; height: 120px; transform-style: preserve-3d; transform: rotateX(48deg) rotateZ(-30deg); animation: 8s ease-in-out 0s infinite normal none running n3dTilt; }
.n3d-cards .card { position: absolute; left: 0px; top: 0px; width: 150px; height: 96px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.35) 0px 14px 24px; padding: 12px; box-sizing: border-box; animation: 0.8s ease-out 0s 1 normal both running ncx2Fade; }
.n3d-cards .card .t { font-size: 10px; color: var(--muted); font-weight: 700; }
.n3d-cards .card .v { font-size: 22px; font-weight: 800; color: var(--c,var(--info)); margin-top: 2px; }
.n3d-cards .card .mini { display: flex; align-items: flex-end; gap: 3px; height: 24px; margin-top: 8px; }
.n3d-cards .card .mini i { flex: 1 1 0%; border-radius: 2px; background: var(--c,var(--info)); opacity: 0.8; }
.n3d-cards .c1 { transform: translateZ(0px); }
.n3d-cards .c2 { transform: translateZ(26px); }
.n3d-cards .c3 { transform: translateZ(52px); }
@keyframes n3dTilt { 
  0%, 100% { transform: rotateX(52deg) rotateZ(-4deg); }
  50% { transform: rotateX(52deg) rotateZ(6deg); }
}
@keyframes ncx2Fade { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="n3d-scene"><div class="n3d-cards">
      <div class="card c1" style="--c:var(--info);animation-delay:0s"><div class="t">TRAFFIC</div><div class="v">8.4k</div><div class="mini"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:65%"></i></div></div>
      <div class="card c2" style="--c:var(--accent);animation-delay:.12s"><div class="t">LATENCY</div><div class="v">63ms</div><div class="mini"><i style="height:80%"></i><i style="height:60%"></i><i style="height:45%"></i><i style="height:70%"></i><i style="height:50%"></i></div></div>
      <div class="card c3" style="--c:var(--pos);animation-delay:.24s"><div class="t">HEALTHY</div><div class="v">97%</div><div class="mini"><i style="height:60%"></i><i style="height:75%"></i><i style="height:85%"></i><i style="height:70%"></i><i style="height:95%"></i></div></div>
    </div></div></div></div>
<div class="meta"><b>Tilted Card Stack</b> · <code>charts-tilted-card-stack</code><br>Charts &amp; Metrics · 3D &amp; Perspective (2026 drop)<p>Dashboard cards floated at different depths on a tilted plane — a layered &quot;deck&quot; summary view for a status wall.</p></div>

</body>
</html>
