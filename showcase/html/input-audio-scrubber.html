<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Scrubber · Prism</title>
<!-- Prism showcase sample: input-audio-scrubber (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.audio-bar { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 15px; }
.audio-bar .ab-play { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: rgb(26, 18, 0); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.audio-bar .ab-track { flex: 1 1 0%; height: 6px; border-radius: 3px; background: var(--panel); position: relative; cursor: pointer; }
.audio-bar .ab-track .ab-fill { position: absolute; left: 0px; top: 0px; height: 100%; border-radius: 3px; background: linear-gradient(90deg,var(--accent),#ffd277); }
.audio-bar .ab-track .ab-knob { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 13px; height: 13px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),.5); }
.audio-bar .ab-t { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="audio-bar" id="audio1">
        <button class="ab-play" onclick="ipAudioPlay(this)">▶</button>
        <span class="ab-t" id="abCur1">0:08</span>
        <div class="ab-track" onclick="ipAudioSeek(event,this)"><div class="ab-fill" style="width:32%"></div><div class="ab-knob" style="left:32%"></div></div>
        <span class="ab-t">0:26</span>
      </div></div></div>
<div class="meta"><b>Audio Scrubber</b> · <code>input-audio-scrubber</code><br>Input Methods · Voice &amp; Media Capture<p>Playback control with a draggable seek bar, fill progress, and elapsed / total time. Click anywhere on the track to scrub. For recorded notes or attached clips.</p></div>

</body>
</html>
