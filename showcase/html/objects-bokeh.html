<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokeh · Prism</title>
<!-- Prism showcase sample: objects-bokeh (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.amb-bg-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: var(--panel2); isolation: isolate; }
.amb-bg-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.amb-bg-bokeh { background: radial-gradient(120% 100% at 30% 100%,rgba(var(--warn-rgb),.2),var(--panel2) 60%); }
.amb-bg-bokeh-c { position: absolute; left: var(--x,50%); top: var(--y,50%); width: var(--s,30px); height: var(--s,30px); margin: calc(var(--s,30px) / -2) 0 0 calc(var(--s,30px) / -2); border-radius: 50%; background: radial-gradient(circle,rgba(var(--c-rgb,var(--accent-rgb)),.5) 55%,rgba(var(--c-rgb,var(--accent-rgb)),.15) 70%,transparent 72%); filter: blur(1.5px); animation-name: ambBgBokeh; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.amb-bg-bokeh-c:nth-child(3n+2) { background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 55%, rgba(255, 255, 255, 0.1) 70%, transparent 72%); filter: blur(3px); }
.amb-bg-bokeh-c:nth-child(3n+3) { background: radial-gradient(circle,rgba(var(--info-rgb),.45) 55%,rgba(var(--info-rgb),.12) 70%,transparent 72%); }
@keyframes ambBgBokeh { 
  0%, 100% { transform: translate(0px, 0px) scale(0.9); opacity: 0.5; }
  50% { transform: translate(8px, -22px) scale(1.1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb-bg-root amb-bg-bokeh"><i class="amb-bg-bokeh-c" style="--x:12%;--y:70%;--s:46px"></i><i class="amb-bg-bokeh-c" style="--x:30%;--y:30%;--s:28px;--d:-1.2s"></i><i class="amb-bg-bokeh-c" style="--x:50%;--y:62%;--s:60px;--d:-2.5s"></i><i class="amb-bg-bokeh-c" style="--x:68%;--y:22%;--s:22px;--d:-.7s"></i><i class="amb-bg-bokeh-c" style="--x:84%;--y:56%;--s:40px;--d:-3.1s"></i><i class="amb-bg-bokeh-c" style="--x:92%;--y:88%;--s:30px;--d:-1.9s"></i><i class="amb-bg-bokeh-c" style="--x:40%;--y:92%;--s:34px;--d:-3.5s"></i><i class="amb-bg-bokeh-c" style="--x:76%;--y:84%;--s:18px;--d:-2.2s"></i><span class="amb-bg-tag">Pixel · evening</span></div></div></div>
<div class="meta"><b>Bokeh</b> · <code>objects-bokeh</code><br>Animated Objects · AMBIENT BACKGROUNDS<p>Soft out of focus light discs in three tints drift and swell. Warm ambient backdrop for photo, event and evening themed surfaces.</p></div>
