<title>Folding Box · Prism</title>
<!-- Prism showcase sample: objects-folding-box (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-face { position: absolute; border: 1.5px solid var(--fc,var(--nobj2-i)); background: color-mix(in srgb,var(--fc,var(--nobj2-i)) 14%,transparent); box-shadow: inset 0 0 16px color-mix(in srgb,var(--fc,var(--nobj2-i)) 24%,transparent); }
.nobj2-cube .nobj2-face { width: 74px; height: 74px; }
.nobj2-fold { position: relative; width: 74px; height: 74px; transform-style: preserve-3d; animation: 14s linear 0s infinite normal none running nobj2FoldSpin; }
.nobj2-fold .nobj2-base { position: absolute; inset: 0px; }
.nobj2-fold .nobj2-wall { position: absolute; width: 74px; height: 74px; }
.nobj2-fw-f { bottom: 0px; left: 0px; transform-origin: 50% 100%; animation: 5s ease-in-out 0s infinite normal none running nobj2FoldF; }
.nobj2-fw-b { top: 0px; left: 0px; transform-origin: 50% 0px; animation: 5s ease-in-out 0s infinite normal none running nobj2FoldB; }
.nobj2-fw-r { top: 0px; right: 0px; transform-origin: 100% 50%; animation: 5s ease-in-out 0s infinite normal none running nobj2FoldR; }
.nobj2-fw-l { top: 0px; left: 0px; transform-origin: 0px 50%; animation: 5s ease-in-out 0s infinite normal none running nobj2FoldL; }
@keyframes nobj2FoldSpin { 
  0% { transform: rotateX(58deg) rotateZ(0deg); }
  100% { transform: rotateX(58deg) rotateZ(360deg); }
}
@keyframes nobj2FoldF { 
  0%, 12% { transform: rotateX(0deg); }
  46%, 72% { transform: rotateX(-90deg); }
  100% { transform: rotateX(0deg); }
}
@keyframes nobj2FoldB { 
  0%, 12% { transform: rotateX(0deg); }
  46%, 72% { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}
@keyframes nobj2FoldR { 
  0%, 12% { transform: rotateY(0deg); }
  46%, 72% { transform: rotateY(-90deg); }
  100% { transform: rotateY(0deg); }
}
@keyframes nobj2FoldL { 
  0%, 12% { transform: rotateY(0deg); }
  46%, 72% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nobj2-scene"><div class="nobj2-fold" style="--fc:var(--nobj2-p)">
      <span class="nobj2-face nobj2-base"></span>
      <span class="nobj2-face nobj2-wall nobj2-fw-f"></span><span class="nobj2-face nobj2-wall nobj2-fw-b"></span>
      <span class="nobj2-face nobj2-wall nobj2-fw-r"></span><span class="nobj2-face nobj2-wall nobj2-fw-l"></span>
    </div></div></div></div>
