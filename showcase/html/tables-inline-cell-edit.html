<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline Cell Edit · Prism</title>
<!-- Prism showcase sample: tables-inline-cell-edit (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-mono { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.dtb-mut { color: var(--muted); }
.dtb-edit-cell { display: inline-block; min-width: 78px; padding: 1px 6px; border: 1px solid var(--info); border-radius: 4px; background: rgba(var(--info-rgb),.09); box-shadow: 0 0 0 3px rgba(var(--info-rgb),.14); font-family: ui-monospace, Menlo, monospace; }
.dtb-typed { display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; max-width: 0px; animation: 4.5s steps(9) 0s infinite normal none running dtbType; }
.dtb-caret { display: inline-block; width: 1px; height: 11px; background: var(--ink); vertical-align: -2px; margin-left: 1px; animation: 1s steps(1) 0s infinite normal none running dtbCaret; }
.dtb-edit-hint { font-size: 8.5px; color: var(--info); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800; margin-left: 6px; }
.dtb-def dd .dtb-typed { max-width: 0px; animation: 6s steps(26) 0s infinite normal none running dtbTypeLong; color: var(--ink); }
.dtb-search .dtb-typed { animation: 5s steps(7) 0s infinite normal none running dtbType; }
@keyframes dtbCaret { 
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
@keyframes dtbType { 
  0%, 12% { max-width: 0px; }
  55%, 90% { max-width: 5.4em; }
  100% { max-width: 0px; }
}
@keyframes dtbTypeLong { 
  0%, 8% { max-width: 0px; }
  55%, 92% { max-width: 15em; }
  100% { max-width: 0px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>
      <tr><td class="dtb-mut">region</td><td class="dtb-mono">us-east-1</td></tr>
      <tr><td class="dtb-mut">instance</td><td><span class="dtb-edit-cell"><span class="dtb-typed">m7g.large</span><span class="dtb-caret"></span></span><span class="dtb-edit-hint">editing</span></td></tr>
      <tr><td class="dtb-mut">min_size</td><td class="dtb-mono">2</td></tr>
      <tr><td class="dtb-mut">max_size</td><td class="dtb-mono">12</td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Inline Cell Edit</b> · <code>tables-inline-cell-edit</code><br>Tables &amp; Data Layouts · DATA TABLES<p>One cell becomes a focused input with a blinking caret and a value being typed — the editing state of an inline-editable grid.</p></div>

</body>
</html>
