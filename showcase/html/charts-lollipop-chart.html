<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lollipop Chart · Prism</title>
<!-- Prism showcase sample: charts-lollipop-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.scx-bullet .track { position: relative; height: 24px; border-radius: 6px; overflow: hidden; display: flex; }
.scx-bullet .track > span { display: block; height: 100%; }
.lv-eta .track { height: 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; position: relative; }
.lv-eta .track > i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg,var(--info),var(--accent)); position: relative; transition: width 0.4s; }
.lv-eta .track > i::after { content: ""; position: absolute; inset: 0px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent) 0% 0% / 40px 100%; animation: 1s linear 0s infinite normal none running lv-stripe; }
@keyframes lv-stripe { 
  0% { background-position: -40px 0px; }
  100% { background-position: 260px 0px; }
}
.nch-gantt .row { height: 12px; background: var(--panel2); border-radius: 6px; position: relative; overflow: hidden; }
.nch-gantt .row i { position: absolute; top: 0px; height: 100%; border-radius: 6px; background: linear-gradient(90deg,var(--info),rgba(var(--info-rgb),.4)); transform-origin: left center; animation: 1s ease-out 0s 1 normal both running nchGanttW; }
.nch-dumbbell .row { position: relative; height: 12px; }
.nch-sparkbar .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
@keyframes nchGanttW { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
.ncx2-bullet .row { position: relative; height: 16px; border-radius: 4px; background: linear-gradient(90deg,rgba(var(--neg-rgb),.22),rgba(var(--warn-rgb),.22) 60%,rgba(var(--pos-rgb),.22)); }
.ncx2-lollipop { display: flex; flex-direction: column; gap: 12px; width: 220px; }
.ncx2-lollipop .row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
.ncx2-lollipop .track { position: relative; flex: 1 1 0%; height: 12px; }
.ncx2-lollipop .stem { position: absolute; left: 0px; top: 5px; height: 2px; border-radius: 2px; background: var(--line); transform-origin: left center; animation: 1s ease-out 0s 1 normal both running ncx2GrowX; }
.ncx2-lollipop .pop { position: absolute; top: 0px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); animation: 0.7s ease-out 0s 1 normal both running ncx2Pop; }
@keyframes ncx2GrowX { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
@keyframes ncx2Pop { 
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.25); }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ncx2-lollipop">
      <div class="row"><span>lambda</span><div class="track"><span class="stem" style="width:82%;animation-delay:0s"></span><span class="pop" style="left:82%;background:var(--info);animation-delay:.5s"></span></div></div>
      <div class="row"><span>ec2</span><div class="track"><span class="stem" style="width:60%;animation-delay:.1s"></span><span class="pop" style="left:60%;background:var(--accent);animation-delay:.6s"></span></div></div>
      <div class="row"><span>s3</span><div class="track"><span class="stem" style="width:44%;animation-delay:.2s"></span><span class="pop" style="left:44%;background:var(--pos);animation-delay:.7s"></span></div></div>
      <div class="row"><span>rds</span><div class="track"><span class="stem" style="width:71%;animation-delay:.3s"></span><span class="pop" style="left:71%;background:var(--warn);animation-delay:.8s"></span></div></div>
    </div></div></div>
<div class="meta"><b>Lollipop Chart</b> · <code>charts-lollipop-chart</code><br>Charts &amp; Metrics · New<p>Bars distilled to a stem and a dot — less ink, same ranking, ideal when categories are many and values sparse.</p></div>

</body>
</html>
