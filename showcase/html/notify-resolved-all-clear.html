<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resolved / All-clear · Prism</title>
<!-- Prism showcase sample: notify-resolved-all-clear (gallery: notify). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ns-banner { display: flex; align-items: center; gap: 10px; width: 232px; padding: 11px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 600; border: 1px solid rgba(var(--cr,63,185,80),.4); background: rgba(var(--cr,63,185,80),.12); color: var(--ink); }
.ns-banner .ns-bdot { flex: 0 0 9px; height: 9px; border-radius: 50%; background: var(--c,var(--pos)); box-shadow: 0 0 0 0 rgba(var(--cr,63,185,80),.6); animation: 2.2s ease-out 0s infinite normal none running nsPing; }
.ns-banner .ns-bmsg { flex: 1 1 auto; }
.ns-banner .ns-bmsg small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
.ns-b-resolved { --c: var(--pos); --cr: 63,185,80; }
.ns-incident .ns-bdot { animation: 0.8s ease 0s infinite normal none running nsBlink; box-shadow: none; }
@keyframes nsPing { 
  0% { box-shadow: 0 0 0 0 rgba(var(--cr,63,185,80),.55); }
  70%, 100% { box-shadow: 0 0 0 8px rgba(var(--cr,63,185,80),0); }
}
@keyframes nsBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ns-banner ns-b-resolved"><span class="ns-bdot"></span><span class="ns-bmsg">Incident resolved<small>All services restored</small></span></div></div></div>
<div class="meta"><b>Resolved / All-clear</b> · <code>notify-resolved-all-clear</code><br>Notifications &amp; Status · STATUS BANNERS &amp; INDICATORS<p>Green banner confirming recovery; use to close out a resolved incident.</p></div>

</body>
</html>
