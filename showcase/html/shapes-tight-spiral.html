<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-crit { --c: var(--crit); --c-rgb: 200,121,255; }
.nsh2-g { position: absolute; left: 50%; top: 50%; font-weight: 800; white-space: pre; transform-style: preserve-3d; }
.nsh2-ring3d .nsh2-g { font-size: 19px; color: var(--c); text-shadow: 0 0 9px rgba(var(--c-rgb),.55); }
.nsh2-cylinder .nsh2-g { font-size: 15px; color: var(--c); text-shadow: 0 0 7px rgba(var(--c-rgb),.5); }
.nsh2-helix .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.6); }
.nsh2-staircase .nsh2-g { font-size: 15px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.55); }
.nsh2-sphere .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.6); }
.nsh2-circle .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 7px rgba(var(--c-rgb),.5); }
.nsh2-spiralt { position: relative; width: 160px; height: 160px; animation: 11s linear 0s infinite normal none running nsh2Spin2d; }
.nsh2-spiralt .nsh2-g { color: var(--c); text-shadow: 0 0 5px rgba(var(--c-rgb),.5); }
.nsh2-spirall .nsh2-g { color: var(--c); text-shadow: 0 0 5px rgba(var(--c-rgb),.5); }
@keyframes nsh2Spin2d { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
