<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline Matrix · Prism</title>
<!-- Prism showcase sample: charts-sparkline-matrix (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ncx2-sparkmx { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px; }
.ncx2-sparkmx .cell { background: var(--panel2); border-radius: 6px; padding: 5px; }
.ncx2-sparkmx .cell b { font-size: 9px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 2px; }
.ncx2-sparkmx svg { width: 54px; height: 22px; }
.ncx2-sparkmx polyline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: 1.6s ease-out 0s 1 normal forwards running ncx2Draw; }
@keyframes ncx2Draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ncx2-sparkmx">
      <div class="cell"><b>us-east-1</b><svg viewBox="0 0 54 22"><polyline points="2,16 12,12 22,14 32,6 42,10 52,3" stroke="var(--pos)" style="animation-delay:0s"></polyline></svg></div>
      <div class="cell"><b>eu-west-1</b><svg viewBox="0 0 54 22"><polyline points="2,8 12,12 22,6 32,14 42,10 52,16" stroke="var(--info)" style="animation-delay:.1s"></polyline></svg></div>
      <div class="cell"><b>ap-south-1</b><svg viewBox="0 0 54 22"><polyline points="2,18 12,14 22,16 32,10 42,12 52,4" stroke="var(--accent)" style="animation-delay:.2s"></polyline></svg></div>
      <div class="cell"><b>sa-east-1</b><svg viewBox="0 0 54 22"><polyline points="2,6 12,10 22,8 32,12 42,7 52,11" stroke="var(--warn)" style="animation-delay:.15s"></polyline></svg></div>
      <div class="cell"><b>ca-central</b><svg viewBox="0 0 54 22"><polyline points="2,14 12,8 22,12 32,5 42,9 52,2" stroke="var(--pos)" style="animation-delay:.25s"></polyline></svg></div>
      <div class="cell"><b>ap-ne-1</b><svg viewBox="0 0 54 22"><polyline points="2,10 12,16 22,9 32,13 42,6 52,12" stroke="var(--crit)" style="animation-delay:.35s"></polyline></svg></div>
    </div></div></div>
<div class="meta"><b>Sparkline Matrix</b> · <code>charts-sparkline-matrix</code><br>Charts &amp; Metrics · New<p>Small-multiple sparklines in a labelled grid — scan the trend shape of dozens of series in one compact panel.</p></div>

</body>
</html>
