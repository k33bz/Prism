<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Hover Lift · Prism</title>
<!-- Prism showcase sample: fx-glow-hover-lift (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-accent { --c: var(--accent); --c-rgb: 255,153,0; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-lift { max-width: 250px; height: 112px; padding: 16px 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s, border-color 0.35s; animation: 4s ease-in-out 0s infinite normal none running fxGlLift; }
.fx-gl-lift-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.fx-gl-lift-val { font-size: 28px; font-weight: 700; margin: 4px 0px 2px; text-shadow: 0 0 12px rgba(var(--fx-gl-rgb),.5); }
.fx-gl-lift-sub { font-size: 12px; color: var(--muted); }
.fx-gl-lift:hover { animation-name: none; transform: translateY(-6px); border-color: rgba(var(--fx-gl-rgb),.8); box-shadow: 0 14px 28px -10px rgba(0,0,0,.6),0 0 0 1px rgba(var(--fx-gl-rgb),.5),0 0 22px rgba(var(--fx-gl-rgb),.55),0 16px 40px -8px rgba(var(--fx-gl-rgb),.5); }
@keyframes fxGlLift { 
  0%, 18%, 88%, 100% { transform: translateY(0px); border-color: var(--line); box-shadow: 0 2px 6px rgba(0,0,0,.35),0 0 0 0 rgba(var(--fx-gl-rgb),0),0 0 0 rgba(var(--fx-gl-rgb),0),0 0 0 0 rgba(var(--fx-gl-rgb),0); }
  38%, 68% { transform: translateY(-6px); border-color: rgba(var(--fx-gl-rgb),.8); box-shadow: 0 14px 28px -10px rgba(0,0,0,.6),0 0 0 1px rgba(var(--fx-gl-rgb),.5),0 0 22px rgba(var(--fx-gl-rgb),.55),0 16px 40px -8px rgba(var(--fx-gl-rgb),.5); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-lift c-accent"><div class="fx-gl-lift-lbl">Atlas revenue</div><div class="fx-gl-lift-val">12.4%</div><div class="fx-gl-lift-sub">Quarter over quarter</div></div></div></div>
<div class="meta"><b>Glow Hover Lift</b> · <code>fx-glow-hover-lift</code><br>FX Store · GLOW SYSTEM<p>The card rises on hover and a glow pools beneath it; the ambient loop previews the lift without a pointer. Use on clickable KPI cards.</p></div>

</body>
</html>
