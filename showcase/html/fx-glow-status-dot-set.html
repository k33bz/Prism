<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Status Dot Set · Prism</title>
<!-- Prism showcase sample: fx-glow-status-dot-set (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.c-warn { --c: var(--warn); --c-rgb: 224,165,43; }
.c-pos { --c: var(--pos); --c-rgb: 63,185,80; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-status { max-width: 252px; display: grid; gap: 8px; font-size: 13px; }
.fx-gl-status-row { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }
.fx-gl-status-dot { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); width: 10px; height: 10px; border-radius: 50%; background: rgba(var(--fx-gl-rgb),1); animation-name: fxGlStatus; animation-duration: 2s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.fx-gl-status-name { flex: 1 1 0%; }
.fx-gl-status-val { color: var(--muted); font-size: 12px; }
@keyframes fxGlStatus { 
  0% { box-shadow: 0 0 6px rgba(var(--fx-gl-rgb),.9),0 0 14px rgba(var(--fx-gl-rgb),.6),0 0 0 0 rgba(var(--fx-gl-rgb),.6); }
  70%, 100% { box-shadow: 0 0 6px rgba(var(--fx-gl-rgb),.9),0 0 14px rgba(var(--fx-gl-rgb),.6),0 0 0 9px rgba(var(--fx-gl-rgb),0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-status c-pos"><div class="fx-gl-status-row"><span class="fx-gl-status-dot c-pos"></span><span class="fx-gl-status-name">Atlas API</span><span class="fx-gl-status-val">Healthy</span></div><div class="fx-gl-status-row"><span class="fx-gl-status-dot c-warn" style="--d:.66s"></span><span class="fx-gl-status-name">Comet DB</span><span class="fx-gl-status-val">Degraded</span></div><div class="fx-gl-status-row"><span class="fx-gl-status-dot c-neg" style="--d:1.33s"></span><span class="fx-gl-status-name">Ember Cache</span><span class="fx-gl-status-val">Down</span></div></div></div></div>
<div class="meta"><b>Glow Status Dot Set</b> · <code>fx-glow-status-dot-set</code><br>FX Store · GLOW SYSTEM<p>Each row's lamp pulses a halo in its own role colour; the dot re-reads the family token so one rule tints all three. Use for service rosters.</p></div>

</body>
</html>
