<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angular Dropdown Menu · Prism</title>
<!-- Prism showcase sample: spectrums-angular-dropdown-menu (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.cyb2 { --mag: #ff00a0; --mag-rgb: 255,0,160; --cyan: #00f0ff; --cyan-rgb: 0,240,255; --yellow: #fee600; --yellow-rgb: 254,230,0; --bg0: #0d0221; --bg1: #160a35; --bg2: #1e1046; --bg3: #271454; --ink: #eafcff; --dim: #8fa3c9; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; color: var(--ink); position: relative; }
.cyb2 * { box-sizing: border-box; }
.cyb2-menu { width: 216px; font-size: 12px; }
.cyb2-menu .cyb2-menu-trigger { background: var(--bg2); border: 1px solid var(--cyan); color: var(--cyan); padding: 9px 12px; font-weight: 700; letter-spacing: 0.08em; display: flex; justify-content: space-between; text-transform: uppercase; filter: drop-shadow(0 0 6px rgba(var(--cyan-rgb),.45)); }
.cyb2-menu .cyb2-menu-panel { margin-top: 2px; background: var(--bg1); border: 1px solid rgba(var(--cyan-rgb),.4); padding: 6px; filter: drop-shadow(0 0 10px rgba(var(--mag-rgb),.18)); }
.cyb2-menu .cyb2-menu-item { padding: 8px 10px; color: var(--dim); letter-spacing: 0.04em; position: relative; transition: color 0.12s, background 0.12s; cursor: pointer; }
.cyb2-menu .cyb2-menu-item:hover { color: var(--ink); background: rgba(var(--cyan-rgb),.12); }
.cyb2-menu .cyb2-menu-item:hover::before { content: ""; position: absolute; left: 0px; top: 0px; bottom: 0px; width: 3px; background: var(--cyan); }
.cyb2-menu .cyb2-menu-item--active { color: var(--mag); }
.cyb2-menu .cyb2-menu-item--active::before { content: ""; position: absolute; left: 0px; top: 0px; bottom: 0px; width: 3px; background: var(--mag); }
.cyb2-menu .cyb2-menu-item--danger { color: var(--mag); }
.cyb2-menu .cyb2-menu-item--danger:hover { background: rgba(var(--mag-rgb),.16); color: rgb(255, 220, 239); }
.cyb2-menu .cyb2-menu-sep { height: 1px; background: rgba(var(--cyan-rgb),.25); margin: 5px 2px; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="cyb2 cyb2-menu">
      <div class="cyb2-menu-trigger">SYS://MENU <span>▾</span></div>
      <div class="cyb2-menu-panel">
        <div class="cyb2-menu-item cyb2-menu-item--active">▸ Overview</div>
        <div class="cyb2-menu-item">Deployments</div>
        <div class="cyb2-menu-item">Neural Logs</div>
        <div class="cyb2-menu-sep"></div>
        <div class="cyb2-menu-item cyb2-menu-item--danger">Purge Cache</div>
      </div>
    </div></div></div>
<div class="meta"><b>Angular Dropdown Menu</b> · <code>spectrums-angular-dropdown-menu</code><br>Spectrums · Cyberpunk OS · Cyberpunk OS<p>Notch-cornered dropdown with a glowing cyan trigger and a magenta danger row; core Cyberpunk OS menu shell.</p></div>

</body>
</html>
