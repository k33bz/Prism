<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Cloud · Prism</title>
<!-- Prism showcase sample: lab-upload-cloud (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-upload { position: relative; width: 100px; height: 72px; }
.lab-ld-upload-c { position: absolute; left: 14px; top: 16px; width: 72px; height: 28px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); animation: 2s ease-in-out 0s infinite normal none running labLdCloud; }
.lab-ld-upload-c::before, .lab-ld-upload-c::after { content: ""; position: absolute; border-radius: 50%; background: inherit; border: inherit; bottom: 8px; }
.lab-ld-upload-c::before { left: 10px; width: 28px; height: 28px; }
.lab-ld-upload-c::after { left: 32px; width: 36px; height: 36px; }
.lab-ld-upload-a { position: absolute; left: 44px; top: 52px; width: 12px; height: 16px; animation: 1.3s ease-out 0s infinite normal none running labLdArrow; }
.lab-ld-upload-a::before { content: ""; position: absolute; left: 3px; top: -1px; width: 6px; height: 6px; border-left: 3px solid var(--c,var(--accent)); border-top: 3px solid var(--c,var(--accent)); transform: rotate(45deg); }
.lab-ld-upload-a::after { content: ""; position: absolute; left: 4.5px; top: 2px; width: 3px; height: 14px; border-radius: 2px; background: var(--c,var(--accent)); }
@keyframes labLdArrow { 
  0% { transform: translateY(0px); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translateY(-30px); opacity: 0; }
}
@keyframes labLdCloud { 
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-3px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-upload"><div class="lab-ld-upload-c"></div><i class="lab-ld-upload-a"></i></div></div></div>
<div class="meta"><b>Upload Cloud</b> · <code>lab-upload-cloud</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>An arrow rises out of the base and fades into a gently bobbing cloud, again and again. Use for uploads and sync in progress toward remote storage.</p></div>

</body>
</html>
