<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressable Key-Bank Tabs · Prism</title>
<!-- Prism showcase sample: spectrums-pressable-key-bank-tabs (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-menu-item:hover, .skeu-menu-item.skeu-active { background: linear-gradient(rgba(255, 176, 32, 0.22), rgba(255, 176, 32, 0.04)); color: rgb(255, 255, 255); }
.skeu-navbank { display: flex; gap: 3px; padding: 5px; border-radius: 10px; background-image: var(--skeu-gunmetal); border: 1px solid rgb(6, 6, 7); box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 0px inset, rgba(0, 0, 0, 0.6) 0px -1px 0px inset, rgba(0, 0, 0, 0.45) 0px 8px 18px; }
.skeu-navkey { font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; border: 1px solid rgb(5, 5, 6); border-radius: 7px; padding: 9px 12px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; color: var(--skeu-metal-3); cursor: pointer; background-image: var(--skeu-gunmetal); box-shadow: rgba(255, 255, 255, 0.08) 0px 1px 0px inset, rgb(0, 0, 0) 0px 2px 0px, rgba(0, 0, 0, 0.4) 0px 3px 5px; transition: transform 0.1s, box-shadow 0.1s, color 0.1s; }
.skeu-navkey:hover { color: var(--skeu-metal-1); }
.skeu-navkey.skeu-active { color: rgb(26, 18, 6); background: linear-gradient(180deg,#ffce6b,var(--skeu-amber) 55%,#c67f0d); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 3px rgba(0,0,0,.25), 0 1px 0 #7a4c06,
    0 0 10px rgba(var(--skeu-amber-rgb),.55); transform: translateY(1px); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-navbank">
      <button class="skeu-navkey skeu-active">HOME</button>
      <button class="skeu-navkey">STATS</button>
      <button class="skeu-navkey">LOGS</button>
      <button class="skeu-navkey">SYS</button>
    </div></div></div>
<div class="meta"><b>Pressable Key-Bank Tabs</b> · <code>spectrums-pressable-key-bank-tabs</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A row of physical-looking keycap tabs where the active one lights amber, sunken into a gunmetal bank — a tactile segmented nav.</p></div>

</body>
</html>
