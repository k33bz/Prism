<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Ring · Prism</title>
<!-- Prism showcase sample: charts-liquid-ring (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-lq-fig { width: 100%; max-width: 300px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 14px; box-sizing: border-box; }
.chx-lq-svg { display: block; height: 100%; overflow: visible; }
.chx-lq-val { fill: var(--ink); font: 600 13px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
.chx-lq-ring-flow { fill: none; stroke: rgba(var(--c-rgb,var(--accent-rgb)),.5); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 20, 12; animation-name: chxLqRingFlow; animation-duration: 1.4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.chx-lq-ring-track { fill: none; stroke: rgba(var(--c-rgb,var(--accent-rgb)),.13); stroke-width: 13; }
.chx-lq-ring-bub { transform-origin: 60px 60px; animation-name: chxLqSpin; animation-duration: 3.2s; animation-timing-function: linear; animation-iteration-count: infinite; }
.chx-lq-ring-bub2 { transform-origin: 60px 60px; transform: rotate(140deg); animation-name: chxLqSpin; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.chx-lq-bub { fill: rgba(255, 255, 255, 0.55); }
@keyframes chxLqRingFlow { 
  100% { stroke-dashoffset: -32; }
}
@keyframes chxLqSpin { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="chx-lq-fig"><svg class="chx-lq-svg" viewBox="0 0 120 120">
      <circle class="chx-lq-ring-track" cx="60" cy="60" r="42"></circle>
      <circle class="chx-lq-ring-flow" cx="60" cy="60" r="42"></circle>
      <g class="chx-lq-ring-bub"><circle class="chx-lq-bub" cx="60" cy="18" r="2.4"></circle><circle class="chx-lq-bub" cx="52" cy="19" r="1.6"></circle></g>
      <g class="chx-lq-ring-bub2"><circle class="chx-lq-bub" cx="60" cy="18" r="2"></circle></g>
      <text class="chx-lq-val" x="60" y="64">64%</text>
    </svg></div></div></div>
<div class="meta"><b>Liquid Ring</b> · <code>charts-liquid-ring</code><br>Charts &amp; Metrics · LIQUID GAUGES &amp; VARIANCE BANDS<p>A torus channel where fluid streams around the loop with bubbles carried along at two speeds. Use for a circulating or throughput reading.</p></div>

</body>
</html>
