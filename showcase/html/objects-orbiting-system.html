<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Orbiting System · Prism</title>
<!-- Prism showcase sample: objects-orbiting-system (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-orbit3d { position: relative; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(64deg); }
.nobj2-orbit3d .nobj2-sun { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff,var(--nobj2-a)); box-shadow: 0 0 18px var(--nobj2-a); transform: rotateX(-64deg); }
.nobj2-orbit3d .nobj2-track { position: absolute; left: 50%; top: 50%; border: 1.2px dashed color-mix(in srgb,var(--nobj2-ink) 30%,transparent); border-radius: 50%; }
.nobj2-tk1 { width: 74px; height: 74px; margin: -37px; }
.nobj2-tk2 { width: 112px; height: 112px; margin: -56px; }
.nobj2-orbit3d .nobj2-arm { position: absolute; left: 50%; top: 50%; width: 0px; height: 0px; }
.nobj2-orbit3d .nobj2-arm1 { animation: 4s linear 0s infinite normal none running nobj2Orb; }
.nobj2-orbit3d .nobj2-arm2 { animation: 8s linear 0s infinite reverse none running nobj2Orb; }
.nobj2-orbit3d .nobj2-planet { position: absolute; border-radius: 50%; transform: translateX(37px) rotateX(-64deg); width: 16px; height: 16px; margin: -8px; background: radial-gradient(circle at 35% 30%,#fff8,var(--nobj2-i)); }
.nobj2-orbit3d .nobj2-arm2 .nobj2-planet { transform: translateX(56px) rotateX(-64deg); background: radial-gradient(circle at 35% 30%,#fff8,var(--nobj2-p)); }
@keyframes nobj2Orb { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nobj2-scene"><div class="nobj2-orbit3d">
      <span class="nobj2-track nobj2-tk1"></span><span class="nobj2-track nobj2-tk2"></span>
      <span class="nobj2-sun"></span>
      <span class="nobj2-arm nobj2-arm1"><span class="nobj2-planet"></span></span>
      <span class="nobj2-arm nobj2-arm2"><span class="nobj2-planet"></span></span>
    </div></div></div></div>
<div class="meta"><b>Orbiting System</b> · <code>objects-orbiting-system</code><br>Animated Objects · 3D Objects<p>A star with planets on tilted orbital tracks in real perspective. Ecosystems, dependencies, scale.</p></div>

</body>
