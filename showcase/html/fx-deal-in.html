<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal In · Prism</title>
<!-- Prism showcase sample: fx-deal-in (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.fxc { position: relative; width: 100%; max-width: 300px; height: 150px; display: grid; place-items: center; perspective: 640px; --fxc-w: 90px; --fxc-h: 126px; }
.fxc-card { position: relative; width: var(--fxc-w); height: var(--fxc-h); transform-style: preserve-3d; border-radius: 9px; }
.fxc-face { position: absolute; inset: 0px; border-radius: 9px; overflow: hidden; backface-visibility: hidden; background: linear-gradient(160deg,var(--panel),var(--panel2)); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.45) 0px 6px 14px; }
.fxc-back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--panel) 6px 12px); }
.fxc-back::after { content: ""; position: absolute; inset: 14px; border-radius: 6px; border: 2px solid rgba(var(--accent-rgb),.4); }
.fxc-hd { position: absolute; left: 5px; right: 5px; top: 5px; height: 13px; border-radius: 4px; background: rgba(var(--accent-rgb),.85); display: flex; align-items: center; justify-content: space-between; padding: 0px 5px; }
.fxc-name { font: 800 7px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em; color: var(--bg); }
.fxc-cost { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); opacity: 0.7; }
.fxc-art { position: absolute; left: 5px; right: 5px; top: 21px; height: 48px; border-radius: 4px; overflow: hidden; background: radial-gradient(120% 90% at 50% 20%,rgba(var(--info-rgb),.55),rgba(var(--crit-rgb),.35) 60%,var(--bg)); }
.fxc-art::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: radial-gradient(circle at 40% 35%,rgba(255,255,255,.5),rgba(var(--accent-rgb),.5) 55%,transparent 72%); }
.fxc-type { position: absolute; left: 5px; right: 5px; top: 71px; height: 9px; border-radius: 2px; background: var(--panel2); font: 800 6px ui-sans-serif, system-ui, sans-serif; color: var(--muted); display: flex; align-items: center; padding: 0px 5px; letter-spacing: 0.1em; }
.fxc-txt { position: absolute; left: 6px; right: 6px; top: 83px; display: flex; flex-direction: column; gap: 3px; }
.fxc-txt i { height: 3px; border-radius: 2px; background: var(--line); }
.fxc-txt i:nth-child(2) { width: 85%; }
.fxc-txt i:nth-child(3) { width: 60%; }
.fxc-stat { position: absolute; right: 6px; bottom: 5px; font: 900 11px ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.fxc-f-reverse .fxc-art { box-shadow: inset 0 0 0 40px var(--bg); }
.fxc-m-flipy .fxc-card { animation: 4s ease-in-out 0s infinite normal none running fxcFlipY; }
.fxc-m-flipx .fxc-card { animation: 4s ease-in-out 0s infinite normal none running fxcFlipX; }
.fxc-m-tap .fxc-card { transform-origin: 70% 82%; animation: 3.2s ease-in-out 0s infinite normal none running fxcTap; }
.fxc-m-invert .fxc-card { animation: 4s ease-in-out 0s infinite normal none running fxcInvert; }
.fxc-m-deal .fxc-card { animation: 3.2s cubic-bezier(0.2, 0.8, 0.3, 1) 0s infinite normal none running fxcDeal; }
.fxc-m-toss .fxc-card { animation: 3.4s cubic-bezier(0.3, 0, 0.5, 1) 0s infinite normal none running fxcToss; }
.fxc-m-peek .fxc-card { transform-origin: left center; animation: 3.2s ease-in-out 0s infinite normal none running fxcPeek; }
.fxc-live .fxc-card { transition: transform 0.12s ease-out; transform: rotateX(calc((var(--fxc-my) - .5)*-26deg)) rotateY(calc((var(--fxc-mx) - .5)*26deg)); }
.fxc-live:not(.fxc-hot) .fxc-card { animation: 4s ease-in-out 0s infinite normal none running fxcOrbitCard; }
@keyframes fxcFlipY { 
  0%, 16% { transform: rotateY(0deg); }
  46%, 66% { transform: rotateY(180deg); }
  96%, 100% { transform: rotateY(0deg); }
}
@keyframes fxcFlipX { 
  0%, 16% { transform: rotateX(0deg); }
  46%, 66% { transform: rotateX(180deg); }
  96%, 100% { transform: rotateX(0deg); }
}
@keyframes fxcTap { 
  0%, 14% { transform: rotate(0deg); }
  40%, 60% { transform: rotate(90deg); }
  86%, 100% { transform: rotate(0deg); }
}
@keyframes fxcInvert { 
  0%, 14% { transform: rotate(0deg); }
  44%, 64% { transform: rotate(180deg); }
  94%, 100% { transform: rotate(0deg); }
}
@keyframes fxcDeal { 
  0% { transform: translate(120px, -40px) rotate(28deg) scale(0.7); opacity: 0; }
  18% { opacity: 1; }
  40%, 78% { transform: translate(0px, 0px) rotate(0deg) scale(1); opacity: 1; }
  92%, 100% { transform: translate(0px, 6px) rotate(0deg) scale(1); opacity: 0; }
}
@keyframes fxcToss { 
  0% { transform: translateX(-130px) rotate(-40deg) scale(0.9); opacity: 0; }
  12% { opacity: 1; }
  88% { opacity: 1; }
  100% { transform: translateX(130px) rotate(320deg) scale(0.9); opacity: 0; }
}
@keyframes fxcPeek { 
  0%, 20%, 100% { transform: rotateY(0deg); }
  50%, 70% { transform: rotateY(-46deg); }
}
@keyframes fxcOrbitCard { 
  0%, 100% { transform: rotateX(12deg) rotateY(-16deg); }
  50% { transform: rotateX(-12deg) rotateY(16deg); }
}
</style>
</head>
<body>
