<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draggable Radial Dial Menu · Prism</title>
<!-- Prism showcase sample: menus-draggable-radial-dial-menu (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-radial-drag { position: relative; width: 170px; height: 170px; }
.mnu-rd-track { position: absolute; inset: 16px; border: 2px dashed var(--line); border-radius: 50%; }
.mnu-rd-handle { position: absolute; left: 50%; top: 8px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: linear-gradient(150deg,var(--info),#1c5fc4); border: 2px solid var(--panel); cursor: grab; box-shadow: 0 6px 16px rgba(var(--info-rgb),.45); display: grid; place-items: center; color: rgb(255, 255, 255); font-size: 11px; z-index: 2; animation: 6s linear 0s infinite normal none running mnuDragOrbit; }
.mnu-rd-center { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; line-height: 1.2; }
@keyframes mnuDragOrbit { 
  0% { transform: rotate(0deg) translateY(-67px) rotate(0deg); }
  100% { transform: rotate(360deg) translateY(-67px) rotate(-360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-radial-drag">
      <div class="mnu-rd-track"></div>
      <div class="mnu-rd-handle">⠿</div>
      <div class="mnu-rd-center">drag<br>to select</div>
    </div></div></div>
<div class="meta"><b>Draggable Radial Dial Menu</b> · <code>menus-draggable-radial-dial-menu</code><br>Menus &amp; Actions · RADIAL &amp; GESTURE MENUS<p>A grabbable handle that orbits a circular track — drag it around to choose between options on a dial.</p></div>

</body>
</html>
