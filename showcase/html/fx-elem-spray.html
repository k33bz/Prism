<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Spray · Prism</title>
<!-- Prism showcase sample: fx-elem-spray (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-info { --c: var(--info); --c-rgb: 68,147,248; }
.fx-elem { position: relative; width: 330px; max-width: 100%; height: 150px; border-radius: 12px; overflow: hidden; --el: var(--c,var(--accent)); --el-rgb: var(--c-rgb,var(--accent-rgb)); background: radial-gradient(120% 90% at 50% 50%,rgba(var(--el-rgb),.12),rgba(var(--el-rgb),0) 70%),var(--panel2); border: 1px solid rgba(var(--el-rgb),.3); }
.fx-elem svg { position: absolute; inset: 0px; width: 100%; height: 100%; overflow: visible; }
.fx-elem-p { position: absolute; inset: 0px; pointer-events: none; }
.fx-elem-p i { position: absolute; border-radius: 50%; background: var(--el); box-shadow: 0 0 6px var(--el); opacity: 0; }
.fx-elem-spray-plume { transform-origin: 18px 75px; animation: 2s ease-in-out 0s infinite normal none running fxElemSprayBreath; }
.fx-elem-spray-core { stroke: var(--el); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 30, 16; opacity: 0.75; animation: 0.9s linear 0s infinite normal none running fxElemFlow; }
.fx-elem-spray .fx-elem-p i { left: 16px; top: calc(50% + var(--y,0px)); width: var(--s,3px); height: var(--s,3px); animation-name: fxElemSprayFly; animation-duration: 2s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.fx-elem-streak-proj .fx-elem-p i { right: 26px; top: 50%; width: var(--s,3px); height: var(--s,3px); animation-name: fxElemEmber; animation-duration: 0.9s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.fx-elem-burst .fx-elem-p i { left: 50%; top: 50%; width: var(--s,3px); height: var(--s,3px); animation-name: fxElemBurstSpark; animation-duration: 1.6s; animation-timing-function: ease-out; animation-iteration-count: infinite; }
.fx-elem-aura .fx-elem-p i { left: calc(50% + var(--x,0px)); top: 60%; width: var(--s,3px); height: var(--s,3px); animation-name: fxElemMote; animation-duration: 2.2s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes fxElemSprayBreath { 
  0%, 100% { transform: scaleY(0.9) skewY(-1deg); }
  50% { transform: scaleY(1.1) skewY(1.5deg); }
}
@keyframes fxElemFlow { 
  100% { stroke-dashoffset: -46; }
}
@keyframes fxElemSprayFly { 
  0% { transform: translate(0px, 0px) scale(1); opacity: 0; }
  8% { opacity: 1; }
  100% { transform: translate(300px,var(--dy,-24px)) scale(.3); opacity: 0; }
}
@keyframes fxElemEmber { 
  0% { transform: translate(0px, 0px); opacity: 1; }
  100% { transform: translate(-110px,var(--dy,-26px)) scale(.3); opacity: 0; }
}
@keyframes fxElemBurstSpark { 
  0% { transform: translate(0px, 0px); opacity: 0; }
  6% { opacity: 1; }
  60% { transform: translate(var(--dx,40px),var(--dy,-40px)); opacity: 0; }
  100% { opacity: 0; }
}
@keyframes fxElemMote { 
  0% { transform: translateY(0px); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(-84px) translateX(var(--sx,0px)); opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-elem fx-elem-spray c-info" role="img" aria-label="Elemental Spray: a jet of element colour fans out to the right while particles stream off it">
    <svg viewBox="0 0 330 150" aria-hidden="true"><defs>
      <linearGradient id="fxElemSprayG" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--el);stop-opacity:1"></stop><stop offset=".55" style="stop-color:var(--el);stop-opacity:.45"></stop><stop offset="1" style="stop-color:var(--el);stop-opacity:0"></stop></linearGradient>
      <filter id="fxElemSprayF" x="-10%" y="-60%" width="130%" height="220%"><feTurbulence type="fractalNoise" baseFrequency=".02 .07" numOctaves="3" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap><feGaussianBlur stdDeviation="3.2"></feGaussianBlur></filter>
      <filter id="fxElemSprayB" x="-5%" y="-50%" width="115%" height="200%"><feGaussianBlur stdDeviation="1.6"></feGaussianBlur></filter>
    </defs>
      <g class="fx-elem-spray-plume" filter="url(#fxElemSprayF)"><path fill="url(#fxElemSprayG)" opacity=".32" d="M18 75 C70 42,150 24,300 32 L308 118 C160 128,80 106,18 75 Z"></path><path fill="url(#fxElemSprayG)" opacity=".45" d="M18 75 C70 58,150 48,262 52 L264 94 C160 98,80 90,18 75 Z"></path></g>
      <path class="fx-elem-spray-core" filter="url(#fxElemSprayB)" d="M18 75 C80 70,150 63,250 60"></path>
    </svg>
    <span class="fx-elem-p"><i style="--d:0s;--y:-2px;--dy:-30px"></i><i style="--d:.2s;--y:3px;--dy:-10px;--s:2px"></i><i style="--d:.35s;--y:-5px;--dy:-44px;--s:2px"></i><i style="--d:.5s;--y:1px;--dy:8px"></i><i style="--d:.7s;--y:-1px;--dy:-20px;--s:4px"></i><i style="--d:.85s;--y:4px;--dy:18px;--s:2px"></i><i style="--d:1s;--y:-3px;--dy:-36px"></i><i style="--d:1.15s;--y:2px;--dy:-4px;--s:2px"></i><i style="--d:1.3s;--y:-4px;--dy:-52px;--s:2px"></i><i style="--d:1.5s;--y:0;--dy:12px;--s:4px"></i><i style="--d:1.65s;--y:-2px;--dy:-16px"></i><i style="--d:1.8s;--y:3px;--dy:26px;--s:2px"></i></span>
  </div></div></div>
<div class="meta"><b>Elemental Spray</b> · <code>fx-elem-spray</code><br>FX Store · Elemental Base<p>A jet fans out from the left: a turbulence-displaced plume, a dash-flow core and a stream of fading particles. Water shown; swap the colour role for mist, steam, poison or ice.</p></div>

</body>
