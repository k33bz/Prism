<!DOCTYPE html>
<html lang="en">
<head>

<title>Aurora Header Callout · Prism</title>
<!-- Prism showcase sample: obsidian-aurora-header-callout (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-co { width: 288px; max-width: 100%; background: linear-gradient(180deg,rgba(var(--ob-rgb),.11),rgba(var(--ob-rgb),.035)); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 3px solid var(--ob); border-radius: 10px; padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-cob { margin-top: 6px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.obs-cob b { color: var(--ink); }
.obs-co-inner .obs-cob { margin-top: 3px; font-size: 11.5px; }
.obs-aurband { position: relative; height: 34px; margin: -11px -13px 8px; border-bottom: 1px solid rgba(var(--ob-rgb),.3); overflow: hidden; display: flex; align-items: center; padding: 0px 13px; font-weight: 800; color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obs-aurband::before { content: ""; position: absolute; inset: -30% -60%; background: radial-gradient(60% 120% at 20% 50%,rgba(var(--ob-rgb),.55),transparent 60%),radial-gradient(50% 130% at 55% 40%,rgba(var(--pos-rgb),.4),transparent 60%),radial-gradient(55% 110% at 85% 60%,rgba(var(--info-rgb),.5),transparent 60%); filter: blur(8px); animation: 7s ease-in-out 0s infinite alternate none running obsAurora; }
@keyframes obsAurora { 
  0% { transform: translateX(-8%) skewX(-6deg); }
  100% { transform: translateX(8%) skewX(6deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-co" style="padding-top:11px"><div class="obs-aurband"><span style="position:relative;z-index:1">✦ Synthesis</span></div><div class="obs-cob">The strongest theme across these notes is <b>attention as infrastructure</b>.</div></div></div></div>
