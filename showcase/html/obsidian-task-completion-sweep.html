<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Completion Sweep · Prism</title>
<!-- Prism showcase sample: obsidian-task-completion-sweep (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-daily { width: 278px; max-width: 100%; min-height: 88px; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(150deg,var(--panel2),rgba(var(--ob-rgb),.07)); padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-daily h4 { margin: 0px; font-size: 12px; color: var(--ink); }
.obs-daily small { font-size: 9px; color: var(--dim); }
.obs-task-sweep .obs-taskrow { display: flex; align-items: center; gap: 7px; margin-top: 7px; position: relative; }
.obs-task-sweep .obs-taskbox { width: 13px; height: 13px; border: 1px solid rgba(var(--ob-rgb),.5); border-radius: 4px; position: relative; }
.obs-task-sweep .obs-taskbox::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px; border-top-color: ; border-top-style: ; border-right-color: ; border-right-style: ; border-bottom-color: ; border-bottom-style: ; border-left-color: ; border-left-style: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-width: 0px 2px 2px 0px; transform: rotate(45deg) scale(0); animation: 6s ease 0s infinite normal none running obsTaskCheck; }
.obs-taskrow:nth-child(3) .obs-taskbox::after { animation-delay: 1.3s; }
.obs-taskrow:nth-child(4) .obs-taskbox::after { animation-delay: 2.6s; }
.obs-taskrow i { height: 5px; flex: 1 1 0%; background: rgba(255, 255, 255, 0.1); border-radius: 3px; position: relative; overflow: hidden; }
.obs-taskrow i::after { content: ""; position: absolute; inset: 0px; background: var(--ob); transform: translateX(-105%); animation: 6s ease 0s infinite normal none running obsTaskSweep; opacity: 0.4; }
.obs-taskrow:nth-child(3) i::after { animation-delay: 1.3s; }
.obs-taskrow:nth-child(4) i::after { animation-delay: 2.6s; }
@keyframes obsTaskCheck { 
  0%, 10% { transform: rotate(45deg) scale(0); }
  18%, 72% { transform: rotate(45deg) scale(1); }
  88%, 100% { transform: rotate(45deg) scale(0); }
}
@keyframes obsTaskSweep { 
  0%, 12% { transform: translateX(-105%); }
  25%, 72% { transform: translateX(0px); }
  88%, 100% { transform: translateX(105%); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-daily obs-task-sweep"><h4>Today</h4><div class="obs-taskrow"><span class="obs-taskbox"></span><i></i></div><div class="obs-taskrow"><span class="obs-taskbox"></span><i style="max-width:82%"></i></div><div class="obs-taskrow"><span class="obs-taskbox"></span><i style="max-width:67%"></i></div></div></div></div>
<div class="meta"><b>Task Completion Sweep</b> · <code>obsidian-task-completion-sweep</code><br>Obsidian Facets · TASKS &amp; DAILY NOTES<p>Three daily tasks complete in sequence with checks and moving highlight bars.</p></div>

</body>
</html>
