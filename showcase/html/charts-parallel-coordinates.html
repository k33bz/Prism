<style id="prism-tokens">

<style id="showcase-shell">

body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}

.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-pl-svg { width: 100%; max-width: 300px; height: auto; display: block; overflow: hidden; font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-pl-svg text { font: 600 8px ui-sans-serif, system-ui, sans-serif; }
.chx-pl-ax { stroke: var(--line); stroke-width: 1; fill: none; }
.chx-pl-pc-ln { fill: none; stroke: rgba(var(--info-rgb),.45); stroke-width: 1.2; stroke-linejoin: round; stroke-dasharray: 1, 1; stroke-dashoffset: 0; animation-name: chxPlDraw; animation-duration: 4s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-fill-mode: both; animation-delay: calc(var(--i)*.22s); }
.chx-pl-pc-hi { stroke: var(--c,var(--accent)); stroke-width: 2.2; }
@keyframes chxPlDraw { 
  0% { stroke-dashoffset: 1; }
  40%, 100% { stroke-dashoffset: 0; }
}
</style>
