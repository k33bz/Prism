<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Cylinder · Prism</title>
<!-- Prism showcase sample: arch-database-cylinder (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-lbl { font: 700 10px / 1.1 ui-sans-serif, system-ui, sans-serif; color: var(--muted); letter-spacing: 0.03em; text-align: center; }
.arch-node { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px; }
.arch-node .arch-lbl { max-width: 88px; }
.arch-dbcyl { position: relative; width: 52px; height: 56px; margin-top: 8px; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-left-color: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; border-radius: 0px 0px 26px 26px / 0px 0px 14px 14px; background: linear-gradient(180deg,rgba(var(--acr,var(--info-rgb)),.22),rgba(var(--acr,var(--info-rgb)),.08)); display: grid; place-items: center; color: var(--ac,var(--info)); font: 800 12px / 1 ui-sans-serif, system-ui, sans-serif; animation: 3.6s ease-in-out 0s infinite normal none running archGlow; }
.arch-dbcyl::before { content: ""; position: absolute; left: -1px; right: -1px; top: -8px; height: 15px; border-radius: 50%; background: rgba(var(--acr,var(--info-rgb)),.32); border: 1px solid rgba(var(--acr,var(--info-rgb)),.6); }
.arch-dbcyl::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -8px; height: 15px; border-radius: 50%; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-left-color: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; background: rgba(var(--acr,var(--info-rgb)),.1); }
@keyframes archGlow { 
  0%, 100% { box-shadow: 0 0 0 rgba(var(--acr,var(--info-rgb)),0),0 1px 0 rgba(0,0,0,.22); }
  50% { box-shadow: 0 0 15px rgba(var(--acr,var(--info-rgb)),.4),0 1px 0 rgba(0,0,0,.22); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="arch-node" style="--ac:var(--crit);--acr:var(--crit-rgb)">
      <div class="arch-dbcyl">DB</div>
      <div class="arch-lbl">Database</div>
    </div></div></div>
<div class="meta"><b>Database Cylinder</b> · <code>arch-database-cylinder</code><br>Architecture Diagrams · SERVICE NODES<p>A pure-CSS database cylinder with rounded top and bottom caps — the classic datastore icon, no image needed.</p></div>
