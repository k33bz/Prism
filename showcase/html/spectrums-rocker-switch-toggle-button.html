<title>Rocker-Switch Toggle Button · Prism</title>
<!-- Prism showcase sample: spectrums-rocker-switch-toggle-button (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-rocker { position: relative; width: 76px; height: 38px; border-radius: 19px; cursor: pointer; background: linear-gradient(rgb(28, 29, 31), rgb(12, 13, 14)); border: 1px solid rgb(0, 0, 0); box-shadow: rgba(0, 0, 0, 0.7) 0px 3px 6px inset, rgba(255, 255, 255, 0.06) 0px -1px 0px inset; display: flex; align-items: center; padding: 0px 9px; }
.skeu-rocker-on, .skeu-rocker-off { font-size: 9px; font-weight: 800; letter-spacing: 0.05em; z-index: 1; }
.skeu-rocker-on { color: var(--pos); margin-right: auto; }
.skeu-rocker-off { color: var(--skeu-metal-5); margin-left: auto; }
.skeu-rocker-thumb { position: absolute; top: 3px; left: 41px; width: 32px; height: 32px; border-radius: 50%; background-image: var(--skeu-brushed-metal); border: 1px solid rgb(125, 127, 132); box-shadow: rgba(255, 255, 255, 0.85) 0px 1px 0px inset, rgba(0, 0, 0, 0.35) -1px -1px 2px inset, rgba(0, 0, 0, 0.55) 0px 3px 6px; transition: left 0.16s; }
.skeu-rocker:hover .skeu-rocker-thumb { filter: brightness(1.04); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-rocker"><span class="skeu-rocker-on">ON</span><span class="skeu-rocker-off">OFF</span><div class="skeu-rocker-thumb"></div></div></div></div>
<div class="meta"><b>Rocker-Switch Toggle Button</b> · <code>spectrums-rocker-switch-toggle-button</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A recessed rocker housing with a brushed-metal thumb that slides between ON and OFF labels, like a physical power rocker.</p></div>
