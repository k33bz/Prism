<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta Cells · Prism</title>
<!-- Prism showcase sample: tables-delta-cells (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-num { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; text-align: right !important; }
.dtb-row .dtb-num { text-align: right; }
.dtb-up { color: var(--pos); font-weight: 800; }
.dtb-down { color: var(--neg); font-weight: 800; }
.dtb-flat { color: var(--dim); font-weight: 800; }
.dtb-delta td.dtb-flash { animation: 3.2s ease-out 0s infinite normal none running dtbFlash; }
.dtb-delta tbody tr:nth-child(3) td.dtb-flash { animation-delay: 1.1s; animation-name: dtbFlashNeg; }
.dtb-delta tbody tr:nth-child(4) td.dtb-flash { animation-delay: 2.2s; }
.dtb-rowmove .dtb-arr, .dtb-resort th.dtb-num, .dtb-fall th.dtb-num { cursor: pointer; user-select: none; }
.dtb-rowmove .dtb-arr:hover, .dtb-resort th.dtb-num:hover, .dtb-fall th.dtb-num:hover { color: var(--c,var(--accent)); }
.dtb-tbl.manual td.flip { transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
.dtb-tbl.manual tr.lifted td { position: relative; z-index: 2; box-shadow: 0 6px 16px rgba(0,0,0,.45),inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.14); }
@keyframes dtbFlash { 
  0% { box-shadow: inset 0 0 0 999px rgba(var(--pos-rgb),.28); }
  35%, 100% { box-shadow: inset 0 0 0 999px rgba(var(--pos-rgb),0); }
}
@keyframes dtbFlashNeg { 
  0% { box-shadow: inset 0 0 0 999px rgba(var(--neg-rgb),.28); }
  35%, 100% { box-shadow: inset 0 0 0 999px rgba(var(--neg-rgb),0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl dtb-delta"><thead><tr><th>KPI</th><th class="dtb-num">Value</th><th class="dtb-num">Δ vs LW</th></tr></thead><tbody>
      <tr><td>Signups</td><td class="dtb-num">1,284</td><td class="dtb-num dtb-up dtb-flash">▲ 12.4%</td></tr>
      <tr><td>Churn</td><td class="dtb-num">2.1%</td><td class="dtb-num dtb-up">▼ 0.3 pt</td></tr>
      <tr><td>Refunds</td><td class="dtb-num">$4.9K</td><td class="dtb-num dtb-down dtb-flash">▲ 8.0%</td></tr>
      <tr><td>NPS</td><td class="dtb-num">61</td><td class="dtb-num dtb-up dtb-flash">▲ 4</td></tr>
      <tr><td>Tickets</td><td class="dtb-num">318</td><td class="dtb-num dtb-flat">— 0.0%</td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Delta Cells</b> · <code>tables-delta-cells</code><br>Tables &amp; Data Layouts · STATUS &amp; DATA CELLS<p>Change-versus-baseline cells with directional arrows in success/danger colours, each flashing when its value updates.</p></div>

</body>
</html>
