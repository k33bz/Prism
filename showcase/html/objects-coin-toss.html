<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Toss · Prism</title>
<!-- Prism showcase sample: objects-coin-toss (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ob3d-scene { width: 100%; max-width: 300px; height: 140px; perspective: 620px; perspective-origin: 50% 45%; display: grid; place-items: center; overflow: hidden; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); --oc: var(--c,var(--accent)); --ocr: var(--c-rgb,var(--accent-rgb)); }
.ob3d-scene * { box-sizing: border-box; }
.ob3d-coin-air { transform-style: preserve-3d; animation: 4s ease-in-out 0s infinite normal none running ob3dToss; }
.ob3d-coin-body { width: 66px; height: 66px; position: relative; transform-style: preserve-3d; animation: 4s cubic-bezier(0.45, 0, 0.55, 1) 0s infinite normal none running ob3dTumble; }
.ob3d-coin-face { position: absolute; inset: 0px; border-radius: 50%; backface-visibility: hidden; background: rgba(var(--ocr),.4); border: 3px solid var(--oc); display: grid; place-items: center; font-weight: 800; font-size: 24px; color: var(--oc); transform: translateZ(3px); }
.ob3d-coin-tail { transform: rotateX(180deg) translateZ(3px); background: var(--panel2); }
.ob3d-coin-shadow { position: absolute; left: 50%; bottom: 8px; width: 66px; height: 12px; border-radius: 50%; background: rgba(0, 0, 0, 0.5); transform: translateX(-50%); animation: 4s ease-in-out 0s infinite normal none running ob3dCoinShadow; }
.ob3d-coin:hover .ob3d-coin-air, .ob3d-coin:hover .ob3d-coin-shadow { animation-name: none; }
.ob3d-coin:hover .ob3d-coin-body { animation: 0.7s linear 0s infinite normal none running ob3dCoinSpin; }
@keyframes ob3dToss { 
  0%, 10% { transform: translateY(22px); }
  45% { transform: translateY(-28px); }
  80%, 100% { transform: translateY(22px); }
}
@keyframes ob3dTumble { 
  0%, 10% { transform: rotateX(0deg); }
  80%, 100% { transform: rotateX(1080deg); }
}
@keyframes ob3dCoinShadow { 
  0%, 10%, 80%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
  45% { transform: translateX(-50%) scale(0.5); opacity: 0.2; }
}
@keyframes ob3dCoinSpin { 
  100% { transform: rotateX(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ob3d-scene ob3d-coin"><div class="ob3d-coin-air"><div class="ob3d-coin-body"><div class="ob3d-coin-face">N</div><div class="ob3d-coin-face ob3d-coin-tail">1</div></div></div><div class="ob3d-coin-shadow"></div></div></div></div>
<div class="meta"><b>Coin Toss</b> · <code>objects-coin-toss</code><br>Animated Objects · 3D CSS OBJECTS<p>A coin springs up, tumbles end over end and lands as its shadow shrinks and grows. Hover keeps it spinning. Payments, rewards, decisions.</p></div>

</body>
</html>
