<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin VU Meters · Prism</title>
<!-- Prism showcase sample: spectrums-twin-vu-meters (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-vurow { display: flex; gap: 12px; }
.skeu-vu { position: relative; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgb(58, 61, 67), rgb(24, 26, 29) 70%, rgb(8, 8, 9) 100%); border: 3px solid rgb(85, 86, 90); box-shadow: rgba(0, 0, 0, 0.7) 0px 2px 6px inset, rgba(0, 0, 0, 0.45) 0px 4px 8px; }
.skeu-vu-needle { position: absolute; left: 50%; bottom: 50%; width: 2px; height: 20px; border-radius: 2px; background: var(--skeu-amber); transform-origin: center bottom; transform: translateX(-50%) rotate(var(--r,0deg)); box-shadow: 0 0 4px rgba(var(--skeu-amber-rgb),.8); }
.skeu-vu-needle::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; background: rgb(204, 204, 204); transform: translateX(-50%); }
.skeu-vu-needle.skeu-vu-anim { animation: 2.8s ease-in-out 0s infinite normal none running skeuVuSwing; }
.skeu-vu-needle.skeu-vu-anim.skeu-vu-2 { animation-delay: -1.4s; }
@keyframes skeuVuSwing { 
  0%, 100% { transform: translateX(-50%) rotate(-38deg); }
  50% { transform: translateX(-50%) rotate(38deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-vurow">
      <div class="skeu-vu"><div class="skeu-vu-needle skeu-vu-anim"></div></div>
      <div class="skeu-vu"><div class="skeu-vu-needle skeu-vu-anim skeu-vu-2"></div></div>
    </div></div></div>
<div class="meta"><b>Twin VU Meters</b> · <code>spectrums-twin-vu-meters</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A pair of recessed analog VU-meter dials with sweeping amber needles, styled after vintage audio-hardware level meters.</p></div>

</body>
</html>
