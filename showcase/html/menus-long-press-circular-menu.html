<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long-press Circular Menu · Prism</title>
<!-- Prism showcase sample: menus-long-press-circular-menu (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-longpress { position: relative; width: 170px; height: 170px; }
.mnu-lp-touch { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; z-index: 2; }
.mnu-lp-touch::before, .mnu-lp-touch::after { content: ""; position: absolute; inset: 0px; border-radius: 50%; border: 2px solid var(--accent); animation: 2.2s ease-out 0s infinite normal none running mnuRipple; }
.mnu-lp-touch::after { animation-delay: 1.1s; }
.mnu-lp-finger { position: absolute; inset: 0px; border-radius: 50%; background: radial-gradient(circle,rgba(var(--accent-rgb),.5),rgba(var(--accent-rgb),.15)); display: grid; place-items: center; font-size: 16px; color: rgb(26, 18, 6); font-weight: 800; }
.mnu-lp-item { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: grid; place-items: center; font-size: 13px; }
.mnu-lp-item:nth-child(3) { transform: translate(0px, -64px); }
.mnu-lp-item:nth-child(4) { transform: translate(55px, -32px); }
.mnu-lp-item:nth-child(5) { transform: translate(55px, 32px); }
.mnu-lp-item:nth-child(6) { transform: translate(0px, 64px); }
.mnu-lp-item:nth-child(7) { transform: translate(-55px, 32px); }
.mnu-lp-item:nth-child(8) { transform: translate(-55px, -32px); }
@keyframes mnuRipple { 
  0% { transform: scale(0.4); opacity: 0.55; }
  100% { transform: scale(2.6); opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-longpress">
      <div class="mnu-lp-item">✂</div>
      <div class="mnu-lp-item">📋</div>
      <div class="mnu-lp-item">📌</div>
      <div class="mnu-lp-item">🗑</div>
      <div class="mnu-lp-item">↗</div>
      <div class="mnu-lp-item">⭐</div>
      <div class="mnu-lp-touch"><div class="mnu-lp-finger">☉</div></div>
    </div></div></div>
<div class="meta"><b>Long-press Circular Menu</b> · <code>menus-long-press-circular-menu</code><br>Menus &amp; Actions · RADIAL &amp; GESTURE MENUS<p>A touch-triggered radial menu with a rippling press point at the center, for mobile long-press gestures.</p></div>

</body>
</html>
