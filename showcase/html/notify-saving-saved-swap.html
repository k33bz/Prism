<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saving → Saved Swap · Prism</title>
<!-- Prism showcase sample: notify-saving-saved-swap (gallery: notify). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ns-save { position: relative; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.ns-save .ns-sp { width: 15px; height: 15px; border-radius: 50%; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-left-color: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-top-color: var(--info); animation: 0.8s linear 0s infinite normal none running nsSpin, 4s step-end 0s infinite normal none running nsSaveHide; }
.ns-save .ns-ok { position: absolute; color: var(--pos); font-weight: 900; opacity: 0; animation: 4s step-end 0s infinite normal none running nsSaveShow; }
.ns-save .ns-lbl::after { content: "Saving…"; animation: 4s step-end 0s infinite normal none running nsSaveTxt; }
@keyframes nsSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes nsSaveHide { 
  0%, 60% { opacity: 1; }
  60.01%, 100% { opacity: 0; }
}
@keyframes nsSaveShow { 
  0%, 60% { opacity: 0; }
  60.01%, 100% { opacity: 1; }
}
@keyframes nsSaveTxt { 
  0%, 60% { content: "Saving…"; color: var(--muted); }
  60.01%, 100% { content: "Saved"; color: var(--pos); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ns-save"><span class="ns-sp"></span><span class="ns-ok">✓</span><span class="ns-lbl"></span></div></div></div>
<div class="meta"><b>Saving → Saved Swap</b> · <code>notify-saving-saved-swap</code><br>Notifications &amp; Status · PROGRESS NOTIFICATIONS<p>A spinner that resolves to a &quot;Saved&quot; check; use for autosave feedback.</p></div>

</body>
</html>
