<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Flip-Number Stepper · Prism</title>
<!-- Prism showcase sample: input-3d-flip-number-stepper (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-flipnum { display: flex; align-items: center; gap: 14px; }
.nin2-flipnum button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font-size: 20px; cursor: pointer; transition: 0.15s; }
.nin2-flipnum button:hover { border-color: var(--accent); color: var(--accent); }
.nin2-flipnum .nin2-dig { width: 64px; height: 64px; perspective: 300px; }
.nin2-flipnum .nin2-card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; font: 800 30px ui-monospace, Menlo, monospace; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: linear-gradient(180deg,var(--panel2),var(--panel)); border: 1px solid var(--line); color: var(--accent); }
.nin2-flipnum .nin2-card.nin2-roll { animation: 0.35s ease 0s 1 normal none running nin2Roll; }
@keyframes nin2Roll { 
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(-90deg); }
  100% { transform: rotateX(0deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-flipnum" data-v="3">
      <button type="button" data-d="-1">−</button>
      <div class="nin2-dig"><div class="nin2-card">3</div></div>
      <button type="button" data-d="1">+</button>
    </div></div></div>
<div class="meta"><b>3D Flip-Number Stepper</b> · <code>input-3d-flip-number-stepper</code><br>Input Methods · 3D &amp; Depth Controls<p>A stepper whose digit does a split-flap flip on the X axis each time the count changes. The mechanical-counter feel for quantities.</p></div>

</body>
</html>
