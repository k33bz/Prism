<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock Nav · Prism</title>
<!-- Prism showcase sample: menus-dock-nav (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-dock { display: flex; align-items: flex-end; gap: 6px; padding: 9px 13px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.42) 0px 14px 32px; }
.mnu-dock a { position: relative; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; background: var(--card); border: 1px solid var(--line); color: var(--muted); text-decoration: none; transform-origin: center bottom; transition: transform 0.22s cubic-bezier(0.34, 1.5, 0.5, 1), background 0.18s, color 0.18s; }
.mnu-dock a:hover { transform: scale(1.36) translateY(-6px); background: rgba(var(--accent-rgb),.16); color: var(--accent); z-index: 2; }
.mnu-dock a::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%) translateY(4px); background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: 600 10px ui-sans-serif, system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.18s; }
.mnu-dock a:hover::after { opacity: 1; transform: translateX(-50%) translateY(0px); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><nav class="mnu-dock"><a href="#" data-tip="Home">🏠</a><a href="#" data-tip="Search">🔍</a><a href="#" data-tip="Create">➕</a><a href="#" data-tip="Inbox">📬</a><a href="#" data-tip="Profile">👤</a></nav></div></div>
<div class="meta"><b>Dock Nav</b> · <code>menus-dock-nav</code><br>Menus &amp; Actions · NAVIGATION MOTION<p>Hover an icon and it springs up and enlarges with a label above it, the macOS dock. A bouncy cubic-bezier gives the magnify its life.</p></div>

</body>
</html>
