<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illuminated Power Button · Prism</title>
<!-- Prism showcase sample: spectrums-illuminated-power-button (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-pwrbtn { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgb(5, 5, 6); cursor: pointer; background: radial-gradient(circle at 34% 28%, rgb(76, 79, 86), rgb(38, 40, 44) 60%, rgb(18, 19, 21) 100%); box-shadow: rgba(255, 255, 255, 0.25) 0px 1px 0px inset, rgba(0, 0, 0, 0.55) 0px -3px 5px inset, rgb(10, 11, 12) 0px 5px 0px, rgba(0, 0, 0, 0.55) 0px 10px 18px; display: grid; place-items: center; font-size: 20px; color: var(--skeu-amber); transition: transform 0.09s, box-shadow 0.09s; }
.skeu-pwrbtn .skeu-pwr-ring { position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(var(--skeu-amber-rgb),.55), 0 0 14px 3px rgba(var(--skeu-amber-rgb),.4); animation: 2.6s ease-in-out 0s infinite normal none running skeuLedPulse; }
.skeu-pwrbtn:active { transform: translateY(5px); box-shadow: rgba(0, 0, 0, 0.7) 0px 3px 8px inset, rgb(10, 11, 12) 0px 1px 0px, rgba(0, 0, 0, 0.5) 0px 2px 5px; }
@keyframes skeuLedPulse { 
  0%, 100% { box-shadow: 0 0 10px 3px rgba(var(--skeu-amber-rgb),.6), inset 0 -2px 3px rgba(0,0,0,.45),
    inset 0 2px 2px rgba(255,255,255,.55), 0 0 0 3px #35363a, 0 0 0 4px #141516; }
  50% { box-shadow: 0 0 17px 5px rgba(var(--skeu-amber-rgb),.9), inset 0 -2px 3px rgba(0,0,0,.45),
    inset 0 2px 2px rgba(255,255,255,.55), 0 0 0 3px #35363a, 0 0 0 4px #141516; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><button class="skeu-pwrbtn"><span class="skeu-pwr-ring"></span>⏻</button></div></div>
<div class="meta"><b>Illuminated Power Button</b> · <code>spectrums-illuminated-power-button</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A round power button with a breathing amber halo that presses down flush into its own recessed collar.</p></div>

</body>
</html>
