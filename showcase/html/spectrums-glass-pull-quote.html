<!DOCTYPE html>

<title>Glass Pull-Quote · Prism</title>
<!-- Prism showcase sample: spectrums-glass-pull-quote (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.glm-scene { position: relative; width: 100%; min-height: 150px; border-radius: 18px; overflow: hidden; display: flex; align-items: center; justify-content: center; isolation: isolate; padding: 20px; }
.glm-scene, .glm-scene.glm-v1 { background: radial-gradient(circle at 18% 22%, rgba(var(--glm-accent-rgb),.85) 0%, rgba(var(--glm-accent-rgb),0) 45%),
    radial-gradient(circle at 82% 28%, rgba(var(--glm-info-rgb),.8) 0%, rgba(var(--glm-info-rgb),0) 48%),
    radial-gradient(circle at 50% 90%, rgba(var(--glm-crit-rgb),.75) 0%, rgba(var(--glm-crit-rgb),0) 50%),
    linear-gradient(150deg,#181229,#0b0e17 70%); }
.glm-scene.glm-v2 { background: radial-gradient(circle at 16% 82%, rgba(var(--glm-pos-rgb),.8) 0%, rgba(var(--glm-pos-rgb),0) 46%),
    radial-gradient(circle at 85% 18%, rgba(var(--glm-warn-rgb),.78) 0%, rgba(var(--glm-warn-rgb),0) 48%),
    radial-gradient(circle at 60% 65%, rgba(var(--glm-info-rgb),.7) 0%, rgba(var(--glm-info-rgb),0) 50%),
    linear-gradient(160deg,#0f1c2c,#0b0e17 70%); }
.glm-scene.glm-v3 { background: radial-gradient(circle at 28% 25%, rgba(var(--glm-crit-rgb),.82) 0%, rgba(var(--glm-crit-rgb),0) 48%),
    radial-gradient(circle at 78% 70%, rgba(var(--glm-pos-rgb),.75) 0%, rgba(var(--glm-pos-rgb),0) 48%),
    radial-gradient(circle at 12% 88%, rgba(var(--glm-info-rgb),.65) 0%, rgba(var(--glm-info-rgb),0) 46%),
    linear-gradient(145deg,#1c1026,#0b0e17 70%); }
.glm-scene.glm-v4 { background: radial-gradient(circle at 72% 22%, rgba(var(--glm-accent-rgb),.82) 0%, rgba(var(--glm-accent-rgb),0) 48%),
    radial-gradient(circle at 20% 68%, rgba(var(--glm-neg-rgb),.7) 0%, rgba(var(--glm-neg-rgb),0) 46%),
    radial-gradient(circle at 90% 85%, rgba(var(--glm-info-rgb),.72) 0%, rgba(var(--glm-info-rgb),0) 48%),
    linear-gradient(155deg,#161022,#0b0e17 70%); }
.glm-scene.glm-v5 { background: radial-gradient(circle at 50% 15%, rgba(var(--glm-warn-rgb),.8) 0%, rgba(var(--glm-warn-rgb),0) 46%),
    radial-gradient(circle at 15% 75%, rgba(var(--glm-crit-rgb),.72) 0%, rgba(var(--glm-crit-rgb),0) 48%),
    radial-gradient(circle at 88% 78%, rgba(var(--glm-pos-rgb),.7) 0%, rgba(var(--glm-pos-rgb),0) 48%),
    linear-gradient(150deg,#1a1420,#0b0e17 70%); }
.glm-scene::after { content: ""; position: absolute; inset: 0px; pointer-events: none; background: radial-gradient(420px 220px at 50% -10%, rgba(255, 255, 255, 0.1), transparent 65%); }
.glm-glass { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--glm-glass-1), var(--glm-glass-2)); backdrop-filter: var(--glm-blur); border: 1px solid var(--glm-border); border-radius: 16px; box-shadow: var(--glm-shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 26px rgba(255,255,255,.05); color: rgb(255, 255, 255); }
.glm-glass::before { content: ""; position: absolute; top: 0px; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent); pointer-events: none; }
.glm-glass::after { content: ""; position: absolute; inset: 0px; pointer-events: none; border-radius: inherit; background: radial-gradient(140px 60px at 30% -10%, rgba(255, 255, 255, 0.2), transparent 70%); }
.glm-quote { width: 230px; padding: 16px 16px 14px; border-radius: 16px; text-align: left; }
.glm-quote-mark { font-size: 30px; line-height: 0.6; color: rgba(255, 255, 255, 0.55); font-family: Georgia, serif; }
.glm-quote-txt { font-size: 12.5px; color: rgb(255, 255, 255); line-height: 1.55; margin-top: 2px; }
.glm-quote-attr { margin-top: 9px; font-size: 10.5px; color: rgba(255, 255, 255, 0.6); font-weight: 700; }
</style>
</head>
