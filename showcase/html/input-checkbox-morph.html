<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox Morph · Prism</title>
<!-- Prism showcase sample: input-checkbox-morph (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-chkmorph { display: flex; flex-direction: column; gap: 12px; }
.nin2-chkmorph label { display: inline-flex; align-items: center; gap: 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.nin2-chkmorph input { position: absolute; opacity: 0; }
.nin2-chkmorph .nin2-bx { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); position: relative; transition: 0.2s; }
.nin2-chkmorph .nin2-bx::after { content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border-style: solid; border-color: rgb(26, 18, 0); border-image: none; border-width: 0px 2.5px 2.5px 0px; transform: rotate(45deg) scale(0); transition: transform 0.2s cubic-bezier(0.5, 1.6, 0.4, 1); }
.nin2-chkmorph input:checked + .nin2-bx { background: var(--accent); border-color: var(--accent); }
.nin2-chkmorph input:checked + .nin2-bx::after { transform: rotate(45deg) scale(1); }
.nin2-chkmorph input:checked ~ .nin2-txt { color: var(--ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-chkmorph">
      <label><input type="checkbox" checked=""><span class="nin2-bx"></span><span class="nin2-txt">Enable versioning</span></label>
      <label><input type="checkbox"><span class="nin2-bx"></span><span class="nin2-txt">Require MFA delete</span></label>
      <label><input type="checkbox" checked=""><span class="nin2-bx"></span><span class="nin2-txt">Encrypt at rest</span></label>
    </div></div></div>
<div class="meta"><b>Checkbox Morph</b> · <code>input-checkbox-morph</code><br>Input Methods · Fields, Pickers &amp; Actions<p>An empty box that pops a drawn checkmark in with a springy scale when ticked. A crisper alternative to the native control.</p></div>

</body>
</html>
