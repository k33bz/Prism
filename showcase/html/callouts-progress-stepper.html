<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Stepper · Prism</title>
<!-- Prism showcase sample: callouts-progress-stepper (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-progstep { width: 236px; }
.ann-progstep .ann-pline { position: relative; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 14px 6px 0px; }
.ann-progstep .ann-pfill { position: absolute; inset: 0px; width: 60%; border-radius: 999px; transform-origin: left center; background: linear-gradient(90deg,var(--ann-i),var(--ann-p)); animation: 3.4s ease-in-out 0s infinite normal none running annFill; }
.ann-progstep .ann-pdots { display: flex; justify-content: space-between; margin: -9px 4px 6px; }
.ann-progstep .ann-pdots i { width: 12px; height: 12px; border-radius: 50%; background: var(--card,#0c0f18); border: 2px solid var(--ann-i); }
.ann-progstep .ann-plab { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); padding: 0px 2px; }
@keyframes annFill { 
  0% { width: 8%; }
  50% { width: 72%; }
  100% { width: 8%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-progstep">
      <div class="ann-pdots"><i></i><i></i><i></i><i></i></div>
      <div class="ann-pline"><div class="ann-pfill"></div></div>
      <div class="ann-plab"><span>Plan</span><span>Build</span><span>Test</span><span>Ship</span></div>
    </div></div></div>
<div class="meta"><b>Progress Stepper</b> · <code>callouts-progress-stepper</code><br>Callouts &amp; Annotations · TIMELINES &amp; STEPPERS<p>Connecting line that continuously fills to convey ongoing progress across stages.</p></div>

</body>
</html>
