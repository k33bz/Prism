<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Layered Ribbon Lines · Prism</title>
<!-- Prism showcase sample: charts-3d-layered-ribbon-lines (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.6s ease-out 0s 1 normal forwards running draw; }
@keyframes draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="240" height="185" viewBox="0 0 240 185" style="overflow:visible">
        <!-- 3D layered ribbon / multi-plane line chart -->
        <defs>
          <linearGradient id="rib1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--crit)" stop-opacity=".5"></stop><stop offset="1" stop-color="var(--crit)" stop-opacity=".05"></stop></linearGradient>
          <linearGradient id="rib2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--info)" stop-opacity=".5"></stop><stop offset="1" stop-color="var(--info)" stop-opacity=".05"></stop></linearGradient>
          <linearGradient id="rib3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".55"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity=".05"></stop></linearGradient>
        </defs>
        <!-- three receding z-planes, back to front -->
        <g>
          <path d="M50,70 Q80,55 110,68 T180,52 L200,56 L200,95 L50,95 Z" fill="url(#rib1)" stroke="var(--crit)" stroke-width="1.5"></path>
          <path d="M38,98 Q70,82 100,96 T172,78 L194,84 L194,120 L38,120 Z" fill="url(#rib2)" stroke="var(--info)" stroke-width="1.5"></path>
          <path class="draw" style="--len:340" d="M26,128 Q60,108 92,124 T166,104 L188,112 L188,150 L26,150 Z" fill="url(#rib3)" stroke="var(--accent)" stroke-width="2"></path>
        </g>
        <g font-size="9" font-weight="700"><text x="205" y="74" fill="var(--crit)">2024</text><text x="199" y="102" fill="var(--info)">2025</text><text x="193" y="132" fill="var(--accent)">2026</text></g>
      </svg></div></div>
<div class="meta"><b>3D Layered Ribbon Lines</b> · <code>charts-3d-layered-ribbon-lines</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Stacked, receding area-lines on parallel z-planes — a depth-sorted way to compare the same trend across several years or cohorts without overlap clutter.</p></div>

</body>
</html>
