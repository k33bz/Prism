<style id="prism-tokens">

</style>
<style id="showcase-shell">

body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-aws-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-aws-tok { fill: rgba(var(--cr,var(--accent-rgb)),.16); stroke: rgba(var(--cr,var(--accent-rgb)),.9); stroke-width: 1; }
.arch-aws-ghost { fill: rgba(var(--cr,var(--accent-rgb)),.07); stroke: rgba(var(--cr,var(--accent-rgb)),.4); stroke-width: 0.8; stroke-dasharray: 2, 2; }
.arch-aws-mo { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.arch-aws-nl { fill: var(--muted); font-size: 7px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-aws-bl { fill: var(--dim); font-size: 6px; letter-spacing: 0.3px; font-family: ui-monospace, Menlo, monospace; }
.arch-aws-bd { fill: rgba(var(--cr,var(--accent-rgb)),.05); stroke: rgba(var(--cr,var(--accent-rgb)),.5); stroke-width: 0.8; stroke-dasharray: 3, 3; }
.arch-aws-conn { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-aws-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 5, 41; animation-name: archAwsFlow; animation-duration: 3s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
@keyframes archAwsFlow { 
  100% { stroke-dashoffset: -46; }
}
</style>
</head>
