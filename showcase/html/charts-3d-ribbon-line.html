<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Ribbon Line · Prism</title>
<!-- Prism showcase sample: charts-3d-ribbon-line (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.6s ease-out 0s 1 normal forwards running draw; }
@keyframes draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="250" height="180" viewBox="0 0 250 180" style="overflow:visible">
        <!-- 3D ribbon line: a band with top + side face following the curve -->
        <defs><linearGradient id="ribbon-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--pos)"></stop><stop offset="1" stop-color="var(--info)"></stop></linearGradient></defs>
        <g stroke="var(--line)" stroke-width=".5" stroke-dasharray="3 3" opacity=".3"><line x1="20" y1="150" x2="230" y2="150"></line><line x1="20" y1="110" x2="230" y2="110"></line><line x1="20" y1="70" x2="230" y2="70"></line></g>
        <!-- side (depth) face -->
        <path d="M20,120 C60,70 90,130 130,80 S190,60 230,90 L230,104 C190,74 160,94 130,94 S60,84 20,134 Z" fill="rgba(68,147,248,.2)"></path>
        <!-- top ribbon face -->
        <path d="M20,120 C60,70 90,130 130,80 S190,60 230,90 L230,104 C190,74 160,94 130,94 S60,84 20,134 Z" transform="translate(0,-14)" fill="url(#ribbon-g)" opacity=".85"></path>
        <path class="draw" style="--len:340" d="M20,106 C60,56 90,116 130,66 S190,46 230,76" fill="none" stroke="#fff" stroke-width="1.5" opacity=".5"></path>
      </svg></div></div>
<div class="meta"><b>3D Ribbon Line</b> · <code>charts-3d-ribbon-line</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>A time series drawn as a thick ribbon with a visible side face, giving a single trend physical depth as it winds across the plot. The highlight stroke self-draws. Good as a section hero for one headline metric over time.</p></div>

</body>
</html>
