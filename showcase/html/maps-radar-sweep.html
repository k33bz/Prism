<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Sweep · Prism</title>
<!-- Prism showcase sample: maps-radar-sweep (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-hex .r1 { margin-top: 11px; }
.gmap-loc .ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(var(--info-rgb),.8); animation: 2.4s ease-out 0s infinite normal none running gmapPing; }
.gmap-loc .ring.b { animation-delay: 1.2s; }
.gmap-beacon .r2 { animation-delay: 0.7s; }
.gmap-beacon .r3 { animation-delay: 1.4s; }
.gmap-radar { position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle,rgba(var(--pos-rgb),.10),transparent 72%),var(--panel2); border: 1px solid rgba(var(--pos-rgb),.4); }
.gmap-radar .ring { position: absolute; border: 1px solid rgba(var(--pos-rgb),.28); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.gmap-radar .r1 { width: 38%; height: 38%; }
.gmap-radar .r2 { width: 66%; height: 66%; }
.gmap-radar .r3 { width: 94%; height: 94%; }
.gmap-radar .cross { position: absolute; background: rgba(var(--pos-rgb),.28); }
.gmap-radar .cx { left: 0px; right: 0px; top: 50%; height: 1px; }
.gmap-radar .cy { top: 0px; bottom: 0px; left: 50%; width: 1px; }
.gmap-radar .sweep { position: absolute; inset: 0px; border-radius: 50%; background: conic-gradient(from 0deg,rgba(var(--pos-rgb),.6),transparent 55%); mask: radial-gradient(circle, rgb(0, 0, 0) 72%, transparent 72%); animation: 3s linear 0s infinite normal none running gmapRadar; }
.gmap-radar .blip { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 8px rgba(var(--pos-rgb),1); animation: 3s ease-out 0s infinite normal none running gmapBlipFade; }
@keyframes gmapPing { 
  0% { transform: scale(0.4); opacity: 0.9; }
  70% { opacity: 0; }
  100% { transform: scale(2.6); opacity: 0; }
}
@keyframes gmapRadar { 
  100% { transform: rotate(360deg); }
}
@keyframes gmapBlipFade { 
  0%, 20% { opacity: 1; }
  60%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-radar">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="cross cx"></div><div class="cross cy"></div>
      <div class="sweep"></div>
      <div class="blip" style="left:64%;top:36%"></div>
      <div class="blip" style="left:34%;top:60%;animation-delay:1.4s"></div>
    </div></div></div>
<div class="meta"><b>Radar Sweep</b> · <code>maps-radar-sweep</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>A rotating sonar sweep with range rings and fading contact blips.</p></div>

</body>
</html>
