<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tachometer Ring + Ticks · Prism</title>
<!-- Prism showcase sample: charts-tachometer-ring-ticks (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gfill { animation: 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0s 1 normal forwards running gfill; }
.scx-tick { stroke: var(--dim); stroke-width: 1.5; }
@keyframes gfill { 
  0% { stroke-dashoffset: var(--circ); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="160" height="160" viewBox="0 0 160 160">
        <g class="scx-tick">
          <line x1="80" y1="14" x2="80" y2="24"></line><line x1="146" y1="80" x2="136" y2="80"></line><line x1="80" y1="146" x2="80" y2="136"></line><line x1="14" y1="80" x2="24" y2="80"></line>
          <line x1="127" y1="33" x2="120" y2="40"></line><line x1="127" y1="127" x2="120" y2="120"></line><line x1="33" y1="127" x2="40" y2="120"></line><line x1="33" y1="33" x2="40" y2="40"></line>
        </g>
        <circle cx="80" cy="80" r="58" fill="none" stroke="var(--line)" stroke-width="10"></circle>
        <circle class="gfill" style="--circ:364.4" cx="80" cy="80" r="58" fill="none" stroke="var(--info)" stroke-width="10" stroke-linecap="round" stroke-dasharray="291.5 364.4" transform="rotate(135 80 80)"></circle>
        <text x="80" y="76" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">80</text>
        <text x="80" y="96" text-anchor="middle" font-size="9" fill="var(--muted)" style="text-transform:uppercase;letter-spacing:.5px">RPM ×100</text>
      </svg></div></div>
<div class="meta"><b>Tachometer Ring + Ticks</b> · <code>charts-tachometer-ring-ticks</code><br>Charts &amp; Metrics · Gauges &amp; Dials<p>A full 360° ring gauge with major tick marks around the rim, like an instrument cluster. The arc fills clockwise on load and the tick set gives the eye a scale to read against.</p></div>

</body>
</html>
