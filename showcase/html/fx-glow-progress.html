<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Progress · Prism</title>
<!-- Prism showcase sample: fx-glow-progress (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-accent { --c: var(--accent); --c-rgb: 255,153,0; }
.fx-gl-ring, .fx-gl-btn, .fx-gl-edge, .fx-gl-trail, .fx-gl-divider, .fx-gl-badge, .fx-gl-input, .fx-gl-toggle, .fx-gl-progress, .fx-gl-chips, .fx-gl-tip, .fx-gl-lift, .fx-gl-underline, .fx-gl-avatar, .fx-gl-marker, .fx-gl-status, .fx-gl-keys, .fx-gl-slider, .fx-gl-corners, .fx-gl-check { --fx-gl-rgb: var(--c-rgb,var(--accent-rgb)); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); width: 100%; box-sizing: border-box; }
.fx-gl-progress { max-width: 266px; display: grid; gap: 10px; font-size: 12px; color: var(--muted); }
.fx-gl-progress-row { display: flex; justify-content: space-between; }
.fx-gl-progress-row b { color: var(--ink); font-weight: 600; }
.fx-gl-progress-track { position: relative; height: 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.fx-gl-progress-fill { position: absolute; inset: 0px; border-radius: inherit; transform-origin: left center; background: linear-gradient(90deg,rgba(var(--fx-gl-rgb),.45),rgba(var(--fx-gl-rgb),1)); box-shadow: 0 0 8px rgba(var(--fx-gl-rgb),.6),0 0 20px rgba(var(--fx-gl-rgb),.3); animation: 4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite normal none running fxGlProgressFill; }
.fx-gl-progress-tip { position: absolute; top: 50%; left: 0px; width: 14px; height: 14px; margin: -7px 0px 0px -7px; border-radius: 50%; background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 8px rgba(var(--fx-gl-rgb),1),0 0 18px rgba(var(--fx-gl-rgb),.8),0 0 36px rgba(var(--fx-gl-rgb),.45); animation: 4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite normal none running fxGlProgressTip; }
@keyframes fxGlProgressFill { 
  0%, 6% { transform: scaleX(0); }
  78%, 94% { transform: scaleX(1); }
  100% { transform: scaleX(0); }
}
@keyframes fxGlProgressTip { 
  0%, 6% { left: 0px; opacity: 1; }
  78%, 94% { left: 100%; opacity: 1; }
  95%, 100% { left: 100%; opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-gl-progress c-accent"><div class="fx-gl-progress-row"><b>Syncing Nova</b><span>1,284 files</span></div><div class="fx-gl-progress-track"><div class="fx-gl-progress-fill"></div><div class="fx-gl-progress-tip"></div></div></div></div></div>
<div class="meta"><b>Glow Progress</b> · <code>fx-glow-progress</code><br>FX Store · GLOW SYSTEM<p>A tinted fill grows along the track and a white hot tip leads it with the strongest glow. Use for uploads, syncs and long running jobs.</p></div>

</body>
</html>
