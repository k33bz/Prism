<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Wave · Prism</title>
<!-- Prism showcase sample: shapes-depth-wave (gallery: shapes). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-pos { --c: var(--pos); --c-rgb: 63,185,80; }
.nsh2-wave3d { position: relative; width: 250px; height: 100px; perspective: 520px; display: flex; align-items: center; justify-content: center; }
.nsh2-wave3d .nsh2-w3rot { transform-style: preserve-3d; transform: rotateX(20deg) rotateY(-8deg); display: flex; gap: 1px; font-weight: 800; font-size: 24px; color: var(--c); }
.nsh2-wave3d .nsh2-w3o { display: inline-block; transform-style: preserve-3d; }
.nsh2-wave3d .nsh2-w3i { display: inline-block; animation: 2.4s ease-in-out 0s infinite normal none running nsh2W3; text-shadow: 0 0 8px rgba(var(--c-rgb),.5); }
@keyframes nsh2W3 { 
  0%, 100% { transform: translateZ(-30px); }
  50% { transform: translateZ(30px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nsh2-wave3d c-pos" data-text="DEPTH WAVE" data-nsh2="1"><div class="nsh2-w3rot"><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0s;">D</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.09s;">E</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.18s;">P</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.27s;">T</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.36s;">H</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.45s;">&nbsp;</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.54s;">W</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.63s;">A</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.72s;">V</span></span><span class="nsh2-w3o"><span class="nsh2-w3i" style="animation-delay: 0.81s;">E</span></span></div></div></div></div>
<div class="meta"><b>Depth Wave</b> · <code>shapes-depth-wave</code><br>Text Shapes · 3D Tunnels &amp; Perspective<p>A tilted row of letters where each glyph oscillates along the Z-axis on a staggered delay, so a wave travels through the word in depth rather than up and down. Perspective + preserve-3d.</p></div>

</body>
</html>
