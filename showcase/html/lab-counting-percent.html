<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counting Percent · Prism</title>
<!-- Prism showcase sample: lab-counting-percent (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-count { width: 100%; max-width: 200px; text-align: center; font: 12px / 1.4 ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
.lab-ld-count-n { font: 700 40px / 1 ui-monospace, Menlo, monospace; color: var(--ink); --lab-ld-n: 0; counter-reset: lab-ld-cnt var(--lab-ld-n); animation: 4s linear 0s infinite normal none running labLdCountUp; }
.lab-ld-count-n::before { content: counter(lab-ld-cnt); }
.lab-ld-count-n i { font-style: normal; font-size: 18px; color: var(--c,var(--accent)); }
.lab-ld-count-tr { height: 3px; border-radius: 2px; background: var(--panel2); margin: 8px 0px 6px; overflow: hidden; }
.lab-ld-count-f { height: 100%; background: var(--c,var(--accent)); width: 0px; animation: 4s linear 0s infinite normal none running labLdFillLin; }
@keyframes labLdCountUp { 
  0% { --lab-ld-n: 0; }
  75%, 100% { --lab-ld-n: 100; }
}
@keyframes labLdFillLin { 
  0% { width: 0px; }
  75%, 100% { width: 100%; }
}
@property --lab-ld-n { syntax: "<integer>"; inherits: false; initial-value: 0; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-count"><div class="lab-ld-count-n"><i>%</i></div><div class="lab-ld-count-tr"><div class="lab-ld-count-f"></div></div>Syncing Atlas workspace</div></div></div>
<div class="meta"><b>Counting Percent</b> · <code>lab-counting-percent</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>A large number counts from 0 to 100 through an integer property and a CSS counter while a hairline bar fills in step. Use when the number is the whole message.</p></div>

</body>
</html>
