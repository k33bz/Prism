<style id="prism-tokens">

<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-rc, .chx-rc-legend { width: 100%; max-width: 300px; height: 150px; margin: 0px auto; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; }
.chx-rc-lbl.chx-rc-w { fill: var(--warn); }
.chx-rc-lbl.chx-rc-g { fill: var(--pos); }
.chx-rc-lbl.chx-rc-n { fill: var(--neg); }
.chx-rc-legend { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 5px; }
.chx-rc-cell { position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--card); overflow: hidden; }
.chx-rc-cell svg { position: absolute; inset: 0px; width: 100%; height: 100%; }
.chx-rc-cap { position: absolute; left: 5px; top: 3px; font: 700 7px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; z-index: 1; }
.chx-rc-cap.chx-rc-w { color: var(--warn); }
.chx-rc-cap.chx-rc-g { color: var(--pos); }
.chx-rc-cap.chx-rc-i { color: var(--info); }
.chx-rc-cap.chx-rc-n { color: var(--neg); }
.chx-rc-sig { stroke-linecap: round; stroke-linejoin: round; }
.chx-rc-draw { animation-name: chxRcPulse; animation-duration: 3.2s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
.chx-rc-blip { transform-box: fill-box; transform-origin: center center; animation-name: chxRcBlip; animation-duration: 3.2s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes chxRcPulse { 
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@keyframes chxRcBlip { 
  0%, 100% { opacity: 0.5; transform: scale(0.82); }
  50% { opacity: 1; transform: scale(1); }
}
</style>
</head>
