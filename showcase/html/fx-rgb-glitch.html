<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB Glitch · Prism</title>
<!-- Prism showcase sample: fx-rgb-glitch (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-crit { --c: var(--crit); --c-rgb: 200,121,255; }
.el-badge { display: inline-block; background: rgba(var(--c-rgb),.16); border: 1px solid var(--c); color: var(--ink); font-size: 12px; font-weight: 800; padding: 5px 13px; border-radius: 20px; letter-spacing: 0.03em; }
.fx-glitch { animation: 2.4s steps(1) 0s infinite normal none running fxGlitch; color: var(--c); font-weight: 800; }
@keyframes fxGlitch { 
  0%, 100% { transform: translate(0px); clip-path: inset(0px); }
  40% { transform: translate(-2px, 0px); }
  42% { transform: translate(2px, 0px); clip-path: inset(20% 0px 30%); }
  44% { transform: translate(0px); }
}
.fx-glitch { position: relative; overflow: hidden; }
.fx-glitch::before, .fx-glitch::after { content: attr(data-text); position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font: inherit; pointer-events: none; }
.fx-glitch::before { color: var(--neg); clip-path: polygon(0px 0px, 100% 0px, 100% 35%, 0px 35%); animation: 3s linear 0s infinite alternate-reverse none running fxGlitch1; }
.fx-glitch::after { color: var(--info); clip-path: polygon(0px 65%, 100% 65%, 100% 100%, 0px 100%); animation: 3s linear 0s infinite alternate-reverse none running fxGlitch2; }
@keyframes fxGlitch1 { 
  0% { transform: translate(0px); }
  20% { transform: translate(-3px, 1px); }
  40% { transform: translate(2px, -1px); }
  60% { transform: translate(-1px, 2px); }
  80% { transform: translate(3px, 0px); }
  100% { transform: translate(0px); }
}
@keyframes fxGlitch2 { 
  0% { transform: translate(0px); }
  20% { transform: translate(2px, -1px); }
  40% { transform: translate(-3px, 1px); }
  60% { transform: translate(1px, -2px); }
  80% { transform: translate(-2px, 1px); }
  100% { transform: translate(0px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="el-badge c-crit fx-glitch" data-text="CRITICAL" style="font-size:16px;font-weight:800">CRITICAL</div></div></div>
<div class="meta"><b>RGB Glitch</b> · <code>fx-rgb-glitch</code><br>FX Store · Cyberpunk &amp; Glitch<p>Split RGB channels with jitter. Cyberpunk error state — requires data-text attribute.</p></div>

</body>
</html>
