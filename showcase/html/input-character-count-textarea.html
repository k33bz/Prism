<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character-Count Textarea · Prism</title>
<!-- Prism showcase sample: input-character-count-textarea (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ta { width: 100%; min-height: 90px; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: 13px; font-family: inherit; outline: none; resize: vertical; transition: 0.2s; }
.ta:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.ta::placeholder { color: var(--dim); }
.cc-wrap { width: 100%; position: relative; }
.cc-count { position: absolute; bottom: 8px; right: 10px; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; color: var(--dim); background: var(--panel2); padding: 1px 6px; border-radius: 5px; }
.cc-count.warn { color: var(--warn); }
.cc-count.over { color: var(--neg); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="cc-wrap" id="ccWrap1">
        <textarea class="ta" maxlength="180" oninput="ipCount(this)" placeholder="Describe the change request…">Migrate the billing pipeline to us-west-2 and enable cross-region replication.</textarea>
        <span class="cc-count" id="ccCount1">76 / 180</span>
      </div></div></div>
<div class="meta"><b>Character-Count Textarea</b> · <code>input-character-count-textarea</code><br>Input Methods · Text Inputs<p>Live character counter overlaid in the corner. Turns amber as you near the limit and red if you exceed it. Wires to the textarea's maxlength and updates on every keystroke.</p></div>

</body>
</html>
