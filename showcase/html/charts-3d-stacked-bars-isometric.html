<!-- Prism showcase sample: charts-3d-stacked-bars-isometric (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>

<body>
<div class="tile"><div class="stage" id="stage"><svg width="250" height="195" viewBox="0 0 250 195" style="overflow:visible">
        <!-- 3D stacked bar chart (isometric, multi-series) -->
        <defs>
          <linearGradient id="stk-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"></stop><stop offset="1" stop-color="var(--accent)" stop-opacity=".7"></stop></linearGradient>
          <linearGradient id="stk-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--info)"></stop><stop offset="1" stop-color="var(--info)" stop-opacity=".7"></stop></linearGradient>
          <linearGradient id="stk-c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--crit)"></stop><stop offset="1" stop-color="var(--crit)" stop-opacity=".7"></stop></linearGradient>
        </defs>
        <!-- helper: each segment = front face + top + right side, dx=16 dy=-10 depth -->
        <!-- Bar 1 @ x=55 -->
        <g>
          <polygon points="55,160 55,135 79,135 79,160" fill="url(#stk-c)"></polygon><polygon points="79,160 79,135 95,125 95,150" fill="var(--crit)" opacity=".55"></polygon><polygon points="55,135 71,125 95,125 79,135" fill="var(--crit)" opacity=".8"></polygon>
          <polygon points="55,135 55,112 79,112 79,135" fill="url(#stk-b)"></polygon><polygon points="79,135 79,112 95,102 95,125" fill="var(--info)" opacity=".55"></polygon><polygon points="55,112 71,102 95,102 79,112" fill="var(--info)" opacity=".8"></polygon>
          <polygon points="55,112 55,88 79,88 79,112" fill="url(#stk-a)"></polygon><polygon points="79,112 79,88 95,78 95,102" fill="var(--accent)" opacity=".55"></polygon><polygon points="55,88 71,78 95,78 79,88" fill="var(--accent)" opacity=".85"></polygon>
        </g>
        <!-- Bar 2 @ x=130 -->
        <g>
          <polygon points="130,160 130,142 154,142 154,160" fill="url(#stk-c)"></polygon><polygon points="154,160 154,142 170,132 170,150" fill="var(--crit)" opacity=".55"></polygon><polygon points="130,142 146,132 170,132 154,142" fill="var(--crit)" opacity=".8"></polygon>
          <polygon points="130,142 130,108 154,108 154,142" fill="url(#stk-b)"></polygon><polygon points="154,142 154,108 170,98 170,132" fill="var(--info)" opacity=".55"></polygon><polygon points="130,108 146,98 170,98 154,108" fill="var(--info)" opacity=".8"></polygon>
          <polygon points="130,108 130,72 154,72 154,108" fill="url(#stk-a)"></polygon><polygon points="154,108 154,72 170,62 170,98" fill="var(--accent)" opacity=".55"></polygon><polygon points="130,72 146,62 170,62 154,72" fill="var(--accent)" opacity=".85"></polygon>
        </g>
        <line x1="40" y1="160" x2="185" y2="160" stroke="var(--line)"></line>
        <g font-size="9.5" fill="var(--muted)"><text x="75" y="178" text-anchor="middle">Q1</text><text x="150" y="178" text-anchor="middle">Q2</text></g>
        <g font-size="9" font-weight="700"><text x="200" y="86" fill="var(--accent)">▮ compute</text><text x="200" y="110" fill="var(--info)">▮ storage</text><text x="200" y="134" fill="var(--crit)">▮ network</text></g>
      </svg></div></div>
<div class="meta"><b>3D Stacked Bars (isometric)</b> · <code>charts-3d-stacked-bars-isometric</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Multi-series stacked columns rendered with extruded depth. Each segment shows a front face, lit top, and shadowed side. Great for cost breakdowns by category over periods.</p></div>
