<title>Region Fill Sweep · Prism</title>
<!-- Prism showcase sample: maps-region-fill-sweep (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-scene { position: relative; width: 250px; height: 158px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 140% at 50% -20%,rgba(var(--info-rgb),.10),transparent 60%),var(--panel2); border: 1px solid var(--line); }
.gmap-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.gmap-flag .base { position: absolute; left: 50%; bottom: 36px; width: 16px; height: 5px; border-radius: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.3); }
.gmap-sweep .base { fill: rgba(var(--info-rgb),.10); stroke: rgba(var(--info-rgb),.22); stroke-width: 1; }
.gmap-sweep-wrap { animation: 4s ease-in-out 0s infinite normal none running gmapFillSweep; }
.gmap-sweep-wrap .fill { fill: rgba(var(--pos-rgb),.55); stroke: var(--pos); stroke-width: 1.5; }
.gmap-sweep-bar { position: absolute; top: 8%; bottom: 8%; width: 2px; background: var(--pos); box-shadow: 0 0 8px rgba(var(--pos-rgb),.9); animation: 4s ease-in-out 0s infinite normal none running gmapSweepBar; }
@keyframes gmapFillSweep { 
  0% { clip-path: inset(0px 100% 0px 0px); }
  55%, 100% { clip-path: inset(0px); }
}
@keyframes gmapSweepBar { 
  0% { left: 6%; opacity: 1; }
  55% { left: 92%; opacity: 1; }
  56%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-scene gmap-sweep">
      <svg class="gmap-svg" viewBox="0 0 250 158" preserveAspectRatio="none">
        <path class="base" d="M40,40 Q120,20 210,44 Q228,80 200,116 Q120,138 46,116 Q28,78 40,40 Z"></path>
        <g class="gmap-sweep-wrap"><path class="fill" d="M40,40 Q120,20 210,44 Q228,80 200,116 Q120,138 46,116 Q28,78 40,40 Z"></path></g>
      </svg>
      <div class="gmap-sweep-bar"></div>
    </div></div></div>
<div class="meta"><b>Region Fill Sweep</b> · <code>maps-region-fill-sweep</code><br>Maps &amp; Geo · REGIONS &amp; CHOROPLETH<p>A region floods with color left-to-right behind a moving scan bar.</p></div>

</body>
