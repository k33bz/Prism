<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierarchical Bar · Prism</title>
<!-- Prism showcase sample: charts-hierarchical-bar (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.chx-tm-svg { width: 100%; max-width: 300px; height: auto; display: block; font-family: ui-sans-serif, system-ui, sans-serif; }
.chx-tm-lm { fill: var(--muted); font: 8px ui-sans-serif, system-ui, sans-serif; }
.chx-tm-ld { fill: var(--dim); font: 7px ui-sans-serif, system-ui, sans-serif; }
.chx-tm-fa { fill: rgba(var(--accent-rgb),.6); }
.chx-tm-fi { fill: rgba(var(--info-rgb),.58); }
.chx-tm-fp { fill: rgba(var(--pos-rgb),.55); }
.chx-tm-fw { fill: rgba(var(--warn-rgb),.55); }
.chx-tm-hbar rect { transform-box: fill-box; transform-origin: left center; }
.chx-tm-hbar .chx-tm-par { animation: 4s ease-in-out 0s infinite normal none running chxTmHbarParent; }
.chx-tm-hbar .chx-tm-kid { opacity: 0; animation: 4s ease-in-out 0s infinite normal none running chxTmHbarKids; }
.chx-tm-hbar .chx-tm-kid rect { animation-name: chxTmHbarGrow; animation-duration: 0.6s; animation-timing-function: cubic-bezier(0.5, 0, 0.2, 1); animation-iteration-count: infinite; animation-delay: var(--d,0s); }
@keyframes chxTmHbarParent { 
  0%, 20% { opacity: 1; }
  34%, 86% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes chxTmHbarKids { 
  0%, 26% { opacity: 0; }
  40%, 80% { opacity: 1; }
  94%, 100% { opacity: 0; }
}
@keyframes chxTmHbarGrow { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="chx-tm-svg chx-tm-hbar" viewBox="0 0 300 150">
      <g class="chx-tm-par">
        <rect class="chx-tm-fi" x="60" y="14" width="210" height="20" rx="2"></rect>
        <rect class="chx-tm-fa" x="60" y="42" width="150" height="20" rx="2"></rect>
        <rect class="chx-tm-fp" x="60" y="70" width="110" height="20" rx="2"></rect>
        <rect class="chx-tm-fw" x="60" y="98" width="72" height="20" rx="2"></rect>
        <text class="chx-tm-lm" x="6" y="28">Atlas</text>
        <text class="chx-tm-lm" x="6" y="56">Comet</text>
        <text class="chx-tm-lm" x="6" y="84">Ember</text>
        <text class="chx-tm-lm" x="6" y="112">Nova</text>
      </g>
      <g class="chx-tm-kid">
        <rect class="chx-tm-fi" style="--d:0s" x="60" y="10" width="150" height="14" rx="2"></rect>
        <rect class="chx-tm-fi" style="--d:.1s" x="60" y="28" width="118" height="14" rx="2" opacity=".8"></rect>
        <rect class="chx-tm-fi" style="--d:.2s" x="60" y="46" width="92" height="14" rx="2" opacity=".6"></rect>
        <rect class="chx-tm-fi" style="--d:.3s" x="60" y="64" width="200" height="14" rx="2"></rect>
        <rect class="chx-tm-fi" style="--d:.4s" x="60" y="82" width="140" height="14" rx="2" opacity=".8"></rect>
        <rect class="chx-tm-fi" style="--d:.5s" x="60" y="100" width="96" height="14" rx="2" opacity=".6"></rect>
        <text class="chx-tm-ld" x="6" y="21">Atlas.a</text>
        <text class="chx-tm-ld" x="6" y="75">Atlas.d</text>
      </g>
    </svg></div></div>
<div class="meta"><b>Hierarchical Bar</b> · <code>charts-hierarchical-bar</code><br>Charts &amp; Metrics · TREEMAPS &amp; HIERARCHIES<p>Parent bars give way to their child bars, which grow into place, then collapse back. Use it to drill a ranked breakdown.</p></div>

</body>
</html>
