<meta charset="utf-8">

<title>3D Funnel Cone · Prism</title>
<!-- Prism showcase sample: charts-3d-funnel-cone (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.scx-kpic .d { font-size: 11px; font-weight: 800; margin-top: 3px; }
.scx-kpic .d.up { color: var(--pos); }
.scx-kpic .d.down { color: var(--neg); }
.scx-kpic .d.flat { color: var(--muted); }
.n3d-scene { perspective: 640px; perspective-origin: 50% 42%; display: flex; align-items: center; justify-content: center; min-height: 150px; }
.n3d-cone { position: relative; width: 130px; height: 120px; transform-style: preserve-3d; transform: rotateX(60deg); animation: 18s linear 0s infinite normal none running n3dSpin; }
.n3d-cone .d { position: absolute; left: 50%; top: 50%; border-radius: 50%; background: linear-gradient(135deg,var(--crit),var(--accent)); animation: 0.7s ease-out 0s 1 normal both running ncx2Fade; }
@keyframes n3dSpin { 
  100% { transform: rotateY(360deg); }
}
@keyframes ncx2Fade { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="n3d-scene"><div class="n3d-cone">
      <span class="d" style="width:104px;height:104px;margin:-52px;transform:translateZ(0);animation-delay:0s"></span>
      <span class="d" style="width:82px;height:82px;margin:-41px;transform:translateZ(-14px);filter:brightness(.85);animation-delay:.12s"></span>
      <span class="d" style="width:60px;height:60px;margin:-30px;transform:translateZ(-28px);filter:brightness(.72);animation-delay:.24s"></span>
      <span class="d" style="width:38px;height:38px;margin:-19px;transform:translateZ(-42px);filter:brightness(.6);animation-delay:.36s"></span>
      <span class="d" style="width:18px;height:18px;margin:-9px;transform:translateZ(-56px);filter:brightness(.5);animation-delay:.48s"></span>
    </div></div></div></div>
<div class="meta"><b>3D Funnel Cone</b> · <code>charts-3d-funnel-cone</code><br>Charts &amp; Metrics · 3D &amp; Perspective (2026 drop)<p>Shrinking discs stacked down the Z axis form a rotating conversion cone — each ring a narrowing funnel stage.</p></div>
