<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Selection Toolbar · Prism</title>
<!-- Prism showcase sample: menus-floating-selection-toolbar (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-selectwrap { position: relative; width: 230px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.mnu-select-hl { background: rgba(var(--info-rgb),.28); color: var(--ink); border-radius: 2px; }
.mnu-selectbar { position: absolute; left: 14px; top: -46px; display: flex; gap: 3px; padding: 6px; border-radius: 9px; background: var(--panel2); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.42) 0px 12px 28px; animation: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.2s 1 normal both running mnuScaleIn; transform-origin: center bottom; }
.mnu-selectbar::after { content: ""; position: absolute; left: 16px; bottom: -5px; width: 9px; height: 9px; background: var(--panel2); border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; border-left-width: medium; border-left-style: none; border-left-color: currentcolor; transform: rotate(45deg); }
.mnu-selectbar button { width: 28px; height: 28px; border-radius: 6px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: transparent; color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
.mnu-selectbar button:hover { background: rgba(var(--info-rgb),.18); }
@keyframes mnuScaleIn { 
  0% { opacity: 0; transform: scale(0.86) translateY(-4px); }
  100% { opacity: 1; transform: scale(1) translateY(0px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-selectwrap">
      Ship early, ship often, and <span class="mnu-select-hl">learn from real users</span> before betting on a big redesign.
      <div class="mnu-selectbar">
        <button><b>B</b></button><button><i>I</i></button><button>🔗</button><button>💬</button>
      </div>
    </div></div></div>
<div class="meta"><b>Floating Selection Toolbar</b> · <code>menus-floating-selection-toolbar</code><br>Menus &amp; Actions · ACTION BARS, TOOLBARS &amp; FABs<p>A compact action bar that appears above highlighted text, offering quick formatting or commenting.</p></div>

</body>
</html>
