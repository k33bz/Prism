<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Pull Grid · Prism</title>
<!-- Prism showcase sample: lab-focus-pull-grid (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-stg { animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); animation-iteration-count: infinite; animation-fill-mode: both; animation-delay: calc(var(--i,0)*var(--lab-rv-step,.16s)); }
.lab-rv-ico { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 5px; background: rgba(var(--c-rgb,var(--accent-rgb)),.25); border: 1px solid var(--c,var(--accent)); }
.lab-rv-ln { display: block; height: 6px; border-radius: 3px; background: var(--line); width: var(--w,80%); }
.lab-rv-pg .lab-rv-ln { margin-bottom: 8px; }
.lab-rv-focus { --c: var(--pos); --c-rgb: var(--pos-rgb); --lab-rv-step: .1s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
.lab-rv-fg { height: 47px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; justify-content: space-between; animation-name: labRvFocus; }
.lab-rv-fg .lab-rv-ico { width: 14px; height: 14px; }
.lab-rv-fg .lab-rv-ln { width: var(--w,70%); }
@keyframes labRvFocus { 
  0% { opacity: 0; filter: blur(8px); transform: scale(0.86); }
  18%, 78% { opacity: 1; filter: blur(0px); transform: none; }
  86%, 100% { opacity: 0; filter: blur(8px); transform: scale(0.86); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-focus">
      <div class="lab-rv-fg lab-rv-stg" style="--i:0"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:70%"></span></div>
      <div class="lab-rv-fg lab-rv-stg" style="--i:1"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:55%"></span></div>
      <div class="lab-rv-fg lab-rv-stg" style="--i:2"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:80%"></span></div>
      <div class="lab-rv-fg lab-rv-stg" style="--i:3"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:60%"></span></div>
      <div class="lab-rv-fg lab-rv-stg" style="--i:4"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:75%"></span></div>
      <div class="lab-rv-fg lab-rv-stg" style="--i:5"><span class="lab-rv-ico"></span><span class="lab-rv-ln" style="--w:50%"></span></div>
    </div></div></div>
<div class="meta"><b>Focus Pull Grid</b> · <code>lab-focus-pull-grid</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>A grid of tiles resolves from a soft blur and slight shrink in reading order, then defocuses again. Use for galleries or integrations grids.</p></div>

</body>
</html>
