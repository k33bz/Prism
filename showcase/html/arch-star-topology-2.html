<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Topology · Prism</title>
<!-- Prism showcase sample: arch-star-topology-2 (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-box { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-cir { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-gl { fill: none; stroke: rgba(var(--cr,var(--accent-rgb)),.9); stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
.arch-net-nm { fill: var(--ink); font-size: 6.5px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetFlow; animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
@keyframes archNetFlow { 
  100% { stroke-dashoffset: -15; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-net-svg arch-net-star" viewBox="0 0 300 150" style="--c:var(--info);--cr:var(--info-rgb)" role="img" aria-label="Star topology with radiating traffic">
      <path class="arch-net-wire" d="M150 75 150 22M150 75 208 33M150 75 232 75M150 75 208 117M150 75 150 128M150 75 92 117M150 75 68 75M150 75 92 33"></path>
      <path class="arch-net-flow" style="--fd:0s" d="M150 75 150 22"></path>
      <path class="arch-net-flow" style="--fd:.12s" d="M150 75 208 33"></path>
      <path class="arch-net-flow" style="--fd:.24s" d="M150 75 232 75"></path>
      <path class="arch-net-flow" style="--fd:.36s" d="M150 75 208 117"></path>
      <path class="arch-net-flow" style="--fd:.48s" d="M150 75 150 128"></path>
      <path class="arch-net-flow" style="--fd:.6s" d="M150 75 92 117"></path>
      <path class="arch-net-flow" style="--fd:.72s" d="M150 75 68 75"></path>
      <path class="arch-net-flow" style="--fd:.84s" d="M150 75 92 33"></path>
      <g style="--cr:var(--pos-rgb)"><circle class="arch-net-cir" cx="150" cy="22" r="6"></circle><circle class="arch-net-cir" cx="208" cy="33" r="6"></circle><circle class="arch-net-cir" cx="232" cy="75" r="6"></circle><circle class="arch-net-cir" cx="208" cy="117" r="6"></circle><circle class="arch-net-cir" cx="150" cy="128" r="6"></circle><circle class="arch-net-cir" cx="92" cy="117" r="6"></circle><circle class="arch-net-cir" cx="68" cy="75" r="6"></circle><circle class="arch-net-cir" cx="92" cy="33" r="6"></circle></g>
      <g style="--cr:var(--info-rgb)"><rect class="arch-net-box" x="138" y="65" width="24" height="20" rx="4"></rect><path class="arch-net-gl" d="M144 71h12M144 79h12"></path></g>
      <text class="arch-net-nm" x="150" y="98">hub</text>
    </svg></div></div>
<div class="meta"><b>Star Topology</b> · <code>arch-star-topology-2</code><br>Architecture Diagrams · NETWORK FLOW MAPS<p>A central hub with eight spokes and traffic radiating outward to each leaf node. Use for hub and spoke or central switch diagrams.</p></div>

</body>
</html>
