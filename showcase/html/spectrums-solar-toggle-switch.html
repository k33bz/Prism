<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Toggle Switch · Prism</title>
<!-- Prism showcase sample: spectrums-solar-toggle-switch (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.solp-toggle input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.solp-tg-track { width: 56px; height: 30px; border-radius: 16px; background: linear-gradient(rgb(207, 224, 210), rgb(185, 210, 189)); position: relative; transition: 0.3s; box-shadow: rgba(0, 0, 0, 0.15) 0px 2px 4px inset; }
.solp-tg-thumb { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgb(255, 255, 255), rgb(217, 230, 218)); box-shadow: rgba(0, 0, 0, 0.25) 0px 2px 5px; transition: 0.3s cubic-bezier(0.5, 1.6, 0.4, 1); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.solp-toggle input:checked + .solp-tg-track { background: linear-gradient(180deg,var(--solp-gold2),var(--solp-gold)); }
.solp-toggle input:checked + .solp-tg-track .solp-tg-thumb { left: 29px; background: radial-gradient(circle at 35% 30%,#fff6da,var(--solp-gold)); box-shadow: rgba(255, 201, 74, 0.6) 0px 0px 10px; }
.solp-tg-lbl { font-size: 12px; font-weight: 700; color: var(--solp-ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><label class="solp-toggle"><input type="checkbox" checked=""><span class="solp-tg-track"><span class="solp-tg-thumb">☀️</span></span><span class="solp-tg-lbl">Solar mode</span></label></div></div>
<div class="meta"><b>Solar Toggle Switch</b> · <code>spectrums-solar-toggle-switch</code><br>Spectrums · Solarpunk · Solarpunk<p>A soft rounded switch whose thumb carries a tiny sun and glows gold once activated — an eco on/off control.</p></div>

</body>
</html>
