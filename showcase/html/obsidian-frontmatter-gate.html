<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontmatter Gate · Prism</title>
<!-- Prism showcase sample: obsidian-frontmatter-gate (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-prop { width: 280px; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 10px 12px; position: relative; overflow: hidden; text-align: left; }
.obs-frontmatter-gate { height: 88px; display: flex; align-items: center; justify-content: center; }
.obs-gate { width: 120px; height: 54px; position: relative; perspective: 300px; }
.obs-gate::before, .obs-gate::after { content: ""; position: absolute; top: 0px; width: 50%; height: 100%; border: 1px solid var(--ob); background: linear-gradient(135deg,rgba(var(--ob-rgb),.32),var(--panel2)); animation: 5s ease-in-out 0s infinite normal none running obsGate; }
.obs-gate::before { left: 0px; transform-origin: left center; }
.obs-gate::after { right: 0px; transform-origin: right center; animation-name: obsGateR; }
.obs-gatecode { position: absolute; inset: 13px -32px; text-align: center; color: var(--pos); font: 9px ui-monospace, monospace; opacity: 0; animation: 5s ease 0s infinite normal none running obsGateText; }
@keyframes obsGate { 
  0%, 15%, 85%, 100% { transform: rotateY(0deg); }
  35%, 70% { transform: rotateY(-70deg); }
}
@keyframes obsGateR { 
  0%, 15%, 85%, 100% { transform: rotateY(0deg); }
  35%, 70% { transform: rotateY(70deg); }
}
@keyframes obsGateText { 
  0%, 24%, 80%, 100% { opacity: 0; }
  36%, 68% { opacity: 1; text-shadow: 0 0 8px rgba(var(--pos-rgb),.7); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-prop obs-frontmatter-gate"><div class="obs-gate"><span class="obs-gatecode">✓ schema valid</span></div></div></div></div>
<div class="meta"><b>Frontmatter Gate</b> · <code>obsidian-frontmatter-gate</code><br>Obsidian Facets · PROPERTIES &amp; METADATA<p>Twin metadata doors open to reveal a clean validation signal.</p></div>

</body>
</html>
