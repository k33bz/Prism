<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Line Comparison · Prism</title>
<!-- Prism showcase sample: charts-multi-line-comparison (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: 1.6s ease-out 0s 1 normal forwards running draw; }
@keyframes draw { 
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="240" height="140" viewBox="0 0 240 140" style="overflow:visible">
        <!-- Multi-line chart -->
        <g stroke="var(--line)" stroke-dasharray="2 4"><line x1="30" y1="20" x2="30" y2="120"></line><line x1="30" y1="120" x2="230" y2="120"></line><line x1="30" y1="45" x2="230" y2="45"></line><line x1="30" y1="70" x2="230" y2="70"></line><line x1="30" y1="95" x2="230" y2="95"></line></g>
        <polyline class="draw" style="--len:380" points="34,100 64,92 94,85 124,70 154,62 184,48 214,35" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"></polyline>
        <polyline class="draw" style="--len:380" points="34,108 64,102 94,96 124,88 154,82 184,76 214,72" fill="none" stroke="var(--info)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3"></polyline>
        <polyline class="draw" style="--len:380" points="34,115 64,110 94,108 124,102 154,98 184,95 214,92" fill="none" stroke="var(--pos)" stroke-width="2.5" stroke-linecap="round"></polyline>
        <g font-size="8" fill="var(--muted)"><text x="216" y="33" fill="var(--accent)">Opus</text><text x="216" y="70" fill="var(--info)">Sonnet</text><text x="216" y="90" fill="var(--pos)">Haiku</text></g>
      </svg></div></div>
<div class="meta"><b>Multi-Line Comparison</b> · <code>charts-multi-line-comparison</code><br>Charts &amp; Metrics · Advanced Visualizations<p>Multiple series on one chart with inline labels. Compare trends side-by-side. Dashed for projected.</p></div>

</body>
</html>
