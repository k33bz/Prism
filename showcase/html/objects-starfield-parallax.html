<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfield Parallax · Prism</title>
<!-- Prism showcase sample: objects-starfield-parallax (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.amb-bg-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: var(--panel2); isolation: isolate; }
.amb-bg-tag { position: absolute; left: 12px; bottom: 10px; z-index: 6; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.amb-bg-stars { background: radial-gradient(90% 70% at 50% 100%,rgba(var(--info-rgb),.25),var(--bg) 70%); }
.amb-bg-stars-l { position: absolute; inset: -120px 0px 0px -120px; width: calc(100% + 240px); height: calc(100% + 240px); animation-name: ambBgStars; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.amb-bg-stars-l:nth-child(1) { --amb-bg-shift: 60px; background-image: radial-gradient(rgba(255, 255, 255, 0.35) 0.6px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.25) 0.6px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.3) 0.6px, transparent 1px), radial-gradient(rgba(255, 255, 255, 0.2) 0.6px, transparent 1px); background-size: 60px 60px; background-position: 0px 0px, 31px 43px, 17px 22px, 46px 9px; }
.amb-bg-stars-l:nth-child(2) { --amb-bg-shift: 90px; background-image: radial-gradient(rgba(255,255,255,.7) .8px,transparent 1.3px),radial-gradient(rgba(var(--info-rgb),.9) .8px,transparent 1.3px),radial-gradient(rgba(255,255,255,.5) .7px,transparent 1.2px); background-size: 45px 45px; background-position: 12px 7px, 29px 33px, 3px 24px; }
.amb-bg-stars-l:nth-child(3) { --amb-bg-shift: 120px; background-image: radial-gradient(rgba(255, 255, 255, 0.95) 1.2px, transparent 1.8px), radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1.6px); background-size: 50px 50px, 70px 70px; background-position: 5px 19px, 38px 44px; }
@keyframes ambBgStars { 
  100% { transform: translateX(var(--amb-bg-shift)); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb-bg-root amb-bg-stars"><i class="amb-bg-stars-l"></i><i class="amb-bg-stars-l"></i><i class="amb-bg-stars-l"></i><span class="amb-bg-tag">Comet · launch</span></div></div></div>
<div class="meta"><b>Starfield Parallax</b> · <code>objects-starfield-parallax</code><br>Animated Objects · AMBIENT BACKGROUNDS<p>Three star layers scroll at increasing speeds so the nearest stars slide fastest. Space, launch and night mode backdrops.</p></div>

</body>
</html>
