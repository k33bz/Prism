<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correlation Matrix · Prism</title>
<!-- Prism showcase sample: tables-correlation-matrix (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-pivot th.dtb-rh { background: var(--panel2); color: var(--muted); text-transform: none; letter-spacing: 0px; font-size: 10px; }
.dtb-corr { font-family: ui-monospace, Menlo, monospace; }
.dtb-corr th { text-align: center; padding: 5px 6px; }
.dtb-corr td { text-align: center; padding: 5px 6px; font-size: 10px; }
.dtb-corr td.p { background: rgba(var(--c-rgb,var(--accent-rgb)),calc(var(--v,.5)*.75)); }
.dtb-corr td.n { background: rgba(var(--neg-rgb),calc(var(--v,.5)*.75)); }
.dtb-corr td.d { background: rgba(var(--accent-rgb),.3); color: var(--accent); font-weight: 800; animation: 2.6s ease-in-out 0s infinite normal none running dtbBlink; }
.dtb-insp-r .v.n { color: var(--accent); }
.dtb-tl-r .d { width: 8px; height: 8px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); justify-self: center; }
.dtb-tl-r .d.dtb-ok { border-color: var(--pos); background: var(--pos); }
.dtb-tl-r .d.warn { border-color: var(--warn); background: var(--warn); }
.dtb-tbl.manual td.flip { transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
.dtb-tbl.manual tr.lifted td { position: relative; z-index: 2; box-shadow: 0 6px 16px rgba(0,0,0,.45),inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.14); }
@keyframes dtbBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl dtb-corr"><thead><tr><th></th><th>CPU</th><th>Mem</th><th>Lat</th><th>Err</th></tr></thead><tbody>
      <tr><th class="dtb-rh">CPU</th><td class="d">1.0</td><td class="p" style="--v:.6">.61</td><td class="p" style="--v:.8">.82</td><td class="p" style="--v:.3">.27</td></tr>
      <tr><th class="dtb-rh">Mem</th><td class="p" style="--v:.6">.61</td><td class="d">1.0</td><td class="p" style="--v:.4">.38</td><td class="n" style="--v:.2">-.14</td></tr>
      <tr><th class="dtb-rh">Lat</th><td class="p" style="--v:.8">.82</td><td class="p" style="--v:.4">.38</td><td class="d">1.0</td><td class="p" style="--v:.7">.71</td></tr>
      <tr><th class="dtb-rh">Err</th><td class="p" style="--v:.3">.27</td><td class="n" style="--v:.2">-.14</td><td class="p" style="--v:.7">.71</td><td class="d">1.0</td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Correlation Matrix</b> · <code>tables-correlation-matrix</code><br>Tables &amp; Data Layouts · MATRICES &amp; COMPARISON<p>A symmetric matrix with diverging shading (blue positive, red negative, --v strength) and a softly blinking identity diagonal.</p></div>

</html>
