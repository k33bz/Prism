<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>3D Scatter (depth cue) · Prism</title>
<!-- Prism showcase sample: charts-3d-scatter-depth-cue (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="250" height="190" viewBox="0 0 250 190" style="overflow:visible">
        <!-- 3D scatter plot with depth (size + opacity = z-axis) -->
        <!-- floor + back walls for spatial framing -->
        <g stroke="var(--line)" stroke-width=".8" opacity=".5">
          <path d="M30,150 L210,150 L235,120 L55,120 Z" fill="rgba(255,255,255,.02)"></path>
          <line x1="30" y1="150" x2="30" y2="40"></line><line x1="55" y1="120" x2="55" y2="20"></line>
          <line x1="30" y1="40" x2="55" y2="20"></line><line x1="30" y1="95" x2="55" y2="70"></line>
        </g>
        <!-- points: bigger + brighter = closer to viewer -->
        <g>
          <circle cx="70" cy="120" r="9" fill="var(--accent)" opacity=".95"></circle>
          <circle cx="120" cy="135" r="11" fill="var(--info)" opacity=".95"></circle>
          <circle cx="95" cy="75" r="5" fill="var(--crit)" opacity=".55"></circle>
          <circle cx="165" cy="110" r="7" fill="var(--pos)" opacity=".8"></circle>
          <circle cx="140" cy="60" r="4" fill="var(--warn)" opacity=".5"></circle>
          <circle cx="190" cy="130" r="10" fill="var(--accent)" opacity=".9"></circle>
          <circle cx="110" cy="100" r="6" fill="var(--info)" opacity=".7"></circle>
          <circle cx="60" cy="55" r="3.5" fill="var(--crit)" opacity=".45"></circle>
        </g>
        <text x="125" y="178" text-anchor="middle" font-size="10" fill="var(--muted)">cost · usage · risk</text>
      </svg></div></div>
<div class="meta"><b>3D Scatter (depth cue)</b> · <code>charts-3d-scatter-depth-cue</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Bubble scatter where size and opacity encode the z-axis (depth toward the viewer). Plots three metrics at once — cost vs usage vs risk. Floor + back walls anchor the space.</p></div>

</body>
</html>
