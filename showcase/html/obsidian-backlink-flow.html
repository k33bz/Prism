<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlink Flow · Prism</title>
<!-- Prism showcase sample: obsidian-backlink-flow (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-blk { display: flex; align-items: center; gap: 10px; }
.obs-blk-srcs { display: flex; flex-direction: column; gap: 6px; }
.obs-blk-src { width: 64px; height: 18px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line); font-size: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.obs-blk-arrows { flex: 0 0 46px; }
.obs-blk-arrows path { fill: none; stroke: var(--ob); stroke-width: 1.4; stroke-dasharray: 5, 4; animation: 1.2s linear 0s infinite normal none running obsFlowDash; opacity: 0.85; }
.obs-blk-dst { width: 74px; height: 52px; border-radius: 8px; border: 1.5px solid var(--ob); background: rgba(var(--ob-rgb),.12); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--ob); animation: 2.4s ease-in-out 0s infinite normal none running obsDstPulse; }
@keyframes obsFlowDash { 
  100% { stroke-dashoffset: -9; }
}
@keyframes obsDstPulse { 
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--ob-rgb),.5); }
  55% { box-shadow: 0 0 0 8px rgba(var(--ob-rgb),0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-blk"><div class="obs-blk-srcs"><span class="obs-blk-src">Journal</span><span class="obs-blk-src">Design</span><span class="obs-blk-src">Research</span></div><svg class="obs-blk-arrows" viewBox="0 0 46 70"><path d="M0 9 Q26 9 46 35"></path><path d="M0 35 H46"></path><path d="M0 61 Q26 61 46 35"></path></svg><div class="obs-blk-dst">Evergreen<br>Note</div></div></div></div>
<div class="meta"><b>Backlink Flow</b> · <code>obsidian-backlink-flow</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>Three source notes stream backlink packets into a glowing destination note.</p></div>

</body>
</html>
