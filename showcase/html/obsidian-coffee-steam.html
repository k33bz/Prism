<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Steam · Prism</title>
<!-- Prism showcase sample: obsidian-coffee-steam (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-ambient { width: 280px; max-width: 100%; height: 108px; border: 1px solid var(--line); border-radius: 10px; background: rgb(9, 12, 22); position: relative; overflow: hidden; }
.obs-ambient-label { position: absolute; left: 10px; bottom: 7px; z-index: 4; font-size: 8px; font-weight: 800; letter-spacing: 0.12em; color: rgba(255, 255, 255, 0.65); text-shadow: rgb(0, 0, 0) 0px 1px 5px; }
.obs-coffee-steam { background: radial-gradient(circle at 50% 65%,rgba(var(--warn-rgb),.12),#090c16 60%); }
.obs-cup { position: absolute; left: 112px; bottom: 14px; width: 54px; height: 34px; border-radius: 4px 4px 18px 18px; background: linear-gradient(90deg, rgb(93, 47, 40), rgb(167, 95, 67), rgb(93, 47, 40)); box-shadow: rgb(0, 0, 0) 0px 5px 9px; }
.obs-cup::after { content: ""; position: absolute; right: -18px; top: 5px; width: 21px; height: 18px; border-width: 5px 5px 5px 0px; border-style: solid solid solid none; border-color: rgb(127, 69, 54) rgb(127, 69, 54) rgb(127, 69, 54) currentcolor; border-image: none; border-radius: 0px 14px 14px 0px; }
.obs-steam { position: absolute; left: var(--x); bottom: 49px; width: 14px; height: 50px; border-left: 2px solid rgba(255, 255, 255, 0.38); border-radius: 50%; filter: blur(1px); animation-duration: 3s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: obsSteam; animation-timeline: auto; animation-range: normal; animation-delay: var(--delay); }
@keyframes obsSteam { 
  0% { transform: translateY(8px) scale(0.7) rotate(6deg); opacity: 0; }
  25% { opacity: 0.7; }
  100% { transform: translateY(-26px) scale(1.3) rotate(-10deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-ambient obs-coffee-steam"><span class="obs-cup"></span><i class="obs-steam" style="--x:128px;--delay:0s"></i><i class="obs-steam" style="--x:139px;--delay:-1s"></i><i class="obs-steam" style="--x:149px;--delay:-2s"></i><span class="obs-ambient-label">MORNING NOTES</span></div></div></div>
<div class="meta"><b>Coffee Steam</b> · <code>obsidian-coffee-steam</code><br>Obsidian Facets · VAULT AMBIENT &amp; FOCUS<p>Three translucent steam curls rise asynchronously from a tactile cup.</p></div>

</body>
</html>
