<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dual-Handle Range Slider · Prism</title>
<!-- Prism showcase sample: input-dual-handle-range-slider-2 (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-mrange { width: 100%; }
.nin2-mrange .nin2-track { position: relative; height: 6px; border-radius: 3px; background: var(--panel2); margin: 14px 4px; }
.nin2-mrange .nin2-fillbar { position: absolute; top: 0px; bottom: 0px; border-radius: 3px; background: linear-gradient(90deg,var(--info),var(--accent)); }
.nin2-mrange input[type="range"] { position: absolute; top: -7px; left: 0px; width: 100%; height: 20px; appearance: none; background: none; pointer-events: none; margin: 0px; }
.nin2-mrange input[type="range"]::-webkit-slider-thumb { appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 8px rgba(var(--accent-rgb),.4); cursor: pointer; }
.nin2-mrange .nin2-read { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 700; }
.nin2-search .nin2-menu li:hover, .nin2-search .nin2-menu li.nin2-hi { background: rgba(var(--accent-rgb),.12); color: var(--ink); }
.nin2-heart .nin2-hi { font-size: 34px; color: var(--dim); transition: 0.2s; display: inline-block; }
.nin2-heart.nin2-liked .nin2-hi { color: var(--neg); animation: 0.4s ease 0s 1 normal none running nin2Beat; }
@keyframes nin2Beat { 
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.35); }
  60% { transform: scale(0.9); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-mrange">
      <div class="nin2-track"><span class="nin2-fillbar" style="left: 25%; width: 45%;"></span></div>
      <input type="range" min="0" max="100" value="25" class="nin2-lo"><input type="range" min="0" max="100" value="70" class="nin2-hi">
      <div class="nin2-read"><span class="nin2-min">$25</span><span class="nin2-max">$70</span></div>
    </div></div></div>
<div class="meta"><b>Dual-Handle Range Slider</b> · <code>input-dual-handle-range-slider-2</code><br>Input Methods · Fields, Pickers &amp; Actions<p>Two thumbs pick a min/max window with the span highlighted between them; handles can't cross. The classic price/date filter.</p></div>

</body>
</html>
