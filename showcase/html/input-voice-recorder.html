<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Recorder · Prism</title>
<!-- Prism showcase sample: input-voice-recorder (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.voice-rec { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.voice-rec .vr-btn { width: 46px; height: 46px; border-radius: 50%; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: var(--neg); color: rgb(255, 255, 255); font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.15s; position: relative; }
.voice-rec .vr-btn.rec { box-shadow: 0 0 0 0 rgba(var(--neg-rgb),.6); animation: 1.4s ease-out 0s infinite normal none running vr-pulse; }
.voice-rec .vr-btn.paused { background: var(--accent); color: rgb(26, 18, 0); }
.voice-rec .vr-wave { flex: 1 1 0%; display: flex; align-items: center; gap: 2px; height: 36px; }
.voice-rec .vr-wave i { flex: 1 1 0%; max-width: 4px; border-radius: 2px; background: var(--accent); transition: height 0.15s; }
.voice-rec .vr-time { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; color: var(--ink); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
@keyframes vr-pulse { 
  0% { box-shadow: rgba(248, 81, 73, 0.6) 0px 0px 0px 0px; }
  70%, 100% { box-shadow: rgba(248, 81, 73, 0) 0px 0px 0px 14px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="voice-rec" id="voice1">
        <button class="vr-btn" onclick="ipVoiceToggle(this)" aria-label="Record">●</button>
        <div class="vr-wave" id="vrWave1"><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i><i style="height: 4px;"></i></div>
        <span class="vr-time" id="vrTime1">0:00</span>
      </div></div></div>
<div class="meta"><b>Voice Recorder</b> · <code>input-voice-recorder</code><br>Input Methods · Voice &amp; Media Capture<p>Tap to record — the button pulses red, a live waveform animates, and the timer counts up. Tap again to pause (turns amber). For voice notes, dictation, and audio feedback.</p></div>

</body>
</html>
