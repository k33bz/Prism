<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funnel Chart · Prism</title>
<!-- Prism showcase sample: charts-funnel-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.funnel-seg { transition: opacity 0.2s; }
.funnel-seg:hover { opacity: 0.8; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">Conversion Funnel</div>
        <svg width="260" height="140" viewBox="0 0 260 140">
          <g class="funnel-seg">
            <polygon points="20,5 240,5 225,30 35,30" fill="var(--info)" opacity=".9"></polygon><text x="130" y="22" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Visitors — 10,000</text>
          </g>
          <g class="funnel-seg">
            <polygon points="35,34 225,34 210,59 50,59" fill="var(--accent)" opacity=".85"></polygon><text x="130" y="51" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Sign-ups — 3,200</text>
          </g>
          <g class="funnel-seg">
            <polygon points="50,63 210,63 195,88 65,88" fill="var(--warn)" opacity=".8"></polygon><text x="130" y="80" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Active — 1,800</text>
          </g>
          <g class="funnel-seg">
            <polygon points="65,92 195,92 180,117 80,117" fill="var(--pos)" opacity=".85"></polygon><text x="130" y="109" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Paid — 420</text>
          </g>
          <text x="250" y="20" font-size="9" fill="var(--muted)">100%</text>
          <text x="250" y="50" font-size="9" fill="var(--muted)">32%</text>
          <text x="250" y="80" font-size="9" fill="var(--muted)">18%</text>
          <text x="250" y="110" font-size="9" fill="var(--muted)">4.2%</text>
        </svg>
      </div></div></div>
<div class="meta"><b>Funnel Chart</b> · <code>charts-funnel-chart</code><br>Charts &amp; Metrics · Advanced Visualizations<p>Narrowing stages for conversion / pipeline analysis. Percentages on the right for drop-off rates.</p></div>

</body>
</html>
