<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Radar · Prism</title>
<!-- Prism showcase sample: obsidian-canvas-radar (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-canvas { width: 280px; max-width: 100%; height: 108px; border: 1px solid var(--line); border-radius: 10px; background-color: rgb(12, 16, 27); background-image: radial-gradient(rgba(var(--ob-rgb),.22) .8px,transparent .9px); background-size: 12px 12px; position: relative; overflow: hidden; }
.obs-canvas-radar .obs-cradar { position: absolute; width: 88px; height: 88px; left: 96px; top: 10px; border-radius: 50%; border: 1px solid rgba(var(--ob-rgb),.35); background: repeating-radial-gradient(circle,transparent 0 14px,rgba(var(--ob-rgb),.17) 15px 16px),linear-gradient(90deg,transparent 49.5%,rgba(var(--ob-rgb),.22) 50%,transparent 50.5%); }
.obs-cradar::before { content: ""; position: absolute; inset: 0px; border-radius: 50%; background: conic-gradient(rgba(var(--ob-rgb),.55),transparent 72deg); animation: 3.7s linear 0s infinite normal none running obsSpin; }
.obs-cradar i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--ob); left: 57px; top: 22px; animation: 3.7s linear 0s infinite normal none running obsBlip; box-shadow: 0 0 6px var(--ob); }
@keyframes obsSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes obsBlip { 
  0%, 6% { opacity: 0; }
  10%, 45% { opacity: 1; }
  60%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-canvas obs-canvas-radar"><span class="obs-cradar"><i></i></span></div></div></div>
<div class="meta"><b>Canvas Radar</b> · <code>obsidian-canvas-radar</code><br>Obsidian Facets · CANVAS &amp; SPATIAL NOTES<p>A radial sweep searches the infinite canvas and illuminates one distant card.</p></div>

</body>
</html>
