<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Region Compare · Prism</title>
<!-- Prism showcase sample: maps-two-region-compare (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.gmap-loc .ring.b { animation-delay: 1.2s; }
.gmap-border .fillrg { fill: rgba(var(--crit-rgb),.14); }
.gmap-cmp { display: flex; gap: 10px; }
.gmap-cmp .side { position: relative; width: 96px; height: 110px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; background: var(--panel2); }
.gmap-cmp .a .fillrg { fill: rgba(var(--info-rgb),.5); animation: 3.2s ease-in-out 0s infinite normal none running gmapCmpFlip; }
.gmap-cmp .b .fillrg { fill: rgba(var(--accent-rgb),.5); animation: 3.2s ease-in-out 1.6s infinite normal none running gmapCmpFlip; }
.gmap-cmp .tag { position: absolute; left: 8px; bottom: 6px; font: 700 10px / 1 system-ui, sans-serif; color: var(--muted); }
.gmap-live .d.a { animation-delay: 0.2s; }
.gmap-live .d.b { animation-delay: 0.7s; background: var(--info); box-shadow: 0 0 8px rgba(var(--info-rgb),.9); }
@keyframes gmapCmpFlip { 
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0.25; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-cmp">
      <div class="side a">
        <svg class="gmap-svg" viewBox="0 0 96 110" preserveAspectRatio="none"><path class="fillrg" d="M14,20 Q48,8 80,22 Q88,56 68,88 Q40,100 20,82 Q8,50 14,20 Z"></path></svg>
        <span class="tag">EAST</span>
      </div>
      <div class="side b">
        <svg class="gmap-svg" viewBox="0 0 96 110" preserveAspectRatio="none"><path class="fillrg" d="M16,24 Q50,10 78,26 Q86,58 66,86 Q38,98 22,80 Q10,52 16,24 Z"></path></svg>
        <span class="tag">WEST</span>
      </div>
    </div></div></div>
<div class="meta"><b>Two-Region Compare</b> · <code>maps-two-region-compare</code><br>Maps &amp; Geo · REGIONS &amp; CHOROPLETH<p>Side-by-side regions alternating emphasis for an A/B territory comparison.</p></div>

</body>
</html>
