<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Isometric Tile Floor · Prism</title>
<!-- Prism showcase sample: objects-isometric-tile-floor (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ob3d-scene { width: 100%; max-width: 300px; height: 140px; perspective: 620px; perspective-origin: 50% 45%; display: grid; place-items: center; overflow: hidden; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); --oc: var(--c,var(--accent)); --ocr: var(--c-rgb,var(--accent-rgb)); }
.ob3d-scene * { box-sizing: border-box; }
.ob3d-iso-rig { display: grid; grid-template-columns: repeat(4, 22px); gap: 4px; transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(45deg); }
.ob3d-iso-t { width: 22px; height: 22px; position: relative; transform-style: preserve-3d; animation-name: ob3dIsoFlip; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--d)*-1s); }
.ob3d-iso-t::before, .ob3d-iso-t::after { content: ""; position: absolute; inset: 0px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel2); backface-visibility: hidden; }
.ob3d-iso-t::after { transform: rotateX(180deg); background: rgba(var(--ocr),.6); border-color: var(--oc); }
@keyframes ob3dIsoFlip { 
  0%, 12% { transform: rotateX(0deg); }
  38%, 62% { transform: rotateX(180deg); }
  88%, 100% { transform: rotateX(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ob3d-scene ob3d-iso"><div class="ob3d-iso-rig"><div class="ob3d-iso-t" style="--d:0"></div><div class="ob3d-iso-t" style="--d:.25"></div><div class="ob3d-iso-t" style="--d:.5"></div><div class="ob3d-iso-t" style="--d:.75"></div><div class="ob3d-iso-t" style="--d:.25"></div><div class="ob3d-iso-t" style="--d:.5"></div><div class="ob3d-iso-t" style="--d:.75"></div><div class="ob3d-iso-t" style="--d:1"></div><div class="ob3d-iso-t" style="--d:.5"></div><div class="ob3d-iso-t" style="--d:.75"></div><div class="ob3d-iso-t" style="--d:1"></div><div class="ob3d-iso-t" style="--d:1.25"></div><div class="ob3d-iso-t" style="--d:.75"></div><div class="ob3d-iso-t" style="--d:1"></div><div class="ob3d-iso-t" style="--d:1.25"></div><div class="ob3d-iso-t" style="--d:1.5"></div></div></div></div></div>
<div class="meta"><b>Isometric Tile Floor</b> · <code>objects-isometric-tile-floor</code><br>Animated Objects · 3D CSS OBJECTS<p>A four by four floor of tiles flips over in a diagonal wave, showing the coloured backs. Use for loading floors, map reveals and grid refreshes.</p></div>
