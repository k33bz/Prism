<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover Preview Float · Prism</title>
<!-- Prism showcase sample: obsidian-hover-preview-float (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-hovprev { position: relative; padding-bottom: 74px; font-size: 14px; font-weight: 600; }
.obs-hovprev .obs-wl-only { color: var(--ob); border-bottom: 1px dashed rgba(var(--ob-rgb),.6); }
.obs-prevcard { position: absolute; left: 8px; top: 26px; width: 190px; background: var(--panel2); border: 1px solid rgba(var(--ob-rgb),.4); border-radius: 9px; padding: 9px 11px; box-shadow: rgba(0, 0, 0, 0.45) 0px 10px 24px; animation: 3.4s ease-in-out 0s infinite normal none running obsFloatY; transform-origin: 20px -6px; }
.obs-prevcard::before { content: ""; position: absolute; top: -5px; left: 16px; width: 8px; height: 8px; background: inherit; border-left: 1px solid rgba(var(--ob-rgb),.4); border-top: 1px solid rgba(var(--ob-rgb),.4); transform: rotate(45deg); }
.obs-prevtitle { font-size: 11.5px; font-weight: 800; color: var(--ob); }
.obs-prevline { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); margin-top: 6px; }
.obs-prevline.w2 { width: 70%; }
@keyframes obsFloatY { 
  0%, 100% { transform: translateY(0px) rotate(-0.4deg); }
  50% { transform: translateY(-5px) rotate(0.5deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-hovprev"><span class="obs-wl-only">[[Attention Architecture]]</span><div class="obs-prevcard"><div class="obs-prevtitle">Attention Architecture</div><div class="obs-prevline"></div><div class="obs-prevline w2"></div><div class="obs-prevline"></div></div></div></div></div>
<div class="meta"><b>Hover Preview Float</b> · <code>obsidian-hover-preview-float</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>A linked-note preview that hovers below its source like an Obsidian page peek.</p></div>

</body>
</html>
