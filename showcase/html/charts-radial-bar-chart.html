<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Bar Chart · Prism</title>
<!-- Prism showcase sample: charts-radial-bar-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mp-radialbar .arc { transform-box: view-box; transform-origin: center center; animation: 1.3s ease-out 0s 1 normal forwards running mp-dashIn; }
@keyframes mp-dashIn { 
  0% { stroke-dashoffset: var(--len); }
  100% { stroke-dashoffset: var(--off); }
}
.nch-gaugetri .g .arc { position: absolute; top: 0px; width: 60px; height: 60px; border-radius: 50%; mask: radial-gradient(closest-side, transparent 58%, rgb(0, 0, 0) 60%); }
.ncx2-chord .arc { fill: none; stroke-width: 7; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="160" height="160" viewBox="0 0 160 160" class="mp-radialbar" id="mpRadialBar"><circle cx="80" cy="80" r="64" fill="none" stroke="var(--panel2)" stroke-width="10"></circle><circle cx="80" cy="80" r="64" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="402.1" transform="rotate(-90 80 80)" class="arc" style="--len: 402.1; --off: 32.2; stroke-dashoffset: 402.1; animation-delay: 0s;"></circle><circle cx="80" cy="80" r="49" fill="none" stroke="var(--panel2)" stroke-width="10"></circle><circle cx="80" cy="80" r="49" fill="none" stroke="var(--info)" stroke-width="10" stroke-linecap="round" stroke-dasharray="307.9" transform="rotate(-90 80 80)" class="arc" style="--len: 307.9; --off: 80.0; stroke-dashoffset: 307.9; animation-delay: 0.1s;"></circle><circle cx="80" cy="80" r="34" fill="none" stroke="var(--panel2)" stroke-width="10"></circle><circle cx="80" cy="80" r="34" fill="none" stroke="var(--pos)" stroke-width="10" stroke-linecap="round" stroke-dasharray="213.6" transform="rotate(-90 80 80)" class="arc" style="--len: 213.6; --off: 89.7; stroke-dashoffset: 213.6; animation-delay: 0.2s;"></circle><circle cx="80" cy="80" r="19" fill="none" stroke="var(--panel2)" stroke-width="10"></circle><circle cx="80" cy="80" r="19" fill="none" stroke="var(--crit)" stroke-width="10" stroke-linecap="round" stroke-dasharray="119.4" transform="rotate(-90 80 80)" class="arc" style="--len: 119.4; --off: 71.6; stroke-dashoffset: 119.4; animation-delay: 0.3s;"></circle></svg></div></div>
<div class="meta"><b>Radial Bar Chart</b> · <code>charts-radial-bar-chart</code><br>Charts &amp; Metrics · More Plot Types<p>Bars wrapped into concentric arcs around a common center — a compact ranking where each track is one category and arc length is its value. Arcs sweep in on load. Reads like a circular bar chart.</p></div>

</body>
</html>
