<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XY Trade-off Pad · Prism</title>
<!-- Prism showcase sample: input-xy-trade-off-pad (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.inp-label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.xy-pad { position: relative; width: 100%; height: 150px; background: radial-gradient(circle at center,rgba(255,153,0,.05),transparent 70%),var(--panel2); border: 1px solid var(--line); border-radius: 12px; cursor: crosshair; overflow: hidden; }
.xy-pad .xy-grid { position: absolute; inset: 0px; background: repeating-linear-gradient(0deg, transparent, transparent 24px, rgba(255, 255, 255, 0.04) 24px, rgba(255, 255, 255, 0.04) 25px), repeating-linear-gradient(90deg, transparent, transparent 24px, rgba(255, 255, 255, 0.04) 24px, rgba(255, 255, 255, 0.04) 25px); }
.xy-pad .xy-cross-h, .xy-pad .xy-cross-v { position: absolute; background: rgba(var(--accent-rgb),.3); }
.xy-pad .xy-cross-h { left: 0px; right: 0px; height: 1px; }
.xy-pad .xy-cross-v { top: 0px; bottom: 0px; width: 1px; }
.xy-pad .xy-dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 12px rgba(var(--accent-rgb),.6); pointer-events: none; }
.xy-pad .xy-read { position: absolute; left: 8px; bottom: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted); pointer-events: none; }
.xy-pad .xy-read b { color: var(--accent); }
.xy-axis { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--dim); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%">
        <label class="inp-label">Tune: speed ↔ cost</label>
        <div class="xy-pad" id="xy1" onclick="ipXyMove(event,this)">
          <div class="xy-grid"></div>
          <div class="xy-cross-h" style="top:40%"></div>
          <div class="xy-cross-v" style="left:64%"></div>
          <div class="xy-dot" style="left:64%;top:40%"></div>
          <div class="xy-read">x <b id="xyX1">0.64</b> · y <b id="xyY1">0.60</b></div>
        </div>
        <div class="xy-axis"><span>← cheaper</span><span>faster →</span></div>
      </div></div></div>
<div class="meta"><b>XY Trade-off Pad</b> · <code>input-xy-trade-off-pad</code><br>Input Methods · Structured &amp; Matrix Inputs<p>A two-dimensional pad for setting two correlated values at once (e.g. speed vs cost, or precision vs recall). Click or drag the dot; both axes read out live.</p></div>

</body>
</html>
