<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlinked Mentions Radar · Prism</title>
<!-- Prism showcase sample: obsidian-unlinked-mentions-radar (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-radar { position: relative; width: 110px; height: 110px; border-radius: 50%; border: 1px solid rgba(var(--ob-rgb),.35); background: radial-gradient(circle,rgba(var(--ob-rgb),.07),transparent 70%); }
.obs-radar::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; border: 1px dashed rgba(var(--ob-rgb),.25); }
.obs-radar::after { content: ""; position: absolute; inset: 0px; border-radius: 50%; background: conic-gradient(from 0deg,rgba(var(--ob-rgb),.5),transparent 70deg 360deg); animation: 4s linear 0s infinite normal none running obsSpin; }
.obs-radar b { position: absolute; font-size: 8px; font-weight: 700; color: var(--ob); background: rgba(var(--ob-rgb),.14); border: 1px solid rgba(var(--ob-rgb),.4); padding: 1px 5px; border-radius: 8px; opacity: 0; animation: 4s linear 0s infinite normal none running obsBlip; }
.obs-radar b:nth-child(1) { left: 60%; top: 18%; }
.obs-radar b:nth-child(2) { left: 14%; top: 52%; animation-delay: 1.4s; }
.obs-radar b:nth-child(3) { left: 55%; top: 70%; animation-delay: 2.5s; }
@keyframes obsSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes obsBlip { 
  0%, 6% { opacity: 0; }
  10%, 45% { opacity: 1; }
  60%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-radar"><b>attention</b><b>memory</b><b>systems</b></div></div></div>
<div class="meta"><b>Unlinked Mentions Radar</b> · <code>obsidian-unlinked-mentions-radar</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>A rotating discovery sweep reveals nearby unlinked concepts one at a time.</p></div>

</body>
</html>
