<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB Split · Prism</title>
<!-- Prism showcase sample: fx-rgb-split (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.el-card { background-position-x: ; background-position-y: ; background-size: ; background-repeat: ; background-attachment: ; background-origin: ; background-clip: ; background-color: ; background-image: var(--cardgrad); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 4px solid var(--c); border-radius: 13px; padding: 18px; min-width: 200px; }
.el-card .n { font-size: 34px; font-weight: 800; color: var(--c); line-height: 1; }
.el-card .l { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.nfx-rgb-split { position: relative; color: var(--ink); }
.nfx-rgb-split::before, .nfx-rgb-split::after { content: attr(data-text); position: absolute; inset: 0px; display: flex; align-items: center; padding-left: 18px; pointer-events: none; opacity: 0.65; }
.nfx-rgb-split::before { color: rgb(255, 59, 107); animation: 2.4s ease-in-out 0s infinite normal none running nfxRgbA; }
.nfx-rgb-split::after { color: rgb(59, 216, 255); animation: 2.4s ease-in-out 0s infinite normal none running nfxRgbB; }
@keyframes nfxRgbA { 
  0%, 100% { transform: translate(-1.5px, 0px); }
  50% { transform: translate(2px, 0px); }
}
@keyframes nfxRgbB { 
  0%, 100% { transform: translate(1.5px, 0px); }
  50% { transform: translate(-2px, 0px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="el-card c-neg nfx-rgb-split" data-text="RGB SPLIT" style="min-height:60px">RGB SPLIT</div></div></div>
<div class="meta"><b>RGB Split</b> · <code>fx-rgb-split</code><br>FX Store · New<p>Red/cyan channels drift apart and back — chromatic-aberration glitch on the text. Needs data-text.</p></div>

</body>
</html>
