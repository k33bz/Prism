<style id="prism-tokens">

<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-face { position: absolute; border: 1.5px solid var(--fc,var(--nobj2-i)); background: color-mix(in srgb,var(--fc,var(--nobj2-i)) 14%,transparent); box-shadow: inset 0 0 16px color-mix(in srgb,var(--fc,var(--nobj2-i)) 24%,transparent); }
.nobj2-cube .nobj2-face { width: 74px; height: 74px; }
.nobj2-lock3d { position: relative; width: 72px; height: 96px; transform-style: preserve-3d; animation: 7s ease-in-out 0s infinite normal none running nobj2LockTurn; }
.nobj2-lock3d .nobj2-lb { width: 60px; height: 54px; left: 6px; top: 40px; border-radius: 8px; }
.nobj2-lb-f { transform: translateZ(14px); }
.nobj2-lb-bk { transform: translateZ(-14px); }
.nobj2-lb-s { width: 28px; height: 54px; left: 22px; transform: rotateY(90deg) translateZ(30px); }
.nobj2-lb-t { width: 60px; height: 28px; top: 53px; transform: rotateX(90deg) translateZ(27px); }
.nobj2-lock3d .nobj2-shack { position: absolute; left: 50%; top: 6px; width: 36px; height: 44px; margin-left: -18px; border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-left-color: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; border-radius: 18px 18px 0px 0px; transform: translateZ(0px); animation: 7s ease-in-out 0s infinite normal none running nobj2Shack; }
.nobj2-lock3d .nobj2-key { position: absolute; left: 50%; top: 60px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: var(--nobj2-a); transform: translateZ(15px); box-shadow: 0 0 8px var(--nobj2-a); }
@keyframes nobj2LockTurn { 
  0%, 100% { transform: rotateY(-26deg); }
  50% { transform: rotateY(26deg); }
}
@keyframes nobj2Shack { 
  0%, 44%, 100% { transform: translateY(0px); }
  60%, 86% { transform: translateY(-12px); }
}
</style>
