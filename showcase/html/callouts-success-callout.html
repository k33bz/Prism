<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success Callout · Prism</title>
<!-- Prism showcase sample: callouts-success-callout (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-callout { --cc: var(--ann-i); --ccr: var(--ann-i-rgb); display: flex; gap: 10px; width: 236px; padding: 11px 13px 12px; border-radius: 10px; text-align: left; color: var(--ink); background: linear-gradient(180deg,rgba(var(--ccr),.11),rgba(var(--ccr),.03)); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 3px solid var(--cc); box-shadow: 0 8px 22px -14px rgba(var(--ccr),.7); }
.ann-callout .ann-ci { flex: 0 0 auto; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; line-height: 1; color: var(--cc); background: rgba(var(--ccr),.18); border: 1px solid rgba(var(--ccr),.42); }
.ann-callout .ann-cb { min-width: 0px; }
.ann-callout .ann-ct { font-size: 11.5px; font-weight: 800; letter-spacing: 0.02em; color: var(--cc); margin-bottom: 3px; }
.ann-callout .ann-cd { font-size: 11px; line-height: 1.5; color: var(--muted); }
.ann-success { --cc: var(--ann-p); --ccr: var(--ann-p-rgb); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-callout ann-success"><div class="ann-ci">✓</div><div class="ann-cb"><div class="ann-ct">SUCCESS</div><div class="ann-cd">Confirms a completed step or a healthy, expected outcome.</div></div></div></div></div>
<div class="meta"><b>Success Callout</b> · <code>callouts-success-callout</code><br>Callouts &amp; Annotations · CALLOUT / ADMONITION BLOCKS<p>Positive-green admonition to confirm completion or a passing check.</p></div>

</body>
</html>
