<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candlestick · Prism</title>
<!-- Prism showcase sample: charts-candlestick (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.delta.up { color: var(--pos); background: rgba(var(--pos-rgb),.13); }
.scx-kpic .d.up { color: var(--pos); }
.nch-candle { display: flex; align-items: flex-end; gap: 6px; height: 96px; }
.nch-candle .cd { width: 8px; position: relative; transform-origin: center bottom; animation: 0.9s ease-out 0s 1 normal both running nchGrow; }
.nch-candle .cd .wick { position: absolute; left: 50%; transform: translateX(-50%); width: 2px; background: currentcolor; }
.nch-candle .cd .body { position: absolute; left: 0px; right: 0px; border-radius: 2px; background: currentcolor; }
.nch-candle .up { color: var(--pos); }
.nch-candle .dn { color: var(--neg); }
@keyframes nchGrow { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nch-candle">
        <div class="cd up" style="height:70%;animation-delay:0s"><span class="wick" style="top:-8px;height:calc(100% + 16px)"></span><span class="body" style="top:20%;height:60%"></span></div>
        <div class="cd dn" style="height:88%;animation-delay:.08s"><span class="wick" style="top:-6px;height:calc(100% + 12px)"></span><span class="body" style="top:10%;height:55%"></span></div>
        <div class="cd up" style="height:60%;animation-delay:.16s"><span class="wick" style="top:-8px;height:calc(100% + 16px)"></span><span class="body" style="top:25%;height:55%"></span></div>
        <div class="cd up" style="height:96%;animation-delay:.24s"><span class="wick" style="top:-6px;height:calc(100% + 12px)"></span><span class="body" style="top:15%;height:65%"></span></div>
        <div class="cd dn" style="height:74%;animation-delay:.32s"><span class="wick" style="top:-8px;height:calc(100% + 16px)"></span><span class="body" style="top:20%;height:50%"></span></div>
        <div class="cd up" style="height:82%;animation-delay:.4s"><span class="wick" style="top:-6px;height:calc(100% + 12px)"></span><span class="body" style="top:12%;height:60%"></span></div>
      </div></div></div>
<div class="meta"><b>Candlestick</b> · <code>charts-candlestick</code><br>Charts &amp; Metrics · New<p>OHLC candles with wicks — green up, red down. The staple for price / range over time.</p></div>

</body>
</html>
