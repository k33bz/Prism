<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatter Plot + Trend Line · Prism</title>
<!-- Prism showcase sample: charts-scatter-plot-trend-line (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">Scatter Plot — Latency vs Token Count</div>
        <svg width="260" height="130" viewBox="0 0 260 130">
          <line x1="30" y1="110" x2="250" y2="110" stroke="var(--line)"></line><line x1="30" y1="10" x2="30" y2="110" stroke="var(--line)"></line>
          <g font-size="8" fill="var(--dim)"><text x="24" y="114">0</text><text x="240" y="124">tokens</text><text x="14" y="14">ms</text></g>
          <!-- Points -->
          <circle cx="55" cy="95" r="4" fill="var(--pos)" opacity=".7"></circle><circle cx="72" cy="88" r="5" fill="var(--pos)" opacity=".7"></circle>
          <circle cx="95" cy="72" r="4" fill="var(--info)" opacity=".7"></circle><circle cx="110" cy="65" r="6" fill="var(--info)" opacity=".7"></circle>
          <circle cx="130" cy="58" r="4" fill="var(--accent)" opacity=".7"></circle><circle cx="155" cy="42" r="7" fill="var(--accent)" opacity=".7"></circle>
          <circle cx="180" cy="35" r="5" fill="var(--accent)" opacity=".7"></circle><circle cx="205" cy="22" r="8" fill="var(--neg)" opacity=".7"></circle>
          <circle cx="230" cy="18" r="6" fill="var(--neg)" opacity=".7"></circle>
          <!-- Trend line -->
          <line x1="40" y1="100" x2="240" y2="15" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" opacity=".5"></line>
        </svg>
      </div></div></div>
<div class="meta"><b>Scatter Plot + Trend Line</b> · <code>charts-scatter-plot-trend-line</code><br>Charts &amp; Metrics · Advanced Visualizations<p>Two-variable correlation plot. Bubble size can encode a 3rd dimension. Trend line shows direction.</p></div>

</body>
</html>
