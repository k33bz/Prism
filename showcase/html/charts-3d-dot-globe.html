<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Dot Globe · Prism</title>
<!-- Prism showcase sample: charts-3d-dot-globe (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: currentcolor; box-shadow: currentcolor 0px 0px 8px; }
.n3d-scene { perspective: 640px; perspective-origin: 50% 42%; display: flex; align-items: center; justify-content: center; min-height: 150px; }
.n3d-globe { position: relative; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(-16deg); animation: 14s linear 0s infinite normal none running n3dSpin; }
.n3d-globe .ring { position: absolute; inset: 0px; border-radius: 50%; border: 1px solid rgba(var(--info-rgb),.45); }
.n3d-globe .ring:nth-child(1) { transform: rotateY(0deg); }
.n3d-globe .ring:nth-child(2) { transform: rotateY(45deg); }
.n3d-globe .ring:nth-child(3) { transform: rotateY(90deg); }
.n3d-globe .ring:nth-child(4) { transform: rotateY(135deg); }
.n3d-globe .ring:nth-child(5) { transform: rotateX(70deg); border-color: rgba(var(--accent-rgb),.4); }
.n3d-globe .dot { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 7px var(--pos); }
@keyframes n3dSpin { 
  100% { transform: rotateY(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="n3d-scene"><div class="n3d-globe">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <span class="dot" style="transform:translate3d(-40px,-20px,20px)"></span>
      <span class="dot" style="transform:translate3d(30px,10px,40px);background:var(--accent);box-shadow:0 0 7px var(--accent)"></span>
      <span class="dot" style="transform:translate3d(10px,-34px,-30px);background:var(--info);box-shadow:0 0 7px var(--info)"></span>
      <span class="dot" style="transform:translate3d(-18px,28px,-24px);background:var(--warn);box-shadow:0 0 7px var(--warn)"></span>
    </div></div></div></div>
<div class="meta"><b>3D Dot Globe</b> · <code>charts-3d-dot-globe</code><br>Charts &amp; Metrics · 3D &amp; Perspective (2026 drop)<p>Rotating latitude rings with glowing markers — a compact globe for geo-distributed traffic, edge nodes or PoPs.</p></div>

</body>
</html>
