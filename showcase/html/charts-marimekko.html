<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marimekko · Prism</title>
<!-- Prism showcase sample: charts-marimekko (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lv-stackbars .col { width: 20px; display: flex; flex-direction: column-reverse; border-radius: 3px; overflow: hidden; transition: height 0.4s; }
.lv-stackbars .col > span { display: block; transition: height 0.5s cubic-bezier(0.4, 1, 0.4, 1); }
.nch-marimekko { display: flex; gap: 3px; width: 220px; height: 80px; }
.nch-marimekko .col { display: flex; flex-direction: column; gap: 3px; }
.nch-marimekko .col i { border-radius: 2px; transform-origin: center top; animation: 0.8s ease-out 0s 1 normal both running nchGrow; }
@keyframes nchGrow { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
.n3d-stack .col { position: absolute; bottom: 0px; width: 30px; transform-style: preserve-3d; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nch-marimekko">
        <div class="col" style="width:70px"><i style="height:50%;background:var(--info);animation-delay:0s"></i><i style="height:30%;background:var(--crit);animation-delay:.1s"></i><i style="height:20%;background:var(--warn);animation-delay:.2s"></i></div>
        <div class="col" style="width:50px"><i style="height:35%;background:var(--info);animation-delay:.15s"></i><i style="height:45%;background:var(--crit);animation-delay:.25s"></i><i style="height:20%;background:var(--warn);animation-delay:.35s"></i></div>
        <div class="col" style="width:90px"><i style="height:60%;background:var(--info);animation-delay:.3s"></i><i style="height:25%;background:var(--crit);animation-delay:.4s"></i><i style="height:15%;background:var(--warn);animation-delay:.5s"></i></div>
      </div></div></div>
<div class="meta"><b>Marimekko</b> · <code>charts-marimekko</code><br>Charts &amp; Metrics · New<p>Variable-width stacked columns — segment share and category size in one two-dimensional mosaic.</p></div>

</body>
</html>
