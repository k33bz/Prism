<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Axis Flip · Prism</title>
<!-- Prism showcase sample: lab-x-axis-flip (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.flip3d { width: 100px; height: 80px; perspective: 600px; cursor: pointer; }
.flip3d-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
.flip3d:hover .flip3d-inner { transform: rotateY(180deg); }
.flip3d-y-auto .flip3d-inner { animation: 4s ease-in-out 0s infinite normal none running flip3dY; }
.flip3d-x-auto .flip3d-inner { animation: 4s ease-in-out 0s infinite normal none running flip3dX; }
.flip3d-face { position: absolute; inset: 0px; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: rgb(255, 255, 255); }
.flip3d-front { background: linear-gradient(135deg,var(--crit),rgba(var(--crit-rgb),.5)); }
.flip3d-back-x { background: linear-gradient(135deg,var(--pos),rgba(var(--pos-rgb),.5)); transform: rotateX(180deg); }
@keyframes flip3dY { 
  0%, 40% { transform: rotateY(0deg); }
  60%, 100% { transform: rotateY(180deg); }
}
@keyframes flip3dX { 
  0%, 40% { transform: rotateX(0deg); }
  60%, 100% { transform: rotateX(180deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="flip3d flip3d-x-auto"><div class="flip3d-inner"><div class="flip3d-face flip3d-front">TOP</div><div class="flip3d-face flip3d-back-x">UNDER</div></div></div></div></div>
<div class="meta"><b>X-Axis Flip</b> · <code>lab-x-axis-flip</code><br>Animation Lab · 3D Card Flips<p>Same preserve-3d technique flipped vertically, so the card tumbles forward to reveal its underside.</p></div>

</body>
</html>
