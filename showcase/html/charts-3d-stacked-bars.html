<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Stacked Bars · Prism</title>
<!-- Prism showcase sample: charts-3d-stacked-bars (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">

</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="240" height="195" viewBox="0 0 240 195" style="overflow:visible">
        <!-- stacked isometric bars: each column = 3 stacked segments with side faces -->
        <g stroke="var(--line)" stroke-width=".5" opacity=".35"><line x1="30" y1="165" x2="220" y2="165"></line></g>
        <!-- column 1 -->
        <g>
          <polygon points="55,165 55,135 75,125 75,155" fill="var(--pos)" opacity=".5"></polygon><polygon points="40,143 55,135 75,125 60,133" fill="var(--pos)"></polygon><polygon points="40,143 40,173 55,165 55,135" fill="var(--pos)" opacity=".75"></polygon>
          <polygon points="55,135 55,110 75,100 75,125" fill="var(--info)" opacity=".5"></polygon><polygon points="40,118 55,110 75,100 60,108" fill="var(--info)"></polygon><polygon points="40,118 40,143 55,135 55,110" fill="var(--info)" opacity=".75"></polygon>
          <polygon points="55,110 55,92 75,82 75,100" fill="var(--accent)" opacity=".5"></polygon><polygon points="40,100 55,92 75,82 60,90" fill="var(--accent)"></polygon><polygon points="40,100 40,118 55,110 55,92" fill="var(--accent)" opacity=".75"></polygon>
        </g>
        <!-- column 2 -->
        <g>
          <polygon points="125,165 125,140 145,130 145,155" fill="var(--pos)" opacity=".5"></polygon><polygon points="110,148 125,140 145,130 130,138" fill="var(--pos)"></polygon><polygon points="110,148 110,173 125,165 125,140" fill="var(--pos)" opacity=".75"></polygon>
          <polygon points="125,140 125,108 145,98 145,130" fill="var(--info)" opacity=".5"></polygon><polygon points="110,116 125,108 145,98 130,106" fill="var(--info)"></polygon><polygon points="110,116 110,148 125,140 125,108" fill="var(--info)" opacity=".75"></polygon>
          <polygon points="125,108 125,72 145,62 145,98" fill="var(--accent)" opacity=".5"></polygon><polygon points="110,80 125,72 145,62 130,70" fill="var(--accent)"></polygon><polygon points="110,80 110,116 125,108 125,72" fill="var(--accent)" opacity=".75"></polygon>
        </g>
        <text x="120" y="188" text-anchor="middle" font-size="10" fill="var(--muted)">cost mix · this vs last month</text>
      </svg></div></div>
<div class="meta"><b>3D Stacked Bars</b> · <code>charts-3d-stacked-bars</code><br>Charts &amp; Metrics · 3D Charts &amp; Graphs<p>Isometric columns split into stacked segments, each with its own lit top and shaded side — composition and total in one solid. Use for a few categories where the breakdown matters as much as the height.</p></div>

</body>
