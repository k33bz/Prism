<style id="prism-tokens">

</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-cir { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-lbl { fill: var(--muted); font-size: 6px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetFlow; animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
.arch-net-slow { animation-duration: 1.6s; }
.arch-net-lit { transform-box: fill-box; transform-origin: center center; animation-name: archNetLit; animation-duration: 3s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--ld,0s); }
.arch-net-lit4 { animation-duration: 4s; }
@keyframes archNetFlow { 
  100% { stroke-dashoffset: -15; }
}
@keyframes archNetLit { 
  0%, 55%, 100% { opacity: 0; transform: scale(0.5); }
  16% { opacity: 0.75; transform: scale(1); }
  40% { opacity: 0; transform: scale(1.6); }
}
</style>
</head>
