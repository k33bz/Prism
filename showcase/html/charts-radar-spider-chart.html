<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar / Spider Chart · Prism</title>
<!-- Prism showcase sample: charts-radar-spider-chart (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.pie-label { font-size: 10px; fill: var(--muted); font-weight: 600; }
.radar-fill { fill: rgba(var(--accent-rgb),.15); stroke: var(--accent); stroke-width: 2; }
.radar-dot { fill: var(--accent); r: 3.5; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="180" height="180" viewBox="0 0 180 180">
        <!-- Radar / spider chart -->
        <g stroke="var(--line)" fill="none">
          <polygon points="90,20 155,55 155,125 90,160 25,125 25,55"></polygon>
          <polygon points="90,40 140,65 140,115 90,140 40,115 40,65" opacity=".5"></polygon>
          <polygon points="90,60 125,75 125,105 90,120 55,105 55,75" opacity=".3"></polygon>
        </g>
        <!-- Data polygon -->
        <polygon points="90,28 148,62 142,128 90,145 35,108 42,58" class="radar-fill"></polygon>
        <!-- Axis lines -->
        <g stroke="var(--line)" stroke-width=".5"><line x1="90" y1="20" x2="90" y2="160"></line><line x1="25" y1="55" x2="155" y2="125"></line><line x1="155" y1="55" x2="25" y2="125"></line></g>
        <!-- Dots -->
        <g><circle cx="90" cy="28" class="radar-dot"></circle><circle cx="148" cy="62" class="radar-dot"></circle><circle cx="142" cy="128" class="radar-dot"></circle><circle cx="90" cy="145" class="radar-dot"></circle><circle cx="35" cy="108" class="radar-dot"></circle><circle cx="42" cy="58" class="radar-dot"></circle></g>
        <!-- Labels -->
        <g class="pie-label"><text x="90" y="12" text-anchor="middle">Perf</text><text x="165" y="55">Security</text><text x="165" y="135">Cost</text><text x="90" y="175" text-anchor="middle">Reliability</text><text x="12" y="135">Scale</text><text x="12" y="55">DX</text></g>
      </svg></div></div>
<div class="meta"><b>Radar / Spider Chart</b> · <code>charts-radar-spider-chart</code><br>Charts &amp; Metrics · Advanced Visualizations<p>Multi-dimensional comparison (5-8 axes). Shows strengths/weaknesses of a system or team at a glance.</p></div>

</body>
</html>
