<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egg Timer · Prism</title>
<!-- Prism showcase sample: objects-egg-timer (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obj-sand-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,var(--panel2),var(--panel)); display: grid; place-items: center; isolation: isolate; }
.obj-sand-tag { position: absolute; left: 12px; bottom: 9px; z-index: 8; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obj-sand-egg { position: relative; width: 78px; height: 118px; }
.obj-sand-egg-body { position: absolute; inset: 0px; border: 1.5px solid var(--muted); border-radius: 40px / 54px; overflow: hidden; background: rgba(255, 255, 255, 0.02); }
.obj-sand-egg-top { position: absolute; left: 0px; right: 0px; top: 0px; height: 50%; background: radial-gradient(120% 100% at 50% 0,rgba(var(--warn-rgb),.9),var(--warn)); transform-origin: center top; animation: 4s ease-in-out 0s infinite normal none running objSandWideT; }
.obj-sand-egg-bot { position: absolute; left: 0px; right: 0px; bottom: 0px; height: 50%; background: radial-gradient(120% 120% at 50% 100%,var(--warn),rgba(var(--warn-rgb),.72)); clip-path: polygon(50% 20%, 100% 100%, 0px 100%); transform: scaleY(0); transform-origin: center bottom; animation: 4s ease-in-out 0s infinite normal none running objSandWideB; }
.obj-sand-egg-neck { position: absolute; left: 50%; top: 50%; width: 2px; height: 14px; margin: -7px 0px 0px -1px; background: var(--warn); animation: 4s linear 0s infinite normal none running objSandClsStream; }
.obj-sand-egg-cap { position: absolute; left: 22px; right: 22px; height: 5px; background: var(--panel2); border-radius: 3px; }
.obj-sand-egg-cap.obj-sand-egg-ct { top: -2px; }
.obj-sand-egg-cap.obj-sand-egg-cb { bottom: -2px; }
@keyframes objSandClsStream { 
  0%, 88% { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@keyframes objSandWideT { 
  0% { transform: scaleY(1); }
  88%, 100% { transform: scaleY(0.05); }
}
@keyframes objSandWideB { 
  0% { transform: scaleY(0.05); }
  88%, 100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obj-sand-root"><div class="obj-sand-egg"><span class="obj-sand-egg-cap obj-sand-egg-ct"></span><span class="obj-sand-egg-top"></span><span class="obj-sand-egg-neck"></span><span class="obj-sand-egg-bot"></span><span class="obj-sand-egg-cap obj-sand-egg-cb"></span><span class="obj-sand-egg-body"></span></div><span class="obj-sand-tag">Pixel · brew</span></div></div></div>
<div class="meta"><b>Egg Timer</b> · <code>objects-egg-timer</code><br>Animated Objects · HOURGLASS &amp; SAND<p>A rounded kitchen-style timer body drains its sand from the upper half into the lower half. Short countdowns and cook timers.</p></div>

</body>
</html>
