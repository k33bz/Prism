<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Menu Panel · Prism</title>
<!-- Prism showcase sample: menus-mega-menu-panel (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; box-shadow: rgba(0, 0, 0, 0.4) 0px 16px 38px; padding: 6px; min-width: 196px; font-size: 12.5px; color: var(--ink); font-family: inherit; }
.mnu-chevron { transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1); }
.mnu-select-input:checked ~ .mnu-select-trigger .mnu-chevron { transform: rotate(180deg); color: var(--info); }
.mnu-mega { position: relative; display: inline-block; }
.mnu-mega-trigger { padding: 9px 14px; border-radius: 8px; color: var(--ink); font-size: 12.5px; font-weight: 700; cursor: default; display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); }
.mnu-mega-panel { position: absolute; left: 0px; top: calc(100% + 8px); opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.97); transform-origin: left top; transition: opacity 0.2s, transform 0.2s cubic-bezier(0.25, 1, 0.35, 1), visibility 0.2s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; z-index: 5; width: 330px; }
.mnu-mega:hover .mnu-mega-panel, .mnu-mega:focus-within .mnu-mega-panel { opacity: 1; visibility: visible; transform: translateY(0px) scale(1); }
.mnu-mega-col-h { font: 800 9.5px / 1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--info); margin-bottom: 8px; }
.mnu-mega-col a { display: block; color: var(--muted); font-size: 12px; text-decoration: none; padding: 4px 0px; transition: color 0.15s; }
.mnu-mega-col a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-mega">
      <div class="mnu-mega-trigger">Products <span class="mnu-chevron">▾</span></div>
      <div class="mnu-mega-panel mnu-panel">
        <div class="mnu-mega-col"><div class="mnu-mega-col-h">Platform</div><a href="#">Compute</a><a href="#">Storage</a><a href="#">Networking</a></div>
        <div class="mnu-mega-col"><div class="mnu-mega-col-h">Data</div><a href="#">Analytics</a><a href="#">Warehouses</a><a href="#">Pipelines</a></div>
        <div class="mnu-mega-col"><div class="mnu-mega-col-h">Resources</div><a href="#">Docs</a><a href="#">Blog</a><a href="#">Status</a></div>
      </div>
    </div></div></div>
<div class="meta"><b>Mega Menu Panel</b> · <code>menus-mega-menu-panel</code><br>Menus &amp; Actions · NAVIGATION MENUS<p>A wide grouped-column panel that drops from a top nav item — for site-wide product navigation.</p></div>

</body>
</html>
