<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Gradient Title · Prism</title>
<!-- Prism showcase sample: text-forge-gradient-title (gallery: text). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.kf-title { display: inline-block; margin: 0px; font: 800 34px / 1.05 ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; color: var(--ink); --kf-hot: var(--accent); --kf-hot-rgb: var(--accent-rgb); --kf-cool: var(--pos); --kf-cool-rgb: var(--pos-rgb); }
.kf-title span { display: inline-block; background-image: linear-gradient(100deg,var(--kf-hot) 0%,rgba(255,255,255,.8) 55%,var(--kf-hot) 100%); background-size: 220% 100%; background-repeat: no-repeat; background-clip: text; color: transparent; animation: 4.5s ease-in-out 0s infinite normal none running kfSheen; }
.kf-title span::after { content: ""; display: block; height: 5px; border-radius: 2.5px; margin-top: 0.06em; background: linear-gradient(90deg,rgba(var(--kf-cool-rgb),.5),var(--kf-cool)); transform-origin: 0px 50%; animation: 4.5s ease-in-out 0s infinite normal none running kfBar; }
@keyframes kfSheen { 
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes kfBar { 
  0% { transform: scaleX(0); }
  20%, 100% { transform: scaleX(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><h1 class="kf-title">kastroso <span>forge</span></h1></div></div>
<div class="meta"><b>Forge Gradient Title</b> · <code>text-forge-gradient-title</code><br>Text Effects · FORGE LANDING KIT<p>Heading with one word in a hot gradient that sheens slowly, underscored by a green bar that draws in — the landing-page wordmark treatment. Tint with --kf-hot / --kf-cool.</p></div>

</body>
