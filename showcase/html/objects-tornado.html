<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tornado · Prism</title>
<!-- Prism showcase sample: objects-tornado (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mol .ring { transform-box: view-box; transform-origin: 59px 59px; animation: 9s linear 0s infinite normal none running spin; }
.scan-mol .ring { transform-box: view-box; transform-origin: 59px 59px; animation: 11s linear 0s infinite normal none running spin; }
.orbits .ring { transform-box: view-box; transform-origin: 59px 59px; }
@keyframes spin { 
  100% { transform: rotate(1turn); }
}
.amb { position: relative; width: 100%; height: 150px; border-radius: 12px; overflow: hidden; background: rgb(12, 16, 24); }
.amb > .amb-content { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; height: 100%; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; text-shadow: rgba(0, 0, 0, 0.6) 0px 1px 6px; font-size: 13px; }
.amb .amb-px { position: absolute; top: 0px; left: 0px; pointer-events: none; }
.amb-tornado { background: radial-gradient(120% 80% at 50% 0%, rgb(58, 66, 86), rgb(12, 16, 24)); }
.amb-tornado .funnel { position: absolute; left: 50%; top: -4%; width: 120px; height: 160px; margin-left: -60px; animation: 4s ease-in-out 0s infinite normal none running ambSway; }
.amb-tornado .ring { position: absolute; left: 50%; border: 2px solid rgba(190, 200, 220, 0.45); border-radius: 50%; transform: translateX(-50%); animation: ambSpin var(--dur,1.2s) linear infinite; }
@keyframes ambSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes ambSway { 
  0%, 100% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage bg" id="stage"><div class="amb amb-tornado"><div class="funnel" id="amb-tornado-funnel"><div class="ring" style="top: 0px; width: 20px; height: 8px; --dur: 0.80s; opacity: 0.8;"></div><div class="ring" style="top: 16px; width: 31px; height: 10px; --dur: 0.92s; opacity: 0.74;"></div><div class="ring" style="top: 32px; width: 42px; height: 12px; --dur: 1.04s; opacity: 0.68;"></div><div class="ring" style="top: 48px; width: 53px; height: 14px; --dur: 1.16s; opacity: 0.62;"></div><div class="ring" style="top: 64px; width: 64px; height: 16px; --dur: 1.28s; opacity: 0.56;"></div><div class="ring" style="top: 80px; width: 75px; height: 18px; --dur: 1.40s; opacity: 0.5;"></div><div class="ring" style="top: 96px; width: 86px; height: 20px; --dur: 1.52s; opacity: 0.44;"></div><div class="ring" style="top: 112px; width: 97px; height: 22px; --dur: 1.64s; opacity: 0.38;"></div><div class="ring" style="top: 128px; width: 108px; height: 24px; --dur: 1.76s; opacity: 0.32;"></div></div><div class="amb-content">Tornado 🌪</div></div></div></div>
<div class="meta"><b>Tornado</b> · <code>objects-tornado</code><br>Animated Objects · Ambient weather backdrops<p>A stack of spinning debris rings forms a swaying funnel over a dim sky. Ominous, high-energy backdrop.</p></div>
