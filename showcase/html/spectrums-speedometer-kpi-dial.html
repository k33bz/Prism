<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speedometer KPI Dial · Prism</title>
<!-- Prism showcase sample: spectrums-speedometer-kpi-dial (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-speedo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.skeu-speedo-face { position: relative; width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgb(58, 61, 67), rgb(26, 27, 30) 70%, rgb(10, 10, 11) 100%); border: 4px solid rgb(85, 86, 90); box-shadow: rgba(0, 0, 0, 0.7) 0px 3px 9px inset, rgba(0, 0, 0, 0.5) 0px 6px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.skeu-speedo-arc { position: absolute; inset: 8px; border-radius: 50%; background: conic-gradient(from 220deg, var(--info) 0deg 90deg, transparent 90deg 360deg); mask: radial-gradient(circle, transparent 70%, rgb(0, 0, 0) 72%); opacity: 0.85; }
.skeu-speedo-num { font-size: 26px; font-weight: 800; color: var(--skeu-amber); text-shadow: 0 0 8px rgba(var(--skeu-amber-rgb),.6); font-family: ui-monospace, Menlo, monospace; z-index: 1; }
.skeu-speedo-unit { font-size: 8px; letter-spacing: 0.08em; color: var(--skeu-metal-4); z-index: 1; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-speedo"><div class="skeu-speedo-face"><div class="skeu-speedo-arc"></div><span class="skeu-speedo-num">128</span><span class="skeu-speedo-unit">REQ/S</span></div></div></div></div>
<div class="meta"><b>Speedometer KPI Dial</b> · <code>spectrums-speedometer-kpi-dial</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A deep-set circular dial with a glowing arc and a chunky seven-segment-style readout — a single metric shown as an instrument cluster.</p></div>

</body>
</html>
