<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Timeline · Prism</title>
<!-- Prism showcase sample: callouts-branch-timeline (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-glow .ann-gd { font-size: 11px; line-height: 1.5; color: var(--muted); }
.ann-branch { width: 200px; text-align: left; font-family: ui-monospace, Menlo, monospace; }
.ann-branch .ann-brow { display: flex; align-items: center; gap: 9px; height: 24px; position: relative; }
.ann-branch .ann-graph { position: relative; width: 26px; height: 100%; flex: 0 0 auto; }
.ann-branch .ann-gd { position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--card,#0c0f18); border: 2px solid var(--gc,var(--ann-i)); z-index: 2; }
.ann-branch .ann-gd.c1 { left: 2px; }
.ann-branch .ann-gd.c2 { left: 15px; --gc: var(--ann-c); }
.ann-branch .ann-gl { position: absolute; left: 6px; top: 0px; bottom: 0px; width: 2px; background: var(--ann-i); opacity: 0.5; }
.ann-branch .ann-gl2 { position: absolute; left: 19px; top: 50%; bottom: 0px; width: 2px; background: var(--ann-c); opacity: 0.5; }
.ann-branch .ann-bt { font-size: 10px; color: var(--muted); }
.ann-branch .ann-bt b { color: var(--ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-branch">
      <div class="ann-brow"><div class="ann-graph"><span class="ann-gl"></span><span class="ann-gd c1"></span></div><div class="ann-bt"><b>main</b> init</div></div>
      <div class="ann-brow"><div class="ann-graph"><span class="ann-gl"></span><span class="ann-gl2"></span><span class="ann-gd c2"></span></div><div class="ann-bt">feature branch</div></div>
      <div class="ann-brow"><div class="ann-graph"><span class="ann-gl"></span><span class="ann-gd c1"></span></div><div class="ann-bt">merge to <b>main</b></div></div>
    </div></div></div>
<div class="meta"><b>Branch Timeline</b> · <code>callouts-branch-timeline</code><br>Callouts &amp; Annotations · TIMELINES &amp; STEPPERS<p>Git-graph style timeline with branch and merge dots for version histories.</p></div>

</body>
</html>
