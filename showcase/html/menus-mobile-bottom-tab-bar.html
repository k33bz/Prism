<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Bottom Tab Bar · Prism</title>
<!-- Prism showcase sample: menus-mobile-bottom-tab-bar (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-ico { flex: 0 0 16px; text-align: center; color: var(--muted); font-size: 12px; }
.mnu-item:hover .mnu-ico { color: inherit; }
.mnu-sidebar .mnu-ico { flex: 0 0 15px; }
.mnu-cmdk-inputrow .mnu-ico { color: var(--dim); }
.mnu-cmdk-row .mnu-ico { width: 20px; text-align: center; color: var(--muted); }
.mnu-cmdk-row.is-sel .mnu-ico { color: var(--info); }
.mnu-tabs-mobile { position: relative; width: 250px; }
.mnu-tm-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-tm-track { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; }
.mnu-tm-track label { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: var(--dim); font-size: 9.5px; font-weight: 700; transition: color 0.18s, transform 0.18s; }
.mnu-tm-track label .mnu-ico { font-size: 15px; color: inherit; }
#mnu-tm-a:checked ~ .mnu-tm-track label[for="mnu-tm-a"], #mnu-tm-b:checked ~ .mnu-tm-track label[for="mnu-tm-b"], #mnu-tm-c:checked ~ .mnu-tm-track label[for="mnu-tm-c"], #mnu-tm-d:checked ~ .mnu-tm-track label[for="mnu-tm-d"] { color: var(--accent); transform: translateY(-3px); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-tabs-mobile">
      <input type="radio" name="mnu-tm" id="mnu-tm-a" class="mnu-tm-input" checked="">
      <input type="radio" name="mnu-tm" id="mnu-tm-b" class="mnu-tm-input">
      <input type="radio" name="mnu-tm" id="mnu-tm-c" class="mnu-tm-input">
      <input type="radio" name="mnu-tm" id="mnu-tm-d" class="mnu-tm-input">
      <div class="mnu-tm-track">
        <label for="mnu-tm-a"><span class="mnu-ico">⌂</span>Home</label>
        <label for="mnu-tm-b"><span class="mnu-ico">🔍</span>Search</label>
        <label for="mnu-tm-c"><span class="mnu-ico">🔔</span>Alerts</label>
        <label for="mnu-tm-d"><span class="mnu-ico">👤</span>Profile</label>
      </div>
    </div></div></div>
<div class="meta"><b>Mobile Bottom Tab Bar</b> · <code>menus-mobile-bottom-tab-bar</code><br>Menus &amp; Actions · TAB BARS &amp; SEGMENTED CONTROLS<p>A four-icon mobile tab bar where the active icon lifts and tints on tap.</p></div>

</body>
</html>
