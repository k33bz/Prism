<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap · Prism</title>
<!-- Prism showcase sample: diagrams-roadmap (gallery: diagrams). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dgm { display: block; width: 100%; max-width: 320px; height: auto; overflow: visible; font: 600 9px ui-sans-serif, system-ui, sans-serif; --c: var(--accent); --c-rgb: var(--accent-rgb); }
.dgm text { fill: var(--ink); text-anchor: middle; dominant-baseline: middle; font-size: 9px; font-weight: 600; }
.dgm text.mut { fill: var(--muted); font-weight: 500; font-size: 8px; }
.dgm text.dim { fill: var(--dim); font-weight: 500; font-size: 7.5px; }
.dgm text.hd { font-weight: 800; font-size: 10px; }
.dgm .ln { fill: none; stroke: var(--line); stroke-width: 1.5; }
.dgm .ln.c { stroke: var(--c); }
.dgm .bx { fill: var(--panel2); stroke: var(--line); stroke-width: 1; }
.dgm .bx.c { stroke: var(--c); fill: rgba(var(--c-rgb),.12); }
.dgm .bx.pos { stroke: var(--pos); fill: rgba(var(--pos-rgb),.14); }
.dgm .bx.warn { stroke: var(--warn); fill: rgba(var(--warn-rgb),.14); }
.dgm .bx.neg { stroke: var(--neg); fill: rgba(var(--neg-rgb),.14); }
.dgm .bx.info { stroke: var(--info); fill: rgba(var(--info-rgb),.14); }
.dgm .bx.crit { stroke: var(--crit); fill: rgba(var(--crit-rgb),.14); }
.dgm .dot { fill: var(--c); }
.dgm .dr { stroke-dasharray: 400; stroke-dashoffset: 400; animation-name: dgmDraw; animation-duration: 6s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.22s); }
.dgm .fi { opacity: 0; animation-name: dgmFade; animation-duration: 6s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.22s); }
.dgm .pop { transform-box: fill-box; transform-origin: center center; animation-name: dgmPop; animation-duration: 6s; animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1.2); animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.22s); }
.dgm .pulse { animation: 2.4s ease-in-out 0s infinite normal none running dgmPulse; }
.dgm .flow { fill: none; stroke: var(--c); stroke-width: 2; stroke-dasharray: 6, 8; stroke-linecap: round; animation: 1.6s linear 0s infinite normal none running dgmFlow; }
.dgm .seq { animation-name: dgmSeq; animation-duration: calc(var(--n,4)*1.1s); animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*1.1s); }
.dgm .seqfill { animation-name: dgmSeqFill; animation-duration: calc(var(--n,4)*1.1s); animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*1.1s); }
.dgm .spin { transform-box: fill-box; transform-origin: center center; animation: 12s linear 0s infinite normal none running dgmSpin; }
.dgm-chev .step.done { fill: rgba(var(--c-rgb),.22); stroke: var(--c); }
.dgm-road .rail { stroke: var(--line); stroke-width: 6; stroke-linecap: round; }
.dgm-road .done { stroke: var(--c); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: 7s ease-in-out 0s infinite normal none running dgmDraw; }
.dgm-road .ms { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
.dgm-road .ms.lit { animation-name: dgmMsLit; animation-duration: 7s; animation-timing-function: steps(1); animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.75s); }
@keyframes dgmDraw { 
  0% { stroke-dashoffset: 400; }
  30%, 88% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
@keyframes dgmFade { 
  0%, 4% { opacity: 0; }
  14%, 88% { opacity: 1; }
  96%, 100% { opacity: 0; }
}
@keyframes dgmPop { 
  0%, 4% { transform: scale(0.2); opacity: 0; }
  16%, 88% { transform: scale(1); opacity: 1; }
  96%, 100% { transform: scale(0.2); opacity: 0; }
}
@keyframes dgmPulse { 
  0%, 100% { filter: drop-shadow(0 0 0 rgba(var(--c-rgb),0)); }
  50% { filter: drop-shadow(0 0 6px rgba(var(--c-rgb),.9)); }
}
@keyframes dgmFlow { 
  100% { stroke-dashoffset: -28; }
}
@keyframes dgmSeq { 
  0%, 6% { opacity: 0.45; }
  12%, 22% { opacity: 1; }
  30%, 100% { opacity: 0.45; }
}
@keyframes dgmSeqFill { 
  0%, 6% { fill-opacity: 0.12; }
  12%, 22% { fill-opacity: 0.55; }
  30%, 100% { fill-opacity: 0.12; }
}
@keyframes dgmSpin { 
  100% { transform: rotate(360deg); }
}
@keyframes dgmMsLit { 
  0%, 8% { fill: var(--panel); stroke: var(--line); }
  9%, 88% { fill: var(--c); stroke: var(--c); }
  100% { fill: var(--panel); stroke: var(--line); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="dgm dgm-road" viewBox="0 0 320 160" aria-label="Roadmap">
      <path class="rail" d="M24 80 H296"></path><path class="done" d="M24 80 H296"></path>
      <text class="dim" x="56" y="120">Q1</text><text class="dim" x="120" y="120">Q2</text><text class="dim" x="184" y="120">Q3</text><text class="dim" x="248" y="120">Q4</text>
      <circle class="ms lit" style="--i:0" cx="56" cy="80" r="8"></circle><circle class="ms lit" style="--i:1" cx="120" cy="80" r="8"></circle><circle class="ms lit" style="--i:2" cx="184" cy="80" r="8"></circle><circle class="ms lit" style="--i:3" cx="248" cy="80" r="8"></circle>
      <text x="56" y="56">Alpha</text><text x="120" y="56">Beta</text><text x="184" y="56">GA</text><text x="248" y="56">v2</text>
      <text class="mut" x="56" y="44">Mar 14</text><text class="mut" x="120" y="44">Jun 2</text><text class="mut" x="184" y="44">Sep 9</text><text class="mut" x="248" y="44">Dec 1</text>
      <path class="ln" d="M296 77 l6 3 l-6 3" style="stroke:var(--ink)"></path>
    </svg></div></div>
<div class="meta"><b>Roadmap</b> · <code>diagrams-roadmap</code><br>Diagrams &amp; Frameworks · TIMELINE &amp; PLANNING<p>A quarter-by-quarter rail with dated milestones that light up as the progress bar reaches them. Product and strategic planning with benchmarks.</p></div>

</body>
