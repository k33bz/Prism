<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Diagram · Prism</title>
<!-- Prism showcase sample: arch-sequence-diagram (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-svg { display: block; width: 100%; height: 100%; overflow: visible; font: 700 9px ui-sans-serif, system-ui, sans-serif; }
.arch-svg text { fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.arch-conn .arch-svg .arch-ln { stroke: var(--line); stroke-width: 2; fill: none; }
.arch-conn .arch-svg .arch-flow { stroke: var(--info); stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 7, 7; animation: 1.1s linear 0s infinite normal none running archDash; }
.arch-arw { fill: var(--info); }
.arch-life { stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 3, 4; }
.arch-actor { fill: var(--card); stroke: var(--info); stroke-width: 1.4; }
.arch-msgln { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-dasharray: 80; stroke-dashoffset: 80; animation: 3.2s ease-in-out 0s infinite normal none running archDraw; }
.arch-msgln.arch-m2 { stroke: var(--info); animation-delay: 1.1s; }
.arch-msgln.arch-m3 { stroke: var(--pos); animation-delay: 2.1s; }
@keyframes archDash { 
  100% { stroke-dashoffset: -32; }
}
@keyframes archDraw { 
  0% { stroke-dashoffset: 80; }
  30%, 70% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-svg" viewBox="0 0 210 128" style="width:210px;height:128px">
      <rect class="arch-actor" x="16" y="8" width="44" height="20" rx="5"></rect><text x="38" y="18">Client</text>
      <rect class="arch-actor" x="83" y="8" width="44" height="20" rx="5"></rect><text x="105" y="18">API</text>
      <rect class="arch-actor" x="150" y="8" width="44" height="20" rx="5"></rect><text x="172" y="18">DB</text>
      <line class="arch-life" x1="38" y1="28" x2="38" y2="122"></line>
      <line class="arch-life" x1="105" y1="28" x2="105" y2="122"></line>
      <line class="arch-life" x1="172" y1="28" x2="172" y2="122"></line>
      <line class="arch-msgln" x1="38" y1="48" x2="105" y2="48"></line><polygon class="arch-arw" points="105,44 105,52 100,48" style="fill:var(--accent)"></polygon>
      <line class="arch-msgln arch-m2" x1="105" y1="72" x2="172" y2="72"></line><polygon class="arch-arw" points="172,68 172,76 167,72" style="fill:var(--info)"></polygon>
      <line class="arch-msgln arch-m3" x1="172" y1="98" x2="38" y2="98"></line><polygon class="arch-arw" points="38,94 38,102 43,98" style="fill:var(--pos)"></polygon>
    </svg></div></div>
<div class="meta"><b>Sequence Diagram</b> · <code>arch-sequence-diagram</code><br>Architecture Diagrams · SEQUENCE &amp; FLOW DIAGRAMS<p>Three lifelines with messages that draw themselves in order — a request tracing through API to DB and back.</p></div>

</body>
</html>
