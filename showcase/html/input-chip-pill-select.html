<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip / Pill Select · Prism</title>
<!-- Prism showcase sample: input-chip-pill-select (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.prism-rail a.sr-link.active { background: rgba(255, 153, 0, 0.14); color: rgb(255, 255, 255); border-left-color: rgb(255, 153, 0); }
.chip-select { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s; user-select: none; }
.chip:hover { border-color: var(--muted); color: var(--ink); }
.chip.active { border-color: var(--accent); background: rgba(var(--accent-rgb),.12); color: var(--accent); }
.color-swatch.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.4); }
.us-step.active .us-ico { background: rgba(var(--accent-rgb),.15); color: var(--accent); animation: 0.8s linear 0s infinite normal none running spinico; }
@keyframes spinico { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="chip-select">
        <span class="chip active" onclick="this.classList.toggle('active')">EC2</span>
        <span class="chip" onclick="this.classList.toggle('active')">Lambda</span>
        <span class="chip active" onclick="this.classList.toggle('active')">S3</span>
        <span class="chip" onclick="this.classList.toggle('active')">RDS</span>
        <span class="chip" onclick="this.classList.toggle('active')">DynamoDB</span>
        <span class="chip active" onclick="this.classList.toggle('active')">CloudFront</span>
      </div></div></div>
<div class="meta"><b>Chip / Pill Select</b> · <code>input-chip-pill-select</code><br>Input Methods · Selection &amp; Choice<p>Multi-select toggle chips. Click to toggle on/off. Compact for filter bars.</p></div>

</body>
</html>
