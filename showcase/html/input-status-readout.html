<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Readout · Prism</title>
<!-- Prism showcase sample: input-status-readout (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.in-scf { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--bg); padding: 8px; font: 800 8px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.1em; color: var(--bg); text-transform: uppercase; }
.in-scf-stat { display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; padding: 2px 4px; }
.in-scf-stat .in-scf-line { display: flex; align-items: center; gap: 6px; }
.in-scf-stat .in-scf-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--pos); animation: 1.6s ease-in-out 0s infinite normal none running inScfPing; }
.in-scf-stat .in-scf-line:nth-child(2) .in-scf-dot { background: var(--warn); animation-delay: 0.5s; }
.in-scf-stat .in-scf-line:nth-child(3) .in-scf-dot { background: var(--neg); animation-delay: 1s; }
.in-scf-stat .in-scf-lbl { color: var(--muted); width: 52px; flex: 0 0 52px; }
.in-scf-stat .in-scf-track { flex: 1 1 0%; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.in-scf-stat .in-scf-track i { display: block; height: 100%; background: var(--info); transform-origin: left center; animation: 3s ease-in-out 0s infinite normal none running inScfBar; }
.in-scf-stat .in-scf-line:nth-child(2) .in-scf-track i { background: var(--warn); animation-delay: 0.6s; }
.in-scf-stat .in-scf-line:nth-child(3) .in-scf-track i { background: var(--neg); animation-delay: 1.2s; }
@keyframes inScfBar { 
  0%, 100% { transform: scaleX(0.35); }
  50% { transform: scaleX(0.95); }
}
@keyframes inScfPing { 
  0%, 100% { opacity: 0.35; box-shadow: currentcolor 0px 0px 0px 0px; }
  50% { opacity: 1; box-shadow: currentcolor 0px 0px 6px 1px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="in-scf in-scf-stat" role="img" aria-label="Status readout panel">
      <div class="in-scf-line"><span class="in-scf-dot"></span><span class="in-scf-lbl">Power</span><span class="in-scf-track"><i></i></span></div>
      <div class="in-scf-line"><span class="in-scf-dot"></span><span class="in-scf-lbl">Shields</span><span class="in-scf-track"><i></i></span></div>
      <div class="in-scf-line"><span class="in-scf-dot"></span><span class="in-scf-lbl">Hull</span><span class="in-scf-track"><i></i></span></div>
    </div></div></div>
<div class="meta"><b>Status Readout</b> · <code>input-status-readout</code><br>Input Methods · RETRO SCIFI CONTROL PANELS<p>Labelled status rows with pinging indicator lamps and filling level tracks in green, amber and red. A system-status console.</p></div>

</body>
</html>
