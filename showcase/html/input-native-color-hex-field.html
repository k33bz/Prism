<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native Color + Hex Field · Prism</title>
<!-- Prism showcase sample: input-native-color-hex-field (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.colorhex { display: flex; align-items: center; gap: 10px; width: 100%; }
.colorhex input[type="color"] { appearance: none; width: 48px; height: 48px; border: 2px solid var(--line); border-radius: 10px; background: none; cursor: pointer; padding: 0px; overflow: hidden; }
.colorhex input[type="color"]::-webkit-color-swatch-wrapper { padding: 0px; }
.colorhex input[type="color"]::-webkit-color-swatch { border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 8px; }
.colorhex .hexbox { flex: 1 1 0%; display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 0px 12px; }
.colorhex .hexbox span { color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
.colorhex .hexbox input { flex: 1 1 0%; background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; color: var(--ink); font: 13px ui-monospace, Menlo, monospace; outline: none; padding: 11px 4px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="colorhex">
        <input type="color" value="#ff9900" oninput="ipColorHex(this)">
        <div class="hexbox"><span>#</span><input value="FF9900" maxlength="6" oninput="ipHexColor(this)"></div>
      </div></div></div>
<div class="meta"><b>Native Color + Hex Field</b> · <code>input-native-color-hex-field</code><br>Input Methods · Range, Number &amp; Rating<p>The OS color picker swatch wired two-way to an editable hex field: pick a color and the hex updates; type a hex and the swatch follows. Uses the real &lt;input type=color&gt; so it works fully offline.</p></div>

</body>
</html>
