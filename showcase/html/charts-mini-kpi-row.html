<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini KPI Row · Prism</title>
<!-- Prism showcase sample: charts-mini-kpi-row (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.kpi { background-position-x: ; background-position-y: ; background-size: ; background-repeat: ; background-attachment: ; background-origin: ; background-clip: ; background-color: ; background-image: var(--cardgrad); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; min-width: 150px; }
.kpi .l { font-family: ui-monospace, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.kpi .n { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11px; color: var(--muted); margin-top: 5px; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 20px; margin-top: 8px; }
.delta.up { color: var(--pos); background: rgba(var(--pos-rgb),.13); }
.delta.down { color: var(--neg); background: rgba(var(--neg-rgb),.13); }
.delta.flat { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
.scx-kpic .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
.scx-kpic .d.down { color: var(--neg); }
.scx-kpic .d.flat { color: var(--muted); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="kpi"><div class="l">Open cases</div><div class="n">21</div><div class="delta down">▼ 4 WoW</div></div>
      <div class="kpi"><div class="l">Sev-2</div><div class="n" style="color:var(--neg)">3</div><div class="delta flat">━ no change</div></div></div></div>
<div class="meta"><b>Mini KPI Row</b> · <code>charts-mini-kpi-row</code><br>Charts &amp; Metrics · KPI &amp; Single Value<p>A compact row of small KPIs for a summary strip across the top of a report.</p></div>

</body>
</html>
