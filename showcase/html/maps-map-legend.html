<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Legend · Prism</title>
<!-- Prism showcase sample: maps-map-legend (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tile .row { display: flex; gap: 8px; margin-top: 10px; }
.gmap-legend { width: 220px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 12px / 1.4 system-ui, sans-serif; color: var(--ink); }
.gmap-legend .lt { font-weight: 700; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
.gmap-legend .row { display: flex; align-items: center; gap: 8px; margin: 5px 0px; }
.gmap-legend .sw { width: 26px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
.gmap-legend .gradbar { height: 12px; border-radius: 3px; margin: 6px 0px 4px; background: linear-gradient(90deg,rgba(var(--info-rgb),.15),rgba(var(--info-rgb),.5),var(--info)); }
.gmap-legend .scale { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); }
.gmap-legend .live { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); animation: 1.6s ease-in-out 0s infinite normal none running gmapLegendTick; }
.gmap-hud .row { display: flex; justify-content: space-between; padding: 2px 0px; }
@keyframes gmapLegendTick { 
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
.pr-collpill .live { position: relative; z-index: 1; width: 9px; height: 9px; border-radius: 50%; background: var(--pos,#3fb950); box-shadow: 0 0 0 0 rgba(var(--pos-rgb,63,185,80),.6); animation: 1.8s ease-out 0s infinite normal none running prCollPing; }
@keyframes prCollPing { 
  0% { box-shadow: 0 0 0 0 rgba(var(--pos-rgb,63,185,80),.6); }
  70%, 100% { box-shadow: 0 0 0 9px rgba(var(--pos-rgb,63,185,80),0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-legend">
      <div class="lt">Population density <span class="live" style="float:right"></span></div>
      <div class="gradbar"></div>
      <div class="scale"><span>0</span><span>50k</span><span>500k</span><span>2M+</span></div>
      <div class="row"><span class="sw" style="background:var(--pos)"></span>Growing</div>
      <div class="row"><span class="sw" style="background:var(--neg)"></span>Declining</div>
    </div></div></div>
<div class="meta"><b>Map Legend</b> · <code>maps-map-legend</code><br>Maps &amp; Geo · REGIONS &amp; CHOROPLETH<p>A choropleth legend with a gradient scale and category swatches.</p></div>

</body>
</html>
