<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Row Focus · Prism</title>
<!-- Prism showcase sample: obsidian-table-row-focus (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-data { width: 280px; max-width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 10px; background: rgb(13, 17, 29); padding: 10px 12px; position: relative; overflow: hidden; text-align: left; }
.obs-data h4 { margin: 0px 0px 7px; font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.obs-data .obs-dnum { font: 800 23px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
.obs-table-focus .obs-trow { display: grid; grid-template-columns: 1.2fr 0.8fr 0.6fr; gap: 5px; padding: 5px 7px; border-radius: 5px; color: var(--dim); font-size: 9px; animation: 6s ease 0s infinite normal none running obsRowFocus; }
.obs-table-focus .obs-trow:nth-child(2) { animation-delay: 1.5s; }
.obs-table-focus .obs-trow:nth-child(3) { animation-delay: 3s; }
.obs-table-focus .obs-trow:nth-child(4) { animation-delay: 4.5s; }
.obs-trow span:last-child { text-align: right; color: var(--ob); }
@keyframes obsRowFocus { 
  0%, 100% { background: transparent; color: var(--dim); transform: none; }
  8%, 22% { background: rgba(var(--ob-rgb),.16); color: var(--ink); transform: translateX(3px); }
  30% { background: transparent; color: var(--dim); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-data obs-table-focus"><h4>Recently touched</h4><div class="obs-trow"><span>Attention</span><span>evergreen</span><span>94</span></div><div class="obs-trow"><span>Prism</span><span>active</span><span>88</span></div><div class="obs-trow"><span>Memory</span><span>seedling</span><span>71</span></div><div class="obs-trow"><span>Systems</span><span>review</span><span>64</span></div></div></div></div>
<div class="meta"><b>Table Row Focus</b> · <code>obsidian-table-row-focus</code><br>Obsidian Facets · DATAVIEW &amp; DASHBOARDS<p>Dashboard rows take turns stepping forward into an active focus state.</p></div>

</body>
</html>
