<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Circle · Prism</title>
<!-- Prism showcase sample: shapes-full-circle (gallery: shapes). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-info { --c: var(--info); --c-rgb: 68,147,248; }
.nsh2-g { position: absolute; left: 50%; top: 50%; font-weight: 800; white-space: pre; transform-style: preserve-3d; }
.nsh2-rotor { position: absolute; inset: 0px; transform-style: preserve-3d; }
.nsh2-ring3d .nsh2-rotor { animation: 12s linear 0s infinite normal none running nsh2RingSpin; }
.nsh2-ring3d .nsh2-g { font-size: 19px; color: var(--c); text-shadow: 0 0 9px rgba(var(--c-rgb),.55); }
.nsh2-cylinder .nsh2-rotor { animation: 15s linear 0s infinite normal none running nsh2CylSpin; }
.nsh2-cylinder .nsh2-g { font-size: 15px; color: var(--c); text-shadow: 0 0 7px rgba(var(--c-rgb),.5); }
.nsh2-helix .nsh2-rotor { animation: 8s linear 0s infinite normal none running nsh2RingSpin; }
.nsh2-helix .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.6); }
.nsh2-staircase .nsh2-rotor { animation: 13s linear 0s infinite normal none running nsh2RingSpin; }
.nsh2-staircase .nsh2-g { font-size: 15px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.55); }
.nsh2-sphere .nsh2-rotor { animation: 17s linear 0s infinite normal none running nsh2SphereSpin; }
.nsh2-sphere .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 8px rgba(var(--c-rgb),.6); }
.nsh2-cloud3d .nsh2-rotor { animation: 22s linear 0s infinite normal none running nsh2SphereSpin; }
.nsh2-extrude .nsh2-rotor { animation: 7s ease-in-out 0s infinite normal none running nsh2Rock; }
.nsh2-circle { position: relative; width: 150px; height: 150px; }
.nsh2-circle .nsh2-rotor { animation: 15s linear 0s infinite normal none running nsh2Spin2d; }
.nsh2-circle .nsh2-g { font-size: 16px; color: var(--c); text-shadow: 0 0 7px rgba(var(--c-rgb),.5); }
.nsh2-circle .nsh2-hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 20px; color: var(--c); font-weight: 800; }
.nsh2-spiralt .nsh2-g { color: var(--c); text-shadow: 0 0 5px rgba(var(--c-rgb),.5); }
.nsh2-spirall .nsh2-g { color: var(--c); text-shadow: 0 0 5px rgba(var(--c-rgb),.5); }
@keyframes nsh2RingSpin { 
  100% { transform: rotateY(360deg); }
}
@keyframes nsh2CylSpin { 
  0% { transform: rotateX(9deg) rotateY(0deg); }
  100% { transform: rotateX(9deg) rotateY(-360deg); }
}
@keyframes nsh2SphereSpin { 
  0% { transform: rotateX(-14deg) rotateY(0deg); }
  100% { transform: rotateX(-14deg) rotateY(360deg); }
}
@keyframes nsh2Rock { 
  0%, 100% { transform: rotateX(6deg) rotateY(-34deg); }
  50% { transform: rotateX(6deg) rotateY(34deg); }
}
@keyframes nsh2Spin2d { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

50%) rotate(170deg) translateY(-62px);">T</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(180deg) translateY(-62px);">E</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(190deg) translateY(-62px);">X</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(200deg) translateY(-62px);">T</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(210deg) translateY(-62px);">&nbsp;</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(220deg) translateY(-62px);">S</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(230deg) translateY(-62px);">P</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(240deg) translateY(-62px);">I</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(250deg) translateY(-62px);">N</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(260deg) translateY(-62px);">S</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(270deg) translateY(-62px);">&nbsp;</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(280deg) translateY(-62px);">R</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(290deg) translateY(-62px);">O</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(300deg) translateY(-62px);">U</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(310deg) translateY(-62px);">N</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(320deg) translateY(-62px);">D</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(330deg) translateY(-62px);">&nbsp;</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(340deg) translateY(-62px);">★</span><span class="nsh2-g" style="transform: translate(-50%, -50%) rotate(350deg) translateY(-62px);">&nbsp;</span></div><span class="nsh2-hub">◍</span></div></div></div>
<div class="meta"><b>Full Circle</b> · <code>shapes-full-circle</code><br>Text Shapes · 2D Shaped Text<p>A complete 360° ring of tangent letters that rotates as a flat disc around a centre glyph — a coin / seal wordmark. Distinct from the arc set: it closes the loop all the way around.</p></div>
