<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Note Callout · Prism</title>
<!-- Prism showcase sample: spectrums-leaf-note-callout (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-callout { display: flex; gap: 12px; width: 260px; padding: 14px 16px; border-radius: 10px; background: var(--solp-cream); border-left: 4px solid var(--solp-leaf); box-shadow: rgba(47, 90, 58, 0.12) 0px 6px 16px; }
.solp-cico { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 0px 60%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: rgb(255, 255, 255); background: linear-gradient(135deg,var(--solp-leaf2),var(--solp-leaf)); }
.solp-ctitle { font-weight: 800; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--solp-leafdeep); }
.solp-cbody { font-size: 12px; color: rgb(72, 96, 78); margin-top: 4px; line-height: 1.4; }
.solp-callout.solp-tip { border-left-color: var(--solp-gold); }
.solp-callout.solp-tip .solp-cico { background: linear-gradient(135deg,var(--solp-gold2),var(--solp-gold)); color: rgb(74, 44, 5); }
.solp-callout.solp-tip .solp-ctitle { color: var(--solp-golddeep); }
.solp-callout.solp-success { border-left-color: var(--solp-leaf2); position: relative; overflow: hidden; }
.solp-callout.solp-success .solp-cico { background: linear-gradient(135deg,#9be89a,var(--solp-leaf)); }
.solp-callout.solp-success::after { content: "✿"; position: absolute; right: 10px; top: 8px; font-size: 14px; color: rgba(255, 201, 74, 0.75); animation: 4s ease-in-out 0s infinite normal none running solpDrift; }
@keyframes solpDrift { 
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(6deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="solp-callout"><div class="solp-cico">i</div><div><div class="solp-ctitle">Note</div><div class="solp-cbody">Rain barrels refill fastest between 4–6am.</div></div></div></div></div>
<div class="meta"><b>Leaf Note Callout</b> · <code>spectrums-leaf-note-callout</code><br>Spectrums · Solarpunk · Solarpunk<p>A left-accented admonition with a leaf-shaped icon chip — the default neutral aside for the Solarpunk system.</p></div>

</body>
</html>
