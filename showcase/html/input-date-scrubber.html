<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Scrubber · Prism</title>
<!-- Prism showcase sample: input-date-scrubber (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-step .nin2-val { width: 56px; text-align: center; color: var(--ink); border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 40px; }
.nin2-scrub { width: 100%; }
.nin2-scrub .nin2-val { text-align: center; font: 800 18px ui-monospace, Menlo, monospace; color: var(--accent); margin-bottom: 8px; }
.nin2-scrub .nin2-rail { position: relative; height: 34px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.nin2-scrub .nin2-ticks { position: absolute; inset: 0px; display: flex; align-items: flex-end; padding: 0px 2px; }
.nin2-scrub .nin2-ticks span { flex: 1 1 0%; background: var(--line); margin: 0px 0.5px; height: 8px; border-radius: 1px; }
.nin2-scrub .nin2-ticks span:nth-child(7n+1) { height: 16px; background: var(--dim); }
.nin2-scrub input[type="range"] { position: absolute; inset: 0px; width: 100%; height: 100%; appearance: none; background: none; margin: 0px; cursor: ew-resize; }
.nin2-scrub input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 34px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.5); cursor: ew-resize; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-scrub" data-days="365"><div class="nin2-val">Day 220</div><div class="nin2-rail"><div class="nin2-ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><input type="range" min="0" max="365" value="220"></div></div></div></div>
<div class="meta"><b>Date Scrubber</b> · <code>input-date-scrubber</code><br>Input Methods · Fields, Pickers &amp; Actions<p>A timeline rail with tick marks you drag a wide handle across; the readout updates live. For scrubbing a range or time offset.</p></div>

</body>
</html>
