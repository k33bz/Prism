<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collapsible Tree Nav · Prism</title>
<!-- Prism showcase sample: menus-collapsible-tree-nav (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-ico { flex: 0 0 16px; text-align: center; color: var(--muted); font-size: 12px; }
.mnu-item:hover .mnu-ico { color: inherit; }
.mnu-lbl { flex: 1 1 auto; min-width: 0px; }
.mnu-sidebar .mnu-ico { flex: 0 0 15px; }
.mnu-tree { width: 186px; font-size: 12px; }
.mnu-tree-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-tree-row { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 7px; cursor: pointer; color: var(--ink); user-select: none; transition: background 0.15s; }
.mnu-tree-row:hover { background: rgba(var(--info-rgb),.1); }
.mnu-tree-caret { display: inline-block; transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1); color: var(--dim); font-size: 9px; }
.mnu-tree-input:checked ~ .mnu-tree-row .mnu-tree-caret { transform: rotate(90deg); color: var(--info); }
.mnu-tree-kids { max-height: 0px; overflow: hidden; padding-left: 20px; transition: max-height 0.26s cubic-bezier(0.3, 1, 0.4, 1); }
.mnu-tree-input:checked ~ .mnu-tree-kids { max-height: 120px; }
.mnu-tree-kids a { display: block; padding: 6px 8px; color: var(--muted); text-decoration: none; border-radius: 6px; font-size: 11.5px; transition: color 0.15s, background 0.15s; }
.mnu-tree-kids a:hover { color: var(--ink); background: rgba(var(--info-rgb),.08); }
.mnu-cmdk-inputrow .mnu-ico { color: var(--dim); }
.mnu-cmdk-row .mnu-ico { width: 20px; text-align: center; color: var(--muted); }
.mnu-cmdk-row.is-sel .mnu-ico { color: var(--info); }
.mnu-tm-track label .mnu-ico { font-size: 15px; color: inherit; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-tree">
      <input type="checkbox" id="mnu-tree-demo" class="mnu-tree-input" checked="">
      <label for="mnu-tree-demo" class="mnu-tree-row"><span class="mnu-tree-caret">▸</span><span class="mnu-ico">📁</span><span class="mnu-lbl">src</span></label>
      <div class="mnu-tree-kids">
        <a href="#">index.ts</a><a href="#">utils.ts</a><a href="#">types.ts</a>
      </div>
    </div></div></div>
<div class="meta"><b>Collapsible Tree Nav</b> · <code>menus-collapsible-tree-nav</code><br>Menus &amp; Actions · NAVIGATION MENUS<p>A folder-style nav row whose caret rotates and reveals children with an eased height expand.</p></div>

</body>
</html>
