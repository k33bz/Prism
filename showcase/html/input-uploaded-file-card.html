<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploaded File Card · Prism</title>
<!-- Prism showcase sample: input-uploaded-file-card (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.btn { padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1px solid transparent; cursor: pointer; transition: 0.15s; font-family: inherit; }
.btn-primary { background: var(--accent); color: rgb(26, 18, 0); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
.btn-secondary { background: var(--panel2); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-danger { background: rgba(var(--neg-rgb),.15); color: var(--neg); border-color: rgba(var(--neg-rgb),.4); }
.btn-danger:hover { background: rgba(var(--neg-rgb),.25); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div style="width:100%;text-align:center">
        <div style="font-size:36px;margin-bottom:10px">📎</div>
        <div style="font-size:13px;font-weight:700;color:var(--ink)">config-backup.yaml</div>
        <div style="font-size:11px;color:var(--dim);margin:4px 0 12px">842 KB · uploaded 3s ago</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-primary" style="font-size:11px;padding:7px 14px">Process</button>
          <button class="btn btn-secondary" style="font-size:11px;padding:7px 14px">Preview</button>
          <button class="btn btn-danger" style="font-size:11px;padding:7px 14px">Remove</button>
        </div>
      </div></div></div>
<div class="meta"><b>Uploaded File Card</b> · <code>input-uploaded-file-card</code><br>Input Methods · File Upload &amp; Processing<p>Post-upload file card with metadata and action buttons. Confirm processing or delete.</p></div>

</body>
</html>
