<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded Note Materialize · Prism</title>
<!-- Prism showcase sample: obsidian-embedded-note-materialize (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-embed { width: 270px; border-left: 3px solid var(--ob); border-radius: 6px; background: rgba(var(--ob-rgb),.07); padding: 9px 12px; position: relative; }
.obs-embed::before { content: ""; position: absolute; left: -3px; top: 0px; bottom: 0px; width: 3px; background-image: ; background-position-x: ; background-position-y: ; background-repeat: ; background-attachment: ; background-origin: ; background-clip: ; background-color: ; background-size: 100% 300%; animation: 2.6s linear 0s infinite normal none running obsBond; }
.obs-embed-h { font-size: 11px; font-weight: 800; color: var(--ob); display: flex; align-items: center; gap: 6px; }
.obs-embed-h i { font-style: normal; font-size: 10px; opacity: 0.8; }
.obs-embed .obs-eline { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); margin-top: 7px; opacity: 0; animation: 4.4s ease 0s infinite normal none running obsEmbedIn; }
.obs-embed .obs-eline:nth-child(3) { animation-delay: 0.2s; width: 88%; }
.obs-embed .obs-eline:nth-child(4) { animation-delay: 0.4s; width: 64%; }
@keyframes obsBond { 
  100% { background-position: -200% 0px; }
}
@keyframes obsEmbedIn { 
  0% { opacity: 0; transform: translateY(3px); }
  12%, 80% { opacity: 1; transform: none; }
  94%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-embed"><div class="obs-embed-h"><i>↳</i> Attention as Infrastructure</div><span class="obs-eline"></span><span class="obs-eline"></span><span class="obs-eline"></span></div></div></div>
<div class="meta"><b>Embedded Note Materialize</b> · <code>obsidian-embedded-note-materialize</code><br>Obsidian Facets · GRAPH VIEW &amp; LINK VISUALS<p>An embedded note materializes line-by-line beneath its source heading.</p></div>

</body>
</html>
