<title>Live ECG Monitor · Prism</title>
<!-- Prism showcase sample: charts-live-ecg-monitor (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.head { padding: 26px 32px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg,#232f3e,var(--panel)); }
.head h1 { margin: 0px; font-size: 25px; font-weight: 800; letter-spacing: -0.01em; }
.head p { margin: 7px 0px 0px; color: var(--muted); font-size: 13px; max-width: 820px; }
.lv-ecg { width: 260px; height: 96px; background: rgb(8, 11, 18); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; position: relative; }
.lv-ecg svg { display: block; width: 100%; height: 100%; }
.lv-ecg .grid { stroke: rgba(255, 255, 255, 0.043); stroke-width: 1; }
.lv-ecg .trace { fill: none; stroke: var(--pos); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(var(--pos-rgb),.6)); }
.lv-ecg .head { fill: var(--pos); filter: drop-shadow(0 0 5px var(--pos)); }
.lv-ecg .lbl { position: absolute; top: 7px; left: 9px; font: 700 10px ui-monospace, Menlo, monospace; color: var(--pos); letter-spacing: 0.05em; }
.lv-ecg .val { position: absolute; top: 7px; right: 9px; font-style: normal; font-variant: tabular-nums; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: 800; font-stretch: normal; font-size: 13px; line-height: normal; font-family: ui-monospace, Menlo, monospace; color: var(--ink); }
.head { background: var(--panel) !important; border-bottom: var(--bd,1px) solid var(--line) !important; }
.head h1 { font-weight: var(--head-w,700) !important; letter-spacing: -0.01em !important; color: var(--ink) !important; }
.head h1 span, .facets-hero h1 span { color: var(--accent) !important; }
.head { position: relative; }
.pr-collpill .lbl { position: relative; z-index: 1; }
.nch-rings .lbl { position: absolute; inset: 0px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--ink); }
.n3d-radar .grid { fill: none; stroke: var(--line); }
.ncx2-bullet .val { position: absolute; left: 0px; top: 4px; height: 8px; border-radius: 3px; background: var(--ink); transform-origin: left center; animation: 1.1s ease-out 0s 1 normal both running ncx2GrowX; }
.ncx2-arcgauge .val { position: absolute; left: 0px; right: 0px; bottom: 2px; text-align: center; font-size: 16px; font-weight: 800; color: var(--ink); }
@keyframes ncx2GrowX { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
</style>
</head>
