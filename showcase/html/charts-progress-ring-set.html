<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Ring Set · Prism</title>
<!-- Prism showcase sample: charts-progress-ring-set (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tl .r { color: var(--neg); background: var(--neg); }
.srchbox .results .r { padding: 3px 6px; border-radius: 5px; color: rgb(159, 176, 198); opacity: 0; animation: 0.4s ease-out 0s 1 normal forwards running srchReveal; }
.facets .f { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 11px; color: var(--muted); }
.facets .f b { color: var(--ink); font-variant-numeric: tabular-nums; }
.facets .f .bar { width: 46px; height: 5px; border-radius: 3px; background: rgb(10, 15, 26); overflow: hidden; }
.facets .f .bar > i { display: block; height: 100%; border-radius: 3px; animation: 1s cubic-bezier(0.22, 1, 0.36, 1) 0s 1 normal none running scx-growW; }
.lv-ecg .lbl { position: absolute; top: 7px; left: 9px; font: 700 10px ui-monospace, Menlo, monospace; color: var(--pos); letter-spacing: 0.05em; }
@keyframes srchReveal { 
  0% { opacity: 0; transform: translateX(-6px); }
  100% { opacity: 1; transform: none; }
}
@keyframes scx-growW { 
  0% { }
}
.pr-collpill .lbl { position: relative; z-index: 1; }
.nch-radbar .t { stroke: var(--panel2); }
.nch-radbar .f { stroke: var(--c,var(--accent)); stroke-dasharray: var(--dash); stroke-dashoffset: var(--dash); animation: 1.6s ease-out 0s 1 normal forwards running nchDraw; }
.nch-rings { display: flex; gap: 16px; }
.nch-rings .r { position: relative; width: 56px; height: 56px; }
.nch-rings svg { transform: rotate(-90deg); }
.nch-rings circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.nch-rings .t { stroke: var(--panel2); }
.nch-rings .f { stroke-dasharray: 151; stroke-dashoffset: 151; animation: 1.8s ease-out 0s 1 normal forwards running nchDraw; }
.nch-rings .lbl { position: absolute; inset: 0px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--ink); }
@keyframes nchDraw { 
  100% { stroke-dashoffset: 0; }
}
.n3d-cards .card .t { font-size: 10px; color: var(--muted); font-weight: 700; }
</style>
</head>

        <div class="r"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="t" cx="28" cy="28" r="24"></circle><circle class="f" cx="28" cy="28" r="24" style="stroke:var(--warn);stroke-dashoffset:75"></circle></svg><div class="lbl">50</div></div>
        <div class="r"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="t" cx="28" cy="28" r="24"></circle><circle class="f" cx="28" cy="28" r="24" style="stroke:var(--info);stroke-dashoffset:23"></circle></svg><div class="lbl">85</div></div>
