<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Dashboard Gauge · Prism</title>
<!-- Prism showcase sample: spectrums-analog-dashboard-gauge (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-gauge { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.skeu-gauge-face { position: relative; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgb(58, 61, 67), rgb(26, 27, 30) 70%, rgb(10, 10, 11) 100%); border: 4px solid rgb(85, 86, 90); box-shadow: rgba(0, 0, 0, 0.7) 0px 3px 8px inset, rgba(255, 255, 255, 0.08) 0px -1px 2px inset, rgba(0, 0, 0, 0.5) 0px 6px 14px; }
.skeu-gauge-arc { position: absolute; inset: 9px; border-radius: 50%; background: conic-gradient(from 205deg, var(--pos) 0deg 60deg, var(--skeu-amber) 60deg 105deg, var(--neg) 105deg 130deg, transparent 130deg 360deg); mask: radial-gradient(circle, transparent 62%, rgb(0, 0, 0) 64%); opacity: 0.9; }
.skeu-gauge-needle { position: absolute; left: 50%; bottom: 50%; width: 3px; height: 38px; border-radius: 2px; background: linear-gradient(180deg,var(--skeu-amber),#7a4c06); transform-origin: center bottom; transform: translateX(-50%) rotate(28deg); box-shadow: 0 0 5px rgba(var(--skeu-amber-rgb),.7); transition: transform 0.4s cubic-bezier(0.3, 1.3, 0.5, 1); }
.skeu-gauge-hub { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle at 34% 28%, rgb(238, 238, 238), rgb(119, 119, 119) 70%, rgb(51, 51, 51) 100%); box-shadow: rgba(0, 0, 0, 0.6) 0px 1px 2px; }
.skeu-gauge-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: var(--skeu-metal-4); }
.skeu-gauge:hover .skeu-gauge-needle { transform: translateX(-50%) rotate(70deg); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-gauge"><div class="skeu-gauge-face"><div class="skeu-gauge-arc"></div><div class="skeu-gauge-needle"></div><div class="skeu-gauge-hub"></div></div><div class="skeu-gauge-label">CPU LOAD</div></div></div></div>
<div class="meta"><b>Analog Dashboard Gauge</b> · <code>spectrums-analog-dashboard-gauge</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A recessed analog dial with a colored risk arc and an amber needle that sweeps further on hover — a metric read as an instrument-panel gauge.</p></div>

</body>
</html>
