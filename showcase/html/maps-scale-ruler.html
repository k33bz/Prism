<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Ruler · Prism</title>
<!-- Prism showcase sample: maps-scale-ruler (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-scene { position: relative; width: 250px; height: 158px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 140% at 50% -20%,rgba(var(--info-rgb),.10),transparent 60%),var(--panel2); border: 1px solid var(--line); }
.gmap-svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }
.gmap-ruler-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: var(--len); stroke-linecap: round; animation: 4s ease-in-out 0s infinite normal none running gmapMeasure; }
.gmap-ruler-end { fill: var(--accent); }
.gmap-ruler .bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; font: 9px / 1 system-ui, sans-serif; color: var(--muted); }
.gmap-ruler .bar i { width: 26px; height: 8px; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-left-color: ; border-left-style: ; border-left-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; }
.gmap-ruler .bar i:nth-child(2n+1) { background: rgba(var(--info-rgb),.35); }
.gmap-ruler .dist { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); font: 700 11px / 1 ui-monospace, monospace; color: var(--accent); animation: 1.4s ease-in-out 0s infinite normal none running gmapHudBlink; }
@keyframes gmapHudBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@keyframes gmapMeasure { 
  0% { stroke-dashoffset: var(--len); }
  60%, 100% { stroke-dashoffset: 0; }
}
.bar { background: var(--panel) !important; border-bottom: var(--bd,1px) solid var(--line) !important; backdrop-filter: none !important; }
.bar b { color: var(--muted) !important; }
.bar button { border-radius: var(--r-sm,8px) !important; transition: background var(--dur,.12s) var(--ease,ease),color var(--dur,.12s) var(--ease,ease),border-color var(--dur,.12s) var(--ease,ease) !important; }
.bar button.on { color: rgb(255, 255, 255) !important; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-scene gmap-ruler">
      <svg class="gmap-svg" viewBox="0 0 250 158">
        <path class="gmap-ruler-line" style="--len:210" d="M30,110 L220,50"></path>
        <circle class="gmap-ruler-end" cx="30" cy="110" r="4"></circle>
        <circle class="gmap-ruler-end" cx="220" cy="50" r="4"></circle>
      </svg>
      <div class="dist">318 km</div>
      <div class="bar"><i></i><i></i><i></i><i></i></div>
    </div></div></div>
<div class="meta"><b>Scale Ruler</b> · <code>maps-scale-ruler</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>A measure line drawing between two points with a distance readout and scale bar.</p></div>

</body>
</html>
