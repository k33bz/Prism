<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass Rose · Prism</title>
<!-- Prism showcase sample: maps-compass-rose (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-tiers .lbl { margin-top: 4px; font: 9px / 1 system-ui, sans-serif; color: var(--dim); text-align: center; }
.gmap-grid-svg .lbl { fill: var(--dim); font: 8px system-ui, sans-serif; }
.gmap-compass { position: relative; width: 130px; height: 130px; }
.gmap-compass .dial { position: absolute; inset: 0px; border-radius: 50%; border: 2px solid rgba(var(--info-rgb),.25); background: radial-gradient(circle,var(--panel2),var(--panel)); }
.gmap-compass .needle { position: absolute; left: 50%; top: 50%; width: 0px; height: 0px; transform-origin: center bottom; animation: 5s ease-in-out 0s infinite normal none running gmapCompassWob; }
.gmap-compass .n-n { border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 52px solid var(--neg); transform: translate(-50%, -100%); }
.gmap-compass .n-s { border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 52px solid var(--muted); position: absolute; left: 50%; top: 50%; transform: translate(-50%, 0px); }
.gmap-compass .hub { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); }
.gmap-compass .lbl { position: absolute; left: 50%; transform: translateX(-50%); font: 700 11px / 1 system-ui, sans-serif; color: var(--muted); }
.gmap-compass .cn { top: 4px; }
.gmap-compass .cs { bottom: 4px; }
.gmap-compass .ce { right: 6px; top: 50%; transform: translateY(-50%); }
.gmap-compass .cw { left: 6px; top: 50%; transform: translateY(-50%); }
.gmap-dc .node.hub { width: 22px; height: 22px; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb),.8); border-radius: 5px; }
.gmap-pulse .hub { fill: var(--accent); filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),1)); }
@keyframes gmapCompassWob { 
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}
.pr-collpill .lbl { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-compass">
      <div class="dial"></div>
      <div class="lbl cn">N</div><div class="lbl cs">S</div><div class="lbl ce">E</div><div class="lbl cw">W</div>
      <div class="needle"><div class="n-n"></div><div class="n-s"></div></div>
      <div class="hub"></div>
    </div></div></div>
<div class="meta"><b>Compass Rose</b> · <code>maps-compass-rose</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>A cardinal compass whose needle wavers gently around north.</p></div>

</body>
</html>
