<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat Roll-Up · Prism</title>
<!-- Prism showcase sample: lab-stat-roll-up (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-stg { animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); animation-iteration-count: infinite; animation-fill-mode: both; animation-delay: calc(var(--i,0)*var(--lab-rv-step,.16s)); }
.lab-rv-stat { --c: var(--crit); --c-rgb: var(--crit-rgb); --lab-rv-step: .14s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 10px; align-content: center; }
.lab-rv-st { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 9px 10px; }
.lab-rv-num { height: 22px; overflow: hidden; font: 700 17px / 22px ui-monospace, Menlo, monospace; color: var(--c); }
.lab-rv-strip { display: block; transform: translateY(-80%); animation-name: labRvRoll; }
.lab-rv-strip span { display: block; height: 22px; }
.lab-rv-sl { color: var(--muted); font-size: 10px; margin-top: 3px; }
.lab-rv-sb { height: 4px; border-radius: 2px; background: var(--line); margin-top: 7px; overflow: hidden; }
.lab-rv-sb i { display: block; height: 100%; background: var(--c); transform-origin: left center; transform: scaleX(var(--w,.6)); animation-name: labRvFill; }
@keyframes labRvRoll { 
  0% { opacity: 0; transform: translateY(0px); }
  8% { opacity: 1; }
  44%, 80% { opacity: 1; transform: translateY(-80%); }
  90% { opacity: 0; transform: translateY(-80%); }
  100% { opacity: 0; transform: translateY(0px); }
}
@keyframes labRvFill { 
  0% { transform: scaleX(0); }
  44%, 80% { transform: scaleX(var(--w,.6)); }
  90%, 100% { transform: scaleX(0); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-stat">
      <div class="lab-rv-st"><div class="lab-rv-num"><span class="lab-rv-strip lab-rv-stg" style="--i:0"><span>0</span><span>3</span><span>7</span><span>9</span><span>12.4%</span></span></div><div class="lab-rv-sl">Growth</div><div class="lab-rv-sb"><i class="lab-rv-stg" style="--i:0;--w:.45"></i></div></div>
      <div class="lab-rv-st"><div class="lab-rv-num"><span class="lab-rv-strip lab-rv-stg" style="--i:1"><span>0</span><span>210</span><span>640</span><span>980</span><span>1,284</span></span></div><div class="lab-rv-sl">Signups</div><div class="lab-rv-sb"><i class="lab-rv-stg" style="--i:1;--w:.8"></i></div></div>
      <div class="lab-rv-st"><div class="lab-rv-num"><span class="lab-rv-strip lab-rv-stg" style="--i:2"><span>0</span><span>42</span><span>87</span><span>96</span><span>99.9%</span></span></div><div class="lab-rv-sl">Uptime</div><div class="lab-rv-sb"><i class="lab-rv-stg" style="--i:2;--w:1"></i></div></div>
    </div></div></div>
<div class="meta"><b>Stat Roll-Up</b> · <code>lab-stat-roll-up</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>Three KPI values roll upward through intermediate numbers to their final figure while a bar fills beneath. Use for metric strips that count in on scroll.</p></div>

</body>
</html>
