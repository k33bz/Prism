<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical Speed-dial FAB · Prism</title>
<!-- Prism showcase sample: menus-vertical-speed-dial-fab (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-fabstack { position: relative; width: 64px; height: 196px; display: flex; flex-direction: column-reverse; align-items: center; gap: 10px; }
.mnu-fs-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-fs-main { position: relative; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(150deg,var(--info),#1c5fc4); color: rgb(255, 255, 255); font-size: 22px; font-weight: 800; display: grid; place-items: center; cursor: pointer; z-index: 3; box-shadow: 0 8px 22px rgba(var(--info-rgb),.4); transition: transform 0.3s; user-select: none; }
.mnu-fs-input:checked ~ .mnu-fs-main { transform: rotate(135deg); }
.mnu-fs-item { width: 38px; height: 38px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); display: grid; place-items: center; font-size: 14px; opacity: 0; transform: translateY(16px) scale(0.5); transition: transform 0.28s cubic-bezier(0.3, 1.5, 0.4, 1), opacity 0.2s; box-shadow: rgba(0, 0, 0, 0.35) 0px 6px 16px; }
.mnu-fs-input:checked ~ .mnu-fs-item { opacity: 1; transform: translateY(0px) scale(1); }
.mnu-fs-input:checked ~ .mnu-fs-item:nth-of-type(2) { transition-delay: 0.03s; }
.mnu-fs-input:checked ~ .mnu-fs-item:nth-of-type(3) { transition-delay: 0.06s; }
.mnu-fs-input:checked ~ .mnu-fs-item:nth-of-type(4) { transition-delay: 0.09s; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-fabstack">
      <input type="checkbox" id="mnu-fs-demo" class="mnu-fs-input">
      <label for="mnu-fs-demo" class="mnu-fs-main">+</label>
      <div class="mnu-fs-item">📄</div>
      <div class="mnu-fs-item">📁</div>
      <div class="mnu-fs-item">🔗</div>
    </div></div></div>
<div class="meta"><b>Vertical Speed-dial FAB</b> · <code>menus-vertical-speed-dial-fab</code><br>Menus &amp; Actions · ACTION BARS, TOOLBARS &amp; FABs<p>A FAB that stacks its mini-actions straight upward instead of fanning radially — for narrow corners.</p></div>

</body>
</html>
