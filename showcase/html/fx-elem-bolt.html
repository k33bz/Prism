<title>Elemental Bolt · Prism</title>
<!-- Prism showcase sample: fx-elem-bolt (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-warn { --c: var(--warn); --c-rgb: 224,165,43; }
.fx-elem { position: relative; width: 330px; max-width: 100%; height: 150px; border-radius: 12px; overflow: hidden; --el: var(--c,var(--accent)); --el-rgb: var(--c-rgb,var(--accent-rgb)); background: radial-gradient(120% 90% at 50% 50%,rgba(var(--el-rgb),.12),rgba(var(--el-rgb),0) 70%),var(--panel2); border: 1px solid rgba(var(--el-rgb),.3); }
.fx-elem svg { position: absolute; inset: 0px; width: 100%; height: 100%; overflow: visible; }
.fx-elem-bolt-glow, .fx-elem-bolt-mid, .fx-elem-bolt-core, .fx-elem-bolt-br { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: 1.8s linear 0s infinite normal none running fxElemBoltStrike; }
.fx-elem-bolt-glow { stroke: var(--el); stroke-width: 10; opacity: 0.35; filter: blur(3px); }
.fx-elem-bolt-mid { stroke: var(--el); stroke-width: 3.2; }
.fx-elem-bolt-core { stroke: rgba(255, 255, 255, 0.95); stroke-width: 1.3; }
.fx-elem-bolt-br { stroke: var(--el); stroke-width: 1.4; opacity: 0.75; filter: blur(0.4px); animation-delay: 0.14s; }
.fx-elem-bolt-flash { position: absolute; inset: 0px; background: radial-gradient(60% 45% at 50% 50%,rgba(var(--el-rgb),.55),rgba(var(--el-rgb),0) 70%); opacity: 0; animation: 1.8s linear 0s infinite normal none running fxElemBoltFlash; }
@keyframes fxElemBoltStrike { 
  0% { stroke-dashoffset: 1; opacity: 1; }
  16% { stroke-dashoffset: 0; opacity: 1; }
  22% { opacity: 0.3; }
  26% { opacity: 1; }
  32% { opacity: 0.45; }
  38% { opacity: 1; }
  58% { opacity: 0; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes fxElemBoltFlash { 
  0%, 12% { opacity: 0; }
  17% { opacity: 1; }
  24% { opacity: 0.2; }
  28% { opacity: 0.7; }
  45%, 100% { opacity: 0; }
}
</style>
</head>
