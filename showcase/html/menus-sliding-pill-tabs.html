<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliding Pill Tabs · Prism</title>
<!-- Prism showcase sample: menus-sliding-pill-tabs (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-tabs-pill { position: relative; width: 280px; }
.mnu-tp-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-tp-track { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 4px; }
.mnu-tp-track label { position: relative; z-index: 1; text-align: center; padding: 8px 4px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 8px; transition: color 0.18s; }
.mnu-tp-thumb { position: absolute; top: 4px; left: 4px; bottom: 4px; width: calc(33.3333% - 2.66667px); border-radius: 8px; background: var(--accent); box-shadow: 0 4px 14px rgba(var(--accent-rgb),.4); transition: transform 0.3s cubic-bezier(0.25, 1, 0.35, 1); }
#mnu-tp-a:checked ~ .mnu-tp-track label[for="mnu-tp-a"], #mnu-tp-b:checked ~ .mnu-tp-track label[for="mnu-tp-b"], #mnu-tp-c:checked ~ .mnu-tp-track label[for="mnu-tp-c"] { color: rgb(26, 18, 6); }
#mnu-tp-a:checked ~ .mnu-tp-track .mnu-tp-thumb { transform: translateX(0px); }
#mnu-tp-b:checked ~ .mnu-tp-track .mnu-tp-thumb { transform: translateX(100%); }
#mnu-tp-c:checked ~ .mnu-tp-track .mnu-tp-thumb { transform: translateX(200%); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-tabs-pill">
      <input type="radio" name="mnu-tp" id="mnu-tp-a" class="mnu-tp-input" checked="">
      <input type="radio" name="mnu-tp" id="mnu-tp-b" class="mnu-tp-input">
      <input type="radio" name="mnu-tp" id="mnu-tp-c" class="mnu-tp-input">
      <div class="mnu-tp-track">
        <label for="mnu-tp-a">Board</label><label for="mnu-tp-b">List</label><label for="mnu-tp-c">Chart</label>
        <span class="mnu-tp-thumb"></span>
      </div>
    </div></div></div>
<div class="meta"><b>Sliding Pill Tabs</b> · <code>menus-sliding-pill-tabs</code><br>Menus &amp; Actions · TAB BARS &amp; SEGMENTED CONTROLS<p>A three-way tab switcher whose accent pill glides to whichever tab is clicked.</p></div>

</body>
</html>
