<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shatter · Prism</title>
<!-- Prism showcase sample: fx-shatter (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-neg { --c: var(--neg); --c-rgb: 248,81,73; }
.el-card { background-position-x: ; background-position-y: ; background-size: ; background-repeat: ; background-attachment: ; background-origin: ; background-clip: ; background-color: ; background-image: var(--cardgrad); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 4px solid var(--c); border-radius: 13px; padding: 18px; min-width: 200px; }
.el-card .n { font-size: 34px; font-weight: 800; color: var(--c); line-height: 1; }
.el-card .l { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.nfx2-shatter { position: relative; overflow: hidden; }
.nfx2-shatter::after { content: ""; position: absolute; inset: 0px; pointer-events: none; background: linear-gradient(45deg,transparent 48%,rgba(255,255,255,.4) 49%,transparent 50%),linear-gradient(-20deg,transparent 60%,rgba(var(--c-rgb),.5) 61%,transparent 62%),linear-gradient(80deg,transparent 30%,rgba(255,255,255,.3) 31%,transparent 32%); animation: 3s steps(1) 0s infinite normal none running nfx2Shatter; }
@keyframes nfx2Shatter { 
  0%, 60% { opacity: 0; }
  62% { opacity: 1; }
  64% { opacity: 0.3; }
  66% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="el-card c-neg nfx2-shatter" style="min-height:66px">Shatter</div></div></div>
<div class="meta"><b>Shatter</b> · <code>fx-shatter</code><br>FX Store · Glass, Glitch, Liquid &amp; Energy FX<p>Fractured glass crack lines flash across the surface then vanish. Sudden &quot;broken / breached&quot; impact.</p></div>

</body>
</html>
