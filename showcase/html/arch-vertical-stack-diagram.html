<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical Stack Diagram · Prism</title>
<!-- Prism showcase sample: arch-vertical-stack-diagram (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-svg { display: block; width: 100%; height: 100%; overflow: visible; font: 700 9px ui-sans-serif, system-ui, sans-serif; }
.arch-svg text { fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.arch-conn { position: relative; width: 190px; height: 20px; }
.arch-conn .arch-svg .arch-ln { stroke: var(--line); stroke-width: 2; fill: none; }
.arch-conn .arch-svg .arch-flow { stroke: var(--info); stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 7, 7; animation: 1.1s linear 0s infinite normal none running archDash; }
.arch-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.arch-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.arch-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
.arch-chip .arch-ci { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font: 800 12px / 1 ui-sans-serif, system-ui, sans-serif; color: var(--ac,var(--info)); background: linear-gradient(160deg,rgba(var(--acr,var(--info-rgb)),.2),rgba(var(--acr,var(--info-rgb)),.08)); border: 1px solid rgba(var(--acr,var(--info-rgb)),.55); }
.arch-chip .arch-ct { font: 700 8.5px / 1 ui-sans-serif, system-ui, sans-serif; color: var(--muted); letter-spacing: 0.02em; }
@keyframes archDash { 
  100% { stroke-dashoffset: -32; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="arch-col">
      <div class="arch-chip"><div class="arch-ci" style="--ac:var(--muted);--acr:var(--info-rgb)">👤</div><span class="arch-ct">Users</span></div>
      <div class="arch-conn" style="height:16px;width:2px"><svg class="arch-svg" viewBox="0 0 2 16" preserveAspectRatio="none"><line class="arch-flow" x1="1" y1="0" x2="1" y2="16"></line></svg></div>
      <div class="arch-row">
        <div class="arch-chip"><div class="arch-ci" style="--ac:var(--info);--acr:var(--info-rgb)">ALB</div><span class="arch-ct">Balancer</span></div>
      </div>
      <div class="arch-row">
        <div class="arch-chip"><div class="arch-ci" style="--ac:var(--pos);--acr:var(--pos-rgb)">EC2</div></div>
        <div class="arch-chip"><div class="arch-ci" style="--ac:var(--pos);--acr:var(--pos-rgb)">EC2</div></div>
        <div class="arch-chip"><div class="arch-ci" style="--ac:var(--pos);--acr:var(--pos-rgb)">EC2</div></div>
      </div>
    </div></div></div>
<div class="meta"><b>Vertical Stack Diagram</b> · <code>arch-vertical-stack-diagram</code><br>Architecture Diagrams · FULL MINI<p>A top-down users → balancer → fleet layout — the vertical orientation for taller report figures.</p></div>

</body>
</html>
