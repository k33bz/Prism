<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Orbit · Prism</title>
<!-- Prism showcase sample: lab-hex-orbit (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-hexmap { position: relative; width: 128px; height: 114px; margin: 0px auto; perspective: 420px; }
.lab-ld-hexmap .lab-ld-hx { position: absolute; width: 44px; height: 39px; clip-path: polygon(25% 0px, 75% 0px, 100% 50%, 75% 100%, 25% 100%, 0px 50%); }
.lab-ld-hexo { background: var(--panel2); transform-style: preserve-3d; backface-visibility: hidden; transform-origin: center center; animation-name: labLdHexFlip; animation-duration: 2.6s; animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1); animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.28s); }
.lab-ld-hexc { background: var(--panel2); overflow: hidden; box-shadow: 0 0 0 1px rgba(var(--info-rgb),.35); }
.lab-ld-hexfill { position: absolute; left: 0px; right: 0px; bottom: 0px; height: calc(var(--lab-ld-hp)*1%); background: linear-gradient(0deg,var(--info),var(--crit)); z-index: 1; }
.lab-ld-hexmeter { position: absolute; inset: 0px; display: grid; place-items: center; z-index: 2; font: 800 12px ui-sans-serif, system-ui, sans-serif; color: var(--ink); counter-reset: labLdHp var(--lab-ld-hp); }
.lab-ld-hexmeter::after { content: counter(labLdHp) "%"; }
.lab-ld-hexfilltile { animation: 3.4s ease-in-out 0s infinite normal none running labLdHexFill; }
.lab-ld-hexorbit .lab-ld-hexo { transform-style: preserve-3d; backface-visibility: hidden; transform-origin: var(--ox) var(--oy); animation-name: labLdHexEdge; animation-duration: 2.8s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--i,0)*.42s); }
@keyframes labLdHexFlip { 
  0%, 58%, 100% { transform: rotateY(0deg); background: var(--panel2); }
  20%, 40% { transform: rotateY(180deg); background: var(--info); }
}
@keyframes labLdHexFill { 
  0%, 6% { --lab-ld-hp: 0; }
  84%, 92% { --lab-ld-hp: 100; }
  100% { --lab-ld-hp: 0; }
}
@keyframes labLdHexEdge { 
  0%, 52%, 100% { transform: rotate3d(var(--ax,1),var(--ay,0),0,0deg); background: var(--panel2); }
  20%, 38% { transform: rotate3d(var(--ax,1),var(--ay,0),0,180deg); background: var(--info); }
}
@property --lab-ld-hp { syntax: "<integer>"; inherits: true; initial-value: 0; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-hexmap lab-ld-hexorbit lab-ld-hexfilltile" role="img" aria-label="Hex orbit loader: outer hexes flip on their inner edges around a filling central hex">
      <span class="lab-ld-hx lab-ld-hexo" style="left:42px;top:0;--i:0;--ax:-1;--ay:0;--ox:50%;--oy:100%"></span>
      <span class="lab-ld-hx lab-ld-hexo" style="left:75px;top:19px;--i:1;--ax:-.51;--ay:-.86;--ox:7%;--oy:76%"></span>
      <span class="lab-ld-hx lab-ld-hexo" style="left:75px;top:57px;--i:2;--ax:.49;--ay:-.87;--ox:7%;--oy:25%"></span>
      <span class="lab-ld-hx lab-ld-hexo" style="left:42px;top:76px;--i:3;--ax:1;--ay:0;--ox:50%;--oy:0%"></span>
      <span class="lab-ld-hx lab-ld-hexo" style="left:9px;top:57px;--i:4;--ax:.49;--ay:.87;--ox:93%;--oy:25%"></span>
      <span class="lab-ld-hx lab-ld-hexo" style="left:9px;top:19px;--i:5;--ax:-.51;--ay:.86;--ox:93%;--oy:76%"></span>
      <span class="lab-ld-hx lab-ld-hexc" style="left:42px;top:38px"><i class="lab-ld-hexfill"></i><b class="lab-ld-hexmeter"></b></span>
    </div></div></div>
<div class="meta"><b>Hex Orbit</b> · <code>lab-hex-orbit</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>The hex map, but each outer hex flips on the edge that touches the central hex, so the ring rolls around it almost like a wheel while the centre fills to 100%.</p></div>

</body>
</html>
