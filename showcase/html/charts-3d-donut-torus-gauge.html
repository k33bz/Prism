<style id="prism-tokens">

</style>
<style id="showcase-shell">

body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}

<body>
<div class="tile"><div class="stage" id="stage"><svg width="230" height="190" viewBox="0 0 230 190" style="overflow:visible">
        <!-- 3D donut / torus with extruded depth -->
        <defs>
          <linearGradient id="torusTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"></stop><stop offset="1" stop-color="#ffd277"></stop></linearGradient>

        <ellipse cx="115" cy="96" rx="40" ry="20" fill="var(--panel)"></ellipse>

        <path d="M115,58 A75,38 0 0 1 178,82" fill="none" stroke="var(--info)" stroke-width="26" stroke-linecap="butt"></path>
