<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Band Speedometer · Prism</title>
<!-- Prism showcase sample: charts-gradient-band-speedometer (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.scx-tick { stroke: var(--dim); stroke-width: 1.5; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="200" height="120" viewBox="0 0 200 120">
        <defs><linearGradient id="scxgg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--pos)"></stop><stop offset=".55" stop-color="var(--warn)"></stop><stop offset="1" stop-color="var(--neg)"></stop></linearGradient></defs>
        <path d="M18 104 A82 82 0 0 1 182 104" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"></path>
        <path d="M18 104 A82 82 0 0 1 182 104" fill="none" stroke="url(#scxgg)" stroke-width="14" stroke-linecap="round" opacity=".9"></path>
        <g class="scx-tick"><line x1="18" y1="104" x2="28" y2="100"></line><line x1="100" y1="22" x2="100" y2="34"></line><line x1="182" y1="104" x2="172" y2="100"></line></g>
        <line x1="100" y1="104" x2="100" y2="40" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" transform="rotate(38 100 104)"></line>
        <circle cx="100" cy="104" r="8" fill="var(--ink)"></circle>
        <text x="100" y="92" text-anchor="middle" font-size="11" fill="var(--muted)">62 °C</text>
      </svg></div></div>
<div class="meta"><b>Gradient Band Speedometer</b> · <code>charts-gradient-band-speedometer</code><br>Charts &amp; Metrics · Gauges &amp; Dials<p>A 180° dial whose arc runs through a green→amber→red gradient with a pointer needle. Great for any reading where &quot;how far into the red&quot; matters — temperature, load, risk score.</p></div>

</body>
</html>
