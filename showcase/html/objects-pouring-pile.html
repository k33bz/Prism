<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pouring Pile · Prism</title>
<!-- Prism showcase sample: objects-pouring-pile (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obj-sand-root { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,var(--panel2),var(--panel)); display: grid; place-items: center; isolation: isolate; }
.obj-sand-tag { position: absolute; left: 12px; bottom: 9px; z-index: 8; font: 500 10px / 1 ui-monospace, Menlo, monospace; letter-spacing: 0.06em; color: var(--muted); opacity: 0.9; pointer-events: none; text-shadow: rgba(0, 0, 0, 0.5) 0px 1px 4px; }
.obj-sand-pour { position: relative; width: 140px; height: 120px; }
.obj-sand-pour-spout { position: absolute; left: 14px; top: 8px; width: 34px; height: 16px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px 8px 3px 3px; transform: rotate(-14deg); }
.obj-sand-pour-stream { position: absolute; left: 44px; top: 22px; width: 2px; height: 70px; background: linear-gradient(180deg,rgba(var(--warn-rgb),.3),var(--warn)); transform: rotate(6deg); transform-origin: center top; animation: 2s ease-in-out 0s infinite normal none running objSandPourStream; }
.obj-sand-pour-pile { position: absolute; left: 16px; bottom: 8px; width: 96px; height: 56px; background: linear-gradient(160deg,var(--warn),rgba(var(--warn-rgb),.7)); clip-path: polygon(38% 0px, 100% 100%, 0px 100%); transform-origin: left bottom; animation: 4s ease-in-out 0s infinite normal none running objSandPourPile; }
.obj-sand-pour-base { position: absolute; left: 8px; right: 8px; bottom: 6px; height: 4px; border-radius: 2px; background: rgba(var(--warn-rgb),.35); }
@keyframes objSandPourPile { 
  0% { transform: scale(0.2, 0.2); }
  70% { transform: scale(1, 1.06); }
  74% { transform: scale(1.08, 0.9); }
  100% { transform: scale(1, 1); }
}
@keyframes objSandPourStream { 
  0%, 68%, 100% { opacity: 1; }
  72%, 80% { opacity: 0.25; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obj-sand-root"><div class="obj-sand-pour"><span class="obj-sand-pour-spout"></span><span class="obj-sand-pour-stream"></span><span class="obj-sand-pour-pile"></span><span class="obj-sand-pour-base"></span></div><span class="obj-sand-tag">Nova · pour</span></div></div></div>
<div class="meta"><b>Pouring Pile</b> · <code>objects-pouring-pile</code><br>Animated Objects · HOURGLASS &amp; SAND<p>Sand pours from a tilted spout and builds an angled heap that settles and briefly avalanches. A playful accumulation loop.</p></div>
