<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaf Press Button · Prism</title>
<!-- Prism showcase sample: spectrums-leaf-press-button (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.solp-press-btn { position: relative; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; cursor: pointer; padding: 14px 26px; font-weight: 800; font-size: 13px; color: rgb(247, 255, 240); background: linear-gradient(180deg,var(--solp-leaf2),var(--solp-leafdeep)); border-radius: 16px; box-shadow: rgb(31, 75, 42) 0px 6px 0px, rgba(0, 0, 0, 0.25) 0px 10px 18px; transform: translateY(-4px); transition: transform 0.1s, box-shadow 0.1s; }
.solp-press-btn:active { transform: translateY(0px); box-shadow: rgb(31, 75, 42) 0px 1px 0px; }
.solp-press-btn::after { content: ""; position: absolute; inset: -6px; border-radius: 22px; background: radial-gradient(circle, rgba(255, 201, 74, 0.55), transparent 70%); opacity: 0; transform: scale(0.6); pointer-events: none; }
.solp-press-btn:active::after { animation: 0.5s ease-out 0s 1 normal none running solpRipple; }
@keyframes solpRipple { 
  0% { opacity: 0.8; transform: scale(0.6); }
  100% { opacity: 0; transform: scale(1.3); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><button class="solp-press-btn">Water Garden</button></div></div>
<div class="meta"><b>Leaf Press Button</b> · <code>spectrums-leaf-press-button</code><br>Spectrums · Solarpunk · Solarpunk<p>A tactile leaf-green button that presses down with a soft golden ripple on click, like pressing into soil.</p></div>

</body>
</html>
