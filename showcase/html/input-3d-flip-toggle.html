<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Flip Toggle · Prism</title>
<!-- Prism showcase sample: input-3d-flip-toggle (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-hide { position: absolute; opacity: 0; pointer-events: none; width: 0px; height: 0px; }
.nin2-flip3d { display: inline-block; perspective: 600px; cursor: pointer; user-select: none; }
.nin2-flip3d .nin2-fcard { position: relative; width: 120px; height: 52px; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.6, 0.2, 0.1, 1); }
.nin2-flip3d input:checked ~ .nin2-fcard { transform: rotateX(180deg); }
.nin2-flip3d .nin2-face { position: absolute; inset: 0px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; letter-spacing: 0.08em; backface-visibility: hidden; border: 1px solid var(--line); }
.nin2-flip3d .nin2-off { background: var(--panel2); color: var(--muted); }
.nin2-flip3d .nin2-on { background: linear-gradient(135deg,rgba(var(--accent-rgb),.25),rgba(var(--accent-rgb),.08)); color: var(--accent); border-color: rgba(var(--accent-rgb),.5); transform: rotateX(180deg); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><label class="nin2-flip3d"><input type="checkbox" class="nin2-hide" checked="">
      <div class="nin2-fcard"><div class="nin2-face nin2-off">OFF</div><div class="nin2-face nin2-on">ON</div></div>
    </label></div></div>
<div class="meta"><b>3D Flip Toggle</b> · <code>input-3d-flip-toggle</code><br>Input Methods · 3D &amp; Depth Controls<p>A switch that physically flips a card in 3D between OFF and ON faces. Pure CSS off a hidden checkbox — click to flip.</p></div>

</body>
</html>
