<title>Determinate Progress Ring · Prism</title>
<!-- Prism showcase sample: spectrums-determinate-progress-ring (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mat-root { --mat-primary: #6750A4; --mat-primary-rgb: 103,80,164; --mat-on-primary: #ffffff; --mat-primary-container: #EADDFF; --mat-on-primary-container: #21005D; --mat-secondary: #625B71; --mat-secondary-container: #E8DEF8; --mat-tertiary: #7D5260; --mat-tertiary-container: #FFD8E4; --mat-surface: #FEF7FF; --mat-surface-dim: #DED8E1; --mat-surface-container: #F3EDF7; --mat-surface-container-high: #ECE6F0; --mat-on-surface: #1D1B20; --mat-on-surface-variant: #49454F; --mat-outline: #79747E; --mat-error: #B3261E; --mat-error-container: #F9DEDC; --mat-success: #2E6E42; --mat-success-container: #C4EED0; font-family: "Segoe UI", Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif; }
.mat-ring { position: relative; width: 88px; height: 88px; }
.mat-ring svg { transform: rotate(-90deg); }
.mat-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.mat-ring .mat-ring-bg { stroke: var(--mat-surface-dim); }
.mat-ring .mat-ring-fg { stroke: var(--mat-primary); stroke-dasharray: 220; stroke-dashoffset: 220; animation: 3.6s ease-in-out 0s infinite normal none running matRingFill; }
.mat-ring .mat-ring-lbl { position: absolute; inset: 10px; display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--mat-on-surface); background: var(--mat-surface); border-radius: 50%; }
@keyframes matRingFill { 
  0% { stroke-dashoffset: 220; }
  55%, 100% { stroke-dashoffset: 56; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mat-root mat-ring">
      <svg width="88" height="88" viewBox="0 0 88 88">
        <circle class="mat-ring-bg" cx="44" cy="44" r="35"></circle>
        <circle class="mat-ring-fg" cx="44" cy="44" r="35"></circle>
      </svg>
      <div class="mat-ring-lbl">74%</div>
    </div></div></div>
<div class="meta"><b>Determinate Progress Ring</b> · <code>spectrums-determinate-progress-ring</code><br>Spectrums · Material UI · Material UI<p>Round-cap circular progress indicator in the primary color, filling to its target value on an ambient loop.</p></div>
