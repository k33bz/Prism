<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotary Knob Dial · Prism</title>
<!-- Prism showcase sample: spectrums-rotary-knob-dial (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-dial { position: relative; width: 118px; height: 118px; display: flex; flex-direction: column; align-items: center; gap: 8px; outline: none; }
.skeu-dial-ticks { position: absolute; inset: 0px; }
.skeu-dial-ticks i { position: absolute; left: 50%; top: 6px; width: 2px; height: 9px; border-radius: 1px; background: var(--skeu-metal-3); transform-origin: 50% 51px; }
.skeu-dial-knob { position: relative; width: 78px; height: 78px; border-radius: 50%; background: repeating-conic-gradient(rgb(154, 156, 161) 0deg, rgb(154, 156, 161) 4deg, rgb(90, 91, 96) 4deg, rgb(90, 91, 96) 8deg); box-shadow: rgba(0, 0, 0, 0.5) 0px 6px 12px; transition: transform 0.25s cubic-bezier(0.3, 1.4, 0.5, 1); }
.skeu-dial-knob::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 28%,var(--skeu-metal-1) 0%,var(--skeu-metal-3) 45%,var(--skeu-metal-5) 100%); box-shadow: rgba(0, 0, 0, 0.45) 0px -4px 6px inset, rgba(255, 255, 255, 0.65) 0px 3px 4px inset, rgba(0, 0, 0, 0.35) 0px 0px 0px 1px; }
.skeu-dial-indicator { position: absolute; top: 15px; left: 50%; width: 4px; height: 16px; border-radius: 2px; background: var(--skeu-amber); box-shadow: 0 0 6px 1px rgba(var(--skeu-amber-rgb),.85); transform: translateX(-50%); z-index: 1; }
.skeu-dial:hover .skeu-dial-knob, .skeu-dial:focus .skeu-dial-knob { transform: rotate(55deg); }
.skeu-dial-label { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: var(--skeu-metal-4); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-dial" tabindex="0">
      <div class="skeu-dial-ticks"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(30deg)"></i><i style="transform:rotate(60deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(120deg)"></i><i style="transform:rotate(150deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(210deg)"></i><i style="transform:rotate(240deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(300deg)"></i><i style="transform:rotate(330deg)"></i></div>
      <div class="skeu-dial-knob"><div class="skeu-dial-indicator"></div></div>
      <div class="skeu-dial-label">GAIN</div>
    </div></div></div>
<div class="meta"><b>Rotary Knob Dial</b> · <code>spectrums-rotary-knob-dial</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A machined aluminum rotary knob with tick marks and an amber pointer that turns convincingly on hover/focus — the flagship control of Skeuo Hardware.</p></div>

</body>
</html>
