<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaxon Alert Banner · Prism</title>
<!-- Prism showcase sample: spectrums-klaxon-alert-banner (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.skeu-klaxon { display: flex; align-items: center; gap: 11px; width: 236px; padding: 11px 13px; border-radius: 10px; background-image: var(--skeu-gunmetal); border: 1px solid rgb(6, 6, 7); box-shadow: rgba(255, 255, 255, 0.1) 0px 1px 0px inset, rgba(0, 0, 0, 0.5) 0px 10px 22px; }
.skeu-klaxon-beacon { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 34% 28%,#ffdcd6,var(--neg) 46%,#6b0f0a 100%); box-shadow: 0 0 12px 4px rgba(var(--neg-rgb),.75), inset 0 -2px 3px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.55); animation: 1.4s ease-in-out 0s infinite normal none running skeuKlaxonSpin; }
.skeu-klaxon-body b { display: block; font-size: 11.5px; color: rgb(255, 218, 214); letter-spacing: 0.03em; }
.skeu-klaxon-body small { display: block; margin-top: 2px; font-size: 10px; color: var(--skeu-metal-4); }
@keyframes skeuKlaxonSpin { 
  0%, 100% { box-shadow: 0 0 8px 2px rgba(var(--neg-rgb),.55), inset 0 -2px 3px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.55); }
  50% { box-shadow: 0 0 18px 6px rgba(var(--neg-rgb),.95), inset 0 -2px 3px rgba(0,0,0,.4), inset 0 2px 2px rgba(255,255,255,.55); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="skeu-klaxon"><div class="skeu-klaxon-beacon"></div><div class="skeu-klaxon-body"><b>CRITICAL FAULT</b><small>Core temp exceeds threshold</small></div></div></div></div>
<div class="meta"><b>Klaxon Alert Banner</b> · <code>spectrums-klaxon-alert-banner</code><br>Spectrums · Skeuomorphic Hardware · Skeuo Hardware<p>A rotating red beacon light beside bold alert text — an industrial-alarm-style banner for critical, high-severity notices.</p></div>

</body>
</html>
