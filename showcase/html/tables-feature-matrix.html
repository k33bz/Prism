<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Matrix · Prism</title>
<!-- Prism showcase sample: tables-feature-matrix (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-matrix td { text-align: center; }
.dtb-matrix td:first-child { text-align: left; color: var(--muted); }
.dtb-matrix th { text-align: center; }
.dtb-matrix th:first-child { text-align: left; }
.dtb-yes { display: inline-block; color: var(--pos); font-weight: 900; animation: 4.8s ease-out 0s infinite normal none running dtbPop; }
.dtb-no { color: var(--dim); }
.dtb-part { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: conic-gradient(var(--warn) 0 50%,var(--panel2) 50% 100%); vertical-align: -1px; }
.dtb-matrix tr:nth-child(1) .dtb-yes { animation-delay: 0s; }
.dtb-matrix tr:nth-child(2) .dtb-yes { animation-delay: 0.25s; }
.dtb-matrix tr:nth-child(3) .dtb-yes { animation-delay: 0.5s; }
.dtb-matrix tr:nth-child(4) .dtb-yes { animation-delay: 0.75s; }
.dtb-matrix td:nth-child(3) .dtb-yes { animation-delay: 0.9s; }
.dtb-matrix td:nth-child(4) .dtb-yes { animation-delay: 1.3s; }
.dtb-tbl.manual td.flip { transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
.dtb-tbl.manual tr.lifted td { position: relative; z-index: 2; box-shadow: 0 6px 16px rgba(0,0,0,.45),inset 0 0 0 999px rgba(var(--c-rgb,var(--accent-rgb)),.14); }
@keyframes dtbPop { 
  0%, 60% { transform: scale(0.4); opacity: 0; }
  70% { transform: scale(1.25); opacity: 1; }
  78%, 92% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl dtb-matrix"><thead><tr><th>Feature</th><th>Free</th><th>Team</th><th>Ent.</th></tr></thead><tbody>
      <tr><td>SSO</td><td><span class="dtb-no">—</span></td><td><span class="dtb-yes">✓</span></td><td><span class="dtb-yes">✓</span></td></tr>
      <tr><td>Audit log</td><td><span class="dtb-no">—</span></td><td><span class="dtb-part"></span></td><td><span class="dtb-yes">✓</span></td></tr>
      <tr><td>API access</td><td><span class="dtb-yes">✓</span></td><td><span class="dtb-yes">✓</span></td><td><span class="dtb-yes">✓</span></td></tr>
      <tr><td>SLA 99.9%</td><td><span class="dtb-no">—</span></td><td><span class="dtb-no">—</span></td><td><span class="dtb-yes">✓</span></td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Feature Matrix</b> · <code>tables-feature-matrix</code><br>Tables &amp; Data Layouts · MATRICES &amp; COMPARISON<p>Plans across the top, capabilities down the side, checks popping in one by one — with a half-disc for partial support.</p></div>

</body>
</html>
