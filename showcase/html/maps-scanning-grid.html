<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanning Grid · Prism</title>
<!-- Prism showcase sample: maps-scanning-grid (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-scan { position: relative; width: 200px; height: 130px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(var(--info-rgb),.4); background: linear-gradient(0deg,rgba(var(--info-rgb),.05),transparent),var(--panel2); }
.gmap-scan .mesh { position: absolute; inset: 0px; background-image: linear-gradient(rgba(var(--info-rgb),.18) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--info-rgb),.18) 1px,transparent 1px); background-size: 20px 20px; }
.gmap-scan .line { position: absolute; left: 0px; right: 0px; height: 22px; background: linear-gradient(0deg,transparent,rgba(var(--info-rgb),.5)); border-top: 1.5px solid var(--info); animation: 2.6s linear 0s infinite normal none running gmapScanLine; }
.gmap-scan .cell { position: absolute; width: 18px; height: 18px; background: rgba(var(--accent-rgb),.45); box-shadow: 0 0 8px rgba(var(--accent-rgb),.6); animation: 2s ease-in-out 0s infinite normal none running gmapHexGlow; }
@keyframes gmapHexGlow { 
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.6); }
}
@keyframes gmapScanLine { 
  0% { top: 0px; }
  100% { top: 100%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-scan">
      <div class="mesh"></div>
      <div class="cell" style="left:64px;top:34px"></div>
      <div class="cell" style="left:120px;top:72px;animation-delay:.7s"></div>
      <div class="line"></div>
    </div></div></div>
<div class="meta"><b>Scanning Grid</b> · <code>maps-scanning-grid</code><br>Maps &amp; Geo · COORDINATES &amp; RADAR<p>A mesh grid with a scan line sweeping down and lit hot cells.</p></div>

</body>
</html>
