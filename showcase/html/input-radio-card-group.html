<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Card Group · Prism</title>
<!-- Prism showcase sample: input-radio-card-group (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-hide { position: absolute; opacity: 0; pointer-events: none; width: 0px; height: 0px; }
.nin2-radcard { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.nin2-radcard label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel2); cursor: pointer; transition: 0.18s; }
.nin2-radcard input { position: absolute; opacity: 0; }
.nin2-radcard .nin2-rd { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; position: relative; transition: 0.18s; }
.nin2-radcard .nin2-rd::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: 0.18s; }
.nin2-radcard .nin2-body { flex: 1 1 0%; display: flex; flex-direction: column; gap: 2px; }
.nin2-radcard .nin2-t { display: block; font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.nin2-radcard .nin2-s { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; }
.nin2-radcard input:checked + label { border-color: var(--accent); background: rgba(var(--accent-rgb),.06); }
.nin2-radcard input:checked + label .nin2-rd { border-color: var(--accent); }
.nin2-radcard input:checked + label .nin2-rd::after { transform: scale(1); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-radcard">
      <input type="radio" name="nin2rc" id="nin2rc0" class="nin2-hide" checked=""><label for="nin2rc0"><span class="nin2-rd"></span><span class="nin2-body"><span class="nin2-t">Standard</span><span class="nin2-s">Balanced price and speed</span></span></label>
      <input type="radio" name="nin2rc" id="nin2rc1" class="nin2-hide"><label for="nin2rc1"><span class="nin2-rd"></span><span class="nin2-body"><span class="nin2-t">Priority</span><span class="nin2-s">Fastest, higher cost</span></span></label>
    </div></div></div>
<div class="meta"><b>Radio Card Group</b> · <code>input-radio-card-group</code><br>Input Methods · Fields, Pickers &amp; Actions<p>Full-width option cards with a title, description, and radio dot — the plan / tier picker with a clear hit target.</p></div>

</body>
</html>
