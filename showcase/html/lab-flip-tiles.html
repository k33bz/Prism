<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip Tiles · Prism</title>
<!-- Prism showcase sample: lab-flip-tiles (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-fliptiles { display: flex; gap: 6px; perspective: 300px; }
.lab-ld-fliptiles-t { position: relative; width: 26px; height: 34px; transform-style: preserve-3d; animation-name: labLdFlip; animation-duration: 2.4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: calc(var(--i)*.14s); }
.lab-ld-fliptiles-t::before, .lab-ld-fliptiles-t::after { content: ""; position: absolute; inset: 0px; border-radius: 5px; backface-visibility: hidden; }
.lab-ld-fliptiles-t::before { background: var(--panel2); border: 1px solid var(--line); }
.lab-ld-fliptiles-t::after { background: var(--c,var(--accent)); box-shadow: 0 0 10px rgba(var(--c-rgb,var(--accent-rgb)),.5); transform: rotateX(180deg); }
@keyframes labLdFlip { 
  0% { transform: rotateX(0deg); }
  30%, 50% { transform: rotateX(180deg); }
  80%, 100% { transform: rotateX(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-fliptiles"><i class="lab-ld-fliptiles-t" style="--i:0"></i><i class="lab-ld-fliptiles-t" style="--i:1"></i><i class="lab-ld-fliptiles-t" style="--i:2"></i><i class="lab-ld-fliptiles-t" style="--i:3"></i><i class="lab-ld-fliptiles-t" style="--i:4"></i></div></div></div>
<div class="meta"><b>Flip Tiles</b> · <code>lab-flip-tiles</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>Five tiles flip on their horizontal axis in sequence to a coloured back face, then flip on to the plain front. Use for board or grid views that are refreshing.</p></div>

</body>
</html>
