<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotating Globe · Prism</title>
<!-- Prism showcase sample: maps-rotating-globe (gallery: maps). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.gmap-globe { position: relative; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle at 34% 30%,rgba(var(--info-rgb),.6),rgba(var(--info-rgb),.14) 58%,rgba(var(--info-rgb),.03)); box-shadow: inset -16px -14px 34px rgba(0,0,0,.5),inset 8px 8px 22px rgba(var(--info-rgb),.25),0 0 26px rgba(var(--info-rgb),.35); overflow: hidden; }
.gmap-globe-lat { position: absolute; inset: 0px; border-radius: 50%; background: repeating-linear-gradient(0deg,transparent 0 13px,rgba(var(--info-rgb),.30) 13px 14px); }
.gmap-globe-lon { position: absolute; inset: 0px; border-radius: 50%; background: repeating-linear-gradient(90deg,transparent 0 15px,rgba(var(--info-rgb),.24) 15px 16px); animation: 6s linear 0s infinite normal none running gmapLon; }
.gmap-globe-shine { position: absolute; top: 12%; left: 20%; width: 34%; height: 26%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.35), transparent 70%); filter: blur(2px); }
@keyframes gmapLon { 
  100% { background-position: 66px 0px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="gmap-globe">
      <div class="gmap-globe-lat"></div>
      <div class="gmap-globe-lon"></div>
      <div class="gmap-globe-shine"></div>
    </div></div></div>
<div class="meta"><b>Rotating Globe</b> · <code>maps-rotating-globe</code><br>Maps &amp; Geo · WORLD &amp; REGION MAPS<p>A CSS sphere with a scrolling longitude grid — a spinning globe with no assets.</p></div>

</body>
</html>
