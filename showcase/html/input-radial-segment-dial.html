<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Segment Dial · Prism</title>
<!-- Prism showcase sample: input-radial-segment-dial (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.in-scf { position: relative; width: 100%; max-width: 300px; height: 150px; border-radius: 12px; overflow: hidden; background: var(--bg); padding: 8px; font: 800 8px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.1em; color: var(--bg); text-transform: uppercase; }
.in-scf-dial { display: grid; place-items: center; height: 100%; }
.in-scf-dial svg { width: 104px; height: 104px; }
.in-scf-dial .seg { fill: none; stroke-width: 12; opacity: 0.3; animation: 3.6s ease-in-out 0s infinite normal none running inScfSeg; }
.in-scf-dial .ptr { stroke: var(--ink); stroke-width: 2; transform-origin: 52px 52px; animation: 3.6s ease-in-out 0s infinite normal none running inScfPtr; }
.in-scf-strip .seg { flex: 1 1 0%; max-width: 180px; display: flex; gap: 4px; padding: 0px 6px; }
.in-scf-strip .seg b { flex: 1 1 0%; height: 34px; border-radius: 4px; background: var(--panel2); animation: 3s steps(1) 0s infinite normal none running inScfSegLit; }
.in-scf-strip .seg b:nth-child(1) { animation-delay: 0s; }
.in-scf-strip .seg b:nth-child(2) { animation-delay: 0.6s; }
.in-scf-strip .seg b:nth-child(3) { animation-delay: 1.2s; }
.in-scf-strip .seg b:nth-child(4) { animation-delay: 1.8s; }
.in-scf-strip .seg b:nth-child(5) { animation-delay: 2.4s; }
@keyframes inScfSeg { 
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}
@keyframes inScfPtr { 
  0% { transform: rotate(-120deg); }
  50% { transform: rotate(130deg); }
  100% { transform: rotate(-120deg); }
}
@keyframes inScfSegLit { 
  0%, 20%, 100% { background: var(--panel2); }
  4%, 16% { background: var(--info); box-shadow: 0 0 8px rgba(var(--info-rgb),.6); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="in-scf in-scf-dial" role="img" aria-label="Radial segment dial with a sweeping pointer">
      <svg viewBox="0 0 104 104" aria-hidden="true">
        <path class="seg" style="stroke:var(--info)" d="M20 78 A44 44 0 0 1 20 26"></path>
        <path class="seg" style="stroke:var(--accent);animation-delay:.4s" d="M28 20 A44 44 0 0 1 76 20"></path>
        <path class="seg" style="stroke:var(--crit);animation-delay:.8s" d="M84 26 A44 44 0 0 1 84 78"></path>
        <path class="seg" style="stroke:var(--neg);animation-delay:1.2s" d="M76 84 A44 44 0 0 1 28 84"></path>
        <circle cx="52" cy="52" r="7" fill="var(--panel2)"></circle><line class="ptr" x1="52" y1="52" x2="52" y2="16"></line>
      </svg>
    </div></div></div>
<div class="meta"><b>Radial Segment Dial</b> · <code>input-radial-segment-dial</code><br>Input Methods · RETRO SCIFI CONTROL PANELS<p>A ring of coloured segments with a pointer sweeping across them, each segment lighting as it passes. A rotary control readout.</p></div>

</body>
</html>
