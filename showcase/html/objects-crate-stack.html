<style id="showcase-shell">

body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}

</style>
<style id="effect-css">
.ob3d-scene { width: 100%; max-width: 300px; height: 140px; perspective: 620px; perspective-origin: 50% 45%; display: grid; place-items: center; overflow: hidden; position: relative; font-family: ui-sans-serif, system-ui, sans-serif; color: var(--ink); --oc: var(--c,var(--accent)); --ocr: var(--c-rgb,var(--accent-rgb)); }
.ob3d-scene * { box-sizing: border-box; }
.ob3d-stack-rig { width: 32px; height: 32px; position: relative; transform-style: preserve-3d; transform: translateY(34px) rotateX(-28deg) rotateY(-40deg); }
.ob3d-stack-cube { position: absolute; inset: 0px; transform-style: preserve-3d; transform: translateY(calc(var(--i)*-32px)); }
.ob3d-stack-f { position: absolute; inset: 0px; border: 1px solid var(--line); }
.ob3d-stack-front { background: rgba(var(--ocr),.35); transform: translateZ(16px); }
.ob3d-stack-side { background: rgba(var(--ocr),.18); transform: rotateY(90deg) translateZ(16px); }
.ob3d-stack-top { background: rgba(var(--ocr),.62); transform: rotateX(90deg) translateZ(16px); }
.ob3d-stack-c0 { animation: 4s cubic-bezier(0.3, 0, 0.5, 1) 0s infinite normal none running ob3dDrop0; }
.ob3d-stack-c1 { animation: 4s cubic-bezier(0.3, 0, 0.5, 1) 0s infinite normal none running ob3dDrop1; }
.ob3d-stack-c2 { animation: 4s cubic-bezier(0.3, 0, 0.5, 1) 0s infinite normal none running ob3dDrop2; }
@keyframes ob3dDrop0 { 
  0% { transform: translateY(-150px); }
  12%, 88% { transform: translateY(0px); }
  100% { transform: translateY(-150px); }
}
@keyframes ob3dDrop1 { 
  0%, 10% { transform: translateY(-182px); }
  24%, 88% { transform: translateY(-32px); }
  100% { transform: translateY(-182px); }
}
@keyframes ob3dDrop2 { 
  0%, 22% { transform: translateY(-214px); }
  36%, 88% { transform: translateY(-64px); }
  100% { transform: translateY(-214px); }
}
</style>
