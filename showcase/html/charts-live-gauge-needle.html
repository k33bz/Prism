<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Gauge + Needle · Prism</title>
<!-- Prism showcase sample: charts-live-gauge-needle (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lv-gauge { position: relative; width: 150px; height: 96px; }
.lv-gauge .gv { position: absolute; bottom: 2px; left: 0px; right: 0px; text-align: center; font-style: normal; font-variant: tabular-nums; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: 800; font-stretch: normal; font-size: 22px; line-height: normal; font-family: ui-monospace, Menlo, monospace; }
.lv-gauge .needle { transform-box: fill-box; transform-origin: center bottom; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.ncx2-arcgauge .needle { transform-origin: 75px 82px; animation: 2.8s ease-in-out 0s infinite normal none running ncx2Needle; }
@keyframes ncx2Needle { 
  0%, 100% { transform: rotate(-72deg); }
  50% { transform: rotate(58deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lv-gauge" id="lvGauge">
        <svg width="150" height="90" viewBox="0 0 150 90">
          <path d="M15,82 A60 60 0 0 1 135,82" fill="none" stroke="var(--panel2)" stroke-width="11" stroke-linecap="round"></path>
          <path d="M15,82 A60 60 0 0 1 135,82" fill="none" stroke="url(#lvGaugeG)" stroke-width="11" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="73.5" id="lvGaugeArc"></path>
          <defs><linearGradient id="lvGaugeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--pos)"></stop><stop offset=".6" stop-color="var(--warn)"></stop><stop offset="1" stop-color="var(--neg)"></stop></linearGradient></defs>
          <rect class="needle" id="lvNeedle" x="73.5" y="34" width="3" height="48" rx="1.5" fill="var(--ink)" style="transform: rotate(19.8deg);"></rect>
          <circle cx="75" cy="82" r="6" fill="var(--ink)"></circle>
        </svg>
        <div class="gv" id="lvGaugeVal" style="color: var(--warn);">61</div>
      </div></div></div>
<div class="meta"><b>Live Gauge + Needle</b> · <code>charts-live-gauge-needle</code><br>Charts &amp; Metrics · Live &amp; Animated<p>A speedometer-style dial whose needle and colored arc swing to each new value with an overshoot spring. Reads green→amber→red as the metric climbs toward its ceiling.</p></div>

</body>
</html>
