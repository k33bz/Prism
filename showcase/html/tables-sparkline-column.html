<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline Column · Prism</title>
<!-- Prism showcase sample: tables-sparkline-column (gallery: tables). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dtb-tbl { width: 100%; max-width: 300px; border-collapse: separate; border-spacing: 0px; font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dtb-tbl th { font: 700 9px / 1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.07em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 7px 9px; background: var(--panel2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtb-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.dtb-tbl tbody tr:last-child td { border-bottom: 0px; }
.dtb-tbl tfoot td { border-top: 2px solid var(--line); border-bottom: 0px; font-weight: 800; background: var(--panel2); }
.dtb-num { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; text-align: right !important; }
.dtb-row .dtb-num { text-align: right; }
.dtb-spark { display: inline-block; width: 64px; height: 18px; vertical-align: middle; overflow: visible; }
.dtb-spark-line { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: 3s ease-out 0s infinite normal none running dtbDraw; }
.dtb-spark-dot { fill: var(--c,var(--accent)); animation: 1.6s ease-in-out 0s infinite normal none running dtbBlink; }
.dtb-bento .dtb-spark { width: 100%; height: 20px; }
@keyframes dtbBlink { 
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
@keyframes dtbDraw { 
  0% { stroke-dashoffset: 120; }
  55%, 85% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><table class="dtb-tbl"><thead><tr><th>Metric</th><th>7d</th><th class="dtb-num">Now</th></tr></thead><tbody>
      <tr><td>Requests</td><td><svg class="dtb-spark" viewBox="0 0 64 18"><polyline class="dtb-spark-line" points="1,14 10,11 19,13 28,8 37,10 46,5 55,7 63,3"></polyline><circle class="dtb-spark-dot" cx="63" cy="3" r="2"></circle></svg></td><td class="dtb-num">48.2K</td></tr>
      <tr><td>Errors</td><td><svg class="dtb-spark" viewBox="0 0 64 18" style="--c:var(--neg)"><polyline class="dtb-spark-line" points="1,6 10,9 19,7 28,11 37,9 46,14 55,12 63,15"></polyline><circle class="dtb-spark-dot" cx="63" cy="15" r="2"></circle></svg></td><td class="dtb-num">0.3%</td></tr>
      <tr><td>Latency</td><td><svg class="dtb-spark" viewBox="0 0 64 18" style="--c:var(--accent)"><polyline class="dtb-spark-line" points="1,10 10,12 19,6 28,9 37,4 46,8 55,9 63,7"></polyline><circle class="dtb-spark-dot" cx="63" cy="7" r="2"></circle></svg></td><td class="dtb-num">142ms</td></tr>
      <tr><td>Uptime</td><td><svg class="dtb-spark" viewBox="0 0 64 18" style="--c:var(--pos)"><polyline class="dtb-spark-line" points="1,9 10,9 19,8 28,9 37,9 46,8 55,9 63,8"></polyline><circle class="dtb-spark-dot" cx="63" cy="8" r="2"></circle></svg></td><td class="dtb-num">99.98%</td></tr>
    </tbody></table></div></div>
<div class="meta"><b>Sparkline Column</b> · <code>tables-sparkline-column</code><br>Tables &amp; Data Layouts · STATUS &amp; DATA CELLS<p>A mini trend line drawn into each row with a blinking endpoint — the at-a-glance history column for metric tables.</p></div>

</body>
</html>
