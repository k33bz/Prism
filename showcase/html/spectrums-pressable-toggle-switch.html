<!DOCTYPE html>

<meta charset="utf-8">

<title>Pressable Toggle Switch · Prism</title>
<!-- Prism showcase sample: spectrums-pressable-toggle-switch (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.neu-switch { position: relative; display: inline-block; width: 64px; height: 34px; }
.neu-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0px; cursor: pointer; z-index: 2; }
.neu-switch .neu-strack { position: absolute; inset: 0px; border-radius: 20px; background: var(--neu-base); box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light); transition: box-shadow 0.2s; }
.neu-switch .neu-sknob { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--neu-base); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-lightStrong); transition: transform 0.26s cubic-bezier(0.5, 0.15, 0.15, 1), box-shadow 0.26s; }
.neu-switch input:checked ~ .neu-sknob { transform: translateX(30px); box-shadow: 3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-lightStrong), 0 0 0 2px rgba(var(--neu-accent-rgb),.35) inset; }
.neu-switch input:checked ~ .neu-sknob::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--neu-accent); opacity: 0.9; }
.neu-switch input:focus-visible ~ .neu-strack { box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light), 0 0 0 2px rgba(var(--neu-accent-rgb),.5); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="neu-row">
      <label class="neu-switch"><input type="checkbox" checked=""><span class="neu-strack"></span><span class="neu-sknob"></span></label>
      <label class="neu-switch"><input type="checkbox"><span class="neu-strack"></span><span class="neu-sknob"></span></label>
    </div></div></div>
<div class="meta"><b>Pressable Toggle Switch</b> · <code>spectrums-pressable-toggle-switch</code><br>Spectrums · Neumorphism · Neumorphism<p>The signature Neumorphism switch: an inset track cradles an extruded knob that slides and lights up amber when on — no border anywhere, just light and shadow doing the work.</p></div>

</body>
</html>
