<title>Click-to-open Select Trigger · Prism</title>
<!-- Prism showcase sample: menus-click-to-open-select-trigger (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; box-shadow: rgba(0, 0, 0, 0.4) 0px 16px 38px; padding: 6px; min-width: 196px; font-size: 12.5px; color: var(--ink); font-family: inherit; }
.mnu-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; cursor: pointer; transition: background 0.15s, color 0.15s; line-height: 1.2; white-space: nowrap; }
.mnu-item:hover { background: rgba(var(--info-rgb),.14); color: var(--ink); }
.mnu-item.is-danger { color: var(--neg); }
.mnu-item.is-danger:hover { background: rgba(var(--neg-rgb),.14); }
.mnu-item.is-active { color: var(--accent); }
.mnu-item:hover .mnu-ico { color: inherit; }
.mnu-lbl { flex: 1 1 auto; min-width: 0px; }
.mnu-check { flex: 0 0 14px; text-align: center; color: var(--accent); font-weight: 800; opacity: 0; }
.mnu-item.is-active .mnu-check { opacity: 1; }
.mnu-chevron { transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1); }
.mnu-drop-panel .mnu-item:nth-child(1) { animation: 0.3s ease 0.03s 1 normal both running mnuStagger; }
.mnu-drop-panel .mnu-item:nth-child(2) { animation: 0.3s ease 0.08s 1 normal both running mnuStagger; }
.mnu-drop-panel .mnu-item:nth-child(3) { animation: 0.3s ease 0.13s 1 normal both running mnuStagger; }
.mnu-drop-panel .mnu-item:nth-child(4) { animation: 0.3s ease 0.18s 1 normal both running mnuStagger; }
.mnu-drop-panel .mnu-item:nth-child(5) { animation: 0.3s ease 0.23s 1 normal both running mnuStagger; }
.mnu-drop-icons .mnu-item { justify-content: flex-start; }
.mnu-drop-check .mnu-item { justify-content: flex-start; }
.mnu-select { position: relative; display: inline-block; }
.mnu-select-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-select-trigger { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-size: 12.5px; cursor: pointer; user-select: none; }
.mnu-select-trigger:hover { border-color: rgba(var(--info-rgb),.6); }
.mnu-select-panel { position: absolute; left: 0px; top: calc(100% + 6px); width: 100%; opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.97); transform-origin: center top; transition: opacity 0.18s, transform 0.18s cubic-bezier(0.3, 1, 0.4, 1), visibility 0.18s; z-index: 5; }
.mnu-select-input:checked ~ .mnu-select-panel { opacity: 1; visibility: visible; transform: translateY(0px) scale(1); }
.mnu-select-input:checked ~ .mnu-select-trigger .mnu-chevron { transform: rotate(180deg); color: var(--info); }
.mnu-nav-underline a.is-active { color: var(--ink); }
.mnu-nav-underline a:nth-child(1).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(1):hover ~ .mnu-nu-bar { transform: translateX(0px); }
.mnu-nav-underline a:nth-child(2).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(2):hover ~ .mnu-nu-bar { transform: translateX(100%); }
.mnu-nav-underline a:nth-child(3).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(3):hover ~ .mnu-nu-bar { transform: translateX(200%); }
.mnu-nav-underline a:nth-child(4).is-active ~ .mnu-nu-bar, .mnu-nav-underline a:nth-child(4):hover ~ .mnu-nu-bar { transform: translateX(300%); }
.mnu-sidebar a.is-active { background: rgba(var(--accent-rgb),.16); color: var(--accent); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.3); animation: 2.6s ease-in-out 0s infinite normal none running mnuPulseGlow; }
.mnu-pillnav a.is-active, .mnu-pillnav a:hover { color: var(--ink); }
.mnu-pillnav a:nth-child(1).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(1):hover ~ .mnu-pn-pill { transform: translateX(0px); }
.mnu-pillnav a:nth-child(2).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(2):hover ~ .mnu-pn-pill { transform: translateX(68px); }
.mnu-pillnav a:nth-child(3).is-active ~ .mnu-pn-pill, .mnu-pillnav a:nth-child(3):hover ~ .mnu-pn-pill { transform: translateX(146px); }
.mnu-actionbar button.is-active { color: var(--accent); background: rgba(var(--accent-rgb),.14); }
.mnu-ts-track a.is-active { background: rgba(var(--info-rgb),.18); border-color: rgba(var(--info-rgb),.5); color: var(--info); }
.mnu-static-drop .mnu-item { cursor: default; }
.mnu-static-drop .mnu-item:hover { background: none; }
.mnu-static-ctx .mnu-item { cursor: default; }
.mnu-static-ctx .mnu-item:hover { background: none; }
@keyframes mnuStagger { 
  0% { opacity: 0; transform: translateY(-6px); }
  100% { opacity: 1; transform: translateY(0px); }
}
@keyframes mnuPulseGlow { 
  0%, 100% { box-shadow: 0 0 0 rgba(var(--accent-rgb),0); }
  50% { box-shadow: 0 0 14px rgba(var(--accent-rgb),.45); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-select">
      <input type="checkbox" id="mnu-select-demo" class="mnu-select-input">

      <div class="mnu-panel mnu-select-panel">

        <div class="mnu-item"><span class="mnu-check">✓</span><span class="mnu-lbl">Oldest first</span></div>
        <div class="mnu-item"><span class="mnu-check">✓</span><span class="mnu-lbl">A → Z</span></div>
      </div>
    </div></div></div>
<div class="meta"><b>Click-to-open Select Trigger</b> · <code>menus-click-to-open-select-trigger</code><br>Menus &amp; Actions · DROPDOWN MENUS<p>A real toggling select control whose chevron flips and panel drops open on click, no JS.</p></div>
