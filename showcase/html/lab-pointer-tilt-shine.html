<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer Tilt + Shine · Prism</title>
<!-- Prism showcase sample: lab-pointer-tilt-shine (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tilt-card { width: 110px; height: 80px; border-radius: 14px; background: linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.4)); display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgb(26, 18, 0); transform-style: preserve-3d; transition: transform 0.2s; box-shadow: rgba(0, 0, 0, 0.35) 0px 8px 24px; }
.tilt-shine { position: relative; overflow: hidden; }
.tilt-shine::after { content: ""; position: absolute; inset: 0px; background: radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.45),transparent 45%); opacity: 0; transition: opacity 0.2s; }
.tilt-shine:hover::after { opacity: 1; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="tilt-card tilt-shine" data-tilt="" onmousemove="var r=this.getBoundingClientRect();var x=(event.clientX-r.left)/r.width,y=(event.clientY-r.top)/r.height;this.style.transform='perspective(500px) rotateY('+((x-.5)*24)+'deg) rotateX('+((.5-y)*24)+'deg)';this.style.setProperty('--mx',x*100+'%');this.style.setProperty('--my',y*100+'%')" onmouseleave="this.style.transform='perspective(500px) rotateY(0) rotateX(0)'">↗</div></div></div>
<div class="meta"><b>Pointer Tilt + Shine</b> · <code>lab-pointer-tilt-shine</code><br>Animation Lab · Parallax Tilt<p>Tracks the cursor to tilt the card toward it and moves a specular highlight to match — the classic interactive trading-card effect.</p></div>

</body>
</html>
