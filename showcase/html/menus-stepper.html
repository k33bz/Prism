<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper · Prism</title>
<!-- Prism showcase sample: menus-stepper (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-stepper { width: 252px; }
.mnu-step-track { position: relative; height: 3px; background: rgba(var(--info-rgb),.16); border-radius: 3px; margin: 8px 14px; }
.mnu-step-fill { position: absolute; left: 0px; top: 0px; height: 100%; width: 0px; background: linear-gradient(90deg,var(--accent),var(--warn)); border-radius: 3px; animation: 4.6s cubic-bezier(0.65, 0, 0.35, 1) 0s infinite normal none running mnuStep; }
.mnu-step-marker { position: absolute; top: 50%; left: 0px; width: 13px; height: 13px; margin: -6.5px 0px 0px -6.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb),.25); animation: 4.6s cubic-bezier(0.65, 0, 0.35, 1) 0s infinite normal none running mnuStepM; }
.mnu-step-labels { display: flex; justify-content: space-between; margin: 9px 8px 0px; }
.mnu-step-labels span { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
.mnu-step-labels span:first-child { color: var(--accent); }
@keyframes mnuStep { 
  0%, 8% { width: 0px; }
  90%, 100% { width: 100%; }
}
@keyframes mnuStepM { 
  0%, 8% { left: 0px; }
  90%, 100% { left: 100%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-stepper"><div class="mnu-step-track"><div class="mnu-step-fill"></div><div class="mnu-step-marker"></div></div>
      <div class="mnu-step-labels"><span>Cart</span><span>Shipping</span><span>Payment</span><span>Done</span></div></div></div></div>
<div class="meta"><b>Stepper</b> · <code>menus-stepper</code><br>Menus &amp; Actions · WAYFINDING &amp; PROGRESS<p>A wizard progress track: the fill and its glowing marker advance from step to step, the checkout or onboarding flow. Labels sit beneath each stop.</p></div>

</body>
</html>
