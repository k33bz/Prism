<title>Hourglass · Prism</title>
<!-- Prism showcase sample: objects-hourglass-2 (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-2d { width: 118px; height: 118px; overflow: visible; }
.nobj2-hg { transform-box: view-box; transform-origin: 59px 59px; animation: 6s ease-in-out 0s infinite normal none running nobj2HgFlip; }
.nobj2-hg-top { transform-box: fill-box; transform-origin: center top; animation: 6s ease-in-out 0s infinite normal none running nobj2HgTop; }
.nobj2-hg-bot { transform-box: fill-box; transform-origin: center bottom; animation: 6s ease-in-out 0s infinite normal none running nobj2HgBot; }
.nobj2-hg-str { animation: 6s linear 0s infinite normal none running nobj2HgStr; }
@keyframes nobj2HgFlip { 
  0%, 80% { transform: rotate(0deg); }
  90%, 100% { transform: rotate(180deg); }
}
@keyframes nobj2HgTop { 
  0% { transform: scaleY(1); }
  78%, 100% { transform: scaleY(0.06); }
}
@keyframes nobj2HgBot { 
  0% { transform: scaleY(0.06); }
  78%, 100% { transform: scaleY(1); }
}
@keyframes nobj2HgStr { 
  0%, 78% { opacity: 1; }
  80%, 100% { opacity: 0; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="nobj2-2d" fill="none">
      <g class="nobj2-hg">
        <path d="M34 20 H84 M34 98 H84" stroke="var(--nobj2-a)" stroke-width="5" stroke-linecap="round"></path>
        <path d="M38 22 L59 59 L38 96 M80 22 L59 59 L80 96" stroke="var(--nobj2-ln)" stroke-width="3"></path>
        <path class="nobj2-hg-top" d="M42 26 L76 26 L59 57 Z" fill="var(--nobj2-a)"></path>
        <path class="nobj2-hg-bot" d="M59 61 L76 92 L42 92 Z" fill="var(--nobj2-a)"></path>
        <line class="nobj2-hg-str" x1="59" y1="57" x2="59" y2="66" stroke="var(--nobj2-a)" stroke-width="2.4"></line>
      </g>
    </svg></div></div>
<div class="meta"><b>Hourglass</b> · <code>objects-hourglass-2</code><br>Animated Objects · 2D &amp; SVG Objects<p>Sand drains then the glass flips over. Timers, pending, &quot;please wait&quot; states.</p></div>

</body>
