<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilt-frame Toast · Prism</title>
<!-- Prism showcase sample: spectrums-gilt-frame-toast (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.deco-menu, .deco-dd, .deco-tabs, .deco-ctx, .deco-btn, .deco-iconbtn, .deco-toggle, .deco-toast, .deco-banner, .deco-snack, .deco-callout, .deco-quote, .deco-chart, .deco-gauge, .deco-kpi, .deco-spark, .deco-field, .deco-select, .deco-check, .deco-range, .deco-headline, .deco-eyebrow, .deco-dropcap, .deco-monogram, .deco-sunburst, .deco-ziggurat, .deco-frame, .deco-fandivider { box-sizing: border-box; font-family: Georgia, "Times New Roman", serif; }
.deco-toast { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 230px; padding: 14px 16px; background: linear-gradient(160deg,var(--deco-emerald),var(--deco-emerald-deep)); border: 1px solid var(--deco-line); box-shadow: rgba(0, 0, 0, 0.5) 0px 14px 30px; animation: 0.5s ease-out 0s 1 normal both running decoFadeUp; }
.deco-toast::before, .deco-toast::after { content: ""; position: absolute; width: 12px; height: 12px; border: 1px solid var(--deco-gold); opacity: 0.8; }
.deco-toast::before { top: 5px; left: 5px; border-right-width: medium; border-right-style: none; border-right-color: currentcolor; border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; }
.deco-toast::after { bottom: 5px; right: 5px; border-left-width: medium; border-left-style: none; border-left-color: currentcolor; border-top-width: medium; border-top-style: none; border-top-color: currentcolor; }
.deco-toast-ico { color: var(--deco-gold-hi); font-size: 15px; line-height: 1; flex: 0 0 auto; animation: 2.4s ease-in-out 0s infinite normal none running decoGlowPulse; }
.deco-toast-title { font-size: 13px; font-weight: 700; color: var(--deco-gold-hi); letter-spacing: 0.03em; }
.deco-toast-sub { margin-top: 3px; font-size: 11.5px; color: var(--deco-muted); }
@keyframes decoFadeUp { 
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0px); }
}
@keyframes decoGlowPulse { 
  0%, 100% { opacity: 0.75; text-shadow: rgba(212, 175, 55, 0.4) 0px 0px 4px; }
  50% { opacity: 1; text-shadow: rgba(212, 175, 55, 0.8) 0px 0px 12px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="deco-toast">
      <span class="deco-toast-ico">✦</span>
      <div class="deco-toast-body"><div class="deco-toast-title">Reservation Confirmed</div><div class="deco-toast-sub">Table for two · 8:00 PM</div></div>
    </div></div></div>
<div class="meta"><b>Gilt-frame Toast</b> · <code>spectrums-gilt-frame-toast</code><br>Spectrums · Art Deco · Art Deco<p>A notification card bordered in a thin gold line with mirrored corner fans, sliding in like an engraved calling card.</p></div>

</body>
</html>
