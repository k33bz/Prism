<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superb Scissors · Prism</title>
<!-- Prism showcase sample: fx-pkmn-superb-scissors (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.fx-pkpd-card.b1 { left: 158px; top: 112px; width: 22px; height: 28px; }
.fx-pkpd-card.b2 { left: 208px; top: 112px; width: 22px; height: 28px; }
.fx-pkpd-card.b2.bp { animation-delay: 0.12s; }
.fx-pksc { position: relative; width: 100%; max-width: 330px; height: 150px; border-radius: 12px; overflow: hidden; --c1: var(--accent); --c1-rgb: var(--accent-rgb); --c2: var(--warn); --c2-rgb: var(--warn-rgb); background: radial-gradient(130% 100% at 50% 50%,rgba(var(--c1-rgb),.11),rgba(0,0,0,0) 72%),#0b0e15; border: 1px solid rgba(var(--c1-rgb),.35); animation: 2.2s linear 0s infinite normal none running fxPkscHit; }
.fx-pksc-card { position: absolute; left: 143px; top: 44px; width: 44px; height: 58px; border-radius: 4px; border: 1.5px solid rgba(255, 255, 255, 0.4); background: linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)); }
.fx-pksc-bl { position: absolute; left: 165px; top: 73px; width: 190px; height: 15px; margin: -7.5px 0px 0px -95px; opacity: 0; background: linear-gradient(90deg,#6e4520,var(--c1) 35%,var(--c2) 70%,#f7ecd6 96%); clip-path: polygon(0px 24%, 86% 0px, 100% 50%, 86% 100%, 0px 76%); box-shadow: 0 0 10px rgba(var(--c1-rgb),.85),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.3); animation: 2.2s cubic-bezier(0.75, 0.02, 0.2, 1) 0s infinite normal none running fxPkscSnap; }
.fx-pksc-bl.b2 { animation-delay: 0.05s; --ba: -42deg; }
.fx-pksc-bl.b1 { --ba: 42deg; }
.fx-pksc-sl { position: absolute; left: 165px; top: 73px; width: 200px; height: 3px; margin: -1.5px 0px 0px -100px; border-radius: 2px; background: rgb(255, 255, 255); opacity: 0; box-shadow: rgb(255, 255, 255) 0px 0px 10px 2px; animation: 2.2s ease-out 0s infinite normal none running fxPkscFlash; }
.fx-pksc-sl.s2 { --ba: -42deg; animation-delay: 0.06s; }
.fx-pksc-sl.s1 { --ba: 42deg; }
.fx-pksc-ch { position: absolute; left: 165px; top: 73px; width: 6px; height: 5px; border-radius: 1.5px; background: var(--c1); opacity: 0; animation: 2.2s ease-out 0s infinite normal none running fxPkscChip; }
.fx-pksc-ch.c2 { --dx: 26px; --dy: -30px; animation-delay: 0.04s; background: var(--c2); }
.fx-pksc-ch.c3 { --dx: -30px; --dy: -22px; animation-delay: 0.08s; }
.fx-pksc-ch.c1 { --dx: 6px; --dy: -38px; }
@keyframes fxPkscHit { 
  0%, 30% { transform: translate(0px, 0px); }
  33% { transform: translate(-3px, 2px); }
  36% { transform: translate(3px, -2px); }
  39% { transform: translate(-2px, 1px); }
  42%, 100% { transform: translate(0px, 0px); }
}
@keyframes fxPkscSnap { 
  0%, 24% { opacity: 0; transform: rotate(calc(var(--ba,42deg) - 16deg)) scaleX(.45); }
  30% { opacity: 1; transform: rotate(var(--ba,42deg)) scaleX(1.06); }
  62% { opacity: 1; transform: rotate(var(--ba,42deg)) scaleX(1); }
  72%, 100% { opacity: 0; transform: rotate(var(--ba,42deg)) scaleX(1); }
}
@keyframes fxPkscFlash { 
  0%, 30% { opacity: 0; transform: rotate(var(--ba,42deg)) scaleX(.3); }
  36% { opacity: 1; transform: rotate(var(--ba,42deg)) scaleX(1.1); }
  48%, 100% { opacity: 0; transform: rotate(var(--ba,42deg)) scaleX(1.16); }
}
@keyframes fxPkscChip { 
  0%, 32% { opacity: 0; transform: translate(0px, 0px) rotate(0deg); }
  38% { opacity: 1; }
  62% { opacity: 0.9; transform: translate(var(--dx,10px),calc(var(--dy,-30px) + 14px)) rotate(160deg); }
  74%, 100% { opacity: 0; transform: translate(var(--dx,10px),calc(var(--dy,-30px) + 30px)) rotate(220deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="fx-pksc" role="img" aria-label="Superb Scissors: two chitinous blades snap across the defending card in an X with a white slash flash and flying chips">
    <i class="fx-pksc-card"></i>
    <i class="fx-pksc-bl b1"></i><i class="fx-pksc-bl b2"></i>
    <i class="fx-pksc-sl s1"></i><i class="fx-pksc-sl s2"></i>
    <i class="fx-pksc-ch c1"></i><i class="fx-pksc-ch c2"></i><i class="fx-pksc-ch c3"></i>
  </div></div></div>
<div class="meta"><b>Superb Scissors</b> · <code>fx-pkmn-superb-scissors</code><br>FX Store · Pokémon Battle<p>Crustle's bite, seen from the receiving end: two huge chitinous blades X-snap across the defending card in under a beat - white slash flash at the crossing, shell chips flying, the whole stage jolting.</p></div>

</body>
