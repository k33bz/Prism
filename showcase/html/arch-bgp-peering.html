<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGP Peering · Prism</title>
<!-- Prism showcase sample: arch-bgp-peering (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-box { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-nm { fill: var(--ink); font-size: 6.5px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-lbl { fill: var(--muted); font-size: 6px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-cap { fill: var(--muted); font-size: 6px; font-family: ui-monospace, Menlo, monospace; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-flow { fill: none; stroke: var(--c,var(--accent)); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 2.5, 12.5; animation-name: archNetFlow; animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--fd,0s); }
@keyframes archNetFlow { 
  100% { stroke-dashoffset: -15; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-net-svg arch-net-bgp" viewBox="0 0 300 150" role="img" aria-label="BGP peering between autonomous systems">
      <path class="arch-net-wire" d="M84 52 216 52M74 68 140 108M226 68 160 108"></path>
      <path class="arch-net-flow" style="--fd:0s" d="M84 52 216 52"></path>
      <path class="arch-net-flow" style="--fd:.5s" d="M216 52 84 52"></path>
      <path class="arch-net-flow" style="--fd:.2s" d="M74 68 140 108"></path>
      <path class="arch-net-flow" style="--fd:.35s" d="M226 68 160 108"></path>
      <g style="--cr:var(--info-rgb)"><rect class="arch-net-box" x="26" y="34" width="60" height="34" rx="16"></rect></g>
      <g style="--cr:var(--warn-rgb)"><rect class="arch-net-box" x="214" y="34" width="60" height="34" rx="16"></rect></g>
      <g style="--cr:var(--pos-rgb)"><rect class="arch-net-box" x="120" y="96" width="60" height="34" rx="16"></rect></g>
      <text class="arch-net-nm" x="56" y="49">AS 64500</text><text class="arch-net-lbl" x="56" y="60">edge</text>
      <text class="arch-net-nm" x="244" y="49">AS 64501</text><text class="arch-net-lbl" x="244" y="60">transit</text>
      <text class="arch-net-nm" x="150" y="111">AS 64502</text><text class="arch-net-lbl" x="150" y="122">peer</text>
      <text class="arch-net-cap" x="128" y="46" style="fill:var(--accent)">routes</text>
    </svg></div></div>
<div class="meta"><b>BGP Peering</b> · <code>arch-bgp-peering</code><br>Architecture Diagrams · NETWORK FLOW MAPS<p>Three autonomous system clouds exchange route advertisements across bidirectional peering links. Use for interdomain and BGP diagrams.</p></div>

</body>
</html>
