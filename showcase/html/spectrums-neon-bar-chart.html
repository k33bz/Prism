<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bar Chart · Prism</title>
<!-- Prism showcase sample: spectrums-neon-bar-chart (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.cyb2 { --mag: #ff00a0; --mag-rgb: 255,0,160; --cyan: #00f0ff; --cyan-rgb: 0,240,255; --yellow: #fee600; --yellow-rgb: 254,230,0; --bg0: #0d0221; --bg1: #160a35; --bg2: #1e1046; --bg3: #271454; --ink: #eafcff; --dim: #8fa3c9; font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; color: var(--ink); position: relative; }
.cyb2 * { box-sizing: border-box; }
.cyb2-chart-bar { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 8px; }
.cyb2-chart-bar .cyb2-bar { width: 20px; background: linear-gradient(to top,var(--cyan),rgba(0,240,255,.15)); filter: drop-shadow(0 0 5px rgba(var(--cyan-rgb),.6)); animation: 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) 0s 1 normal both running cyb2BarRise; clip-path: polygon(4px 0px, 100% 0px, 100% 100%, 0px 100%, 0px 4px); }
.cyb2-chart-bar .cyb2-bar--mag { background: linear-gradient(to top,var(--mag),rgba(255,0,160,.15)); filter: drop-shadow(0 0 5px rgba(var(--mag-rgb),.6)); }
.cyb2-chart-bar .cyb2-bar { transform-origin: center bottom; }
@keyframes cyb2BarRise { 
  0% { transform: scaleY(0); }
  100% { transform: scaleY(1); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="cyb2 cyb2-chart-bar">
      <div class="cyb2-bar" style="height:38%;animation-delay:0s"></div>
      <div class="cyb2-bar cyb2-bar--mag" style="height:64%;animation-delay:.05s"></div>
      <div class="cyb2-bar" style="height:52%;animation-delay:.1s"></div>
      <div class="cyb2-bar cyb2-bar--mag" style="height:88%;animation-delay:.15s"></div>
      <div class="cyb2-bar" style="height:70%;animation-delay:.2s"></div>
    </div></div></div>
<div class="meta"><b>Neon Bar Chart</b> · <code>spectrums-neon-bar-chart</code><br>Spectrums · Cyberpunk OS · Cyberpunk OS<p>Cyan/magenta glowing bars with notch-cut tops that rise in on load; a compact metric comparison.</p></div>

</body>
</html>
