<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staged Progress · Prism</title>
<!-- Prism showcase sample: lab-staged-progress (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-ld-stages { width: 100%; max-width: 250px; font: 12px / 1 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-ld-stages-lb { position: relative; height: 16px; margin-bottom: 8px; }
.lab-ld-stages-lb span { position: absolute; left: 0px; top: 0px; opacity: 0; animation-name: labLdStgWin; animation-duration: 4s; animation-timing-function: steps(1); animation-iteration-count: infinite; animation-delay: var(--d); }
.lab-ld-stages-lb span:last-of-type { color: var(--pos); font-weight: 600; }
.lab-ld-stages-pc { position: absolute; right: 0px; top: 0px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; --lab-ld-n: 0; counter-reset: lab-ld-pct var(--lab-ld-n); animation: 4s linear 0s infinite normal none running labLdCountUp; }
.lab-ld-stages-pc::after { content: counter(lab-ld-pct) "%"; }
.lab-ld-stages-tr { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.lab-ld-stages-f { height: 100%; border-radius: 4px; background: var(--c,var(--accent)); width: 0px; animation: 4s linear 0s infinite normal none running labLdStgBar; }
@keyframes labLdStgWin { 
  0% { opacity: 1; }
  25%, 100% { opacity: 0; }
}
@keyframes labLdStgBar { 
  0% { width: 0px; background: var(--c,var(--accent)); }
  74% { width: 100%; background: var(--c,var(--accent)); }
  76%, 100% { width: 100%; background: var(--pos); }
}
@keyframes labLdCountUp { 
  0% { --lab-ld-n: 0; }
  75%, 100% { --lab-ld-n: 100; }
}
@property --lab-ld-n { syntax: "<integer>"; inherits: false; initial-value: 0; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-ld-stages"><div class="lab-ld-stages-lb"><span style="--d:0s">Uploading Atlas.zip</span><span style="--d:-3s">Processing</span><span style="--d:-2s">Finalizing</span><span style="--d:-1s">Done</span><b class="lab-ld-stages-pc"></b></div><div class="lab-ld-stages-tr"><div class="lab-ld-stages-f"></div></div></div></div></div>
<div class="meta"><b>Staged Progress</b> · <code>lab-staged-progress</code><br>Animation Lab · LOADERS &amp; WAITING STATES<p>A progress bar with a live percent and a stage label that steps from Uploading through Processing to Done, turning green at the end. Use for multi step jobs.</p></div>

</body>
</html>
