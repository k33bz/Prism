<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosted Glass Toast · Prism</title>
<!-- Prism showcase sample: spectrums-frosted-glass-toast (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.tile .copy.ok { border-color: var(--pos); color: var(--pos); }
.glm-scene { position: relative; width: 100%; min-height: 150px; border-radius: 18px; overflow: hidden; display: flex; align-items: center; justify-content: center; isolation: isolate; padding: 20px; }
.glm-scene, .glm-scene.glm-v1 { background: radial-gradient(circle at 18% 22%, rgba(var(--glm-accent-rgb),.85) 0%, rgba(var(--glm-accent-rgb),0) 45%),
    radial-gradient(circle at 82% 28%, rgba(var(--glm-info-rgb),.8) 0%, rgba(var(--glm-info-rgb),0) 48%),
    radial-gradient(circle at 50% 90%, rgba(var(--glm-crit-rgb),.75) 0%, rgba(var(--glm-crit-rgb),0) 50%),
    linear-gradient(150deg,#181229,#0b0e17 70%); }
.glm-scene.glm-v2 { background: radial-gradient(circle at 16% 82%, rgba(var(--glm-pos-rgb),.8) 0%, rgba(var(--glm-pos-rgb),0) 46%),
    radial-gradient(circle at 85% 18%, rgba(var(--glm-warn-rgb),.78) 0%, rgba(var(--glm-warn-rgb),0) 48%),
    radial-gradient(circle at 60% 65%, rgba(var(--glm-info-rgb),.7) 0%, rgba(var(--glm-info-rgb),0) 50%),
    linear-gradient(160deg,#0f1c2c,#0b0e17 70%); }
.glm-scene.glm-v3 { background: radial-gradient(circle at 28% 25%, rgba(var(--glm-crit-rgb),.82) 0%, rgba(var(--glm-crit-rgb),0) 48%),
    radial-gradient(circle at 78% 70%, rgba(var(--glm-pos-rgb),.75) 0%, rgba(var(--glm-pos-rgb),0) 48%),
    radial-gradient(circle at 12% 88%, rgba(var(--glm-info-rgb),.65) 0%, rgba(var(--glm-info-rgb),0) 46%),
    linear-gradient(145deg,#1c1026,#0b0e17 70%); }
.glm-scene.glm-v4 { background: radial-gradient(circle at 72% 22%, rgba(var(--glm-accent-rgb),.82) 0%, rgba(var(--glm-accent-rgb),0) 48%),
    radial-gradient(circle at 20% 68%, rgba(var(--glm-neg-rgb),.7) 0%, rgba(var(--glm-neg-rgb),0) 46%),
    radial-gradient(circle at 90% 85%, rgba(var(--glm-info-rgb),.72) 0%, rgba(var(--glm-info-rgb),0) 48%),
    linear-gradient(155deg,#161022,#0b0e17 70%); }
.glm-scene.glm-v5 { background: radial-gradient(circle at 50% 15%, rgba(var(--glm-warn-rgb),.8) 0%, rgba(var(--glm-warn-rgb),0) 46%),
    radial-gradient(circle at 15% 75%, rgba(var(--glm-crit-rgb),.72) 0%, rgba(var(--glm-crit-rgb),0) 48%),
    radial-gradient(circle at 88% 78%, rgba(var(--glm-pos-rgb),.7) 0%, rgba(var(--glm-pos-rgb),0) 48%),
    linear-gradient(150deg,#1a1420,#0b0e17 70%); }
.glm-scene::after { content: ""; position: absolute; inset: 0px; pointer-events: none; background: radial-gradient(420px 220px at 50% -10%, rgba(255, 255, 255, 0.1), transparent 65%); }
.glm-glass { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--glm-glass-1), var(--glm-glass-2)); backdrop-filter: var(--glm-blur); border: 1px solid var(--glm-border); border-radius: 16px; box-shadow: var(--glm-shadow), inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 26px rgba(255,255,255,.05); color: rgb(255, 255, 255); }
.glm-glass::before { content: ""; position: absolute; top: 0px; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent); pointer-events: none; }
.glm-glass::after { content: ""; position: absolute; inset: 0px; pointer-events: none; border-radius: inherit; background: radial-gradient(140px 60px at 30% -10%, rgba(255, 255, 255, 0.2), transparent 70%); }
.glm-toast { display: flex; align-items: flex-start; gap: 10px; width: 230px; padding: 12px 13px; border-radius: 15px; animation: 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0s 1 normal both running glmToastIn; }
.glm-toast-ico { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, 0.18); box-shadow: rgba(255, 255, 255, 0.5) 0px 1px 0px inset; }
.glm-toast.ok .glm-toast-ico { color: rgb(201, 255, 214); background: rgba(var(--glm-pos-rgb),.32); }
.glm-toast.info .glm-toast-ico { color: rgb(207, 230, 255); background: rgba(var(--glm-info-rgb),.32); }
.glm-toast-body { min-width: 0px; }
.glm-toast-title { font-size: 12.5px; font-weight: 800; color: rgb(255, 255, 255); }
.glm-toast-sub { font-size: 11px; color: rgba(255, 255, 255, 0.72); margin-top: 2px; line-height: 1.4; }
.glm-toast-x { margin-left: auto; flex: 0 0 auto; font-size: 13px; color: rgba(255, 255, 255, 0.55); cursor: pointer; }
.glm-toast::before { background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent); animation: 2.6s ease-in-out 0.3s infinite normal none running glmSheen; }
.glm-stack .glm-toast { position: absolute; left: 0px; width: 100%; animation: auto ease 0s 1 normal none running none; }
.glm-stack .glm-toast:nth-child(1) { top: 0px; z-index: 3; }
.glm-stack .glm-toast:nth-child(2) { top: 34px; z-index: 2; transform: scale(0.96); opacity: 0.85; }
.glm-stack .glm-toast:nth-child(3) { top: 64px; z-index: 1; transform: scale(0.92); opacity: 0.6; }
@keyframes glmSheen { 
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}
@keyframes glmToastIn { 
  0% { opacity: 0; transform: translateY(-14px) scale(0.95); }
  100% { opacity: 1; transform: none; }
}
.tile .copy.ok { border-color: var(--pos) !important; color: var(--pos) !important; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="glm-scene glm-v5"><div class="glm-toast ok glm-glass">
      <span class="glm-toast-ico">✓</span>
      <div class="glm-toast-body"><div class="glm-toast-title">Changes saved</div><div class="glm-toast-sub">Synced across all devices.</div></div>
      <span class="glm-toast-x">×</span>
    </div></div></div></div>
<div class="meta"><b>Frosted Glass Toast</b> · <code>spectrums-frosted-glass-toast</code><br>Spectrums · Glassmorphism · Glassmorphism<p>A softly glowing, blurred confirmation toast with a light sheen; the signature Glassmorphism notification for success feedback.</p></div>

</body>
</html>
