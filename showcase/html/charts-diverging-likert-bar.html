.chx-tm-likert .chx-tm-right { transform-origin: left center; }
.chx-tm-likert .chx-tm-zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2, 2; }
@keyframes chxTmLik { 
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
