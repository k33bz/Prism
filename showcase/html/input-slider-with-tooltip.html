<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider with Tooltip · Prism</title>
<!-- Prism showcase sample: input-slider-with-tooltip (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-tip { width: 100%; padding-top: 26px; }
.nin2-tip .nin2-wrap { position: relative; }
.nin2-tip .nin2-bub { position: absolute; top: -30px; transform: translateX(-50%); background: var(--accent); color: rgb(26, 18, 0); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.nin2-tip .nin2-bub::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border-width: 5px; border-style: solid; border-right-color: transparent; border-bottom-color: transparent; border-left-color: transparent; border-image: none; border-top-color: var(--accent); }
.nin2-tip input[type="range"] { width: 100%; appearance: none; height: 6px; border-radius: 3px; outline: none; background: var(--panel2); }
.nin2-tip input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 8px rgba(var(--accent-rgb),.4); cursor: pointer; }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-tip"><div class="nin2-wrap"><span class="nin2-bub" style="left:60%">60%</span><input type="range" min="0" max="100" value="60"></div></div></div></div>
<div class="meta"><b>Slider with Tooltip</b> · <code>input-slider-with-tooltip</code><br>Input Methods · Fields, Pickers &amp; Actions<p>A range slider topped by a value bubble that tracks the thumb as you drag. Clearer than reading a number elsewhere.</p></div>

</body>
</html>
