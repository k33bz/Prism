<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search + Grep Highlight · Prism</title>
<!-- Prism showcase sample: charts-search-grep-highlight (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.srchbox { width: 100%; font-family: ui-monospace, Menlo, monospace; }
.srchbox .field { display: flex; align-items: center; gap: 8px; background: rgb(10, 15, 26); border: 1px solid var(--info); border-radius: 9px; padding: 8px 12px; box-shadow: 0 0 0 3px rgba(var(--info-rgb),.12); }
.srchbox .field .q { flex: 1 1 0%; color: var(--ink); font-size: 13px; white-space: nowrap; overflow: hidden; }
.srchbox .field .car { display: inline-block; width: 7px; height: 15px; background: var(--info); animation: 1s steps(2, start) 0s infinite normal none running logBlink; }
.srchbox .results { margin-top: 10px; font-size: 11px; line-height: 1.8; }
.srchbox .results .r { padding: 3px 6px; border-radius: 5px; color: rgb(159, 176, 198); opacity: 0; animation: 0.4s ease-out 0s 1 normal forwards running srchReveal; }
.srchbox mark { background: rgba(var(--accent-rgb),.32); color: var(--accent); border-radius: 3px; padding: 0px 2px; font-weight: 700; }
@keyframes logBlink { 
  50% { opacity: 0; }
}
@keyframes srchReveal { 
  0% { opacity: 0; transform: translateX(-6px); }
  100% { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="srchbox">
        <div class="field"><span style="color:var(--info)">🔍</span><span class="q" id="srchQuery">ERROR </span><span class="car"></span></div>
        <div class="results" id="srchResults"></div>
      </div></div></div>
<div class="meta"><b>Search + Grep Highlight</b> · <code>charts-search-grep-highlight</code><br>Charts &amp; Metrics · Log Viewers &amp; Streams<p>A query types itself into the box, then matching log lines reveal one by one with the matched term highlighted in-place. The &quot;searching your logs&quot; moment — type, match, highlight. Loops.</p></div>

</body>
</html>
