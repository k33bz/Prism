<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Runner · Prism</title>
<!-- Prism showcase sample: obsidian-milestone-runner (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.c-pos { --c: var(--pos); --c-rgb: 63,185,80; }
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-co { width: 288px; max-width: 100%; background: linear-gradient(180deg,rgba(var(--ob-rgb),.11),rgba(var(--ob-rgb),.035)); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 3px solid var(--ob); border-radius: 10px; padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-cot { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; color: var(--ob); letter-spacing: 0.02em; }
.obs-coi { width: 17px; height: 17px; flex: 0 0 17px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; }
.obs-co-glowrail .obs-coi { animation: 2.6s ease-in-out 0s infinite normal none running obsIcoBreathe; }
.obs-co-inner .obs-cot { color: var(--info); font-size: 11.5px; }
.obs-mstrip { position: relative; height: 22px; margin-top: 9px; }
.obs-mstrip::before { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: rgba(var(--ob-rgb),.25); border-radius: 1px; }
.obs-mdot { position: absolute; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--panel2); border: 1.5px solid rgba(var(--ob-rgb),.55); }
.obs-mdot:nth-child(2) { left: 4px; }
.obs-mdot:nth-child(3) { left: 33%; }
.obs-mdot:nth-child(4) { left: 63%; }
.obs-mdot:nth-child(5) { right: 4px; }
.obs-mrun { position: absolute; top: 5px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff,var(--ob) 70%); box-shadow: 0 0 10px rgba(var(--ob-rgb),.8); animation: 6s ease-in-out 0s infinite normal none running obsHop; }
@keyframes obsIcoBreathe { 
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.14); opacity: 1; }
}
@keyframes obsHop { 
  0%, 8% { left: 2px; }
  22%, 33% { left: 31%; }
  47%, 58% { left: 61%; }
  74%, 92% { left: calc(100% - 14px); }
  100% { left: 2px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="obs obs-co c-pos"><div class="obs-cot"><span class="obs-coi">◆</span>Publish sequence</div><div class="obs-mstrip"><i></i><span class="obs-mdot"></span><span class="obs-mdot"></span><span class="obs-mdot"></span><span class="obs-mdot"></span><span class="obs-mrun"></span></div></div></div></div>
<div class="meta"><b>Milestone Runner</b> · <code>obsidian-milestone-runner</code><br>Obsidian Facets · OBSIDIAN CALLOUTS &amp; ADMONITIONS<p>A progress callout whose luminous runner hops between milestone stops.</p></div>

</body>
</html>
