<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented Control w/ Sliding Thumb · Prism</title>
<!-- Prism showcase sample: menus-segmented-control-w-sliding-thumb (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-segmented { position: relative; width: 220px; }
.mnu-seg-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-seg-track { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.mnu-seg-track label { position: relative; z-index: 1; text-align: center; padding: 7px 6px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; transition: color 0.18s; }
.mnu-seg-thumb { position: absolute; top: 3px; left: 3px; bottom: 3px; width: calc(50% - 3px); border-radius: 7px; background: var(--panel2); box-shadow: 0 3px 10px rgba(0,0,0,.35),0 0 0 1px rgba(var(--info-rgb),.3); transition: transform 0.26s cubic-bezier(0.3, 1, 0.4, 1); }
#mnu-seg-a:checked ~ .mnu-seg-track label[for="mnu-seg-a"], #mnu-seg-b:checked ~ .mnu-seg-track label[for="mnu-seg-b"] { color: var(--ink); }
#mnu-seg-a:checked ~ .mnu-seg-track .mnu-seg-thumb { transform: translateX(0px); }
#mnu-seg-b:checked ~ .mnu-seg-track .mnu-seg-thumb { transform: translateX(100%); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-segmented">
      <input type="radio" name="mnu-seg" id="mnu-seg-a" class="mnu-seg-input" checked="">
      <input type="radio" name="mnu-seg" id="mnu-seg-b" class="mnu-seg-input">
      <div class="mnu-seg-track">
        <label for="mnu-seg-a">Grid</label><label for="mnu-seg-b">List</label>
        <span class="mnu-seg-thumb"></span>
      </div>
    </div></div></div>
<div class="meta"><b>Segmented Control w/ Sliding Thumb</b> · <code>menus-segmented-control-w-sliding-thumb</code><br>Menus &amp; Actions · TAB BARS &amp; SEGMENTED CONTROLS<p>A two-option iOS-style segmented control whose raised thumb slides to the chosen side.</p></div>

</body>
</html>
