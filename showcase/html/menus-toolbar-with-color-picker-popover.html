<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbar with Color-picker Popover · Prism</title>
<!-- Prism showcase sample: menus-toolbar-with-color-picker-popover (gallery: menus). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mnu-cmdk-row.is-sel { background: rgba(var(--info-rgb),.16); }
.mnu-cmdk-row.is-sel .mnu-ico { color: var(--info); }
.mnu-cmdk-rich .mnu-cmdk-row.is-sel .mnu-cmdk-ic2 { background: rgba(var(--accent-rgb),.2); color: var(--accent); }
.mnu-popbar { display: flex; gap: 6px; padding: 7px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); position: relative; }
.mnu-popbtn-input { position: absolute; opacity: 0; width: 0px; height: 0px; }
.mnu-popbtn-lbl { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--muted); background: transparent; transition: background 0.15s, color 0.15s; font-size: 14px; }
.mnu-popbtn-lbl:hover { background: rgba(var(--info-rgb),.12); color: var(--ink); }
.mnu-popbtn-input:checked ~ .mnu-popbtn-lbl { background: rgba(var(--info-rgb),.18); color: var(--info); }
.mnu-popover { position: absolute; top: calc(100% + 8px); left: 0px; opacity: 0; visibility: hidden; transform: translateY(-6px) scale(0.95); transform-origin: left top; z-index: 6; transition: opacity 0.18s, transform 0.18s cubic-bezier(0.3, 1, 0.4, 1), visibility 0.18s; }
.mnu-popbtn-input:checked ~ .mnu-popover { opacity: 1; visibility: visible; transform: translateY(0px) scale(1); }
.mnu-swatches { display: grid; grid-template-columns: repeat(5, 22px); gap: 6px; padding: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; box-shadow: rgba(0, 0, 0, 0.42) 0px 14px 30px; }
.mnu-swatch { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
.mnu-swatch:hover { transform: scale(1.15); }
.mnu-swatch.is-sel { border-color: var(--ink); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="mnu-popbar">
      <input type="checkbox" id="mnu-pop-color" class="mnu-popbtn-input">
      <label for="mnu-pop-color" class="mnu-popbtn-lbl">🎨</label>
      <div class="mnu-popover"><div class="mnu-swatches">
        <span class="mnu-swatch is-sel" style="background:var(--accent)"></span><span class="mnu-swatch" style="background:var(--info)"></span>
        <span class="mnu-swatch" style="background:var(--pos)"></span><span class="mnu-swatch" style="background:var(--neg)"></span>
        <span class="mnu-swatch" style="background:var(--crit)"></span>
      </div></div>
      <label class="mnu-popbtn-lbl" style="opacity:.5">✎</label>
      <label class="mnu-popbtn-lbl" style="opacity:.5">🗑</label>
    </div></div></div>
<div class="meta"><b>Toolbar with Color-picker Popover</b> · <code>menus-toolbar-with-color-picker-popover</code><br>Menus &amp; Actions · ACTION BARS, TOOLBARS &amp; FABs<p>A toolbar button that toggles a swatch-grid popover open beneath it — click any button to try it.</p></div>

</body>
</html>
