<title>Deal Out · Prism</title>
<!-- Prism showcase sample: fx-deal-out (gallery: fx). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.dk { position: relative; width: 100%; max-width: 300px; height: 150px; margin: 0px auto; perspective: 760px; }
.dk-c { position: absolute; width: 44px; height: 62px; border-radius: 6px; background: linear-gradient(160deg,var(--panel2),var(--panel)); border: 1px solid var(--line); box-shadow: rgba(0, 0, 0, 0.5) 0px 3px 9px; transform-origin: center center; backface-visibility: hidden; }
.dk-c::after { content: ""; position: absolute; inset: 5px; border-radius: 3px; border: 1px solid rgba(var(--accent-rgb),.35); background: repeating-linear-gradient(45deg,rgba(var(--info-rgb),.18) 0 3px,transparent 3px 7px); }
.dk-c.up::after { border-color: rgba(var(--pos-rgb),.45); background: radial-gradient(120% 90% at 50% 25%,rgba(var(--info-rgb),.55),rgba(var(--crit-rgb),.3) 60%,var(--bg)); }
.dk-tag { position: absolute; font: 800 7px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.12em; color: var(--muted); opacity: 0.7; }
.dk-deal .dk-d { animation-duration: 3.8s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: normal; animation-fill-mode: none; animation-play-state: running; animation-name: dkDeal; animation-timeline: auto; animation-range: normal; animation-delay: var(--d); }
@keyframes dkDeal { 
  0% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
  5% { opacity: 1; }
  28%, 82% { transform: translate(var(--tx),var(--ty)) rotate(var(--r)); opacity: 1; }
  94%, 100% { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="meta"><b>Deal Out</b> · <code>fx-deal-out</code><br>FX Store · DECK &amp; HAND<p>The deck deals a card out to each of four seats in turn, so the source is clear. (Deal In, over in Card Motion, arrives from the upper right; this one shows the deck it leaves.)</p></div>
