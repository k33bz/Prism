<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Scatter Cube · Prism</title>
<!-- Prism showcase sample: charts-3d-scatter-cube (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.n3d-scene { perspective: 640px; perspective-origin: 50% 42%; display: flex; align-items: center; justify-content: center; min-height: 150px; }
.n3d-cube { position: relative; width: 120px; height: 120px; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(0deg); animation: 12s linear 0s infinite normal none running n3dSpin; }
.n3d-cube .fc { position: absolute; inset: 0px; border: 1px solid rgba(var(--info-rgb),.5); background: rgba(var(--info-rgb),.05); }
.n3d-cube .f1 { transform: translateZ(60px); }
.n3d-cube .f2 { transform: rotateY(180deg) translateZ(60px); }
.n3d-cube .f3 { transform: rotateY(90deg) translateZ(60px); }
.n3d-cube .f4 { transform: rotateY(-90deg) translateZ(60px); }
.n3d-cube .f5 { transform: rotateX(90deg) translateZ(60px); }
.n3d-cube .f6 { transform: rotateX(-90deg) translateZ(60px); }
.n3d-cube .pt { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; box-shadow: currentcolor 0px 0px 8px; background: currentcolor; animation: 0.9s ease-out 0s 1 normal both running ncx2Fade; }
@keyframes n3dSpin { 
  100% { transform: rotateY(360deg); }
}
@keyframes ncx2Fade { 
  0% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="n3d-scene"><div class="n3d-cube">
      <span class="fc f1"></span><span class="fc f2"></span><span class="fc f3"></span><span class="fc f4"></span><span class="fc f5"></span><span class="fc f6"></span>
      <span class="pt" style="color:var(--info);transform:translate3d(-30px,-20px,34px);animation-delay:0s"></span>
      <span class="pt" style="color:var(--accent);transform:translate3d(24px,10px,-18px);animation-delay:.15s"></span>
      <span class="pt" style="color:var(--pos);transform:translate3d(-8px,26px,10px);animation-delay:.3s"></span>
      <span class="pt" style="color:var(--crit);transform:translate3d(18px,-24px,28px);animation-delay:.45s"></span>
      <span class="pt" style="color:var(--warn);transform:translate3d(-26px,4px,-30px);animation-delay:.6s"></span>
      <span class="pt" style="color:var(--info);transform:translate3d(6px,-6px,-6px);animation-delay:.75s"></span>
    </div></div></div></div>
<div class="meta"><b>3D Scatter Cube</b> · <code>charts-3d-scatter-cube</code><br>Charts &amp; Metrics · 3D &amp; Perspective (2026 drop)<p>Points floating inside a rotating wireframe cube — a genuine three-axis scatter you can read from every angle.</p></div>

</body>
</html>
