<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom-Out Hero · Prism</title>
<!-- Prism showcase sample: lab-zoom-out-hero (gallery: lab). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.lab-rv-mock { position: relative; width: 100%; max-width: 300px; height: 130px; overflow: hidden; box-sizing: border-box; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 11px / 1.35 ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
.lab-rv-mock * { box-sizing: border-box; }
.lab-rv-zoom { --c: var(--crit); --c-rgb: var(--crit-rgb); background: var(--bg); }
.lab-rv-zh { position: absolute; inset: 0px; background: radial-gradient(circle at 28% 40%,rgba(var(--c-rgb),.7),rgba(var(--c-rgb),0) 46%),radial-gradient(circle at 76% 72%,rgba(var(--c-rgb),.4),rgba(var(--c-rgb),0) 40%),var(--bg); animation-name: labRvZoom; }
.lab-rv-zt { position: absolute; left: 0px; right: 0px; top: 44px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 0.02em; animation-name: labRvZt; }
.lab-rv-zs { position: absolute; left: 0px; right: 0px; top: 76px; text-align: center; color: var(--muted); animation-name: labRvFadeLate; }
.lab-rv-zh, .lab-rv-zt, .lab-rv-zs { animation-duration: 4s; animation-timing-function: cubic-bezier(0.2, 0.6, 0.2, 1); animation-iteration-count: infinite; }
@keyframes labRvFadeLate { 
  0%, 34% { opacity: 0; }
  46%, 80% { opacity: 1; }
  88%, 100% { opacity: 0; }
}
@keyframes labRvZoom { 
  0% { transform: scale(1.5); opacity: 0; }
  12% { opacity: 1; }
  56%, 84% { transform: scale(1); opacity: 1; }
  94%, 100% { transform: scale(1); opacity: 0; }
}
@keyframes labRvZt { 
  0%, 10% { opacity: 0; letter-spacing: 0.4em; }
  50%, 84% { opacity: 1; letter-spacing: 0.02em; }
  94%, 100% { opacity: 0; letter-spacing: 0.02em; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="lab-rv-mock lab-rv-zoom">
      <div class="lab-rv-zh"></div>
      <div class="lab-rv-zt">PIXEL</div>
      <div class="lab-rv-zs">Design tools for the next launch</div>
    </div></div></div>
<div class="meta"><b>Zoom-Out Hero</b> · <code>lab-zoom-out-hero</code><br>Animation Lab · REVEAL &amp; SCROLL CHOREOGRAPHY<p>The backdrop starts oversized and settles to scale while the title tightens its letter spacing into place. Use for cinematic hero openings on page load.</p></div>

</body>
</html>
