<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal Stepper · Prism</title>
<!-- Prism showcase sample: callouts-horizontal-stepper (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-stepper { display: flex; align-items: flex-start; width: 236px; }
.ann-stepper .ann-st { flex: 1 1 0%; position: relative; text-align: center; font-size: 9px; color: var(--dim); }
.ann-stepper .ann-sd { width: 20px; height: 20px; margin: 0px auto 5px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--dim); background: var(--panel2,rgba(255,255,255,.03)); border: 2px solid var(--line); position: relative; z-index: 1; }
.ann-stepper .ann-st::after { content: ""; position: absolute; top: 9px; left: 50%; width: 100%; height: 2px; background: var(--line); }
.ann-stepper .ann-st:last-child::after { display: none; }
.ann-stepper .ann-st.done .ann-sd { color: rgb(6, 18, 31); background: var(--ann-p); border-color: var(--ann-p); }
.ann-stepper .ann-st.done::after { background: var(--ann-p); }
.ann-stepper .ann-st.now .ann-sd { color: var(--ann-i); border-color: var(--ann-i); box-shadow: 0 0 0 4px rgba(var(--ann-i-rgb),.18); animation: 2s ease-in-out 0s infinite normal none running annPulse; }
.ann-stepper .ann-st.now .ann-sl, .ann-stepper .ann-st.done .ann-sl { color: var(--ink); font-weight: 700; }
@keyframes annPulse { 
  0%, 100% { box-shadow: 0 0 0 3px rgba(var(--ann-i-rgb),.22); }
  50% { box-shadow: 0 0 0 6px rgba(var(--ann-i-rgb),.05); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-stepper">
      <div class="ann-st done"><div class="ann-sd">✓</div><div class="ann-sl">Cart</div></div>
      <div class="ann-st done"><div class="ann-sd">✓</div><div class="ann-sl">Ship</div></div>
      <div class="ann-st now"><div class="ann-sd">3</div><div class="ann-sl">Pay</div></div>
      <div class="ann-st"><div class="ann-sd">4</div><div class="ann-sl">Done</div></div>
    </div></div></div>
<div class="meta"><b>Horizontal Stepper</b> · <code>callouts-horizontal-stepper</code><br>Callouts &amp; Annotations · TIMELINES &amp; STEPPERS<p>Multi-step progress with done / active / upcoming states and a pulsing current node.</p></div>

</body>
</html>
