<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold-Open Callout · Prism</title>
<!-- Prism showcase sample: obsidian-fold-open-callout (gallery: obsidian). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.obs { --ob: var(--c,var(--crit)); --ob-rgb: var(--c-rgb,var(--crit-rgb)); font-size: 12.5px; color: var(--ink); }
.obs-co { width: 288px; max-width: 100%; background: linear-gradient(180deg,rgba(var(--ob-rgb),.11),rgba(var(--ob-rgb),.035)); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 3px solid var(--ob); border-radius: 10px; padding: 11px 13px; position: relative; overflow: hidden; text-align: left; }
.obs-coi { width: 17px; height: 17px; flex: 0 0 17px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; }
.obs-co-glowrail .obs-coi { animation: 2.6s ease-in-out 0s infinite normal none running obsIcoBreathe; }
.obs-co-fold { padding: 0px; }
.obs-co-fold summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; color: var(--ob); padding: 11px 13px; }
.obs-co-fold summary::-webkit-details-marker { display: none; }
.obs-fold-chev { margin-left: auto; font-size: 10px; color: var(--ob); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); animation: 2.8s ease-in-out 0s infinite normal none running obsChevNudge; }
details[open] .obs-fold-chev { transform: rotate(90deg); animation: auto ease 0s 1 normal none running none; }
.obs-fold-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.42s cubic-bezier(0.4, 0, 0.2, 1); }
details[open] .obs-fold-body { grid-template-rows: 1fr; }
.obs-fold-inner { overflow: hidden; padding: 0px 13px; font-size: 12px; line-height: 1.55; color: var(--muted); }
details[open] .obs-fold-inner { padding-bottom: 11px; }
@keyframes obsIcoBreathe { 
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.14); opacity: 1; }
}
@keyframes obsChevNudge { 
  0%, 100% { translate: 0px; }
  50% { translate: 3px; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><details class="obs obs-co obs-co-fold"><summary><span class="obs-coi">▸</span>Foldable context <span class="obs-fold-chev">▶</span></summary><div class="obs-fold-body"><div class="obs-fold-inner">Hide supporting detail until the reader needs it. Click the header to fold this note.</div></div></details></div></div>
<div class="meta"><b>Fold-Open Callout</b> · <code>obsidian-fold-open-callout</code><br>Obsidian Facets · OBSIDIAN CALLOUTS &amp; ADMONITIONS<p>A native details callout with a springy chevron and smooth content reveal.</p></div>

</body>
</html>
