<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Check · Prism</title>
<!-- Prism showcase sample: objects-shield-check (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.body .br { animation: 1.7s ease-in-out 0s infinite normal none running reticle; }
.body .scanline { animation: 2.8s ease-in-out 0s infinite normal none running bodyscan; }
.lock .body { transform-box: fill-box; transform-origin: center center; }
.shield .tick { stroke-dasharray: var(--len); animation: 3s ease-in-out 0s infinite normal none running draw2; }
.shield .body { transform-box: fill-box; transform-origin: center center; animation: 3s ease-in-out 0s infinite normal none running shieldGlow; }
.sat .body { transform-box: view-box; transform-origin: 59px 59px; animation: 4s ease-in-out 0s infinite normal none running satWob; }
@keyframes reticle { 
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
@keyframes bodyscan { 
  0% { transform: translateY(0px); opacity: 0.3; }
  10% { opacity: 1; }
  50% { transform: translateY(64px); opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(0px); opacity: 0.3; }
}
@keyframes shieldGlow { 
  0%, 100% { opacity: 0.85; }
  50% { opacity: 1; }
}
@keyframes draw2 { 
  0% { stroke-dashoffset: var(--len); }
  45%, 80% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: var(--len); }
}
@keyframes satWob { 
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="shield" fill="none">
        <path class="body" d="M59 16 l34 12 v24 c0 26 -18 40 -34 48 c-16 -8 -34 -22 -34 -48 v-24 z" fill="var(--blue)" opacity=".9"></path>
        <path class="tick" style="--len:60" d="M42 60 l12 13 22 -27" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg></div></div>
<div class="meta"><b>Shield Check</b> · <code>objects-shield-check</code><br>Animated Objects · More mechanisms &amp; infra<p>A shield with a checkmark that draws itself on loop. Security passed, compliance, verified.</p></div>

</body>
</html>
