<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Pipeline States · Prism</title>
<!-- Prism showcase sample: input-upload-pipeline-states (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.prism-rail a.sr-link.active { background: rgba(255, 153, 0, 0.14); color: rgb(255, 255, 255); border-left-color: rgb(255, 153, 0); }
.chip.active { border-color: var(--accent); background: rgba(var(--accent-rgb),.12); color: var(--accent); }
.color-swatch.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.4); }
.upload-states { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.us-step { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 12px; }
.us-step .us-ico { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.us-step.done .us-ico { background: rgba(var(--pos-rgb),.15); color: var(--pos); }
.us-step.active .us-ico { background: rgba(var(--accent-rgb),.15); color: var(--accent); animation: 0.8s linear 0s infinite normal none running spinico; }
.us-step.pending .us-ico { background: var(--panel2); color: var(--dim); }
.copyfield .cf-btn.done { color: var(--pos); }
@keyframes spinico { 
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="upload-states">
        <div class="us-step done"><span class="us-ico">✓</span><span style="color:var(--pos);font-weight:700">Uploaded</span><span style="margin-left:auto;color:var(--dim);font-size:10px">2.4s</span></div>
        <div class="us-step done"><span class="us-ico">✓</span><span style="color:var(--pos);font-weight:700">Validated schema</span><span style="margin-left:auto;color:var(--dim);font-size:10px">0.8s</span></div>
        <div class="us-step active"><span class="us-ico">⟳</span><span style="color:var(--accent);font-weight:700">Processing rows…</span><span style="margin-left:auto;color:var(--accent);font-size:10px">1,240 / 3,800</span></div>
        <div class="us-step pending"><span class="us-ico">○</span><span style="color:var(--dim)">Indexing</span></div>
        <div class="us-step pending"><span class="us-ico">○</span><span style="color:var(--dim)">Complete</span></div>
      </div></div></div>
<div class="meta"><b>Upload Pipeline States</b> · <code>input-upload-pipeline-states</code><br>Input Methods · File Upload &amp; Processing<p>Multi-step upload pipeline: upload → validate → process → index → done. Shows current stage.</p></div>

</body>
</html>
