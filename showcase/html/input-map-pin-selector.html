<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Pin Selector · Prism</title>
<!-- Prism showcase sample: input-map-pin-selector (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.geo-pick { width: 100%; }
.geo-map { position: relative; width: 100%; height: 140px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); cursor: crosshair; background: linear-gradient(135deg, rgb(13, 36, 56), rgb(10, 23, 34)), repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255, 255, 255, 0.04) 19px, rgba(255, 255, 255, 0.04) 20px), repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255, 255, 255, 0.04) 19px, rgba(255, 255, 255, 0.04) 20px); }
.geo-map .geo-roads { position: absolute; inset: 0px; opacity: 0.5; }
.geo-map .geo-pin { position: absolute; transform: translate(-50%, -100%); font-size: 26px; filter: drop-shadow(rgba(0, 0, 0, 0.5) 0px 3px 4px); transition: left 0.1s, top 0.1s; pointer-events: none; }
.geo-map .geo-ring { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); animation: 1.8s ease-out 0s infinite normal none running geo-ping; pointer-events: none; }
.geo-coords { display: flex; gap: 8px; margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.geo-coords span { flex: 1 1 0%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; color: var(--ink); }
.geo-coords span b { color: var(--accent); font-weight: 700; margin-right: 5px; }
@keyframes geo-ping { 
  0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.4); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="geo-pick">
        <div class="geo-map" id="geo1" onclick="ipGeoPin(event,this)">
          <svg class="geo-roads" viewBox="0 0 300 140" preserveAspectRatio="none"><path d="M0,46 H300 M0,96 H300 M70,0 V140 M180,0 V140" stroke="rgba(255,255,255,.12)" stroke-width="2" fill="none"></path><path d="M0,70 Q120,20 300,80" stroke="rgba(68,147,248,.3)" stroke-width="3" fill="none"></path></svg>
          <div class="geo-ring" style="left:58%;top:54%"></div>
          <div class="geo-pin" style="left:58%;top:54%">📍</div>
        </div>
        <div class="geo-coords"><span><b>LAT</b><i id="geoLat1">47.6062</i></span><span><b>LNG</b><i id="geoLng1">-122.3321</i></span></div>
      </div></div></div>
<div class="meta"><b>Map Pin Selector</b> · <code>input-map-pin-selector</code><br>Input Methods · Location &amp; Region<p>Click anywhere on the stylized map to drop a pin; the live coordinate readout updates and a ping ring marks the spot. A dependency-free stand-in for a real map embed.</p></div>

</body>
</html>
