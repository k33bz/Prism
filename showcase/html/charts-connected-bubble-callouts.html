<!DOCTYPE html>

<title>Connected Bubble Callouts · Prism</title>
<!-- Prism showcase sample: charts-connected-bubble-callouts (gallery: charts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.mp-fade { animation: 0.7s ease-out 0s 1 normal backwards running scx-fadeUp; }
@keyframes scx-fadeUp { 
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg width="230" height="150" viewBox="0 0 230 150" style="overflow:visible">
        <line x1="78" y1="44" x2="150" y2="40" stroke="var(--line)" stroke-width="2"></line>
        <line x1="78" y1="104" x2="150" y2="110" stroke="var(--line)" stroke-width="2"></line>
        <circle class="mp-fade" cx="56" cy="44" r="26" fill="var(--accent)"></circle><text x="56" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#1a1200">48%</text>
        <circle class="mp-fade" style="animation-delay:.1s" cx="174" cy="40" r="20" fill="var(--info)"></circle><text x="174" y="44" text-anchor="middle" font-size="11" font-weight="800" fill="#0a1a30">25%</text>
        <circle class="mp-fade" style="animation-delay:.2s" cx="56" cy="104" r="16" fill="var(--crit)"></circle><text x="56" y="108" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">12%</text>
        <circle class="mp-fade" style="animation-delay:.3s" cx="174" cy="110" r="22" fill="var(--pos)"></circle><text x="174" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#052e12">85%</text>
      </svg></div></div>
<div class="meta"><b>Connected Bubble Callouts</b> · <code>charts-connected-bubble-callouts</code><br>Charts &amp; Metrics · More Plot Types<p>Value-sized circles linked by connectors — the &quot;key stats&quot; cluster from infographic decks. Bubble area encodes magnitude; links imply relationship or sequence. Each pops in on a slight delay.</p></div>
