<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy-to-Clipboard Field · Prism</title>
<!-- Prism showcase sample: input-copy-to-clipboard-field-2 (gallery: input). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nin2-copy { display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: 100%; }
.nin2-copy code { flex: 1 1 0%; padding: 11px 13px; font: 12px ui-monospace, Menlo, monospace; color: var(--info); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nin2-copy button { border-top-width: medium; border-right-width: medium; border-bottom-width: medium; border-top-style: none; border-right-style: none; border-bottom-style: none; border-top-color: currentcolor; border-right-color: currentcolor; border-bottom-color: currentcolor; border-image: none; border-left: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 0px 15px; align-self: stretch; cursor: pointer; font-size: 14px; transition: 0.15s; }
.nin2-copy button:hover { color: var(--accent); }
.nin2-copy button.nin2-ok { color: var(--pos); }
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nin2-copy"><code>arn:aws:iam::123456789012:role/PrismDemo</code><button type="button" title="Copy">⧉</button></div></div></div>
<div class="meta"><b>Copy-to-Clipboard Field</b> · <code>input-copy-to-clipboard-field-2</code><br>Input Methods · Fields, Pickers &amp; Actions<p>A read-only value with an inline copy button that flashes a green ✓ on success — the canonical way to surface ARNs and keys.</p></div>

</body>
</html>
