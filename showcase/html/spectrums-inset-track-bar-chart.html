<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inset-Track Bar Chart · Prism</title>
<!-- Prism showcase sample: spectrums-inset-track-bar-chart (gallery: spectrums). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.neu-chartcard { width: 230px; padding: 16px; border-radius: 18px; text-align: left; background: var(--neu-base); box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); }
.neu-chartcard .neu-chead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.neu-chartcard .neu-clabel { font-size: 10.5px; color: var(--neu-muted); font-weight: 700; letter-spacing: 0.03em; }
.neu-chartcard .neu-cval { font-size: 19px; font-weight: 800; color: var(--neu-ink); }
.neu-bars { display: flex; align-items: flex-end; gap: 8px; height: 64px; }
.neu-bars .neu-bar { flex: 1 1 0%; height: 100%; border-radius: 8px 8px 4px 4px; background: var(--neu-base); position: relative; box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); overflow: hidden; }
.neu-bars .neu-bar::after { content: ""; position: absolute; left: 0px; right: 0px; bottom: 0px; border-radius: 6px 6px 3px 3px; background: var(--neu-accent); opacity: 0.85; height: var(--h,40%); animation: 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal backwards running neuBarRise; }
.neu-bars .neu-bar:nth-child(1) { --h: 38%; }
.neu-bars .neu-bar:nth-child(1)::after { animation-delay: 0.02s; }
.neu-bars .neu-bar:nth-child(2) { --h: 64%; }
.neu-bars .neu-bar:nth-child(2)::after { animation-delay: 0.08s; }
.neu-bars .neu-bar:nth-child(3) { --h: 48%; }
.neu-bars .neu-bar:nth-child(3)::after { animation-delay: 0.14s; }
.neu-bars .neu-bar:nth-child(4) { --h: 86%; }
.neu-bars .neu-bar:nth-child(4)::after { animation-delay: 0.2s; }
.neu-bars .neu-bar:nth-child(5) { --h: 58%; }
.neu-bars .neu-bar:nth-child(5)::after { animation-delay: 0.26s; }
@keyframes neuBarRise { 
  0% { height: 0%; }
  100% { height: var(--h); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="neu-chartcard">
      <div class="neu-chead"><span class="neu-clabel">WEEKLY SIGNUPS</span><span class="neu-cval">1,284</span></div>
      <div class="neu-bars"><div class="neu-bar"></div><div class="neu-bar"></div><div class="neu-bar"></div><div class="neu-bar"></div><div class="neu-bar"></div></div>
    </div></div></div>
<div class="meta"><b>Inset-Track Bar Chart</b> · <code>spectrums-inset-track-bar-chart</code><br>Spectrums · Neumorphism · Neumorphism<p>Each bar's track is carved into the card and the accent fill rises inside it on load — bars read as glowing liquid in a groove, not printed rectangles.</p></div>

</body>
</html>
