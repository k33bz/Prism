<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Topology · Prism</title>
<!-- Prism showcase sample: arch-ring-topology-2 (gallery: arch). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.arch-net-svg { width: 100%; max-width: 300px; height: auto; display: block; }
.arch-net-cir { fill: rgba(var(--cr,var(--accent-rgb)),.15); stroke: rgba(var(--cr,var(--accent-rgb)),.85); stroke-width: 1; }
.arch-net-lbl { fill: var(--muted); font-size: 6px; text-anchor: middle; font-family: ui-sans-serif, system-ui, sans-serif; }
.arch-net-wire { fill: none; stroke: var(--line); stroke-width: 1; }
.arch-net-token { fill: none; stroke: var(--c,var(--accent)); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 4, 260; animation-name: archNetToken; animation-duration: 4s; animation-timing-function: linear; animation-iteration-count: infinite; }
.arch-net-lit { transform-box: fill-box; transform-origin: center center; animation-name: archNetLit; animation-duration: 3s; animation-timing-function: ease-out; animation-iteration-count: infinite; animation-delay: var(--ld,0s); }
.arch-net-lit4 { animation-duration: 4s; }
@keyframes archNetToken { 
  100% { stroke-dashoffset: -264; }
}
@keyframes archNetLit { 
  0%, 55%, 100% { opacity: 0; transform: scale(0.5); }
  16% { opacity: 0.75; transform: scale(1); }
  40% { opacity: 0; transform: scale(1.6); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg class="arch-net-svg arch-net-ring" viewBox="0 0 300 150" role="img" aria-label="Ring topology with circulating token">
      <circle class="arch-net-wire" cx="150" cy="72" r="42"></circle>
      <circle class="arch-net-token" cx="150" cy="72" r="42"></circle>
      <g style="--cr:var(--accent-rgb)"><circle class="arch-net-cir" cx="150" cy="30" r="7"></circle><circle class="arch-net-cir" cx="186" cy="51" r="7"></circle><circle class="arch-net-cir" cx="186" cy="93" r="7"></circle><circle class="arch-net-cir" cx="150" cy="114" r="7"></circle><circle class="arch-net-cir" cx="114" cy="93" r="7"></circle><circle class="arch-net-cir" cx="114" cy="51" r="7"></circle></g>
      <g fill="var(--accent)"><circle class="arch-net-lit arch-net-lit4" style="--ld:0s" cx="150" cy="30" r="7"></circle><circle class="arch-net-lit arch-net-lit4" style="--ld:.66s" cx="186" cy="51" r="7"></circle><circle class="arch-net-lit arch-net-lit4" style="--ld:1.33s" cx="186" cy="93" r="7"></circle><circle class="arch-net-lit arch-net-lit4" style="--ld:2s" cx="150" cy="114" r="7"></circle><circle class="arch-net-lit arch-net-lit4" style="--ld:2.66s" cx="114" cy="93" r="7"></circle><circle class="arch-net-lit arch-net-lit4" style="--ld:3.33s" cx="114" cy="51" r="7"></circle></g>
      <text class="arch-net-lbl" x="150" y="74">token ring</text>
    </svg></div></div>
<div class="meta"><b>Ring Topology</b> · <code>arch-ring-topology-2</code><br>Architecture Diagrams · NETWORK FLOW MAPS<p>A token circulates a ring of six nodes, lighting each as it passes. Use for token ring, loop and circular bus network visuals.</p></div>

</body>
</html>
