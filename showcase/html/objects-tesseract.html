<title>Tesseract · Prism</title>
<!-- Prism showcase sample: objects-tesseract (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.nobj2-scene { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; perspective: 620px; perspective-origin: 50% 42%; }
.nobj2-tess { position: relative; width: 100px; height: 100px; transform-style: preserve-3d; animation: 11s linear 0s infinite normal none running nobj2TessSpin; }
.nobj2-tess .nobj2-tcube { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.nobj2-tess .nobj2-tface { position: absolute; border: 1.4px solid var(--fc); background: transparent; box-shadow: inset 0 0 12px color-mix(in srgb,var(--fc) 18%,transparent); }
.nobj2-tess .nobj2-outer { animation: 6s ease-in-out 0s infinite normal none running nobj2TessIn; }
.nobj2-tess .nobj2-inner { animation: 6s ease-in-out 0s infinite reverse none running nobj2TessIn; }
.nobj2-tess .nobj2-outer .nobj2-tface { width: 88px; height: 88px; margin: -44px; }
.nobj2-tess .nobj2-inner .nobj2-tface { width: 44px; height: 44px; margin: -22px; border-color: var(--nobj2-a); }
.nobj2-to-fr { transform: translateZ(44px); }
.nobj2-to-bk { transform: translateZ(-44px); }
.nobj2-to-ri { transform: rotateY(90deg) translateZ(44px); }
.nobj2-to-le { transform: rotateY(-90deg) translateZ(44px); }
.nobj2-to-to { transform: rotateX(90deg) translateZ(44px); }
.nobj2-to-bo { transform: rotateX(-90deg) translateZ(44px); }
.nobj2-ti-fr { transform: translateZ(22px); }
.nobj2-ti-bk { transform: translateZ(-22px); }
.nobj2-ti-ri { transform: rotateY(90deg) translateZ(22px); }
.nobj2-ti-le { transform: rotateY(-90deg) translateZ(22px); }
.nobj2-ti-to { transform: rotateX(90deg) translateZ(22px); }
.nobj2-ti-bo { transform: rotateX(-90deg) translateZ(22px); }
@keyframes nobj2TessSpin { 
  0% { transform: rotateX(-20deg) rotateY(0deg); }
  100% { transform: rotateX(-20deg) rotateY(360deg); }
}
@keyframes nobj2TessIn { 
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotateZ(45deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="nobj2-scene"><div class="nobj2-tess" style="--fc:var(--nobj2-t)">
      <span class="nobj2-tcube nobj2-outer">
        <span class="nobj2-tface nobj2-to-fr"></span><span class="nobj2-tface nobj2-to-bk"></span><span class="nobj2-tface nobj2-to-ri"></span><span class="nobj2-tface nobj2-to-le"></span><span class="nobj2-tface nobj2-to-to"></span><span class="nobj2-tface nobj2-to-bo"></span>
      </span>
      <span class="nobj2-tcube nobj2-inner">
        <span class="nobj2-tface nobj2-ti-fr"></span><span class="nobj2-tface nobj2-ti-bk"></span><span class="nobj2-tface nobj2-ti-ri"></span><span class="nobj2-tface nobj2-ti-le"></span><span class="nobj2-tface nobj2-ti-to"></span><span class="nobj2-tface nobj2-ti-bo"></span>
      </span>
    </div></div></div></div>
