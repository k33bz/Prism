<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Takeaway · Prism</title>
<!-- Prism showcase sample: callouts-key-takeaway (gallery: callouts). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.ann-takeaway { position: relative; width: 236px; padding: 12px 14px; border-radius: 10px; text-align: left; overflow: hidden; background: linear-gradient(120deg,rgba(var(--ann-a-rgb),.14),rgba(var(--ann-a-rgb),.04)); border: 1px solid rgba(var(--ann-a-rgb),.34); }
.ann-takeaway::after { content: ""; position: absolute; top: 0px; left: -60%; width: 45%; height: 100%; background: linear-gradient(100deg,transparent,rgba(var(--ann-a-rgb),.20),transparent); animation: 3.6s ease-in-out 0s infinite normal none running annSweep; }
.ann-takeaway .ann-tkl { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; color: var(--ann-a); margin-bottom: 5px; }
.ann-takeaway .ann-tkl::before { content: "★"; }
.ann-takeaway .ann-tkt { font-size: 12px; line-height: 1.45; font-weight: 600; color: var(--ink); position: relative; }
@keyframes annSweep { 
  0% { left: -60%; }
  55%, 100% { left: 130%; }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><div class="ann-takeaway"><div class="ann-tkl">KEY TAKEAWAY</div><div class="ann-tkt">Latency dropped 42% after moving reads to the replica pool.</div></div></div></div>
<div class="meta"><b>Key Takeaway</b> · <code>callouts-key-takeaway</code><br>Callouts &amp; Annotations · CALLOUT / ADMONITION BLOCKS<p>Highlighted summary block with a slow light sweep for the one thing to remember.</p></div>

</body>
</html>
