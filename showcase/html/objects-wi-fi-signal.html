<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Signal · Prism</title>
<!-- Prism showcase sample: objects-wi-fi-signal (gallery: objects). Offline, self-contained. -->
<style id="prism-tokens">
:root{--bg:#0b0e17;--panel:#121623;--panel2:#171d2e;--card:#141b2b;--line:#243049;--ink:#eaf1f9;--muted:#8593a8;--dim:#5b6678;--crit:#c879ff;--crit-rgb:200,121,255;--neg:#f85149;--neg-rgb:248,81,73;--warn:#e0a52b;--warn-rgb:224,165,43;--pos:#3fb950;--pos-rgb:63,185,80;--info:#4493f8;--info-rgb:68,147,248;--accent:#ff9900;--accent-rgb:255,153,0;--cardgrad:linear-gradient(157deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}.c-crit{--c:var(--crit);--c-rgb:200,121,255}.c-neg{--c:var(--neg);--c-rgb:248,81,73}.c-warn{--c:var(--warn);--c-rgb:224,165,43}.c-pos{--c:var(--pos);--c-rgb:63,185,80}.c-info{--c:var(--info);--c-rgb:68,147,248}.c-accent{--c:var(--accent);--c-rgb:255,153,0}
</style>
<style id="showcase-shell">
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage{position:relative;overflow:hidden;box-sizing:border-box;width:344px;min-height:120px;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.stage.bg{padding:0;min-height:0;display:block}
.stage.bg>*{width:100%}
.meta{max-width:362px;text-align:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-size:13px}
.meta code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--info)}
.meta p{margin:6px 0 0}
</style>
<style id="effect-css">
.wifi .arc { transform-box: fill-box; transform-origin: center center; animation: 2s ease-in-out 0s infinite normal none running wifiOn; }
.wifi .a2 { animation-delay: 0.25s; }
.wifi .a3 { animation-delay: 0.5s; }
.wifi .dot { animation-delay: 0.75s; }
.cloudup .a2 { animation-delay: 0.6s; }
.cloudup .a3 { animation-delay: 1.2s; }
.pring .arc { transform-box: view-box; transform-origin: 59px 59px; stroke-dasharray: 210; animation: 2.6s ease-in-out 0s infinite normal none running pringFill; }
@keyframes wifiOn { 
  0%, 100% { opacity: 0.18; }
  50% { opacity: 1; }
}
@keyframes pringFill { 
  0% { stroke-dashoffset: 210; transform: rotate(-90deg); }
  60%, 80% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 0; transform: rotate(270deg); }
}
</style>
</head>
<body>
<div class="tile"><div class="stage" id="stage"><svg viewBox="0 0 118 118" class="wifi" fill="none">
        <g stroke="var(--teal)" stroke-width="7" stroke-linecap="round">
          <path class="arc a3" d="M22 50 A52 52 0 0 1 96 50"></path>
          <path class="arc a2" d="M33 64 A36 36 0 0 1 85 64"></path>
          <path class="arc a1" d="M44 78 A20 20 0 0 1 74 78"></path>
        </g>
        <circle class="arc dot" cx="59" cy="90" r="6" fill="var(--teal)"></circle>
      </svg></div></div>
<div class="meta"><b>Wi-Fi Signal</b> · <code>objects-wi-fi-signal</code><br>Animated Objects · Vitals &amp; status<p>Concentric arcs light up from the dot outward in sequence, like a connecting handshake. Connectivity, &quot;online&quot;, network status.</p></div>

</body>
</html>
